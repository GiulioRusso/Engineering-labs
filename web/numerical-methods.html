<template id="explain-bisection"><section>
  <p>Most equations f(x) = 0 have no formula for their solution. <b>Root finding</b> methods start from a guess and improve it step by step; what separates them is how many correct digits each step adds, and whether they can fail.</p>
</section>
<section data-case="bisect">
  <h3>Bisection</h3>
  <div class="look"><h4>What you are looking at</h4>Left: f(x) with the current bracket [a, b] (orange) and its midpoint (green). Top right: the error of the midpoint on a log scale, one dot per step. Bottom right: each error against the previous one — a line of slope 1 means a constant factor per step. Below: the midpoint against the step.</div>
  <p>If a continuous f is negative at a and positive at b, it must cross zero in between. Look at the midpoint: one of the two halves still has a sign change. Keep that half and repeat.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>m</mi><mo>=</mo><mfrac><mrow><mi>a</mi><mo>+</mo><mi>b</mi></mrow><mn>2</mn></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="normal">∣</mi><msub><mi>e</mi><mi>k</mi></msub><mi mathvariant="normal">∣</mi><mo>≤</mo><mfrac><mrow><mi>b</mi><mo>−</mo><mi>a</mi></mrow><msup><mn>2</mn><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msup></mfrac></mrow><annotation encoding="application/x-tex">m=\frac{a+b}{2},\qquad |e_k|\le\frac{b-a}{2^{k+1}}</annotation></semantics></math></span></div>
  <ol class="steps"><li>Check that f(a) and f(b) have opposite signs.</li><li>Compute m and f(m).</li><li>Replace a or b by m so that the sign change is kept.</li><li>Stop when the bracket is narrower than the tolerance.</li></ol>
  <div class="worked"><h4>Worked example</h4>Bracket [1, 3], width 2. For an error below 10⁻⁶ we need 2/2^(k+1) &lt; 10⁻⁶, so k ≥ 20 steps — known before starting.</div>
  <div class="pitfall"><h4>Common mistakes</h4>Starting from a bracket without a sign change, or one containing two roots (no sign change either). Bisection also cannot find a double root like x² = 0, where f touches zero without crossing.</div>
  <div class="try"><h4>Try it</h4>Change the function: the error line has exactly the same slope. Bisection ignores the shape of f.</div>
</section>
<section data-case="bisect" data-example="cos"><h3>cos x = x</h3><p>A transcendental equation, no formula for x — still one bit per step.</p></section>
<section data-case="bisect" data-example="nosign"><h3>No sign change</h3><p>f(2.5) and f(3) are both positive: the method has nothing to guarantee a root and refuses to start.</p></section>
<section data-case="secant">
  <h3>The secant method</h3>
  <div class="look"><h4>What you are looking at</h4>Left: f(x), the chord through the last two estimates (orange), and where it crosses zero: the next estimate. Right: the error per step and the error-vs-previous-error chart, whose slope is the order of convergence.</div>
  <p>Replace f by the straight line through the two latest points and solve the line instead. Close to the root f looks almost straight, so the line's zero is an excellent guess. It is Newton's method without needing the derivative.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>x</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>=</mo><msub><mi>x</mi><mi>k</mi></msub><mo>−</mo><mi>f</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>k</mi></msub><mo stretchy="false">)</mo><mtext> </mtext><mfrac><mrow><msub><mi>x</mi><mi>k</mi></msub><mo>−</mo><msub><mi>x</mi><mrow><mi>k</mi><mo>−</mo><mn>1</mn></mrow></msub></mrow><mrow><mi>f</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>k</mi></msub><mo stretchy="false">)</mo><mo>−</mo><mi>f</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mrow><mi>k</mi><mo>−</mo><mn>1</mn></mrow></msub><mo stretchy="false">)</mo></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="normal">∣</mi><msub><mi>e</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub><mi mathvariant="normal">∣</mi><mo>≈</mo><mi>C</mi><mtext> </mtext><mi mathvariant="normal">∣</mi><msub><mi>e</mi><mi>k</mi></msub><msup><mi mathvariant="normal">∣</mi><mn>1.618</mn></msup></mrow><annotation encoding="application/x-tex">x_{k+1}=x_k-f(x_k)\,\frac{x_k-x_{k-1}}{f(x_k)-f(x_{k-1})},\qquad |e_{k+1}|\approx C\,|e_k|^{1.618}</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>From x₀ = 1, x₁ = 3 on x³ − 2x − 5 the errors fall roughly 10⁻¹, 10⁻², 10⁻³, 10⁻⁶, 10⁻⁹, 10⁻¹⁴: the number of digits grows by a factor ≈ 1.6 each step.</div>
  <div class="pitfall"><h4>Common mistake</h4>Assuming fast means safe: far from the root the chord can be nearly flat and throw the next guess far away. Robust solvers (Brent's method) combine secant steps with a bisection bracket.</div>
</section>
<section data-case="secant" data-example="close"><h3>Start close</h3><p>Already near the root: the curve is nearly straight between the points and the digits pile up immediately.</p></section>
<section data-case="secant" data-example="far"><h3>Bad start</h3><p>Between 0 and 0.6 the curve slopes the wrong way: the first chord shoots far left. It recovers, but nothing guaranteed it would.</p></section>
<section data-case="fixed">
  <h3>Fixed-point iteration</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the cobweb. From xₖ go up to the blue curve g, across to the line y = x, and that is xₖ₊₁. The root √2 is where g meets the line (green). Right: error charts as for the other methods.</div>
  <p>Rewrite f(x) = 0 as x = g(x) and iterate x ← g(x). Here f = x² − 2 and g(x) = x − λ(x² − 2), with a free relaxation λ. Near the fixed point each error is multiplied by g′ there, so the iteration converges when |g′| &lt; 1.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>e</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>≈</mo><msup><mi>g</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo stretchy="false">(</mo><msup><mi>x</mi><mo>∗</mo></msup><mo stretchy="false">)</mo><mtext> </mtext><msub><mi>e</mi><mi>k</mi></msub><mo separator="true">,</mo><mspace width="2em"/><msup><mi>g</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo stretchy="false">(</mo><msqrt><mn>2</mn></msqrt><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn><mo>−</mo><mn>2</mn><msqrt><mn>2</mn></msqrt><mtext> </mtext><mi>λ</mi></mrow><annotation encoding="application/x-tex">e_{k+1}\approx g&#x27;(x^*)\,e_k,\qquad g&#x27;(\sqrt2)=1-2\sqrt2\,\lambda</annotation></semantics></math></span></div>
  <ol class="steps"><li>0 &lt; g′ &lt; 1: monotone staircase.</li><li>−1 &lt; g′ &lt; 0: spiral, alternating sides.</li><li>|g′| &gt; 1: the spiral or staircase goes outward.</li><li>g′ = 0: quadratic convergence (this is Newton's choice λ = 1/f′).</li></ol>
  <div class="pitfall"><h4>Common mistake</h4>Thinking any rearrangement x = g(x) works. x = 2/x has the same fixed point √2 but g′ = −1: it bounces between two values forever.</div>
</section>
<section data-case="fixed" data-example="best"><h3>Optimal λ</h3><p>λ = 1/(2√2) makes g′(√2) = 0: the errors square every step, as in Newton's method.</p></section>
<section data-case="fixed" data-example="slow"><h3>Slow staircase</h3><p>g′ ≈ 0.86: each step removes only 14 % of the error.</p></section>
<section data-case="fixed" data-example="spiral"><h3>Spiral in</h3><p>g′ ≈ −0.70: the estimate overshoots and comes back from the other side, still shrinking.</p></section>

<template id="explain-secant-method"><section>
  <p>Most equations f(x) = 0 have no formula for their solution. <b>Root finding</b> methods start from a guess and improve it step by step; what separates them is how many correct digits each step adds, and whether they can fail.</p>
</section>
<section data-case="bisect">
  <h3>Bisection</h3>
  <div class="look"><h4>What you are looking at</h4>Left: f(x) with the current bracket [a, b] (orange) and its midpoint (green). Top right: the error of the midpoint on a log scale, one dot per step. Bottom right: each error against the previous one — a line of slope 1 means a constant factor per step. Below: the midpoint against the step.</div>
  <p>If a continuous f is negative at a and positive at b, it must cross zero in between. Look at the midpoint: one of the two halves still has a sign change. Keep that half and repeat.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>m</mi><mo>=</mo><mfrac><mrow><mi>a</mi><mo>+</mo><mi>b</mi></mrow><mn>2</mn></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="normal">∣</mi><msub><mi>e</mi><mi>k</mi></msub><mi mathvariant="normal">∣</mi><mo>≤</mo><mfrac><mrow><mi>b</mi><mo>−</mo><mi>a</mi></mrow><msup><mn>2</mn><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msup></mfrac></mrow><annotation encoding="application/x-tex">m=\frac{a+b}{2},\qquad |e_k|\le\frac{b-a}{2^{k+1}}</annotation></semantics></math></span></div>
  <ol class="steps"><li>Check that f(a) and f(b) have opposite signs.</li><li>Compute m and f(m).</li><li>Replace a or b by m so that the sign change is kept.</li><li>Stop when the bracket is narrower than the tolerance.</li></ol>
  <div class="worked"><h4>Worked example</h4>Bracket [1, 3], width 2. For an error below 10⁻⁶ we need 2/2^(k+1) &lt; 10⁻⁶, so k ≥ 20 steps — known before starting.</div>
  <div class="pitfall"><h4>Common mistakes</h4>Starting from a bracket without a sign change, or one containing two roots (no sign change either). Bisection also cannot find a double root like x² = 0, where f touches zero without crossing.</div>
  <div class="try"><h4>Try it</h4>Change the function: the error line has exactly the same slope. Bisection ignores the shape of f.</div>
</section>
<section data-case="bisect" data-example="cos"><h3>cos x = x</h3><p>A transcendental equation, no formula for x — still one bit per step.</p></section>
<section data-case="bisect" data-example="nosign"><h3>No sign change</h3><p>f(2.5) and f(3) are both positive: the method has nothing to guarantee a root and refuses to start.</p></section>
<section data-case="secant">
  <h3>The secant method</h3>
  <div class="look"><h4>What you are looking at</h4>Left: f(x), the chord through the last two estimates (orange), and where it crosses zero: the next estimate. Right: the error per step and the error-vs-previous-error chart, whose slope is the order of convergence.</div>
  <p>Replace f by the straight line through the two latest points and solve the line instead. Close to the root f looks almost straight, so the line's zero is an excellent guess. It is Newton's method without needing the derivative.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>x</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>=</mo><msub><mi>x</mi><mi>k</mi></msub><mo>−</mo><mi>f</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>k</mi></msub><mo stretchy="false">)</mo><mtext> </mtext><mfrac><mrow><msub><mi>x</mi><mi>k</mi></msub><mo>−</mo><msub><mi>x</mi><mrow><mi>k</mi><mo>−</mo><mn>1</mn></mrow></msub></mrow><mrow><mi>f</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>k</mi></msub><mo stretchy="false">)</mo><mo>−</mo><mi>f</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mrow><mi>k</mi><mo>−</mo><mn>1</mn></mrow></msub><mo stretchy="false">)</mo></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="normal">∣</mi><msub><mi>e</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub><mi mathvariant="normal">∣</mi><mo>≈</mo><mi>C</mi><mtext> </mtext><mi mathvariant="normal">∣</mi><msub><mi>e</mi><mi>k</mi></msub><msup><mi mathvariant="normal">∣</mi><mn>1.618</mn></msup></mrow><annotation encoding="application/x-tex">x_{k+1}=x_k-f(x_k)\,\frac{x_k-x_{k-1}}{f(x_k)-f(x_{k-1})},\qquad |e_{k+1}|\approx C\,|e_k|^{1.618}</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>From x₀ = 1, x₁ = 3 on x³ − 2x − 5 the errors fall roughly 10⁻¹, 10⁻², 10⁻³, 10⁻⁶, 10⁻⁹, 10⁻¹⁴: the number of digits grows by a factor ≈ 1.6 each step.</div>
  <div class="pitfall"><h4>Common mistake</h4>Assuming fast means safe: far from the root the chord can be nearly flat and throw the next guess far away. Robust solvers (Brent's method) combine secant steps with a bisection bracket.</div>
</section>
<section data-case="secant" data-example="close"><h3>Start close</h3><p>Already near the root: the curve is nearly straight between the points and the digits pile up immediately.</p></section>
<section data-case="secant" data-example="far"><h3>Bad start</h3><p>Between 0 and 0.6 the curve slopes the wrong way: the first chord shoots far left. It recovers, but nothing guaranteed it would.</p></section>
<section data-case="fixed">
  <h3>Fixed-point iteration</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the cobweb. From xₖ go up to the blue curve g, across to the line y = x, and that is xₖ₊₁. The root √2 is where g meets the line (green). Right: error charts as for the other methods.</div>
  <p>Rewrite f(x) = 0 as x = g(x) and iterate x ← g(x). Here f = x² − 2 and g(x) = x − λ(x² − 2), with a free relaxation λ. Near the fixed point each error is multiplied by g′ there, so the iteration converges when |g′| &lt; 1.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>e</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>≈</mo><msup><mi>g</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo stretchy="false">(</mo><msup><mi>x</mi><mo>∗</mo></msup><mo stretchy="false">)</mo><mtext> </mtext><msub><mi>e</mi><mi>k</mi></msub><mo separator="true">,</mo><mspace width="2em"/><msup><mi>g</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo stretchy="false">(</mo><msqrt><mn>2</mn></msqrt><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn><mo>−</mo><mn>2</mn><msqrt><mn>2</mn></msqrt><mtext> </mtext><mi>λ</mi></mrow><annotation encoding="application/x-tex">e_{k+1}\approx g&#x27;(x^*)\,e_k,\qquad g&#x27;(\sqrt2)=1-2\sqrt2\,\lambda</annotation></semantics></math></span></div>
  <ol class="steps"><li>0 &lt; g′ &lt; 1: monotone staircase.</li><li>−1 &lt; g′ &lt; 0: spiral, alternating sides.</li><li>|g′| &gt; 1: the spiral or staircase goes outward.</li><li>g′ = 0: quadratic convergence (this is Newton's choice λ = 1/f′).</li></ol>
  <div class="pitfall"><h4>Common mistake</h4>Thinking any rearrangement x = g(x) works. x = 2/x has the same fixed point √2 but g′ = −1: it bounces between two values forever.</div>
</section>
<section data-case="fixed" data-example="best"><h3>Optimal λ</h3><p>λ = 1/(2√2) makes g′(√2) = 0: the errors square every step, as in Newton's method.</p></section>
<section data-case="fixed" data-example="slow"><h3>Slow staircase</h3><p>g′ ≈ 0.86: each step removes only 14 % of the error.</p></section>
<section data-case="fixed" data-example="spiral"><h3>Spiral in</h3><p>g′ ≈ −0.70: the estimate overshoots and comes back from the other side, still shrinking.</p></section>
<section data-case="fixed" data-example="diverge"><h3>Spiral out</h3><p>g′ ≈ −1.26: every overshoot is larger than the last.</p></section>

<template id="explain-ode-methods"><section>
  <p>A computer solves a differential equation by marching: from the state now, estimate the state a small step h later, and repeat. The method decides how accurate each step is, whether errors pile up, and whether the solution stays bounded at all.</p>
</section>
<section data-case="euler">
  <h3>Methods compared on an oscillator</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the phase portrait, velocity against position. The exact motion goes round the unit circle (dashed). Top right: x(t) against cos t. Bottom right: the energy, constant for the exact solution. Below: the error in x over time.</div>
  <p>The spring x″ = −x is written as two first-order equations, x′ = v and v′ = −x. <b>Euler</b> moves along the current slope for one step. On a circle the slope is the tangent, which always points slightly outside: the numerical orbit spirals out.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>Euler: </mtext><msub><mi>y</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>=</mo><msub><mi>y</mi><mi>n</mi></msub><mo>+</mo><mi>h</mi><mtext> </mtext><mi>f</mi><mo stretchy="false">(</mo><msub><mi>y</mi><mi>n</mi></msub><mo stretchy="false">)</mo><mspace width="2em"/><mtext>RK4: </mtext><msub><mi>y</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>=</mo><msub><mi>y</mi><mi>n</mi></msub><mo>+</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><mi>h</mi><mn>6</mn></mfrac></mstyle><mo stretchy="false">(</mo><msub><mi>k</mi><mn>1</mn></msub><mo>+</mo><mn>2</mn><msub><mi>k</mi><mn>2</mn></msub><mo>+</mo><mn>2</mn><msub><mi>k</mi><mn>3</mn></msub><mo>+</mo><msub><mi>k</mi><mn>4</mn></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\text{Euler: } y_{n+1}=y_n+h\,f(y_n)\qquad\text{RK4: } y_{n+1}=y_n+\tfrac h6(k_1+2k_2+2k_3+k_4)</annotation></semantics></math></span></div>
  <ol class="steps"><li>Euler: one slope per step, error per period ∝ h.</li><li>Semi-implicit Euler: update v, then x with the new v. Same cost, energy no longer drifts (a <i>symplectic</i> method).</li><li>Heun: Euler guess, then average the two slopes. Error ∝ h².</li><li>RK4: four slopes per step. Error ∝ h⁴.</li></ol>
  <div class="worked"><h4>Worked example</h4>Euler with h = 0.1: energy × (1 + 0.01) per step. After t = 20 (200 steps) the energy is 1.01²⁰⁰ ≈ 7.3 times too large.</div>
  <div class="pitfall"><h4>Common mistake</h4>Judging a method by one step. A small error per step that always pushes the same way (outward) accumulates; long simulations of orbits or molecules use symplectic methods for that reason.</div>
  <div class="try"><h4>Try it</h4>Pick RK4 and push h up to 1: the orbit stays close to the circle for a long time, even with only six steps per period.</div>
</section>
<section data-case="euler" data-example="semi"><h3>Semi-implicit Euler</h3><p>The energy wobbles by about h/2 but never drifts: the orbit is a slightly squashed closed curve.</p></section>
<section data-case="euler" data-example="rk4big"><h3>RK4 with a big step</h3><p>Twelve steps per period, and the energy is still within a fraction of a percent after three periods.</p></section>
<section data-case="stability">
  <h3>Stability</h3>
  <div class="look"><h4>What you are looking at</h4>Left: y′ = λy with λ &lt; 0, exact decay (dashed), explicit Euler (red) and implicit Euler (green), one dot per step. Top right: how much each method multiplies y per step, against hλ. Bottom right: the complex hλ plane with each method's stability region; the dot is your step.</div>
  <p>On the decay y′ = λy each Euler step multiplies y by a fixed factor. If that factor is larger than 1 in size, the numerical solution grows even though the exact one decays: the method is <b>unstable</b> at that step.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>explicit: </mtext><msub><mi>y</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>=</mo><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mi>h</mi><mi>λ</mi><mo stretchy="false">)</mo><mtext> </mtext><msub><mi>y</mi><mi>n</mi></msub><mspace width="2em"/><mtext>implicit: </mtext><msub><mi>y</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>=</mo><mfrac><msub><mi>y</mi><mi>n</mi></msub><mrow><mn>1</mn><mo>−</mo><mi>h</mi><mi>λ</mi></mrow></mfrac></mrow><annotation encoding="application/x-tex">\text{explicit: } y_{n+1}=(1+h\lambda)\,y_n\qquad\text{implicit: } y_{n+1}=\frac{y_n}{1-h\lambda}</annotation></semantics></math></span></div>
  <ol class="steps"><li>Explicit Euler is stable when |1 + hλ| &lt; 1, i.e. h &lt; 2/|λ|.</li><li>Between h = 1/|λ| and 2/|λ| it is stable but flips sign every step.</li><li>Implicit Euler solves for y_{n+1} and is stable for every h &gt; 0 (A-stable).</li></ol>
  <div class="worked"><h4>Worked example</h4>|λ| = 10: explicit Euler needs h &lt; 0.2 s. With h = 0.3 s the factor is 1 − 3 = −2: after 10 steps y ≈ 1000, sign alternating.</div>
  <div class="pitfall"><h4>Common mistake</h4>Confusing accuracy with stability. A stable result can still be inaccurate (implicit Euler with a huge step decays too slowly), and you cannot fix an instability by waiting.</div>
</section>
<section data-case="stability" data-example="edge"><h3>On the edge</h3><p>hλ = −2: the factor is exactly −1, the solution flips sign forever without decaying.</p></section>
<section data-case="stability" data-example="blow"><h3>Past the edge</h3><p>hλ = −3: explicit Euler doubles every step; implicit Euler divides by 4 and decays.</p></section>
<section data-case="order">
  <h3>Order of accuracy</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the error after one period of the oscillator against the step h, both logarithmic. Each method is a straight line whose slope is its order. Top right: the same errors against the work, counted in slope evaluations. Bottom right: Euler and RK4 at the marked step. Below: the local slope of each line.</div>
  <p>A method of order p has a global error ∝ h^p. On log–log axes that is a line of slope p: Euler and semi-implicit Euler 1, Heun 2, RK4 4.</p>

<template id="explain-ode-stability"><section>
  <p>A computer solves a differential equation by marching: from the state now, estimate the state a small step h later, and repeat. The method decides how accurate each step is, whether errors pile up, and whether the solution stays bounded at all.</p>
</section>
<section data-case="euler">
  <h3>Methods compared on an oscillator</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the phase portrait, velocity against position. The exact motion goes round the unit circle (dashed). Top right: x(t) against cos t. Bottom right: the energy, constant for the exact solution. Below: the error in x over time.</div>
  <p>The spring x″ = −x is written as two first-order equations, x′ = v and v′ = −x. <b>Euler</b> moves along the current slope for one step. On a circle the slope is the tangent, which always points slightly outside: the numerical orbit spirals out.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>Euler: </mtext><msub><mi>y</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>=</mo><msub><mi>y</mi><mi>n</mi></msub><mo>+</mo><mi>h</mi><mtext> </mtext><mi>f</mi><mo stretchy="false">(</mo><msub><mi>y</mi><mi>n</mi></msub><mo stretchy="false">)</mo><mspace width="2em"/><mtext>RK4: </mtext><msub><mi>y</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>=</mo><msub><mi>y</mi><mi>n</mi></msub><mo>+</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><mi>h</mi><mn>6</mn></mfrac></mstyle><mo stretchy="false">(</mo><msub><mi>k</mi><mn>1</mn></msub><mo>+</mo><mn>2</mn><msub><mi>k</mi><mn>2</mn></msub><mo>+</mo><mn>2</mn><msub><mi>k</mi><mn>3</mn></msub><mo>+</mo><msub><mi>k</mi><mn>4</mn></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\text{Euler: } y_{n+1}=y_n+h\,f(y_n)\qquad\text{RK4: } y_{n+1}=y_n+\tfrac h6(k_1+2k_2+2k_3+k_4)</annotation></semantics></math></span></div>
  <ol class="steps"><li>Euler: one slope per step, error per period ∝ h.</li><li>Semi-implicit Euler: update v, then x with the new v. Same cost, energy no longer drifts (a <i>symplectic</i> method).</li><li>Heun: Euler guess, then average the two slopes. Error ∝ h².</li><li>RK4: four slopes per step. Error ∝ h⁴.</li></ol>
  <div class="worked"><h4>Worked example</h4>Euler with h = 0.1: energy × (1 + 0.01) per step. After t = 20 (200 steps) the energy is 1.01²⁰⁰ ≈ 7.3 times too large.</div>
  <div class="pitfall"><h4>Common mistake</h4>Judging a method by one step. A small error per step that always pushes the same way (outward) accumulates; long simulations of orbits or molecules use symplectic methods for that reason.</div>
  <div class="try"><h4>Try it</h4>Pick RK4 and push h up to 1: the orbit stays close to the circle for a long time, even with only six steps per period.</div>
</section>
<section data-case="euler" data-example="semi"><h3>Semi-implicit Euler</h3><p>The energy wobbles by about h/2 but never drifts: the orbit is a slightly squashed closed curve.</p></section>
<section data-case="euler" data-example="rk4big"><h3>RK4 with a big step</h3><p>Twelve steps per period, and the energy is still within a fraction of a percent after three periods.</p></section>
<section data-case="stability">
  <h3>Stability</h3>
  <div class="look"><h4>What you are looking at</h4>Left: y′ = λy with λ &lt; 0, exact decay (dashed), explicit Euler (red) and implicit Euler (green), one dot per step. Top right: how much each method multiplies y per step, against hλ. Bottom right: the complex hλ plane with each method's stability region; the dot is your step.</div>
  <p>On the decay y′ = λy each Euler step multiplies y by a fixed factor. If that factor is larger than 1 in size, the numerical solution grows even though the exact one decays: the method is <b>unstable</b> at that step.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>explicit: </mtext><msub><mi>y</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>=</mo><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mi>h</mi><mi>λ</mi><mo stretchy="false">)</mo><mtext> </mtext><msub><mi>y</mi><mi>n</mi></msub><mspace width="2em"/><mtext>implicit: </mtext><msub><mi>y</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>=</mo><mfrac><msub><mi>y</mi><mi>n</mi></msub><mrow><mn>1</mn><mo>−</mo><mi>h</mi><mi>λ</mi></mrow></mfrac></mrow><annotation encoding="application/x-tex">\text{explicit: } y_{n+1}=(1+h\lambda)\,y_n\qquad\text{implicit: } y_{n+1}=\frac{y_n}{1-h\lambda}</annotation></semantics></math></span></div>
  <ol class="steps"><li>Explicit Euler is stable when |1 + hλ| &lt; 1, i.e. h &lt; 2/|λ|.</li><li>Between h = 1/|λ| and 2/|λ| it is stable but flips sign every step.</li><li>Implicit Euler solves for y_{n+1} and is stable for every h &gt; 0 (A-stable).</li></ol>
  <div class="worked"><h4>Worked example</h4>|λ| = 10: explicit Euler needs h &lt; 0.2 s. With h = 0.3 s the factor is 1 − 3 = −2: after 10 steps y ≈ 1000, sign alternating.</div>
  <div class="pitfall"><h4>Common mistake</h4>Confusing accuracy with stability. A stable result can still be inaccurate (implicit Euler with a huge step decays too slowly), and you cannot fix an instability by waiting.</div>
</section>
<section data-case="stability" data-example="edge"><h3>On the edge</h3><p>hλ = −2: the factor is exactly −1, the solution flips sign forever without decaying.</p></section>
<section data-case="stability" data-example="blow"><h3>Past the edge</h3><p>hλ = −3: explicit Euler doubles every step; implicit Euler divides by 4 and decays.</p></section>
<section data-case="order">
  <h3>Order of accuracy</h3>

  <div class="pitfall"><h4>Common mistake</h4>Making h as small as possible. Below about 10⁻³ RK4's error stops falling: round-off in millions of additions sets a floor.</div>
</section>
<section data-case="order" data-example="cost"><h3>Equal work</h3><p>RK4 costs four slope evaluations per step, but even per evaluation its line sits far below the others.</p></section>

<template id="explain-interpolation"><section>
  <p>Numerical methods replace a function by something simpler that a computer can handle: a polynomial through some samples, a sum of areas, a difference of two values. Each replacement has an error, and knowing how that error behaves is the whole craft.</p>
</section>
<section data-case="runge">
  <h3>Polynomial interpolation</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the function 1/(1 + 25x²) (blue), the nodes where it is sampled, and the polynomial through them (orange). Top right: the error along x. Bottom right: the largest error against the number of nodes, for equispaced (red) and Chebyshev (green) nodes. Below: the node polynomial that controls the error.</div>
  <p>Through n points goes exactly one polynomial of degree n − 1. More points should mean a better fit — but with equally spaced points the polynomial starts to oscillate wildly near the ends. This is <b>Runge's phenomenon</b>.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>−</mo><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><msup><mi>f</mi><mrow><mo stretchy="false">(</mo><mi>n</mi><mo stretchy="false">)</mo></mrow></msup><mo stretchy="false">(</mo><mi>ξ</mi><mo stretchy="false">)</mo></mrow><mrow><mi>n</mi><mo stretchy="false">!</mo></mrow></mfrac><munderover><mo>∏</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mo stretchy="false">(</mo><mi>x</mi><mo>−</mo><msub><mi>x</mi><mi>i</mi></msub><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><msubsup><mi>x</mi><mi>i</mi><mtext>Cheb</mtext></msubsup><mo>=</mo><mo>−</mo><mi>cos</mi><mo>⁡</mo><mfrac><mrow><mo stretchy="false">(</mo><mn>2</mn><mi>i</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mi>π</mi></mrow><mrow><mn>2</mn><mi>n</mi></mrow></mfrac></mrow><annotation encoding="application/x-tex">f(x)-p(x)=\frac{f^{(n)}(\xi)}{n!}\prod_{i=1}^{n}(x-x_i),\qquad x_i^{\text{Cheb}}=-\cos\frac{(2i-1)\pi}{2n}</annotation></semantics></math></span></div>
  <ol class="steps"><li>The error has two factors: a derivative of f, and the node product.</li><li>With equispaced nodes the product is huge near the ends.</li><li>Chebyshev nodes cluster at the ends and make the product as small as possible: the error then falls as n grows.</li></ol>
  <div class="pitfall"><h4>Common mistake</h4>Fitting a high-degree polynomial through equally spaced measurements. Use Chebyshev nodes if you can choose them, otherwise splines (low-degree pieces).</div>
  <div class="try"><h4>Try it</h4>Equispaced, raise n from 5 to 25 and watch the error at x ≈ ±0.9; then switch to Chebyshev.</div>
</section>
<section data-case="runge" data-example="wild"><h3>Equispaced, n = 15</h3><p>The polynomial passes through every node yet overshoots to about 7 between the last ones.</p></section>
<section data-case="runge" data-example="cheb"><h3>Chebyshev, n = 15</h3><p>Same degree, nodes moved towards the ends: the error is under 0.1 everywhere.</p></section>
<section data-case="quad">
  <h3>Numerical integration</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the integrand (blue), the panel boundaries, and the curve the rule actually integrates (orange): chords or parabolas. Top right: the error against the number of panels, log–log. Bottom right: the error made in each panel.</div>
  <p>Split [a, b] into n panels of width h. The <b>trapezoid rule</b> replaces f by a straight line on each; <b>Simpson's rule</b> by a parabola through each pair of panels. Simpson is exact for cubics and its error falls much faster.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>T</mi><mi>n</mi></msub><mo>=</mo><mi>h</mi><mo fence="false" stretchy="true" minsize="1.8em" maxsize="1.8em">[</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><msub><mi>f</mi><mn>0</mn></msub><mn>2</mn></mfrac></mstyle><mo>+</mo><msub><mi>f</mi><mn>1</mn></msub><mo>+</mo><mo>⋯</mo><mo>+</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><msub><mi>f</mi><mi>n</mi></msub><mn>2</mn></mfrac></mstyle><mo fence="false" stretchy="true" minsize="1.8em" maxsize="1.8em">]</mo><mo separator="true">,</mo><mspace width="2em"/><msub><mi>S</mi><mi>n</mi></msub><mo>=</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><mi>h</mi><mn>3</mn></mfrac></mstyle><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">[</mo><msub><mi>f</mi><mn>0</mn></msub><mo>+</mo><mn>4</mn><msub><mi>f</mi><mn>1</mn></msub><mo>+</mo><mn>2</mn><msub><mi>f</mi><mn>2</mn></msub><mo>+</mo><mo>⋯</mo><mo>+</mo><mn>4</mn><msub><mi>f</mi><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow></msub><mo>+</mo><msub><mi>f</mi><mi>n</mi></msub><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">]</mo></mrow><annotation encoding="application/x-tex">T_n=h\Big[\tfrac{f_0}2+f_1+\dots+\tfrac{f_n}2\Big],\qquad S_n=\tfrac h3\big[f_0+4f_1+2f_2+\dots+4f_{n-1}+f_n\big]</annotation></semantics></math></span></div>

<section data-case="fdiff">
  <h3>Finite differences</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the error of the derivative of sin at x = 1 against the step h, log–log, with the two error sources dashed: truncation (blue) and round-off (yellow). Top right: a zoom on sin with the chord being used. Bottom right: the number of correct digits. Below: the difference quotient itself.</div>
  <p>The derivative is the limit of a difference quotient as h → 0. On a computer h cannot go to zero: f(x + h) and f(x) become nearly equal and their difference keeps only a few significant digits. Two errors pull in opposite directions.</p>

  <ol class="steps"><li>Large h: truncation dominates, the error falls as h (forward) or h² (central).</li><li>Small h: round-off dominates, the error grows as 1/h.</li><li>The minimum: h ≈ √ε ≈ 10⁻⁸ (forward), h ≈ ∛ε ≈ 10⁻⁵ (central).</li></ol>
  <div class="pitfall"><h4>Common mistake</h4>Choosing h = 10⁻¹⁵ "to be accurate": the answer has no correct digits at all.</div>
</section>
<section data-case="fdiff" data-example="tiny"><h3>h = 10⁻¹³</h3><p>Only three digits of the difference survive the subtraction: the derivative is wrong in the fourth digit.</p></section>

<template id="explain-quadrature"><section>
  <p>Numerical methods replace a function by something simpler that a computer can handle: a polynomial through some samples, a sum of areas, a difference of two values. Each replacement has an error, and knowing how that error behaves is the whole craft.</p>
</section>
<section data-case="runge">
  <h3>Polynomial interpolation</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the function 1/(1 + 25x²) (blue), the nodes where it is sampled, and the polynomial through them (orange). Top right: the error along x. Bottom right: the largest error against the number of nodes, for equispaced (red) and Chebyshev (green) nodes. Below: the node polynomial that controls the error.</div>
  <p>Through n points goes exactly one polynomial of degree n − 1. More points should mean a better fit — but with equally spaced points the polynomial starts to oscillate wildly near the ends. This is <b>Runge's phenomenon</b>.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>−</mo><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><msup><mi>f</mi><mrow><mo stretchy="false">(</mo><mi>n</mi><mo stretchy="false">)</mo></mrow></msup><mo stretchy="false">(</mo><mi>ξ</mi><mo stretchy="false">)</mo></mrow><mrow><mi>n</mi><mo stretchy="false">!</mo></mrow></mfrac><munderover><mo>∏</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mo stretchy="false">(</mo><mi>x</mi><mo>−</mo><msub><mi>x</mi><mi>i</mi></msub><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><msubsup><mi>x</mi><mi>i</mi><mtext>Cheb</mtext></msubsup><mo>=</mo><mo>−</mo><mi>cos</mi><mo>⁡</mo><mfrac><mrow><mo stretchy="false">(</mo><mn>2</mn><mi>i</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mi>π</mi></mrow><mrow><mn>2</mn><mi>n</mi></mrow></mfrac></mrow><annotation encoding="application/x-tex">f(x)-p(x)=\frac{f^{(n)}(\xi)}{n!}\prod_{i=1}^{n}(x-x_i),\qquad x_i^{\text{Cheb}}=-\cos\frac{(2i-1)\pi}{2n}</annotation></semantics></math></span></div>
  <ol class="steps"><li>The error has two factors: a derivative of f, and the node product.</li><li>With equispaced nodes the product is huge near the ends.</li><li>Chebyshev nodes cluster at the ends and make the product as small as possible: the error then falls as n grows.</li></ol>

</section>

  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>E</mi><mi>T</mi></msub><mo>≈</mo><mo>−</mo><mfrac><mrow><mo stretchy="false">(</mo><mi>b</mi><mo>−</mo><mi>a</mi><mo stretchy="false">)</mo><msup><mi>h</mi><mn>2</mn></msup></mrow><mn>12</mn></mfrac><msup><mi>f</mi><mrow><mo mathvariant="normal">′</mo><mo mathvariant="normal">′</mo></mrow></msup><mo separator="true">,</mo><mspace width="2em"/><msub><mi>E</mi><mi>S</mi></msub><mo>≈</mo><mo>−</mo><mfrac><mrow><mo stretchy="false">(</mo><mi>b</mi><mo>−</mo><mi>a</mi><mo stretchy="false">)</mo><msup><mi>h</mi><mn>4</mn></msup></mrow><mn>180</mn></mfrac><msup><mi>f</mi><mrow><mo stretchy="false">(</mo><mn>4</mn><mo stretchy="false">)</mo></mrow></msup></mrow><annotation encoding="application/x-tex">E_T\approx-\frac{(b-a)h^2}{12}f&#x27;&#x27;,\qquad E_S\approx-\frac{(b-a)h^4}{180}f^{(4)}</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>∫₀¹ eˣ dx = 1.718282. Trapezoid with 4 panels: 1.727222 (error 9·10⁻³). Simpson with 4 panels: 1.718319 (error 4·10⁻⁵).</div>
  <div class="pitfall"><h4>Common mistake</h4>Using Simpson with an odd number of panels — it needs pairs.</div>
</section>
<section data-case="quad" data-example="simpson"><h3>Simpson</h3><p>The parabolas are almost on top of the curve: the error line has slope −4.</p></section>
<section data-case="quad" data-example="bump"><h3>A narrow bump</h3><p>With 8 panels the rule barely sees the peak; the panel errors concentrate around it. Doubling n helps, but adaptive rules would refine only the middle.</p></section>
<section data-case="fdiff">
  <h3>Finite differences</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the error of the derivative of sin at x = 1 against the step h, log–log, with the two error sources dashed: truncation (blue) and round-off (yellow). Top right: a zoom on sin with the chord being used. Bottom right: the number of correct digits. Below: the difference quotient itself.</div>
  <p>The derivative is the limit of a difference quotient as h → 0. On a computer h cannot go to zero: f(x + h) and f(x) become nearly equal and their difference keeps only a few significant digits. Two errors pull in opposite directions.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mfrac><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo>+</mo><mi>h</mi><mo stretchy="false">)</mo><mo>−</mo><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow><mi>h</mi></mfrac><mo>=</mo><msup><mi>f</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo>+</mo><mfrac><mi>h</mi><mn>2</mn></mfrac><msup><mi>f</mi><mrow><mo mathvariant="normal">′</mo><mo mathvariant="normal">′</mo></mrow></msup><mo>+</mo><mo>…</mo><mo separator="true">,</mo><mspace width="2em"/><mtext>round-off</mtext><mo>≈</mo><mfrac><mrow><mi>ε</mi><mtext> </mtext><mi mathvariant="normal">∣</mi><mi>f</mi><mi mathvariant="normal">∣</mi></mrow><mi>h</mi></mfrac><mo separator="true">,</mo><mspace width="1em"/><mi>ε</mi><mo>≈</mo><mn>2.2</mn><mo>⋅</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>16</mn></mrow></msup></mrow><annotation encoding="application/x-tex">\frac{f(x+h)-f(x)}{h}=f&#x27;+\frac h2f&#x27;&#x27;+\dots,\qquad\text{round-off}\approx\frac{\varepsilon\,|f|}{h},\quad\varepsilon\approx2.2\cdot10^{-16}</annotation></semantics></math></span></div>
  <ol class="steps"><li>Large h: truncation dominates, the error falls as h (forward) or h² (central).</li><li>Small h: round-off dominates, the error grows as 1/h.</li><li>The minimum: h ≈ √ε ≈ 10⁻⁸ (forward), h ≈ ∛ε ≈ 10⁻⁵ (central).</li></ol>
  <div class="pitfall"><h4>Common mistake</h4>Choosing h = 10⁻¹⁵ "to be accurate": the answer has no correct digits at all.</div>
</section>
<section data-case="fdiff" data-example="tiny"><h3>h = 10⁻¹³</h3><p>Only three digits of the difference survive the subtraction: the derivative is wrong in the fourth digit.</p></section>
<section data-case="fdiff" data-example="central"><h3>Central difference</h3><p>Symmetric around x, the h term cancels: error ∝ h², best near 10⁻⁵ with about 11 correct digits.</p></section>
</template>
