<template id="explain-time-dilation"><section data-case="clock">
  <h3>Time dilation and the light clock</h3>
  <div class="look"><h4>What you are looking at</h4>Two identical light clocks: a flash of light bouncing between two mirrors, one tick per round trip. The left clock is at rest in the lab; the right one rides on a ship moving at β = v/c (the posts underneath are the lab sliding past). Top right: the slowing factor γ. Bottom right: the ticks each clock has counted.</div>
  <p>Light travels at the same speed c for every observer: that is the starting point of relativity. Seen from the lab, the light in the moving clock does not go straight up and down: the mirrors move while it travels, so it runs along a longer diagonal path. Same speed, longer path: each tick takes longer. The moving clock runs slow, and not just this one: every process on the ship, from wristwatches to heartbeats, slows by the same factor.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msup><mrow><mo fence="true">(</mo><mfrac><mrow><mi>c</mi><mtext> </mtext><mi mathvariant="normal">Δ</mi><mi>t</mi></mrow><mn>2</mn></mfrac><mo fence="true">)</mo></mrow><mn>2</mn></msup><mo>=</mo><msup><mi>L</mi><mn>2</mn></msup><mo>+</mo><msup><mrow><mo fence="true">(</mo><mfrac><mrow><mi>v</mi><mtext> </mtext><mi mathvariant="normal">Δ</mi><mi>t</mi></mrow><mn>2</mn></mfrac><mo fence="true">)</mo></mrow><mn>2</mn></msup><mtext>  </mtext><mo>⇒</mo><mtext>  </mtext><mi mathvariant="normal">Δ</mi><mi>t</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>L</mi><mi mathvariant="normal">/</mi><mi>c</mi></mrow><msqrt><mrow><mn>1</mn><mo>−</mo><msup><mi>v</mi><mn>2</mn></msup><mi mathvariant="normal">/</mi><msup><mi>c</mi><mn>2</mn></msup></mrow></msqrt></mfrac><mo>=</mo><mi>γ</mi><mtext> </mtext><mi mathvariant="normal">Δ</mi><mi>τ</mi><mo separator="true">,</mo><mspace width="2em"/><mi>γ</mi><mo>=</mo><mfrac><mn>1</mn><msqrt><mrow><mn>1</mn><mo>−</mo><msup><mi>β</mi><mn>2</mn></msup></mrow></msqrt></mfrac></mrow><annotation encoding="application/x-tex">\left(\frac{c\,\Delta t}{2}\right)^2 = L^2 + \left(\frac{v\,\Delta t}{2}\right)^2 \;\Rightarrow\; \Delta t = \frac{2L/c}{\sqrt{1 - v^2/c^2}} = \gamma\,\Delta\tau, \qquad \gamma = \frac{1}{\sqrt{1 - \beta^2}}</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>At rest: the light goes up and down, 2L, one tick Δτ = 2L/c.</li>
    <li>Moving: the light runs the hypotenuse; Pythagoras with the same c gives Δt.</li>
    <li>Ratio Δt/Δτ = γ, always ≥ 1, growing without limit as β → 1.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>β = 0.6: γ = 1/√(1 − 0.36) = 1.25. While the lab clock ticks 5 times, the moving one ticks 4. At β = 0.99, γ = 7.09.</div>
  <div class="pitfall"><h4>Common mistake</h4>Thinking the ship's crew sees their own clock slow down. On board everything is normal; it is the lab observer who measures the slowing (and the crew says the same of the lab's clocks).</div>
  <div class="try"><h4>Try it</h4>Push β towards 0.99 and watch the moving photon crawl along its long zigzag.</div>
</section>
<section data-case="clock" data-example="fast"><h3>At 0.99 c</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>γ</mi><mo>=</mo><mn>7.09</mn></mrow><annotation encoding="application/x-tex">\gamma = 7.09</annotation></semantics></math></span>: one tick of the moving clock lasts seven lab ticks. Muons made high in the atmosphere live long enough to reach the ground only because of this.</p></section>
<section data-case="clock" data-example="slow"><h3>At 0.1 c</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>γ</mi><mo>=</mo><mn>1.005</mn></mrow><annotation encoding="application/x-tex">\gamma = 1.005</annotation></semantics></math></span>: half a percent, and that is already 30 000 km/s. At everyday speeds the effect is billions of times smaller, which is why we never notice it (GPS satellites do have to correct for it).</p></section>

<section data-case="twins">
  <h3>The twin paradox</h3>
  <div class="look"><h4>What you are looking at</h4>A spacetime diagram: distance across, Earth time up. The Earth twin stays at x = 0 (blue); the traveller (orange) flies at 0.8 c to a star 8 light-years away and comes back. Dots mark each twin's birthdays on their own clock; the gold dashed line is a light ray.</div>
  <p>On each leg the traveller's clock runs slow by γ, as seen from Earth. So on return the traveller is younger. The "paradox": the traveller could say Earth was moving, so Earth's twin should be younger. But the two are not equal: only the traveller turns round, jumping from the outgoing to the returning frame. In spacetime the stay-at-home path is the straight line, and between two events the straight path is the one that collects the most time.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>T</mi><mtext>Earth</mtext></msub><mo>=</mo><mfrac><mrow><mn>2</mn><mi>D</mi></mrow><mi>v</mi></mfrac><mo separator="true">,</mo><mspace width="2em"/><msub><mi>T</mi><mtext>traveller</mtext></msub><mo>=</mo><mfrac><msub><mi>T</mi><mtext>Earth</mtext></msub><mi>γ</mi></mfrac></mrow><annotation encoding="application/x-tex">T_\text{Earth} = \frac{2D}{v}, \qquad T_\text{traveller} = \frac{T_\text{Earth}}{\gamma}</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Earth time for the round trip: distance there and back over speed.</li>
    <li>The traveller's own (proper) time: divide by γ.</li>
    <li>Count the dots on each worldline: those are the birthdays each twin celebrates.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>D = 8 ly, β = 0.8, γ = 5/3: Earth waits 2 · 8/0.8 = 20 years; the traveller ages 20/(5/3) = 12 years. They part as twins and meet 8 years apart in age.</div>
  <div class="pitfall"><h4>Common mistake</h4>Putting the asymmetry in the acceleration's size. The turn can be as quick as you like; what matters is that the traveller's worldline is bent and Earth's is straight.</div>
  <div class="try"><h4>Try it</h4>Raise β towards 0.99: the trip takes Earth just over 16 years, the traveller little more than 2.</div>
</section>
<section data-case="twins" data-example="half"><h3>At 0.5 c</h3><p>32 years on Earth, 27.7 for the traveller (<span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>γ</mi><mo>=</mo><mn>1.155</mn></mrow><annotation encoding="application/x-tex">\gamma = 1.155</annotation></semantics></math></span>): a gap of 4 years.</p></section>

<section data-case="minkowski">
  <h3>Spacetime diagrams and simultaneity</h3>
  <div class="look"><h4>What you are looking at</h4>Lab axes (grey), light rays at 45° (gold), and the axes and grid of a frame moving at β (orange). Events A and B happen at the same lab time, ct = 1, two light-years apart. The red and green dashed lines are the moving frame's lines of "same time" through A and through B.</div>
  <p>In the lab, A and B are simultaneous. But "at the same time" means "on a line of constant time", and a moving observer's lines of constant time are tilted: their time axis leans towards the light ray, and their space axis leans up by the same angle, keeping the light ray halfway between them. Through A and B those tilted lines are different, so for the moving observer the two events are not simultaneous. Which one comes first depends on the direction of motion.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msup><mi>t</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo>=</mo><mi>γ</mi><mrow><mo fence="true">(</mo><mi>t</mi><mo>−</mo><mfrac><mrow><mi>v</mi><mi>x</mi></mrow><msup><mi>c</mi><mn>2</mn></msup></mfrac><mo fence="true">)</mo></mrow><mo separator="true">,</mo><mspace width="2em"/><msup><mi>x</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo>=</mo><mi>γ</mi><mo stretchy="false">(</mo><mi>x</mi><mo>−</mo><mi>v</mi><mi>t</mi><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><msup><mi>c</mi><mn>2</mn></msup><msup><mi>t</mi><mrow><mo mathvariant="normal">′</mo><mn>2</mn></mrow></msup><mo>−</mo><msup><mi>x</mi><mrow><mo mathvariant="normal">′</mo><mn>2</mn></mrow></msup><mo>=</mo><msup><mi>c</mi><mn>2</mn></msup><msup><mi>t</mi><mn>2</mn></msup><mo>−</mo><msup><mi>x</mi><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">t&#x27; = \gamma\left(t - \frac{vx}{c^2}\right), \qquad x&#x27; = \gamma(x - vt), \qquad c^2t&#x27;^2 - x&#x27;^2 = c^2t^2 - x^2</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>The ct' axis (x' = 0) is the line x = βct; the x' axis (t' = 0) is ct = βx.</li>
    <li>Apply the Lorentz transformation to A and B.</li>
    <li>The time difference is −γβΔx/c: zero only if the events are at the same place or β = 0.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>β = 0.6, γ = 1.25: A at (ct, x) = (1, −1) becomes ct' = 1.25 (1 + 0.6) = 2; B at (1, 1) becomes ct' = 1.25 (1 − 0.6) = 0.5. B happens 1.5 years before A for the moving observer.</div>
  <div class="pitfall"><h4>Common mistake</h4>Thinking this can reverse cause and effect. It cannot for events that light could connect (inside each other's light cone): their order is the same in every frame. Only events too far apart for any signal can swap.</div>
  <div class="try"><h4>Try it</h4>Slide β through 0: the order of A and B swaps exactly there.</div>
</section>
<section data-case="minkowski" data-example="flip"><h3>The other way</h3><p>At <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>β</mi><mo>=</mo><mo>−</mo><mn>0.6</mn></mrow><annotation encoding="application/x-tex">\beta = -0.6</annotation></semantics></math></span> the roles swap: now A is at ct' = 0.5 and B at 2.</p></section>
<section data-case="minkowski" data-example="near-c"><h3>At 0.9 c</h3><p>Both orange axes fold towards the light line: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msubsup><mi>t</mi><mi>A</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msubsup><mo>=</mo><mn>4.36</mn></mrow><annotation encoding="application/x-tex">t&#x27;_A = 4.36</annotation></semantics></math></span>, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msubsup><mi>t</mi><mi>B</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msubsup><mo>=</mo><mn>0.23</mn></mrow><annotation encoding="application/x-tex">t&#x27;_B = 0.23</annotation></semantics></math></span>. Every frame sees light at 45°: that is the constancy of c, drawn.</p></section>
<details><summary>About the model</summary>
  <p>Units with c = 1 (years and light-years). Tests: the interval <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>t</mi><mn>2</mn></msup><mo>−</mo><msup><mi>x</mi><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">t^2 - x^2</annotation></semantics></math></span> is unchanged by 200 random boosts (10⁻¹²); two boosts equal one at the relativistic sum of the speeds, always below c; the light-clock tick from the geometry of the diagonal (bisection) equals <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>γ</mi></mrow><annotation encoding="application/x-tex">\gamma</annotation></semantics></math></span> times the rest tick (10⁻¹²); twins at 0.8 c and 8 ly: 20 and 12 years; A and B transform as in the worked example.</p>
</details>
</template>
<template id="explain-spacetime"><section data-case="clock">
  <h3>Time dilation and the light clock</h3>
  <div class="look"><h4>What you are looking at</h4>Two identical light clocks: a flash of light bouncing between two mirrors, one tick per round trip. The left clock is at rest in the lab; the right one rides on a ship moving at β = v/c (the posts underneath are the lab sliding past). Top right: the slowing factor γ. Bottom right: the ticks each clock has counted.</div>
  <p>Light travels at the same speed c for every observer: that is the starting point of relativity. Seen from the lab, the light in the moving clock does not go straight up and down: the mirrors move while it travels, so it runs along a longer diagonal path. Same speed, longer path: each tick takes longer. The moving clock runs slow, and not just this one: every process on the ship, from wristwatches to heartbeats, slows by the same factor.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msup><mrow><mo fence="true">(</mo><mfrac><mrow><mi>c</mi><mtext> </mtext><mi mathvariant="normal">Δ</mi><mi>t</mi></mrow><mn>2</mn></mfrac><mo fence="true">)</mo></mrow><mn>2</mn></msup><mo>=</mo><msup><mi>L</mi><mn>2</mn></msup><mo>+</mo><msup><mrow><mo fence="true">(</mo><mfrac><mrow><mi>v</mi><mtext> </mtext><mi mathvariant="normal">Δ</mi><mi>t</mi></mrow><mn>2</mn></mfrac><mo fence="true">)</mo></mrow><mn>2</mn></msup><mtext>  </mtext><mo>⇒</mo><mtext>  </mtext><mi mathvariant="normal">Δ</mi><mi>t</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>L</mi><mi mathvariant="normal">/</mi><mi>c</mi></mrow><msqrt><mrow><mn>1</mn><mo>−</mo><msup><mi>v</mi><mn>2</mn></msup><mi mathvariant="normal">/</mi><msup><mi>c</mi><mn>2</mn></msup></mrow></msqrt></mfrac><mo>=</mo><mi>γ</mi><mtext> </mtext><mi mathvariant="normal">Δ</mi><mi>τ</mi><mo separator="true">,</mo><mspace width="2em"/><mi>γ</mi><mo>=</mo><mfrac><mn>1</mn><msqrt><mrow><mn>1</mn><mo>−</mo><msup><mi>β</mi><mn>2</mn></msup></mrow></msqrt></mfrac></mrow><annotation encoding="application/x-tex">\left(\frac{c\,\Delta t}{2}\right)^2 = L^2 + \left(\frac{v\,\Delta t}{2}\right)^2 \;\Rightarrow\; \Delta t = \frac{2L/c}{\sqrt{1 - v^2/c^2}} = \gamma\,\Delta\tau, \qquad \gamma = \frac{1}{\sqrt{1 - \beta^2}}</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>At rest: the light goes up and down, 2L, one tick Δτ = 2L/c.</li>
    <li>Moving: the light runs the hypotenuse; Pythagoras with the same c gives Δt.</li>
    <li>Ratio Δt/Δτ = γ, always ≥ 1, growing without limit as β → 1.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>β = 0.6: γ = 1/√(1 − 0.36) = 1.25. While the lab clock ticks 5 times, the moving one ticks 4. At β = 0.99, γ = 7.09.</div>
  <div class="pitfall"><h4>Common mistake</h4>Thinking the ship's crew sees their own clock slow down. On board everything is normal; it is the lab observer who measures the slowing (and the crew says the same of the lab's clocks).</div>
  <div class="try"><h4>Try it</h4>Push β towards 0.99 and watch the moving photon crawl along its long zigzag.</div>
</section>
<section data-case="clock" data-example="fast"><h3>At 0.99 c</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>γ</mi><mo>=</mo><mn>7.09</mn></mrow><annotation encoding="application/x-tex">\gamma = 7.09</annotation></semantics></math></span>: one tick of the moving clock lasts seven lab ticks. Muons made high in the atmosphere live long enough to reach the ground only because of this.</p></section>
<section data-case="clock" data-example="slow"><h3>At 0.1 c</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>γ</mi><mo>=</mo><mn>1.005</mn></mrow><annotation encoding="application/x-tex">\gamma = 1.005</annotation></semantics></math></span>: half a percent, and that is already 30 000 km/s. At everyday speeds the effect is billions of times smaller, which is why we never notice it (GPS satellites do have to correct for it).</p></section>

<section data-case="twins">
  <h3>The twin paradox</h3>
  <div class="look"><h4>What you are looking at</h4>A spacetime diagram: distance across, Earth time up. The Earth twin stays at x = 0 (blue); the traveller (orange) flies at 0.8 c to a star 8 light-years away and comes back. Dots mark each twin's birthdays on their own clock; the gold dashed line is a light ray.</div>
  <p>On each leg the traveller's clock runs slow by γ, as seen from Earth. So on return the traveller is younger. The "paradox": the traveller could say Earth was moving, so Earth's twin should be younger. But the two are not equal: only the traveller turns round, jumping from the outgoing to the returning frame. In spacetime the stay-at-home path is the straight line, and between two events the straight path is the one that collects the most time.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>T</mi><mtext>Earth</mtext></msub><mo>=</mo><mfrac><mrow><mn>2</mn><mi>D</mi></mrow><mi>v</mi></mfrac><mo separator="true">,</mo><mspace width="2em"/><msub><mi>T</mi><mtext>traveller</mtext></msub><mo>=</mo><mfrac><msub><mi>T</mi><mtext>Earth</mtext></msub><mi>γ</mi></mfrac></mrow><annotation encoding="application/x-tex">T_\text{Earth} = \frac{2D}{v}, \qquad T_\text{traveller} = \frac{T_\text{Earth}}{\gamma}</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Earth time for the round trip: distance there and back over speed.</li>
    <li>The traveller's own (proper) time: divide by γ.</li>
    <li>Count the dots on each worldline: those are the birthdays each twin celebrates.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>D = 8 ly, β = 0.8, γ = 5/3: Earth waits 2 · 8/0.8 = 20 years; the traveller ages 20/(5/3) = 12 years. They part as twins and meet 8 years apart in age.</div>
  <div class="pitfall"><h4>Common mistake</h4>Putting the asymmetry in the acceleration's size. The turn can be as quick as you like; what matters is that the traveller's worldline is bent and Earth's is straight.</div>
  <div class="try"><h4>Try it</h4>Raise β towards 0.99: the trip takes Earth just over 16 years, the traveller little more than 2.</div>
</section>
<section data-case="twins" data-example="half"><h3>At 0.5 c</h3><p>32 years on Earth, 27.7 for the traveller (<span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>γ</mi><mo>=</mo><mn>1.155</mn></mrow><annotation encoding="application/x-tex">\gamma = 1.155</annotation></semantics></math></span>): a gap of 4 years.</p></section>

<template id="explain-photoelectric"><section data-case="photo">
  <h3>The photoelectric effect</h3>
  <div class="look"><h4>What you are looking at</h4>Light of one wavelength shining on a metal. Left: the largest kinetic energy of the electrons knocked out, against the frequency of the light, one line per metal. Top right: the energy budget of one photon. Bottom: the spectrum, with each metal's threshold and your light marked.</div>
  <p>Light knocks electrons out of a metal, but in a way waves cannot explain: below a certain frequency nothing comes out at all, however bright the light; above it, electrons appear at once, even in dim light, and their energy depends only on the colour. Einstein's answer: light comes in packets, photons, each with energy hf. One photon gives all its energy to one electron. Part of it (the work function φ) pays to get out of the metal; the rest is kinetic energy.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>E</mi><mtext>photon</mtext></msub><mo>=</mo><mi>h</mi><mi>f</mi><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mi>λ</mi></mfrac><mo separator="true">,</mo><mspace width="2em"/><msub><mi>K</mi><mtext>max</mtext></msub><mo>=</mo><mi>h</mi><mi>f</mi><mo>−</mo><mi>φ</mi><mo separator="true">,</mo><mspace width="2em"/><mi>e</mi><msub><mi>V</mi><mtext>stop</mtext></msub><mo>=</mo><msub><mi>K</mi><mtext>max</mtext></msub><mo separator="true">,</mo><mspace width="2em"/><msub><mi>λ</mi><mn>0</mn></msub><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mi>φ</mi></mfrac></mrow><annotation encoding="application/x-tex">E_\text{photon} = hf = \frac{hc}{\lambda}, \qquad K_\text{max} = hf - \varphi, \qquad eV_\text{stop} = K_\text{max}, \qquad \lambda_0 = \frac{hc}{\varphi}</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Photon energy: hc/λ, with hc = 1240 eV·nm.</li>
    <li>Subtract the work function of the metal.</li>
    <li>Negative? No electrons. Positive? That is K_max, and a reverse voltage of K_max/e stops them.</li>
    <li>All metals give parallel lines of slope h: Millikan measured h this way in 1916.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>Violet light, 400 nm: 1240/400 = 3.10 eV. On sodium (φ = 2.36 eV): K_max = 0.74 eV, stopped by 0.74 V. On zinc (φ = 4.33 eV): nothing; zinc needs λ &lt; 286 nm, ultraviolet.</div>
  <div class="pitfall"><h4>Common mistake</h4>Expecting brighter light to give faster electrons. Brighter light means more photons, so more electrons, each with the same K_max.</div>
  <div class="try"><h4>Try it</h4>Lengthen the wavelength until K_max hits zero: that is the threshold λ₀.</div>
</section>
<section data-case="photo" data-example="red"><h3>Red light on sodium</h3><p>650 nm photons carry 1.91 eV, less than the 2.36 eV needed: no electrons, at any brightness. Sodium needs λ &lt; 525 nm.</p></section>
<section data-case="photo" data-example="uv"><h3>Ultraviolet on zinc</h3><p>250 nm: 4.96 eV per photon, 0.63 eV left after paying zinc's 4.33 eV. This is the experiment Hallwachs did with a zinc plate in 1888.</p></section>

<section data-case="box">
  <h3>A particle in a box</h3>
  <div class="look"><h4>What you are looking at</h4>An electron trapped between two hard walls 1 nm apart. Left: the probability of finding it at each place, |Ψ|². Top right: the allowed energies. Bottom: the two wave functions ψ₁ and ψ₂ that are mixed.</div>
  <p>In quantum mechanics a trapped particle is described by a wave that must vanish at the walls. Like a guitar string, it can only fit a whole number of half-waves: so only certain shapes, and only certain energies, are allowed. A particle in one of these states has a probability pattern that never changes: a stationary state. Mix two of them and the pattern sloshes from side to side, at a rate set by their energy difference.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>ψ</mi><mi>n</mi></msub><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><msqrt><mstyle scriptlevel="0" displaystyle="false"><mfrac><mn>2</mn><mi>L</mi></mfrac></mstyle></msqrt><mi>sin</mi><mo>⁡</mo><mfrac><mrow><mi>n</mi><mi>π</mi><mi>x</mi></mrow><mi>L</mi></mfrac><mo separator="true">,</mo><mspace width="2em"/><msub><mi>E</mi><mi>n</mi></msub><mo>=</mo><mfrac><mrow><msup><mi>n</mi><mn>2</mn></msup><msup><mi>h</mi><mn>2</mn></msup></mrow><mrow><mn>8</mn><mi>m</mi><msup><mi>L</mi><mn>2</mn></msup></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="normal">∣</mi><mi mathvariant="normal">Ψ</mi><msup><mi mathvariant="normal">∣</mi><mn>2</mn></msup><mo>=</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mo stretchy="false">(</mo><msubsup><mi>ψ</mi><mi>a</mi><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>ψ</mi><mi>b</mi><mn>2</mn></msubsup><mo stretchy="false">)</mo><mo>+</mo><msub><mi>ψ</mi><mi>a</mi></msub><msub><mi>ψ</mi><mi>b</mi></msub><mi>cos</mi><mo>⁡</mo><mfrac><mrow><mo stretchy="false">(</mo><msub><mi>E</mi><mi>b</mi></msub><mo>−</mo><msub><mi>E</mi><mi>a</mi></msub><mo stretchy="false">)</mo><mi>t</mi></mrow><mi mathvariant="normal">ℏ</mi></mfrac></mrow><annotation encoding="application/x-tex">\psi_n(x) = \sqrt{\tfrac{2}{L}}\sin\frac{n\pi x}{L}, \qquad E_n = \frac{n^2h^2}{8mL^2}, \qquad |\Psi|^2 = \tfrac12(\psi_a^2 + \psi_b^2) + \psi_a\psi_b\cos\frac{(E_b - E_a)t}{\hbar}</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Fit n half-wavelengths in L: λₙ = 2L/n.</li>
    <li>De Broglie: p = h/λ, so E = p²/2m = n²h²/8mL².</li>
    <li>The lowest energy is not zero: the particle can never sit still.</li>
    <li>Mixed states beat with period h/(E_b − E_a).</li>
  </ol>

<template id="explain-particle-in-a-box"><section data-case="photo">

<section data-case="box">
  <h3>A particle in a box</h3>

  <div class="worked"><h4>Worked example</h4>Violet light, 400 nm: 1240/400 = 3.10 eV. On sodium (φ = 2.36 eV): K_max = 0.74 eV, stopped by 0.74 V. On zinc (φ = 4.33 eV): nothing; zinc needs λ &lt; 286 nm, ultraviolet.</div>
  <div class="pitfall"><h4>Common mistake</h4>Expecting brighter light to give faster electrons. Brighter light means more photons, so more electrons, each with the same K_max.</div>
  <div class="try"><h4>Try it</h4>Lengthen the wavelength until K_max hits zero: that is the threshold λ₀.</div>
</section>
<section data-case="photo" data-example="red"><h3>Red light on sodium</h3><p>650 nm photons carry 1.91 eV, less than the 2.36 eV needed: no electrons, at any brightness. Sodium needs λ &lt; 525 nm.</p></section>
<section data-case="photo" data-example="uv"><h3>Ultraviolet on zinc</h3><p>250 nm: 4.96 eV per photon, 0.63 eV left after paying zinc's 4.33 eV. This is the experiment Hallwachs did with a zinc plate in 1888.</p></section>

<section data-case="box">
  <h3>A particle in a box</h3>
  <div class="look"><h4>What you are looking at</h4>An electron trapped between two hard walls 1 nm apart. Left: the probability of finding it at each place, |Ψ|². Top right: the allowed energies. Bottom: the two wave functions ψ₁ and ψ₂ that are mixed.</div>
  <p>In quantum mechanics a trapped particle is described by a wave that must vanish at the walls. Like a guitar string, it can only fit a whole number of half-waves: so only certain shapes, and only certain energies, are allowed. A particle in one of these states has a probability pattern that never changes: a stationary state. Mix two of them and the pattern sloshes from side to side, at a rate set by their energy difference.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>ψ</mi><mi>n</mi></msub><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><msqrt><mstyle scriptlevel="0" displaystyle="false"><mfrac><mn>2</mn><mi>L</mi></mfrac></mstyle></msqrt><mi>sin</mi><mo>⁡</mo><mfrac><mrow><mi>n</mi><mi>π</mi><mi>x</mi></mrow><mi>L</mi></mfrac><mo separator="true">,</mo><mspace width="2em"/><msub><mi>E</mi><mi>n</mi></msub><mo>=</mo><mfrac><mrow><msup><mi>n</mi><mn>2</mn></msup><msup><mi>h</mi><mn>2</mn></msup></mrow><mrow><mn>8</mn><mi>m</mi><msup><mi>L</mi><mn>2</mn></msup></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="normal">∣</mi><mi mathvariant="normal">Ψ</mi><msup><mi mathvariant="normal">∣</mi><mn>2</mn></msup><mo>=</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mo stretchy="false">(</mo><msubsup><mi>ψ</mi><mi>a</mi><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>ψ</mi><mi>b</mi><mn>2</mn></msubsup><mo stretchy="false">)</mo><mo>+</mo><msub><mi>ψ</mi><mi>a</mi></msub><msub><mi>ψ</mi><mi>b</mi></msub><mi>cos</mi><mo>⁡</mo><mfrac><mrow><mo stretchy="false">(</mo><msub><mi>E</mi><mi>b</mi></msub><mo>−</mo><msub><mi>E</mi><mi>a</mi></msub><mo stretchy="false">)</mo><mi>t</mi></mrow><mi mathvariant="normal">ℏ</mi></mfrac></mrow><annotation encoding="application/x-tex">\psi_n(x) = \sqrt{\tfrac{2}{L}}\sin\frac{n\pi x}{L}, \qquad E_n = \frac{n^2h^2}{8mL^2}, \qquad |\Psi|^2 = \tfrac12(\psi_a^2 + \psi_b^2) + \psi_a\psi_b\cos\frac{(E_b - E_a)t}{\hbar}</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Fit n half-wavelengths in L: λₙ = 2L/n.</li>
    <li>De Broglie: p = h/λ, so E = p²/2m = n²h²/8mL².</li>
    <li>The lowest energy is not zero: the particle can never sit still.</li>
    <li>Mixed states beat with period h/(E_b − E_a).</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>Electron, L = 1 nm: E₁ = 0.376 eV, E₂ = 1.50 eV, E₃ = 3.38 eV. The 1 + 2 mix sloshes with period h/1.13 eV = 3.67 fs. A jump from 2 to 1 emits a 1.13 eV photon, λ = 1099 nm.</div>
  <div class="pitfall"><h4>Common mistake</h4>Picturing the electron bouncing between the walls in a stationary state. In a single state nothing moves at all; motion needs a mix of energies.</div>
  <div class="try"><h4>Try it</h4>Pick b = a: the sloshing stops. Pick a and b far apart: it speeds up.</div>
</section>
<section data-case="box" data-example="ground"><h3>The ground state</h3><p>One hump, highest in the middle, constant in time. Its energy, 0.376 eV, is the zero-point energy: the uncertainty principle forbids a confined particle to have none.</p></section>
<section data-case="box" data-example="one-three"><h3>States 1 and 3</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>E</mi><mn>3</mn></msub><mo>−</mo><msub><mi>E</mi><mn>1</mn></msub><mo>=</mo><mn>8</mn><msub><mi>E</mi><mn>1</mn></msub><mo>=</mo><mn>3.0</mn></mrow><annotation encoding="application/x-tex">E_3 - E_1 = 8E_1 = 3.0</annotation></semantics></math></span> eV: the pattern beats with period 1.37 fs, and since both states are symmetric it pulses in the middle instead of sloshing left and right.</p></section>
<section data-case="box" data-example="wide"><h3>Twice as wide</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>E</mi><mo>∝</mo><mn>1</mn><mi mathvariant="normal">/</mi><msup><mi>L</mi><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">E \propto 1/L^2</annotation></semantics></math></span>: every level drops four times, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>E</mi><mn>1</mn></msub><mo>=</mo><mn>0.094</mn></mrow><annotation encoding="application/x-tex">E_1 = 0.094</annotation></semantics></math></span> eV. Larger boxes, closer levels: this is why quantum dots change colour with their size.</p></section>

<section data-case="bohr">
  <h3>The hydrogen spectrum</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the energy levels of hydrogen, with the jumps of one series. Top right: the wavelengths of that series. Bottom: the visible spectrum, dark except for the Balmer lines.</div>
  <p>Heat hydrogen and it glows, but not with all colours: only with a few sharp lines. Bohr explained them: the electron can only have certain energies, and when it drops from one level to a lower one it emits one photon carrying exactly the difference. The levels crowd together towards zero, so each series of lines crowds together towards a limit.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>E</mi><mi>n</mi></msub><mo>=</mo><mo>−</mo><mfrac><mrow><mn>13.6</mn><mtext> eV</mtext></mrow><msup><mi>n</mi><mn>2</mn></msup></mfrac><mo separator="true">,</mo><mspace width="2em"/><mfrac><mn>1</mn><mi>λ</mi></mfrac><mo>=</mo><msub><mi>R</mi><mi>H</mi></msub><mrow><mo fence="true">(</mo><mfrac><mn>1</mn><msubsup><mi>n</mi><mn>1</mn><mn>2</mn></msubsup></mfrac><mo>−</mo><mfrac><mn>1</mn><msubsup><mi>n</mi><mn>2</mn><mn>2</mn></msubsup></mfrac><mo fence="true">)</mo></mrow><mo separator="true">,</mo><mspace width="2em"/><msub><mi>R</mi><mi>H</mi></msub><mo>=</mo><mn>1.0968</mn><mo>⋅</mo><msup><mn>10</mn><mn>7</mn></msup><mtext> </mtext><msup><mtext>m</mtext><mrow><mo>−</mo><mn>1</mn></mrow></msup></mrow><annotation encoding="application/x-tex">E_n = -\frac{13.6\ \text{eV}}{n^2}, \qquad \frac{1}{\lambda} = R_H\left(\frac{1}{n_1^2} - \frac{1}{n_2^2}\right), \qquad R_H = 1.0968\cdot10^7\ \text{m}^{-1}</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Pick the lower level n₁: 1 Lyman (ultraviolet), 2 Balmer (visible), 3 Paschen (infrared).</li>
    <li>Photon energy = E(n₂) − E(n₁); wavelength = 1240 eV·nm / energy.</li>
    <li>As n₂ → ∞, λ → the series limit, n₁²/R_H.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>3 → 2: E = −1.511 − (−3.400) = 1.889 eV, λ = 656.5 nm (Hα, the red line; 656.3 nm in air). 4 → 2: 486.3 nm, cyan. Balmer limit 364.7 nm.</div>
  <div class="pitfall"><h4>Common mistake</h4>Forgetting that energies are negative: the electron is bound, and n = ∞ (energy 0) means free. Larger n is higher energy.</div>
  <div class="try"><h4>Try it</h4>Step the upper level up from 3: the Balmer lines march towards violet and bunch together.</div>
</section>
<section data-case="bohr" data-example="lyman"><h3>Lyman series</h3><p>Every jump ends on the ground state: big energies, 10.2 eV and up, all in the ultraviolet (Lyman α at 121.6 nm).</p></section>
<section data-case="bohr" data-example="paschen"><h3>Paschen series</h3><p>Jumps down to <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding="application/x-tex">n = 3</annotation></semantics></math></span>: small energies, infrared lines from 1876 nm (4 → 3) down to the limit at 820 nm.</p></section>
<details><summary>About the model</summary>
  <p>CODATA 2018 constants; work functions from the CRC Handbook; Bohr levels with the reduced-mass Rydberg constant <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>R</mi><mi>H</mi></msub><mo>=</mo><msub><mi>R</mi><mi mathvariant="normal">∞</mi></msub><mi mathvariant="normal">/</mi><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><msub><mi>m</mi><mi>e</mi></msub><mi mathvariant="normal">/</mi><msub><mi>m</mi><mi>p</mi></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">R_H = R_\infty/(1 + m_e/m_p)</annotation></semantics></math></span>, vacuum wavelengths. Tests: box states normalised and orthogonal, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>E</mi><mi>n</mi></msub><mo>∝</mo><msup><mi>n</mi><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">E_n \propto n^2</annotation></semantics></math></span>, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>E</mi><mn>1</mn></msub><mo>=</mo><mn>0.376</mn></mrow><annotation encoding="application/x-tex">E_1 = 0.376</annotation></semantics></math></span> eV for 1 nm; the superposition keeps probability 1 and moves from the left half to the right in half a period; Hα 656.47 nm and Lyman α vs measured values (2·10⁻⁵, Bohr has no fine structure); no photoelectrons beyond the threshold, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>K</mi><mtext>max</mtext></msub></mrow><annotation encoding="application/x-tex">K_\text{max}</annotation></semantics></math></span> slope the same for every metal.</p>
</details>
</template>
<template id="explain-radioactive-decay"><section data-case="decay">
  <h3>Radioactive decay and half-life</h3>
  <div class="look"><h4>What you are looking at</h4>400 unstable nuclei (gold) with a half-life of 2 s; each turns grey when it decays. Top right: how many are left, against the exponential law, with the half-life points marked. Bottom right: decays per second. Below: the logarithm of the count, a straight line.</div>
  <p>A radioactive nucleus has no clock inside: it does not get "older" and more likely to decay. In every second it has the same small chance of decaying, whatever happened before. So the number that decay each second is proportional to how many are still there, and the count falls by the same fraction in every equal stretch of time: half in one half-life, half of the rest in the next, and so on. Which nucleus goes when is pure chance; the overall law is exact.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mfrac><mrow><mi>d</mi><mi>N</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>−</mo><mi>λ</mi><mi>N</mi><mtext>  </mtext><mo>⇒</mo><mtext>  </mtext><mi>N</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><msub><mi>N</mi><mn>0</mn></msub><msup><mi>e</mi><mrow><mo>−</mo><mi>λ</mi><mi>t</mi></mrow></msup><mo>=</mo><msub><mi>N</mi><mn>0</mn></msub><msup><mrow><mo fence="true">(</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mo fence="true">)</mo></mrow><mrow><mi>t</mi><mi mathvariant="normal">/</mi><msub><mi>T</mi><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mn>2</mn></mrow></msub></mrow></msup><mo separator="true">,</mo><mspace width="2em"/><msub><mi>T</mi><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi>ln</mi><mo>⁡</mo><mn>2</mn></mrow><mi>λ</mi></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi>A</mi><mo>=</mo><mi>λ</mi><mi>N</mi></mrow><annotation encoding="application/x-tex">\frac{dN}{dt} = -\lambda N \;\Rightarrow\; N(t) = N_0 e^{-\lambda t} = N_0\left(\tfrac12\right)^{t/T_{1/2}}, \qquad T_{1/2} = \frac{\ln 2}{\lambda}, \qquad A = \lambda N</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Decay constant λ = ln 2 / T½: the chance per second.</li>
    <li>After n half-lives: N₀/2ⁿ left.</li>
    <li>Activity (decays per second) falls in the same way: A = λN.</li>
    <li>Random scatter: about √(N p(1 − p)) around the law, large when N is small.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>T½ = 2 s: λ = 0.347 /s, mean life 2.89 s. From 400: expect 200 after 2 s, 100 after 4 s, 12.5 after 10 s; this sample had 222, 105 and 16. The starting activity is 0.347 · 400 = 139 decays per second.</div>
  <div class="pitfall"><h4>Common mistake</h4>Thinking that after two half-lives everything has decayed. Each half-life halves what is left: after two, a quarter remains.</div>
  <div class="try"><h4>Try it</h4>Change the random sample: the dots decay in a different order, the curve stays close to the same law.</div>
</section>
<section data-case="decay" data-example="small"><h3>Only 25 nuclei</h3><p>Now chance dominates: after one half-life you might have 10 or 15 instead of 12.5 (here 10). The exponential law is a statement about averages; it gets precise only with many nuclei, and a gram of matter holds 10²² of them.</p></section>
<section data-case="decay" data-example="long"><h3>A longer half-life</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>T</mi><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mn>2</mn></mrow></msub><mo>=</mo><mn>4</mn></mrow><annotation encoding="application/x-tex">T_{1/2} = 4</annotation></semantics></math></span> s: the same curve, stretched twice as long in time; the starting activity is half as large.</p></section>

<section data-case="chain">
  <h3>Decay chains and equilibrium</h3>
  <div class="look"><h4>What you are looking at</h4>Parent A (gold, T½ = 10 s) decays into daughter B (orange, T½ = 1 s), which decays into a stable nucleus (grey). Top right: counts of A and B against the exact (Bateman) curves.</div>
  <p>The daughter is made by the parent's decays and removed by its own. At first B builds up; soon it decays as fast as it is made. If the parent lives much longer than the daughter, B settles to a small, steady fraction of A and then simply follows A down: the two activities become equal. This is secular equilibrium, and it is why short-lived radon is always present wherever there is long-lived uranium.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mfrac><mrow><mi>d</mi><msub><mi>N</mi><mi>B</mi></msub></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><msub><mi>λ</mi><mi>A</mi></msub><msub><mi>N</mi><mi>A</mi></msub><mo>−</mo><msub><mi>λ</mi><mi>B</mi></msub><msub><mi>N</mi><mi>B</mi></msub><mo separator="true">,</mo><mspace width="2em"/><msub><mi>N</mi><mi>B</mi></msub><mo>=</mo><msub><mi>N</mi><mn>0</mn></msub><mfrac><msub><mi>λ</mi><mi>A</mi></msub><mrow><msub><mi>λ</mi><mi>B</mi></msub><mo>−</mo><msub><mi>λ</mi><mi>A</mi></msub></mrow></mfrac><mrow><mo fence="true">(</mo><msup><mi>e</mi><mrow><mo>−</mo><msub><mi>λ</mi><mi>A</mi></msub><mi>t</mi></mrow></msup><mo>−</mo><msup><mi>e</mi><mrow><mo>−</mo><msub><mi>λ</mi><mi>B</mi></msub><mi>t</mi></mrow></msup><mo fence="true">)</mo></mrow><mo separator="true">,</mo><mspace width="2em"/><mfrac><mrow><msub><mi>λ</mi><mi>B</mi></msub><msub><mi>N</mi><mi>B</mi></msub></mrow><mrow><msub><mi>λ</mi><mi>A</mi></msub><msub><mi>N</mi><mi>A</mi></msub></mrow></mfrac><mo>→</mo><mfrac><msub><mi>λ</mi><mi>B</mi></msub><mrow><msub><mi>λ</mi><mi>B</mi></msub><mo>−</mo><msub><mi>λ</mi><mi>A</mi></msub></mrow></mfrac></mrow><annotation encoding="application/x-tex">\frac{dN_B}{dt} = \lambda_A N_A - \lambda_B N_B, \qquad N_B = N_0\frac{\lambda_A}{\lambda_B - \lambda_A}\left(e^{-\lambda_A t} - e^{-\lambda_B t}\right), \qquad \frac{\lambda_B N_B}{\lambda_A N_A} \to \frac{\lambda_B}{\lambda_B - \lambda_A}</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>B grows from zero while e^(−λ_B t) dies away (a few daughter half-lives).</li>
    <li>Then N_B/N_A is fixed: λ_A/(λ_B − λ_A).</li>
    <li>If λ_A ≪ λ_B: activities equal, λ_B N_B ≈ λ_A N_A.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>T½(A) = 10 s, T½(B) = 1 s: N_B/N_A → 0.0693/(0.693 − 0.0693) = 0.111. With 238 nuclei of A at 8 s, expect 26 of B; the sample has 24. The activity ratio B/A is 1.11.</div>
  <div class="pitfall"><h4>Common mistake</h4>Expecting the daughter to pile up indefinitely. It cannot exceed the rate at which it is made divided by its own decay rate.</div>
  <div class="try"><h4>Try it</h4>Make B's half-life longer: B takes longer to settle and ends up a larger fraction of A.</div>
</section>
<section data-case="chain" data-example="transient"><h3>Transient equilibrium</h3><p>T½(A) = 4 s, T½(B) = 1.5 s: still B settles to a fixed ratio of A, but the activity ratio is now <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>λ</mi><mi>B</mi></msub><mi mathvariant="normal">/</mi><mo stretchy="false">(</mo><msub><mi>λ</mi><mi>B</mi></msub><mo>−</mo><msub><mi>λ</mi><mi>A</mi></msub><mo stretchy="false">)</mo><mo>=</mo><mn>1.6</mn></mrow><annotation encoding="application/x-tex">\lambda_B/(\lambda_B - \lambda_A) = 1.6</annotation></semantics></math></span>: B is more active than its parent.</p></section>
<details><summary>About the model</summary>
  <p>Each nucleus draws an exponential lifetime from a seeded random generator; daughters draw theirs when they are born. Exact curves from the Bateman solution. Tests: Bateman vs RK4 integration of the rate equations (10⁻⁸); after one half-life, 10 000 nuclei leave 5000 ± 3σ for three seeds; secular and transient equilibrium ratios <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>λ</mi><mi>B</mi></msub><mi mathvariant="normal">/</mi><mo stretchy="false">(</mo><msub><mi>λ</mi><mi>B</mi></msub><mo>−</mo><msub><mi>λ</mi><mi>A</mi></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\lambda_B/(\lambda_B - \lambda_A)</annotation></semantics></math></span>.</p>
</details>
</template>
</head>
