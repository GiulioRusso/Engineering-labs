<template id="explain-time-response"><section data-case="first second poles">
  <p>The complex plane <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>s</mi><mo>=</mo><mi>σ</mi><mo>+</mo><mi>j</mi><mi>ω</mi></mrow><annotation encoding="application/x-tex">s = \sigma + j\omega</annotation></semantics></math></span>, with the poles of <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>G</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">G(s)</annotation></semantics></math></span> as ×. The poles decide how the system moves; the right half plane (tinted) is unstable. Drag the pole. The <i>3D view</i> (in View) shows <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>log</mi><mo>⁡</mo><mi mathvariant="normal">∣</mi><mi>G</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi></mrow><annotation encoding="application/x-tex">\log|G(s)|</annotation></semantics></math></span> as a surface: every pole is a peak.</p>
</section>
<section data-case="first">
  <h3>First-order response</h3>
  <div class="look"><h4>What you are looking at</h4>The step response of G(s) = K/(τs + 1): the output rising toward K, with the time constant τ and the 63 % point marked; the s-plane shows the single pole at −1/τ.</div>
  <p>Many real systems — a heater, a tank filling, an RC circuit — respond to a sudden change by moving toward the new value quickly at first, then more and more slowly: they close a fixed fraction of the remaining gap every second. That is an exponential, and its speed is set by one number, τ.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>G</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mi>K</mi><mrow><mi>τ</mi><mi>s</mi><mo>+</mo><mn>1</mn></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi>y</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mi>K</mi><mrow><mo fence="true">(</mo><mn>1</mn><mo>−</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>t</mi><mi mathvariant="normal">/</mi><mi>τ</mi></mrow></msup><mo fence="true">)</mo></mrow><mo separator="true">,</mo><mspace width="2em"/><mi>y</mi><mo stretchy="false">(</mo><mi>τ</mi><mo stretchy="false">)</mo><mo>=</mo><mn>0.632</mn><mi>K</mi><mo separator="true">,</mo><mspace width="1em"/><msub><mi>t</mi><mrow><mn>2</mn><mi mathvariant="normal">%</mi></mrow></msub><mo>≈</mo><mn>4</mn><mi>τ</mi></mrow><annotation encoding="application/x-tex">G(s) = \frac{K}{\tau s + 1}, \qquad y(t) = K\left(1 - e^{-t/\tau}\right), \qquad y(\tau) = 0.632K, \quad t_{2\%} \approx 4\tau</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>K sets where it ends; τ sets how fast it gets there.</li>
    <li>Initial slope K/τ: if it kept that rate it would arrive in exactly τ.</li>
    <li>The pole at −1/τ: further left in the s-plane means faster.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>An oven with τ = 10 min set from 20 to 200 °C (K = 180): after 10 min 134 °C, after 40 min 197 °C.</div>
  <div class="pitfall"><h4>Common mistake</h4>Expecting it to "arrive": an exponential never reaches the final value; engineers use the 2 % settling time.</div>
</section>
<section data-case="first" data-example="fast"><h3>Small τ</h3><p>The pole moves left to <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mn>3.3</mn></mrow><annotation encoding="application/x-tex">-3.3</annotation></semantics></math></span>: the response is three times faster. A thermometer with a thin bulb, a small RC circuit.</p></section>
<section data-case="first" data-example="slow"><h3>Large τ</h3><p>A pole near the origin is slow: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>τ</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding="application/x-tex">\tau = 3</annotation></semantics></math></span> s means 12 s to settle.</p></section>
<section data-case="first" data-example="gain"><h3>Gain</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>K</mi></mrow><annotation encoding="application/x-tex">K</annotation></semantics></math></span> scales the final value but not the speed: the pole does not move.</p></section>
<section data-case="second">
  <h3>Second-order response</h3>
  <div class="look"><h4>What you are looking at</h4>The step response of a second-order system for the chosen damping ζ and natural frequency ωn, with overshoot, peak time and settling time marked; the poles in the s-plane.</div>
  <p>Systems with two energy stores (mass and spring, inductor and capacitor) can overshoot and ring. ζ decides the shape: below 1 they oscillate, at 1 they arrive as fast as possible without overshoot, above 1 they creep. ωn only sets the time scale: double it and the same curve happens twice as fast.</p>

  <div class="worked"><h4>Worked example</h4>ζ = 0.3, ωn = 2: overshoot 37 %, peak at 1.65 s, settled after about 6.7 s. ζ = 0.7: overshoot 4.6 % — a common design target.</div>

  <div class="try"><h4>Try it</h4>Sweep ζ from 0 to 2 and follow the poles: they travel round a circle of radius ωn, meet at ζ = 1 and split along the real axis.</div>
</section>
<section data-case="second" data-example="z0"><h3>No damping</h3><p>The poles sit on the <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>j</mi><mi>ω</mi></mrow><annotation encoding="application/x-tex">j\omega</annotation></semantics></math></span> axis: the response oscillates between 0 and <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2</mn><mi>K</mi></mrow><annotation encoding="application/x-tex">2K</annotation></semantics></math></span> forever.</p></section>
<section data-case="second" data-example="z07"><h3>ζ = 0.7</h3><p>A common design target: about 5 % overshoot and a quick rise. The poles are at 45° from the negative real axis.</p></section>

<section data-case="poles">
  <h3>Poles decide the response</h3>
  <div class="look"><h4>What you are looking at</h4>Draggable poles in the s-plane and the resulting step response.</div>
  <p>Each pole contributes a term e^{pt}. Its real part is a decay rate (negative: dies out; positive: grows — unstable); its imaginary part is an oscillation frequency. A pole far to the left dies so fast that it hardly matters; the poles nearest the imaginary axis dominate.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>p</mi><mo>=</mo><mi>σ</mi><mo>±</mo><mi>j</mi><mi>ω</mi><mtext>  </mtext><mo>⇒</mo><mtext>  </mtext><msup><mi>e</mi><mrow><mi>σ</mi><mi>t</mi></mrow></msup><mi>cos</mi><mo>⁡</mo><mi>ω</mi><mi>t</mi><mo separator="true">,</mo><mspace width="2em"/><mtext>stable</mtext><mtext>  </mtext><mo>⟺</mo><mtext>  </mtext><mtext>all </mtext><mi mathvariant="normal">Re</mi><mo>⁡</mo><mi>p</mi><mo>&lt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">p = \sigma \pm j\omega \;\Rightarrow\; e^{\sigma t}\cos\omega t, \qquad \text{stable} \iff \text{all } \operatorname{Re} p &lt; 0</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>Poles at −0.5 ± 2j plus one at −4: the −4 term is gone after 1 s; the response is essentially the second-order one. Move it to −0.2 and it becomes the slowest part.</div>

</section>
<section data-case="poles" data-example="axis"><h3>On the jω axis</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>σ</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\sigma = 0</annotation></semantics></math></span>: the oscillation neither grows nor decays. Marginally stable: any extra push would accumulate.</p></section>
<section data-case="poles" data-example="rhp"><h3>Right half plane</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>σ</mi><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\sigma &gt; 0</annotation></semantics></math></span>: the oscillation grows as <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>e</mi><mrow><mn>0.3</mn><mi>t</mi></mrow></msup></mrow><annotation encoding="application/x-tex">e^{0.3t}</annotation></semantics></math></span> without limit. An unstable system.</p></section>
<section data-case="poles" data-example="real"><h3>Real poles</h3><p>No imaginary part, no oscillation: the modes are pure exponentials.</p></section>
<section data-case="poles" data-example="far"><h3>A far pole</h3><p>A pole at <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mn>4</mn></mrow><annotation encoding="application/x-tex">-4</annotation></semantics></math></span> has a mode <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>e</mi><mrow><mo>−</mo><mn>4</mn><mi>t</mi></mrow></msup></mrow><annotation encoding="application/x-tex">e^{-4t}</annotation></semantics></math></span> that dies out almost at once: the response is still dominated by the pair closest to the axis.</p></section>
<section data-case="poles" data-example="near"><h3>A near pole</h3><p>A real pole at <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mn>0.2</mn></mrow><annotation encoding="application/x-tex">-0.2</annotation></semantics></math></span> decays slower than the pair: now it dominates, and the system looks first order and slow.</p></section>
</template>
<template id="explain-poles"><section data-case="first second poles">
  <p>The complex plane <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>s</mi><mo>=</mo><mi>σ</mi><mo>+</mo><mi>j</mi><mi>ω</mi></mrow><annotation encoding="application/x-tex">s = \sigma + j\omega</annotation></semantics></math></span>, with the poles of <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>G</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">G(s)</annotation></semantics></math></span> as ×. The poles decide how the system moves; the right half plane (tinted) is unstable. Drag the pole. The <i>3D view</i> (in View) shows <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>log</mi><mo>⁡</mo><mi mathvariant="normal">∣</mi><mi>G</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi></mrow><annotation encoding="application/x-tex">\log|G(s)|</annotation></semantics></math></span> as a surface: every pole is a peak.</p>
</section>
<section data-case="first">
  <h3>First-order response</h3>
  <div class="look"><h4>What you are looking at</h4>The step response of G(s) = K/(τs + 1): the output rising toward K, with the time constant τ and the 63 % point marked; the s-plane shows the single pole at −1/τ.</div>
  <p>Many real systems — a heater, a tank filling, an RC circuit — respond to a sudden change by moving toward the new value quickly at first, then more and more slowly: they close a fixed fraction of the remaining gap every second. That is an exponential, and its speed is set by one number, τ.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>G</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mi>K</mi><mrow><mi>τ</mi><mi>s</mi><mo>+</mo><mn>1</mn></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi>y</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mi>K</mi><mrow><mo fence="true">(</mo><mn>1</mn><mo>−</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>t</mi><mi mathvariant="normal">/</mi><mi>τ</mi></mrow></msup><mo fence="true">)</mo></mrow><mo separator="true">,</mo><mspace width="2em"/><mi>y</mi><mo stretchy="false">(</mo><mi>τ</mi><mo stretchy="false">)</mo><mo>=</mo><mn>0.632</mn><mi>K</mi><mo separator="true">,</mo><mspace width="1em"/><msub><mi>t</mi><mrow><mn>2</mn><mi mathvariant="normal">%</mi></mrow></msub><mo>≈</mo><mn>4</mn><mi>τ</mi></mrow><annotation encoding="application/x-tex">G(s) = \frac{K}{\tau s + 1}, \qquad y(t) = K\left(1 - e^{-t/\tau}\right), \qquad y(\tau) = 0.632K, \quad t_{2\%} \approx 4\tau</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>K sets where it ends; τ sets how fast it gets there.</li>
    <li>Initial slope K/τ: if it kept that rate it would arrive in exactly τ.</li>
    <li>The pole at −1/τ: further left in the s-plane means faster.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>An oven with τ = 10 min set from 20 to 200 °C (K = 180): after 10 min 134 °C, after 40 min 197 °C.</div>
  <div class="pitfall"><h4>Common mistake</h4>Expecting it to "arrive": an exponential never reaches the final value; engineers use the 2 % settling time.</div>
</section>
<section data-case="first" data-example="fast"><h3>Small τ</h3><p>The pole moves left to <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mn>3.3</mn></mrow><annotation encoding="application/x-tex">-3.3</annotation></semantics></math></span>: the response is three times faster. A thermometer with a thin bulb, a small RC circuit.</p></section>
<section data-case="first" data-example="slow"><h3>Large τ</h3><p>A pole near the origin is slow: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>τ</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding="application/x-tex">\tau = 3</annotation></semantics></math></span> s means 12 s to settle.</p></section>
<section data-case="first" data-example="gain"><h3>Gain</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>K</mi></mrow><annotation encoding="application/x-tex">K</annotation></semantics></math></span> scales the final value but not the speed: the pole does not move.</p></section>

  <div class="try"><h4>Try it</h4>Sweep ζ from 0 to 2 and follow the poles: they travel round a circle of radius ωn, meet at ζ = 1 and split along the real axis.</div>
</section>

<template id="explain-steady-state-error"><section data-case="error">
  <h3>Steady-state error</h3>
  <div class="look"><h4>What you are looking at</h4>A unity-feedback loop following a step, ramp or parabola input: reference (dashed) and output, with the remaining error.</div>
  <p>Feedback works by acting on the error. A plain proportional controller needs some error to keep pushing, so it never quite gets there. Every integrator in the loop (the "type") removes one level of error: type 1 follows a step perfectly, type 2 a ramp.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>e</mi><mtext>ss</mtext></msub><mo>=</mo><munder><mrow><mi>lim</mi><mo>⁡</mo></mrow><mrow><mi>s</mi><mo>→</mo><mn>0</mn></mrow></munder><mfrac><mrow><mi>s</mi><mtext> </mtext><mi>R</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo></mrow><mrow><mn>1</mn><mo>+</mo><mi>G</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mtext>step: </mtext><mfrac><mn>1</mn><mrow><mn>1</mn><mo>+</mo><msub><mi>K</mi><mi>p</mi></msub></mrow></mfrac><mo separator="true">,</mo><mspace width="1em"/><mtext>ramp: </mtext><mfrac><mn>1</mn><msub><mi>K</mi><mi>v</mi></msub></mfrac><mo separator="true">,</mo><mspace width="1em"/><mtext>parabola: </mtext><mfrac><mn>1</mn><msub><mi>K</mi><mi>a</mi></msub></mfrac></mrow><annotation encoding="application/x-tex">e_\text{ss} = \lim_{s\to 0}\frac{s\,R(s)}{1 + G(s)}, \qquad \text{step: } \frac{1}{1 + K_p}, \quad \text{ramp: } \frac{1}{K_v}, \quad \text{parabola: } \frac{1}{K_a}</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Type 0 on a step: finite error 1/(1 + K) — more gain, less error.</li>
    <li>Type 1 on a step: zero; on a ramp: a constant lag.</li>
    <li>Asking a type-0 loop to follow a ramp: the error grows without limit.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>Type 0 with K = 5: 1/6 = 17 % error. K = 20: 4.8 %. Add an integrator: 0 %.</div>
  <div class="pitfall"><h4>Common mistake</h4>Raising the gain to kill the error: it also pushes the loop toward instability (see the root locus).</div>
</section>
<section data-case="error" data-example="gain"><h3>More gain</h3><p>A type 0 loop always leaves an error: some error is needed to keep pushing. With <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>K</mi><mo>=</mo><mn>20</mn></mrow><annotation encoding="application/x-tex">K = 20</annotation></semantics></math></span> it shrinks to <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mn>21</mn></mrow><annotation encoding="application/x-tex">1/21</annotation></semantics></math></span>, about 5 %.</p></section>
<section data-case="error" data-example="t1"><h3>An integrator</h3><p>A type 1 loop integrates the error: as long as any error is left, the push keeps growing. It only stops when <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>e</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">e = 0</annotation></semantics></math></span>.</p></section>
<section data-case="error" data-example="ramp1"><h3>Following a ramp</h3><p>The type 1 loop follows a moving target with a constant lag <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><msub><mi>K</mi><mi>v</mi></msub><mo>=</mo><mn>1</mn><mi mathvariant="normal">/</mi><mi>K</mi></mrow><annotation encoding="application/x-tex">1/K_v = 1/K</annotation></semantics></math></span>: to keep moving it needs a steady error.</p></section>
<section data-case="error" data-example="ramp0"><h3>Type 0 and a ramp</h3><p>Without an integrator the output cannot keep up with a moving target: the error grows without limit.</p></section>
<section data-case="error" data-example="para2"><h3>Type 2, parabola</h3><p>Two integrators follow a steadily accelerating target with a constant error <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><msub><mi>K</mi><mi>a</mi></msub></mrow><annotation encoding="application/x-tex">1/K_a</annotation></semantics></math></span>, here <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2</mn><mi mathvariant="normal">/</mi><mi>K</mi></mrow><annotation encoding="application/x-tex">2/K</annotation></semantics></math></span>.</p></section>
<section data-case="locus">
  <h3>The root locus</h3>
  <div class="look"><h4>What you are looking at</h4>The path the closed-loop poles follow as the gain K grows from 0; the current poles are marked and the step response shown.</div>
  <p>Closing the loop moves the poles. At K = 0 they sit on the open-loop poles; as K grows they move along fixed branches toward the zeros or off to infinity. When a branch crosses the imaginary axis the loop becomes unstable. The locus shows at a glance which gains give a good response.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mn>1</mn><mo>+</mo><mi>K</mi><mtext> </mtext><mi>G</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mn>0</mn><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="normal">∠</mi><mi>G</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mn>180</mn><mo>∘</mo></msup><mtext> </mtext><mo stretchy="false">(</mo><mn>2</mn><mi>k</mi><mo>+</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">1 + K\,G(s) = 0, \qquad \angle G(s) = 180^\circ\,(2k + 1)</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>G = 1/(s(s + 1)(s + 3)): the closed-loop polynomial is s³ + 4s² + 3s + K. The poles from 0 and −1 meet at s = −0.45 when K = 0.63, then leave the real axis (oscillation). Routh: the loop is stable while 4·3 > K, so they cross the jω axis at K = 12, at ω = √3 = 1.73 rad/s. Above 12: unstable.</div>
  <div class="pitfall"><h4>Common mistake</h4>Assuming more gain is always more stable: for three or more poles it eventually destabilises the loop.</div>
</section>
<section data-case="locus" data-example="meet"><h3>The poles meet</h3><p>At <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>K</mi><mo>≈</mo><mn>0.63</mn></mrow><annotation encoding="application/x-tex">K \approx 0.63</annotation></semantics></math></span> the two slow real poles meet at <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>s</mi><mo>≈</mo><mo>−</mo><mn>0.45</mn></mrow><annotation encoding="application/x-tex">s \approx -0.45</annotation></semantics></math></span> (breakaway) and split into a complex pair: from here on the response overshoots.</p></section>
<section data-case="locus" data-example="under"><h3>Oscillatory</h3><p>The pair moves up and towards the axis: less damping, more overshoot, but a faster rise.</p></section>
<section data-case="locus" data-example="edge"><h3>On the edge</h3><p>At <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>K</mi><mo>=</mo><mn>12</mn></mrow><annotation encoding="application/x-tex">K = 12</annotation></semantics></math></span> the pair reaches the <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>j</mi><mi>ω</mi></mrow><annotation encoding="application/x-tex">j\omega</annotation></semantics></math></span> axis at <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>±</mo><mi>j</mi><msqrt><mn>3</mn></msqrt></mrow><annotation encoding="application/x-tex">\pm j\sqrt3</annotation></semantics></math></span>: the loop oscillates forever. The Routh criterion gives the same limit: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>4</mn><mo>⋅</mo><mn>3</mn><mo>&gt;</mo><mi>K</mi></mrow><annotation encoding="application/x-tex">4 \cdot 3 &gt; K</annotation></semantics></math></span>.</p></section>
<section data-case="locus" data-example="unstable"><h3>Too much gain</h3><p>Past <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>K</mi><mo>=</mo><mn>12</mn></mrow><annotation encoding="application/x-tex">K = 12</annotation></semantics></math></span> the pair is in the right half plane: more gain made the loop unstable.</p></section>
<section data-case="locus" data-example="zero"><h3>A zero helps</h3><p>A zero at <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mn>2</mn></mrow><annotation encoding="application/x-tex">-2</annotation></semantics></math></span> attracts one branch and bends the others away from the right half plane: the loop stays stable for much larger gains. This is what a lead compensator does.</p></section>
<section data-case="locus" data-example="two"><h3>Two poles</h3><p>With only two poles the branches go straight up and down from <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">-1</annotation></semantics></math></span>: more gain means less damping, but never instability.</p></section>
</template>
<template id="explain-root-locus"><section data-case="error">
  <h3>Steady-state error</h3>
  <div class="look"><h4>What you are looking at</h4>A unity-feedback loop following a step, ramp or parabola input: reference (dashed) and output, with the remaining error.</div>
  <p>Feedback works by acting on the error. A plain proportional controller needs some error to keep pushing, so it never quite gets there. Every integrator in the loop (the "type") removes one level of error: type 1 follows a step perfectly, type 2 a ramp.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>e</mi><mtext>ss</mtext></msub><mo>=</mo><munder><mrow><mi>lim</mi><mo>⁡</mo></mrow><mrow><mi>s</mi><mo>→</mo><mn>0</mn></mrow></munder><mfrac><mrow><mi>s</mi><mtext> </mtext><mi>R</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo></mrow><mrow><mn>1</mn><mo>+</mo><mi>G</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mtext>step: </mtext><mfrac><mn>1</mn><mrow><mn>1</mn><mo>+</mo><msub><mi>K</mi><mi>p</mi></msub></mrow></mfrac><mo separator="true">,</mo><mspace width="1em"/><mtext>ramp: </mtext><mfrac><mn>1</mn><msub><mi>K</mi><mi>v</mi></msub></mfrac><mo separator="true">,</mo><mspace width="1em"/><mtext>parabola: </mtext><mfrac><mn>1</mn><msub><mi>K</mi><mi>a</mi></msub></mfrac></mrow><annotation encoding="application/x-tex">e_\text{ss} = \lim_{s\to 0}\frac{s\,R(s)}{1 + G(s)}, \qquad \text{step: } \frac{1}{1 + K_p}, \quad \text{ramp: } \frac{1}{K_v}, \quad \text{parabola: } \frac{1}{K_a}</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Type 0 on a step: finite error 1/(1 + K) — more gain, less error.</li>
    <li>Type 1 on a step: zero; on a ramp: a constant lag.</li>

  </ol>

</section>

<section data-case="error" data-example="t1"><h3>An integrator</h3><p>A type 1 loop integrates the error: as long as any error is left, the push keeps growing. It only stops when <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>e</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">e = 0</annotation></semantics></math></span>.</p></section>
<section data-case="error" data-example="ramp1"><h3>Following a ramp</h3><p>The type 1 loop follows a moving target with a constant lag <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><msub><mi>K</mi><mi>v</mi></msub><mo>=</mo><mn>1</mn><mi mathvariant="normal">/</mi><mi>K</mi></mrow><annotation encoding="application/x-tex">1/K_v = 1/K</annotation></semantics></math></span>: to keep moving it needs a steady error.</p></section>
<section data-case="error" data-example="ramp0"><h3>Type 0 and a ramp</h3><p>Without an integrator the output cannot keep up with a moving target: the error grows without limit.</p></section>
<section data-case="error" data-example="para2"><h3>Type 2, parabola</h3><p>Two integrators follow a steadily accelerating target with a constant error <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><msub><mi>K</mi><mi>a</mi></msub></mrow><annotation encoding="application/x-tex">1/K_a</annotation></semantics></math></span>, here <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2</mn><mi mathvariant="normal">/</mi><mi>K</mi></mrow><annotation encoding="application/x-tex">2/K</annotation></semantics></math></span>.</p></section>
<section data-case="locus">
  <h3>The root locus</h3>
  <div class="look"><h4>What you are looking at</h4>The path the closed-loop poles follow as the gain K grows from 0; the current poles are marked and the step response shown.</div>

  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mn>1</mn><mo>+</mo><mi>K</mi><mtext> </mtext><mi>G</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mn>0</mn><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="normal">∠</mi><mi>G</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mn>180</mn><mo>∘</mo></msup><mtext> </mtext><mo stretchy="false">(</mo><mn>2</mn><mi>k</mi><mo>+</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">1 + K\,G(s) = 0, \qquad \angle G(s) = 180^\circ\,(2k + 1)</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>G = 1/(s(s + 1)(s + 3)): the closed-loop polynomial is s³ + 4s² + 3s + K. The poles from 0 and −1 meet at s = −0.45 when K = 0.63, then leave the real axis (oscillation). Routh: the loop is stable while 4·3 > K, so they cross the jω axis at K = 12, at ω = √3 = 1.73 rad/s. Above 12: unstable.</div>

</section>
<section data-case="locus" data-example="meet"><h3>The poles meet</h3><p>At <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>K</mi><mo>≈</mo><mn>0.63</mn></mrow><annotation encoding="application/x-tex">K \approx 0.63</annotation></semantics></math></span> the two slow real poles meet at <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>s</mi><mo>≈</mo><mo>−</mo><mn>0.45</mn></mrow><annotation encoding="application/x-tex">s \approx -0.45</annotation></semantics></math></span> (breakaway) and split into a complex pair: from here on the response overshoots.</p></section>

<section data-case="locus" data-example="edge"><h3>On the edge</h3><p>At <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>K</mi><mo>=</mo><mn>12</mn></mrow><annotation encoding="application/x-tex">K = 12</annotation></semantics></math></span> the pair reaches the <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>j</mi><mi>ω</mi></mrow><annotation encoding="application/x-tex">j\omega</annotation></semantics></math></span> axis at <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>±</mo><mi>j</mi><msqrt><mn>3</mn></msqrt></mrow><annotation encoding="application/x-tex">\pm j\sqrt3</annotation></semantics></math></span>: the loop oscillates forever. The Routh criterion gives the same limit: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>4</mn><mo>⋅</mo><mn>3</mn><mo>&gt;</mo><mi>K</mi></mrow><annotation encoding="application/x-tex">4 \cdot 3 &gt; K</annotation></semantics></math></span>.</p></section>

<section data-case="locus" data-example="zero"><h3>A zero helps</h3><p>A zero at <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mn>2</mn></mrow><annotation encoding="application/x-tex">-2</annotation></semantics></math></span> attracts one branch and bends the others away from the right half plane: the loop stays stable for much larger gains. This is what a lead compensator does.</p></section>

<template id="explain-pid"><section data-case="pid">
  <h3>PID control of an inverted pendulum</h3>
  <div class="look"><h4>What you are looking at</h4>A pendulum balanced upright by a motor at its pivot; plots show the angle and the motor torque split into P, I and D parts.</div>
  <p>An upright pendulum falls faster the more it tilts: it is unstable on its own. The controller measures the tilt and pushes back. P pushes in proportion to the tilt (a spring); D pushes against the tilt's speed (a damper — stops the rocking); I builds up while an error persists (removes a steady lean caused by a load).</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>u</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><msub><mi>K</mi><mi>p</mi></msub><mtext> </mtext><mi>e</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>+</mo><msub><mi>K</mi><mi>i</mi></msub><msubsup><mo>∫</mo><mn>0</mn><mi>t</mi></msubsup><mi>e</mi><mtext> </mtext><mi>d</mi><mi>τ</mi><mo>+</mo><msub><mi>K</mi><mi>d</mi></msub><mtext> </mtext><mfrac><mrow><mi>d</mi><mi>e</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mtext>upright needs </mtext><msub><mi>K</mi><mi>p</mi></msub><mo>&gt;</mo><mi>m</mi><mi>g</mi><mi>L</mi></mrow><annotation encoding="application/x-tex">u(t) = K_p\,e(t) + K_i\int_0^t e\,d\tau + K_d\,\frac{de}{dt}, \qquad \text{upright needs } K_p &gt; mgL</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Kp below mgL: the spring is weaker than gravity, it falls.</li>
    <li>P alone: it rocks back and forth; D adds damping.</li>
    <li>A constant load leaves a tilt with PD; I removes it.</li>
    <li>If the motor saturates, the integral keeps growing (windup) and overshoots; anti-windup stops integrating while saturated.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>m = 1 kg, L = 0.5 m: mgL = 4.9 N·m/rad, so Kp must exceed 4.9. With Kp = 20 and Kd = 2 it recovers from 10° in about a second.</div>
  <div class="pitfall"><h4>Common mistake</h4>Cranking up D on a noisy sensor: the derivative amplifies noise and makes the motor chatter.</div>
  <div class="try"><h4>Try it</h4>Add a load with PD only, then turn on I and watch the tilt disappear.</div>
</section>
<section data-case="pid" data-example="weak"><h3>Kp too small</h3><p>With <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>K</mi><mi>p</mi></msub><mo>=</mo><mn>3</mn><mo>&lt;</mo><mi>m</mi><mi>g</mi><mi>L</mi><mo>=</mo><mn>4.9</mn></mrow><annotation encoding="application/x-tex">K_p = 3 &lt; mgL = 4.9</annotation></semantics></math></span> N·m/rad, gravity pulls harder than the controller pushes back: the rod falls, slowly at first.</p></section>
<section data-case="pid" data-example="p"><h3>P only</h3><p>A pure spring: the rod rocks back and forth around upright, damped only by the small friction in the pivot. The linearised equation is <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>m</mi><msup><mi>L</mi><mn>2</mn></msup><mover accent="true"><mi>θ</mi><mo>¨</mo></mover><mo>=</mo><mo>−</mo><mo stretchy="false">(</mo><msub><mi>K</mi><mi>p</mi></msub><mo>−</mo><mi>m</mi><mi>g</mi><mi>L</mi><mo stretchy="false">)</mo><mi>θ</mi></mrow><annotation encoding="application/x-tex">mL^2\ddot\theta = -(K_p - mgL)\theta</annotation></semantics></math></span>.</p></section>
<section data-case="pid" data-example="push"><h3>A push</h3><p>A short torque kick at 1 s. More <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>K</mi><mi>d</mi></msub></mrow><annotation encoding="application/x-tex">K_d</annotation></semantics></math></span> absorbs it with less swinging; too little and it rocks for longer.</p></section>
<section data-case="pid" data-example="noise"><h3>Noise and the D term</h3><p>The sensor jitters by a fraction of a degree. D reacts to the rate of change, and noise changes very fast: the motor torque (violet) shakes. Real controllers filter the derivative (here over 10 ms) and keep <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>K</mi><mi>d</mi></msub></mrow><annotation encoding="application/x-tex">K_d</annotation></semantics></math></span> moderate.</p></section>
<section data-case="pid" data-example="load"><h3>A load</h3><p>From 3 s a constant load torque leans on the rod. PD can only push back if the rod is tilted: it settles where <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>K</mi><mi>p</mi></msub><mi>θ</mi><mo>=</mo><mi>m</mi><mi>g</mi><mi>L</mi><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mo>+</mo><msub><mi>τ</mi><mtext>load</mtext></msub></mrow><annotation encoding="application/x-tex">K_p\theta = mgL\sin\theta + \tau_\text{load}</annotation></semantics></math></span>, about 7.6° here.</p></section>
<section data-case="pid" data-example="integral"><h3>Integral action</h3><p>The integral keeps growing while any tilt remains, so the motor keeps adding torque until the tilt is exactly zero. The cost: a slower, slightly oscillatory recovery.</p></section>
<section data-case="pid" data-example="windup"><h3>Integrator windup</h3><p>The motor can only give 6 N·m. Starting at 30°, it saturates; meanwhile the integral keeps piling up. When the rod finally comes back, the huge stored integral pushes it far past upright, beyond what the weak motor can recover: it falls.</p></section>
<section data-case="pid" data-example="antiwindup"><h3>Anti-windup</h3><p>Stop integrating while the motor is saturated: the integral stays small, and the rod comes back without the big overshoot.</p></section>
<details><summary>About the model</summary><p>Point mass on a massless rod, pivot friction <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>b</mi></mrow><annotation encoding="application/x-tex">b</annotation></semantics></math></span>, controller at 1 kHz with a 10 ms derivative filter, integration by semi-implicit Euler. Tests: falls for <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>K</mi><mi>p</mi></msub><mo>&lt;</mo><mi>m</mi><mi>g</mi><mi>L</mi></mrow><annotation encoding="application/x-tex">K_p &lt; mgL</annotation></semantics></math></span>, holds above; PD load tilt satisfies the torque balance (10⁻³); integral removes it; windup falls, anti-windup recovers.</p></details>
</template>
<template id="explain-bode"><section data-case="bode nyquist lead">
  <p>Feed the loop a sine of frequency <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ω</mi></mrow><annotation encoding="application/x-tex">\omega</annotation></semantics></math></span>: it comes out scaled by <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><mi>L</mi><mo stretchy="false">(</mo><mi>j</mi><mi>ω</mi><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi></mrow><annotation encoding="application/x-tex">|L(j\omega)|</annotation></semantics></math></span> and shifted by <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∠</mi><mi>L</mi><mo stretchy="false">(</mo><mi>j</mi><mi>ω</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\angle L(j\omega)</annotation></semantics></math></span>. The yellow curve traces <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>L</mi><mo stretchy="false">(</mo><mi>j</mi><mi>ω</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">L(j\omega)</annotation></semantics></math></span> in the complex plane as <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ω</mi></mrow><annotation encoding="application/x-tex">\omega</annotation></semantics></math></span> grows: the Nyquist plot (to scale up to <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><mi>L</mi><mi mathvariant="normal">∣</mi><mo>=</mo><mn>2</mn></mrow><annotation encoding="application/x-tex">|L| = 2</annotation></semantics></math></span>, compressed beyond). Magnitude and phase against <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>log</mi><mo>⁡</mo><mi>ω</mi></mrow><annotation encoding="application/x-tex">\log\omega</annotation></semantics></math></span> are the Bode diagram below. Tick <i>3D view</i> in View to lift the curve by <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>log</mi><mo>⁡</mo><mi>ω</mi></mrow><annotation encoding="application/x-tex">\log\omega</annotation></semantics></math></span>: its shadows are both diagrams.</p>
</section>
<section data-case="bode">
  <h3>The Bode plot</h3>
  <div class="look"><h4>What you are looking at</h4>Magnitude (dB) and phase of the open-loop transfer function against log frequency, with the asymptotes and the current frequency marked.</div>
  <p>On log–log axes every pole and zero becomes a corner between straight lines: a pole bends the magnitude down by 20 dB/decade and the phase by 90°, a zero bends them up. An integrator is a −20 dB/decade line everywhere. You can sketch any Bode plot by adding these pieces.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="normal">∣</mi><mi>G</mi><mi mathvariant="normal">∣</mi><mo>=</mo><mo>∏</mo><mi mathvariant="normal">∣</mi><mtext>factors</mtext><mi mathvariant="normal">∣</mi><mo>⇒</mo><mn>20</mn><mi>log</mi><mo>⁡</mo><mi mathvariant="normal">∣</mi><mi>G</mi><mi mathvariant="normal">∣</mi><mo>=</mo><mo>∑</mo><mn>20</mn><mi>log</mi><mo>⁡</mo><mi mathvariant="normal">∣</mi><mtext>factor</mtext><mi mathvariant="normal">∣</mi><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="normal">∠</mi><mi>G</mi><mo>=</mo><mo>∑</mo><mi mathvariant="normal">∠</mi><mtext>factors</mtext></mrow><annotation encoding="application/x-tex">|G| = \prod|\text{factors}| \Rightarrow 20\log|G| = \sum 20\log|\text{factor}|, \qquad \angle G = \sum\angle\text{factors}</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>K/(s/1 + 1): flat at 20 log K, −3 dB and −45° at 1 rad/s, then −20 dB/dec. Add a pole at 10: −40 dB/dec beyond 10, phase toward −180°.</div>
  <div class="pitfall"><h4>Common mistake</h4>Forgetting that gain moves the magnitude curve up or down but never changes the phase.</div>
</section>
<section data-case="bode" data-example="pole2"><h3>Two poles</h3><p>Above both corners the slopes add: −40 dB per decade, and the phase heads to −180°.</p></section>
<section data-case="bode" data-example="int"><h3>An integrator</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mi>j</mi><mi>ω</mi></mrow><annotation encoding="application/x-tex">1/j\omega</annotation></semantics></math></span> falls 20 dB per decade at every frequency and adds a constant −90°. Infinite gain at <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ω</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\omega = 0</annotation></semantics></math></span>: zero steady-state error to a step.</p></section>
<section data-case="bode" data-example="zero"><h3>A zero</h3><p>A zero rises +20 dB per decade above its corner and adds up to +90°: here it cancels the slope of the second pole above 5 rad/s.</p></section>
<section data-case="bode" data-example="gain"><h3>Gain</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>K</mi><mo>=</mo><mn>10</mn></mrow><annotation encoding="application/x-tex">K = 10</annotation></semantics></math></span> lifts the whole magnitude by 20 dB. The phase does not change.</p></section>
<section data-case="nyquist">
  <h3>The Nyquist plot and stability margins</h3>
  <div class="look"><h4>What you are looking at</h4>G(jω) drawn in the complex plane as ω sweeps (and its mirror for negative ω); the critical point −1; the gain and phase margins.</div>
  <p>A feedback loop goes unstable when the signal returns around the loop with the same size and inverted sign — that is, when G(jω) passes through −1. The Nyquist plot shows how close it comes. Encircling −1 means instability.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>GM</mtext><mo>=</mo><mfrac><mn>1</mn><mrow><mi mathvariant="normal">∣</mi><mi>G</mi><mo stretchy="false">(</mo><mi>j</mi><msub><mi>ω</mi><mn>180</mn></msub><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mtext>PM</mtext><mo>=</mo><msup><mn>180</mn><mo>∘</mo></msup><mo>+</mo><mi mathvariant="normal">∠</mi><mi>G</mi><mo stretchy="false">(</mo><mi>j</mi><msub><mi>ω</mi><mi>c</mi></msub><mo stretchy="false">)</mo><mtext>  </mtext><mtext> at </mtext><mi mathvariant="normal">∣</mi><mi>G</mi><mo stretchy="false">(</mo><mi>j</mi><msub><mi>ω</mi><mi>c</mi></msub><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\text{GM} = \frac{1}{|G(j\omega_{180})|}, \qquad \text{PM} = 180^\circ + \angle G(j\omega_c)\;\text{ at } |G(j\omega_c)| = 1</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>K/(s(s + 1)(s/2 + 1)): crossing at −1 when K = 3 (gain margin of the K = 1 loop: 3 = 9.5 dB). K = 5 encircles −1: unstable.</div>
  <div class="pitfall"><h4>Common mistake</h4>Checking only the gain margin: a loop with a small phase margin rings badly even if GM is large.</div>
</section>
<section data-case="nyquist" data-example="small"><h3>Small gain</h3><p>The curve crosses the negative real axis far to the right of −1: large gain and phase margins, a calm, slow loop.</p></section>
<section data-case="nyquist" data-example="more"><h3>More gain</h3><p>The whole curve grows: it crosses closer to −1, both margins shrink, the step response overshoots more.</p></section>
<section data-case="nyquist" data-example="edge"><h3>Through −1</h3><p>At <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>K</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding="application/x-tex">K = 3</annotation></semantics></math></span> the curve passes through −1 at <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ω</mi><mo>=</mo><msqrt><mn>2</mn></msqrt></mrow><annotation encoding="application/x-tex">\omega = \sqrt2</annotation></semantics></math></span>: GM = 0 dB, PM = 0°. The closed loop oscillates forever.</p></section>
<section data-case="nyquist" data-example="over"><h3>Encircling −1</h3><p>Now −1 is inside the loop of the curve: two closed-loop poles in the right half plane. Unstable.</p></section>
<section data-case="lead">
  <h3>Compensation: lead and lag</h3>
  <div class="look"><h4>What you are looking at</h4>Bode plots with and without a compensator, the margins, and the closed-loop step response.</div>
  <p>A lead compensator (zero before pole) adds phase near the crossover frequency: more phase margin, less ringing, faster response. A lag compensator (pole before zero) adds gain at low frequency only: smaller steady-state error without touching the margins.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>C</mi><mtext>lead</mtext></msub><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mi>s</mi><mi mathvariant="normal">/</mi><msub><mi>ω</mi><mi>z</mi></msub><mo>+</mo><mn>1</mn></mrow><mrow><mi>s</mi><mi mathvariant="normal">/</mi><msub><mi>ω</mi><mi>p</mi></msub><mo>+</mo><mn>1</mn></mrow></mfrac><mo separator="true">,</mo><mtext>  </mtext><msub><mi>ω</mi><mi>z</mi></msub><mo>&lt;</mo><msub><mi>ω</mi><mi>p</mi></msub><mo separator="true">,</mo><mspace width="2em"/><msub><mi>φ</mi><mi>max</mi><mo>⁡</mo></msub><mo>=</mo><mi>arcsin</mi><mo>⁡</mo><mfrac><mrow><msub><mi>ω</mi><mi>p</mi></msub><mo>−</mo><msub><mi>ω</mi><mi>z</mi></msub></mrow><mrow><msub><mi>ω</mi><mi>p</mi></msub><mo>+</mo><msub><mi>ω</mi><mi>z</mi></msub></mrow></mfrac></mrow><annotation encoding="application/x-tex">C_\text{lead}(s) = \frac{s/\omega_z + 1}{s/\omega_p + 1},\; \omega_z &lt; \omega_p, \qquad \varphi_{\max} = \arcsin\frac{\omega_p - \omega_z}{\omega_p + \omega_z}</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>Zero at 0.8, pole at 8: up to 55° of extra phase at √(0.8·8) = 2.5 rad/s. The phase margin goes from 5° to about 45°.</div>
  <div class="pitfall"><h4>Common mistake</h4>Placing the lead's maximum far from the crossover frequency: it adds phase where it is not needed.</div>
</section>
<section data-case="lead" data-example="none"><h3>Without a compensator</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>K</mi><mo>=</mo><mn>2.5</mn></mrow><annotation encoding="application/x-tex">K = 2.5</annotation></semantics></math></span> gives a fast loop but only 5° of phase margin: the step response rings for a long time.</p></section>
<section data-case="lead" data-example="lag"><h3>Lag</h3><p>Ten times the gain (so ten times less ramp error) with a lag at 0.005–0.05 rad/s: at the crossover the lag is invisible, the margins stay near 30°. The price: a slow tail in the step response.</p></section>
<section data-case="lead" data-example="wide"><h3>A wider lead</h3><p>A larger <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi><mi mathvariant="normal">/</mi><mi>z</mi></mrow><annotation encoding="application/x-tex">p/z</annotation></semantics></math></span> gives more phase but also more high-frequency gain, which amplifies sensor noise.</p></section>
</template>

  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>C</mi><mtext>lead</mtext></msub><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mi>s</mi><mi mathvariant="normal">/</mi><msub><mi>ω</mi><mi>z</mi></msub><mo>+</mo><mn>1</mn></mrow><mrow><mi>s</mi><mi mathvariant="normal">/</mi><msub><mi>ω</mi><mi>p</mi></msub><mo>+</mo><mn>1</mn></mrow></mfrac><mo separator="true">,</mo><mtext>  </mtext><msub><mi>ω</mi><mi>z</mi></msub><mo>&lt;</mo><msub><mi>ω</mi><mi>p</mi></msub><mo separator="true">,</mo><mspace width="2em"/><msub><mi>φ</mi><mi>max</mi><mo>⁡</mo></msub><mo>=</mo><mi>arcsin</mi><mo>⁡</mo><mfrac><mrow><msub><mi>ω</mi><mi>p</mi></msub><mo>−</mo><msub><mi>ω</mi><mi>z</mi></msub></mrow><mrow><msub><mi>ω</mi><mi>p</mi></msub><mo>+</mo><msub><mi>ω</mi><mi>z</mi></msub></mrow></mfrac></mrow><annotation encoding="application/x-tex">C_\text{lead}(s) = \frac{s/\omega_z + 1}{s/\omega_p + 1},\; \omega_z &lt; \omega_p, \qquad \varphi_{\max} = \arcsin\frac{\omega_p - \omega_z}{\omega_p + \omega_z}</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>Zero at 0.8, pole at 8: up to 55° of extra phase at √(0.8·8) = 2.5 rad/s. The phase margin goes from 5° to about 45°.</div>

<template id="explain-lead-lag"><section data-case="bode nyquist lead">
  <p>Feed the loop a sine of frequency <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ω</mi></mrow><annotation encoding="application/x-tex">\omega</annotation></semantics></math></span>: it comes out scaled by <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><mi>L</mi><mo stretchy="false">(</mo><mi>j</mi><mi>ω</mi><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi></mrow><annotation encoding="application/x-tex">|L(j\omega)|</annotation></semantics></math></span> and shifted by <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∠</mi><mi>L</mi><mo stretchy="false">(</mo><mi>j</mi><mi>ω</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\angle L(j\omega)</annotation></semantics></math></span>. The yellow curve traces <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>L</mi><mo stretchy="false">(</mo><mi>j</mi><mi>ω</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">L(j\omega)</annotation></semantics></math></span> in the complex plane as <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ω</mi></mrow><annotation encoding="application/x-tex">\omega</annotation></semantics></math></span> grows: the Nyquist plot (to scale up to <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><mi>L</mi><mi mathvariant="normal">∣</mi><mo>=</mo><mn>2</mn></mrow><annotation encoding="application/x-tex">|L| = 2</annotation></semantics></math></span>, compressed beyond). Magnitude and phase against <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>log</mi><mo>⁡</mo><mi>ω</mi></mrow><annotation encoding="application/x-tex">\log\omega</annotation></semantics></math></span> are the Bode diagram below. Tick <i>3D view</i> in View to lift the curve by <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>log</mi><mo>⁡</mo><mi>ω</mi></mrow><annotation encoding="application/x-tex">\log\omega</annotation></semantics></math></span>: its shadows are both diagrams.</p>
</section>
<section data-case="bode">
  <h3>The Bode plot</h3>
  <div class="look"><h4>What you are looking at</h4>Magnitude (dB) and phase of the open-loop transfer function against log frequency, with the asymptotes and the current frequency marked.</div>
  <p>On log–log axes every pole and zero becomes a corner between straight lines: a pole bends the magnitude down by 20 dB/decade and the phase by 90°, a zero bends them up. An integrator is a −20 dB/decade line everywhere. You can sketch any Bode plot by adding these pieces.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="normal">∣</mi><mi>G</mi><mi mathvariant="normal">∣</mi><mo>=</mo><mo>∏</mo><mi mathvariant="normal">∣</mi><mtext>factors</mtext><mi mathvariant="normal">∣</mi><mo>⇒</mo><mn>20</mn><mi>log</mi><mo>⁡</mo><mi mathvariant="normal">∣</mi><mi>G</mi><mi mathvariant="normal">∣</mi><mo>=</mo><mo>∑</mo><mn>20</mn><mi>log</mi><mo>⁡</mo><mi mathvariant="normal">∣</mi><mtext>factor</mtext><mi mathvariant="normal">∣</mi><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="normal">∠</mi><mi>G</mi><mo>=</mo><mo>∑</mo><mi mathvariant="normal">∠</mi><mtext>factors</mtext></mrow><annotation encoding="application/x-tex">|G| = \prod|\text{factors}| \Rightarrow 20\log|G| = \sum 20\log|\text{factor}|, \qquad \angle G = \sum\angle\text{factors}</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>K/(s/1 + 1): flat at 20 log K, −3 dB and −45° at 1 rad/s, then −20 dB/dec. Add a pole at 10: −40 dB/dec beyond 10, phase toward −180°.</div>
  <div class="pitfall"><h4>Common mistake</h4>Forgetting that gain moves the magnitude curve up or down but never changes the phase.</div>
</section>
<section data-case="bode" data-example="pole2"><h3>Two poles</h3><p>Above both corners the slopes add: −40 dB per decade, and the phase heads to −180°.</p></section>
<section data-case="bode" data-example="int"><h3>An integrator</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mi>j</mi><mi>ω</mi></mrow><annotation encoding="application/x-tex">1/j\omega</annotation></semantics></math></span> falls 20 dB per decade at every frequency and adds a constant −90°. Infinite gain at <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ω</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\omega = 0</annotation></semantics></math></span>: zero steady-state error to a step.</p></section>
<section data-case="bode" data-example="zero"><h3>A zero</h3><p>A zero rises +20 dB per decade above its corner and adds up to +90°: here it cancels the slope of the second pole above 5 rad/s.</p></section>
<section data-case="bode" data-example="gain"><h3>Gain</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>K</mi><mo>=</mo><mn>10</mn></mrow><annotation encoding="application/x-tex">K = 10</annotation></semantics></math></span> lifts the whole magnitude by 20 dB. The phase does not change.</p></section>
<section data-case="nyquist">
  <h3>The Nyquist plot and stability margins</h3>
  <div class="look"><h4>What you are looking at</h4>G(jω) drawn in the complex plane as ω sweeps (and its mirror for negative ω); the critical point −1; the gain and phase margins.</div>
  <p>A feedback loop goes unstable when the signal returns around the loop with the same size and inverted sign — that is, when G(jω) passes through −1. The Nyquist plot shows how close it comes. Encircling −1 means instability.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>GM</mtext><mo>=</mo><mfrac><mn>1</mn><mrow><mi mathvariant="normal">∣</mi><mi>G</mi><mo stretchy="false">(</mo><mi>j</mi><msub><mi>ω</mi><mn>180</mn></msub><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mtext>PM</mtext><mo>=</mo><msup><mn>180</mn><mo>∘</mo></msup><mo>+</mo><mi mathvariant="normal">∠</mi><mi>G</mi><mo stretchy="false">(</mo><mi>j</mi><msub><mi>ω</mi><mi>c</mi></msub><mo stretchy="false">)</mo><mtext>  </mtext><mtext> at </mtext><mi mathvariant="normal">∣</mi><mi>G</mi><mo stretchy="false">(</mo><mi>j</mi><msub><mi>ω</mi><mi>c</mi></msub><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\text{GM} = \frac{1}{|G(j\omega_{180})|}, \qquad \text{PM} = 180^\circ + \angle G(j\omega_c)\;\text{ at } |G(j\omega_c)| = 1</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>K/(s(s + 1)(s/2 + 1)): crossing at −1 when K = 3 (gain margin of the K = 1 loop: 3 = 9.5 dB). K = 5 encircles −1: unstable.</div>
  <div class="pitfall"><h4>Common mistake</h4>Checking only the gain margin: a loop with a small phase margin rings badly even if GM is large.</div>
</section>
<section data-case="nyquist" data-example="small"><h3>Small gain</h3><p>The curve crosses the negative real axis far to the right of −1: large gain and phase margins, a calm, slow loop.</p></section>
<section data-case="nyquist" data-example="more"><h3>More gain</h3><p>The whole curve grows: it crosses closer to −1, both margins shrink, the step response overshoots more.</p></section>
<section data-case="nyquist" data-example="edge"><h3>Through −1</h3><p>At <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>K</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding="application/x-tex">K = 3</annotation></semantics></math></span> the curve passes through −1 at <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ω</mi><mo>=</mo><msqrt><mn>2</mn></msqrt></mrow><annotation encoding="application/x-tex">\omega = \sqrt2</annotation></semantics></math></span>: GM = 0 dB, PM = 0°. The closed loop oscillates forever.</p></section>
<section data-case="nyquist" data-example="over"><h3>Encircling −1</h3><p>Now −1 is inside the loop of the curve: two closed-loop poles in the right half plane. Unstable.</p></section>
