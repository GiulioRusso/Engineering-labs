<section data-case="torsion">
  <h3>Torsion of shafts</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the cross-section of a shaft carrying a torque, coloured by the shear stress (bright = high). Top right: the shear stress across a diameter. Bottom right: for a tube with the same amount of material, the largest stress (orange) and the twist (blue) relative to a solid shaft, against how hollow the tube is. Below: the angle of twist against the shaft length.</div>
  <p>Twist a round shaft and each cross-section turns a little relative to the next. The shear strain, and so the shear stress, grows in proportion to the distance from the axis: zero at the centre, largest at the surface. The material near the centre does almost nothing. A <b>tube</b> puts the material where the stress is useful. With the same weight it is both stronger and stiffer, which is why drive shafts and bicycle frames are hollow.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>τ</mi><mo stretchy="false">(</mo><mi>r</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mi>T</mi><mtext> </mtext><mi>r</mi></mrow><mi>J</mi></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi>J</mi><mo>=</mo><mfrac><mi>π</mi><mn>2</mn></mfrac><mo stretchy="false">(</mo><msubsup><mi>r</mi><mi>o</mi><mn>4</mn></msubsup><mo>−</mo><msubsup><mi>r</mi><mi>i</mi><mn>4</mn></msubsup><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><mi>φ</mi><mo>=</mo><mfrac><mrow><mi>T</mi><mi>L</mi></mrow><mrow><mi>G</mi><mi>J</mi></mrow></mfrac></mrow><annotation encoding="application/x-tex">\tau(r) = \frac{T\,r}{J}, \qquad J = \frac{\pi}{2}(r_o^4 - r_i^4), \qquad \varphi = \frac{T L}{G J}</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>The polar second moment J measures how far the material sits from the axis.</li>
    <li>The largest stress is at the outer surface: T r₀ / J.</li>
    <li>The twist per length is T / (GJ): G is the material, J the shape.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>500 N·m on a solid steel shaft of 20 mm radius: τmax = 39.8 MPa, a twist of 1.4° per metre. A tube of 28 mm outer and 19.6 mm inner radius has the same area, so the same weight, yet τmax is 19.1 MPa and the twist 0.49°, half and a third.</div>
  <div class="pitfall"><h4>Common mistakes</h4>Making the wall very thin to save weight. Below a few per cent of the radius a tube in torsion fails by buckling of its wall, not by the stress computed here.</div>
  <div class="try"><h4>Try it</h4>Raise the inner ÷ outer radius and watch the bottom-right dot: with the material held constant, both curves fall steeply as the tube opens up.</div>
</section>
<section data-case="torsion" data-example="hollow"><h3>Hollow tube, same mass</h3><p>A 28 mm tube with a 19.6 mm bore uses exactly the steel of a 20 mm solid shaft and carries the torque at half the stress.</p></section>
<section data-case="torsion" data-example="alu"><h3>Aluminium: three times the twist</h3><p>Aluminium's shear modulus is a third of steel's: for the same shaft the stress is the same, the twist three times larger.</p></section>

<section data-case="hole">
  <h3>Stress concentration and fatigue</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the stress σxx in a wide plate pulled left and right, around a circular hole; bright is high. Top right: the stress concentration factor of an elliptical hole against its shape. Bottom right: an S–N curve, the stress amplitude a steel can take for a given number of cycles (illustrative values), with the remote stress (green) and the stress at the hole (red). Below: the stress along the section through the hole.</div>
  <p>Load has to flow around a hole, and it crowds at its sides: beside a circular hole the stress is <b>three times</b> the remote stress, whatever the hole's size. An elliptical hole across the load is worse, Kt = 1 + 2a/b, and a crack is the limiting case. A part that survives a static load can still fail under millions of smaller ones. That is <b>fatigue</b>: the stress amplitude a material can take falls with the number of cycles, down to an endurance limit for steels. Because life depends steeply on stress, tripling the local stress can cut the life from infinite to a few thousand cycles. Cracks start at holes, corners and scratches.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>K</mi><mi>t</mi></msub><mo>=</mo><mfrac><msub><mi>σ</mi><mtext>max</mtext></msub><msub><mi>σ</mi><mtext>nominal</mtext></msub></mfrac><mo>=</mo><mn>3</mn><mtext> (circle)</mtext><mo separator="true">,</mo><mspace width="1em"/><mn>1</mn><mo>+</mo><mfrac><mrow><mn>2</mn><mi>a</mi></mrow><mi>b</mi></mfrac><mtext> (ellipse)</mtext><mo separator="true">,</mo><mspace width="2em"/><msub><mi>σ</mi><mi>a</mi></msub><mo>=</mo><msubsup><mi>σ</mi><mi>f</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msubsup><mtext> </mtext><mo stretchy="false">(</mo><mn>2</mn><mi>N</mi><msup><mo stretchy="false">)</mo><mi>b</mi></msup><mtext>  (Basquin)</mtext></mrow><annotation encoding="application/x-tex">K_t = \frac{\sigma_\text{max}}{\sigma_\text{nominal}} = 3\ \text{(circle)},\quad 1 + \frac{2a}{b}\ \text{(ellipse)}, \qquad \sigma_a = \sigma_f&#x27;\,(2N)^b\ \ \text{(Basquin)}</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Find the nominal stress the part would have without the feature.</li>
    <li>Multiply by Kt for the peak at the feature.</li>
    <li>Read the fatigue life at that peak from the S–N curve.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>A 100 MPa amplitude in a plain plate is below the 250 MPa endurance limit: infinite life. Drill a round hole and the edge sees 300 MPa: about 10⁵ cycles. A slit five times wider than long across the load gives Kt = 11 and the part fails almost at once.</div>
  <div class="pitfall"><h4>Common mistakes</h4>Thinking a small hole is harmless because little material is removed. Kt does not depend on the hole's size, only on its shape.</div>
  <div class="try"><h4>Try it</h4>Widen the hole across the load step by step and watch the red dot climb the S–N curve while the green one stays put.</div>
</section>
<section data-case="hole" data-example="crack"><h3>A slit across the load</h3><p>a/b = 5: Kt = 11. This is why a crack keeps growing: its tip concentrates the stress more and more as it lengthens. Drilling a round hole at a crack tip lowers Kt and can stop it.</p></section>
<section data-case="hole" data-example="safe"><h3>Below the endurance limit</h3><p>70 MPa remote, 210 MPa at the hole: even the peak stays under the 250 MPa endurance limit, and the part lasts indefinitely.</p></section>

<section data-case="propped">
  <h3>A statically indeterminate beam</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the deflection of a 4 m beam clamped at the left and resting on a roller at the right (green), against the same beam simply supported (blue) and as a free cantilever (grey, divided by 10). Top right: the bending moment, propped and simply supported. Bottom right: the shear force of the propped beam. Below: the roller reaction per unit load, against where a point load sits.</div>
  <p>A clamp gives three reactions (two forces and a moment) and a roller one more: four unknowns, but statics in the plane gives only three equations. The structure is <b>statically indeterminate</b>. The missing equation comes from geometry, <b>compatibility</b>: the beam cannot move at the roller. Remove the roller, compute how far the tip would drop under the load, and find the roller force that pushes it exactly back. The extra support makes the beam stiffer and spreads the moment between the wall and the span.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>δ</mi><mtext>load</mtext></msub><mo stretchy="false">(</mo><mi>L</mi><mo stretchy="false">)</mo><mo>+</mo><mi>R</mi><mtext> </mtext><msub><mi>δ</mi><mtext>unit</mtext></msub><mo stretchy="false">(</mo><mi>L</mi><mo stretchy="false">)</mo><mo>=</mo><mn>0</mn><mo separator="true">,</mo><mspace width="2em"/><mtext>uniform </mtext><mi>w</mi><mo>:</mo><mtext> </mtext><mi>R</mi><mo>=</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><mn>3</mn><mn>8</mn></mfrac></mstyle><mi>w</mi><mi>L</mi><mo separator="true">,</mo><mtext>  </mtext><msub><mi>M</mi><mtext>wall</mtext></msub><mo>=</mo><mo>−</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><mrow><mi>w</mi><msup><mi>L</mi><mn>2</mn></msup></mrow><mn>8</mn></mfrac></mstyle><mo separator="true">,</mo><mspace width="2em"/><mtext>point at midspan: </mtext><mi>R</mi><mo>=</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><mn>5</mn><mn>16</mn></mfrac></mstyle><mi>P</mi></mrow><annotation encoding="application/x-tex">\delta_\text{load}(L) + R\,\delta_\text{unit}(L) = 0, \qquad \text{uniform } w:\ R = \tfrac38 wL,\ \ M_\text{wall} = -\tfrac{wL^2}{8}, \qquad \text{point at midspan: } R = \tfrac{5}{16}P</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Choose one redundant reaction (the roller) and remove it: a cantilever.</li>
    <li>Compute the tip deflection under the load, and under a unit force at the tip.</li>
    <li>Superpose: the roller force cancels the deflection; then statics gives the rest.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>10 kN/m over 4 m: the roller takes 3/8 × 40 = 15 kN, the wall 25 kN and a moment of 20 kN·m. The largest moment equals the simply supported beam's 20 kN·m but sits at the wall, and the deflection is 0.69 mm instead of 1.67 mm.</div>
  <div class="pitfall"><h4>Common mistakes</h4>Forgetting that indeterminate structures react to settlement and temperature: if the roller sinks a few millimetres, the forces change even with no new load.</div>
  <div class="try"><h4>Try it</h4>Switch to a point load and slide it along the beam: the roller's share follows the curve below, from almost nothing near the wall to all of it at the roller.</div>
</section>
<section data-case="propped" data-example="point"><h3>A point load at midspan</h3><p>R = 5P/16: the roller takes less than half, because the clamp also resists rotation and draws load toward the wall.</p></section>
</template>
<template id="explain-buckling"><section>
  <p>How much load a part can take depends on its material and its shape. A tensile test characterises the material; Mohr's circle shows the stress on any plane through a point; a column can fail by buckling long before its material yields.</p>
</section>
<section data-case="tensile">
  <h3>The tensile test</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the stress–strain curve traced as the specimen is pulled; the grey curves are the other materials. Top right: the specimen itself, stretching, thinning, necking and breaking. Bottom right: the start of the test magnified, with the 0.2 % offset line used to define yield. Below: the energy absorbed per unit volume so far.</div>
  <p>Stress σ = F/A₀ and strain ε = ΔL/L₀ make the result independent of the specimen's size. At first the bar behaves like a stiff spring with slope E (Young's modulus) and springs back fully. Past the <b>yield</b> stress, atoms slip and part of the stretch becomes permanent. The stress still rises (work hardening) up to the <b>ultimate</b> strength; then a neck forms and the bar breaks.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>σ</mi><mo>=</mo><mi>E</mi><mtext> </mtext><mi>ε</mi><mtext>  </mtext><mo stretchy="false">(</mo><mi>σ</mi><mo>&lt;</mo><msub><mi>σ</mi><mi>y</mi></msub><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><msub><mi>ε</mi><mtext>permanent</mtext></msub><mo>=</mo><mi>ε</mi><mo>−</mo><mfrac><mi>σ</mi><mi>E</mi></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi>U</mi><mo>=</mo><msubsup><mo>∫</mo><mn>0</mn><msub><mi>ε</mi><mi>f</mi></msub></msubsup><mi>σ</mi><mtext> </mtext><mi>d</mi><mi>ε</mi></mrow><annotation encoding="application/x-tex">\sigma=E\,\varepsilon\ \ (\sigma&lt;\sigma_y),\qquad \varepsilon_{\text{permanent}}=\varepsilon-\frac{\sigma}{E},\qquad U=\int_0^{\varepsilon_f}\sigma\,d\varepsilon</annotation></semantics></math></span></div>
  <ol class="steps"><li>Elastic: straight line, slope E.</li><li>Yield: the curve bends over (0.2 % offset definition).</li><li>Hardening: stress rises to σ_u at uniform elongation.</li><li>Necking: deformation concentrates, the engineering stress falls, fracture.</li></ol>
  <div class="worked"><h4>Worked example</h4>Mild steel: E = 200 GPa, σ_y = 250 MPa, so yield starts at ε = 250/200 000 = 0.125 %. It stretches to 30 % before breaking and absorbs about 110 MJ/m³.</div>
  <div class="pitfall"><h4>Common mistake</h4>Confusing stiffness with strength. Steel is three times stiffer than aluminium, but this aluminium alloy yields at a higher stress.</div>
  <div class="try"><h4>Try it</h4>Switch from steel to cast iron: no yield, no necking, it breaks with almost no plastic strain. Unload steel at 5 % and see the permanent stretch.</div>
</section>
<section data-case="tensile" data-example="alu"><h3>Aluminium 6061-T6</h3><p>A third of steel's stiffness, a higher yield stress, little hardening, and only 12 % elongation.</p></section>
<section data-case="tensile" data-example="brittle"><h3>Cast iron</h3><p>It breaks at 0.2 % strain with no yield and no neck: almost no energy absorbed, no warning before failure.</p></section>
<section data-case="tensile" data-example="unload"><h3>Unload at 5 %</h3><p>The bar unloads along a line of slope E and keeps almost all of the 5 %. On reloading it stays elastic up to the stress it had reached: work hardening.</p></section>
<section data-case="mohr">
  <h3>Plane stress and Mohr's circle</h3>
  <div class="look"><h4>What you are looking at</h4>Left: Mohr's circle. The grey points are the faces x and y of the original element; the orange points are the faces of the element turned by θ; green marks the principal stresses. Top right: the turned element with its normal stresses (orange tension, blue compression) and shear (purple). Bottom right: σx′ and τx′y′ against θ.</div>
  <p>The same state of stress looks different on differently oriented faces. Every orientation lands on one circle in the (σ, τ) plane, centred at the average stress. Turning the element by θ moves its point round the circle by 2θ.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>σ</mi><msup><mi>x</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup></msub><mo>=</mo><mfrac><mrow><msub><mi>σ</mi><mi>x</mi></msub><mo>+</mo><msub><mi>σ</mi><mi>y</mi></msub></mrow><mn>2</mn></mfrac><mo>+</mo><mfrac><mrow><msub><mi>σ</mi><mi>x</mi></msub><mo>−</mo><msub><mi>σ</mi><mi>y</mi></msub></mrow><mn>2</mn></mfrac><mi>cos</mi><mo>⁡</mo><mn>2</mn><mi>θ</mi><mo>+</mo><msub><mi>τ</mi><mrow><mi>x</mi><mi>y</mi></mrow></msub><mi>sin</mi><mo>⁡</mo><mn>2</mn><mi>θ</mi><mo separator="true">,</mo><mspace width="2em"/><msub><mi>τ</mi><mrow><msup><mi>x</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><msup><mi>y</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup></mrow></msub><mo>=</mo><mo>−</mo><mfrac><mrow><msub><mi>σ</mi><mi>x</mi></msub><mo>−</mo><msub><mi>σ</mi><mi>y</mi></msub></mrow><mn>2</mn></mfrac><mi>sin</mi><mo>⁡</mo><mn>2</mn><mi>θ</mi><mo>+</mo><msub><mi>τ</mi><mrow><mi>x</mi><mi>y</mi></mrow></msub><mi>cos</mi><mo>⁡</mo><mn>2</mn><mi>θ</mi></mrow><annotation encoding="application/x-tex">\sigma_{x&#x27;}=\frac{\sigma_x+\sigma_y}2+\frac{\sigma_x-\sigma_y}2\cos2\theta+\tau_{xy}\sin2\theta,\qquad \tau_{x&#x27;y&#x27;}=-\frac{\sigma_x-\sigma_y}2\sin2\theta+\tau_{xy}\cos2\theta</annotation></semantics></math></span></div>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>σ</mi><mrow><mn>1</mn><mo separator="true">,</mo><mn>2</mn></mrow></msub><mo>=</mo><mi>c</mi><mo>±</mo><mi>R</mi><mo separator="true">,</mo><mspace width="1em"/><mi>c</mi><mo>=</mo><mfrac><mrow><msub><mi>σ</mi><mi>x</mi></msub><mo>+</mo><msub><mi>σ</mi><mi>y</mi></msub></mrow><mn>2</mn></mfrac><mo separator="true">,</mo><mspace width="1em"/><mi>R</mi><mo>=</mo><msqrt><mrow><mo fence="false" stretchy="true" minsize="1.8em" maxsize="1.8em">(</mo><mfrac><mrow><msub><mi>σ</mi><mi>x</mi></msub><mo>−</mo><msub><mi>σ</mi><mi>y</mi></msub></mrow><mn>2</mn></mfrac><msup><mo fence="false" stretchy="true" minsize="1.8em" maxsize="1.8em">)</mo><mn>2</mn></msup><mo>+</mo><msubsup><mi>τ</mi><mrow><mi>x</mi><mi>y</mi></mrow><mn>2</mn></msubsup></mrow></msqrt><mo separator="true">,</mo><mspace width="1em"/><mi>tan</mi><mo>⁡</mo><mn>2</mn><msub><mi>θ</mi><mi>p</mi></msub><mo>=</mo><mfrac><mrow><mn>2</mn><msub><mi>τ</mi><mrow><mi>x</mi><mi>y</mi></mrow></msub></mrow><mrow><msub><mi>σ</mi><mi>x</mi></msub><mo>−</mo><msub><mi>σ</mi><mi>y</mi></msub></mrow></mfrac></mrow><annotation encoding="application/x-tex">\sigma_{1,2}=c\pm R,\quad c=\frac{\sigma_x+\sigma_y}2,\quad R=\sqrt{\Big(\frac{\sigma_x-\sigma_y}2\Big)^2+\tau_{xy}^2},\quad \tan2\theta_p=\frac{2\tau_{xy}}{\sigma_x-\sigma_y}</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>σx = 80, σy = −20, τxy = 30 MPa: c = 30, R = √(50² + 30²) = 58.3. σ₁ = 88.3 MPa, σ₂ = −28.3 MPa at θp = ½ atan(60/100) = 15.5°; maximum shear 58.3 MPa at 60.5°.</div>
  <div class="pitfall"><h4>Common mistake</h4>Forgetting the factor 2: 90° on the element is 180° on the circle, so the faces x and y are always at opposite ends of a diameter.</div>
  <div class="try"><h4>Try it</h4>Turn the element angle θ: the point runs round Mohr's circle at 2θ. Find the angle where the shear is zero: the principal stresses.</div>
</section>
<section data-case="mohr" data-example="principal"><h3>Principal angle</h3><p>At θp the orange points sit on the σ axis: no shear, and the normal stresses are the largest and smallest possible.</p></section>
<section data-case="mohr" data-example="maxshear"><h3>Maximum shear</h3><p>45° from the principal directions the points are at the top and bottom of the circle: τ = R. Ductile metals yield in shear, on these planes.</p></section>
<section data-case="mohr" data-example="pure"><h3>Pure shear</h3><p>A circle centred at zero: at 45° the shear disappears and the element sees tension +50 and compression −50. That is why a twisted chalk stick breaks along a 45° helix.</p></section>
<section data-case="buckling">
  <h3>Buckling of columns</h3>
  <div class="look"><h4>What you are looking at</h4>Left: a steel column with a small initial bow under a load that rises towards the critical load; the bow is exaggerated. Top right: the critical stress against slenderness, Euler's curve (dashed) and the Johnson parabola for short columns (green), with the yield stress. Bottom right: how much the bow grows as the load approaches P_cr. Below: the critical load against length for the three end conditions.</div>
  <p>A straight column under compression can suddenly bend sideways. At the <b>Euler load</b> the bent shape is in equilibrium as well as the straight one; any small imperfection grows without limit. The load depends on stiffness EI and on the effective length KL set by the ends, not on the material's strength.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>P</mi><mrow><mi>c</mi><mi>r</mi></mrow></msub><mo>=</mo><mfrac><mrow><msup><mi>π</mi><mn>2</mn></msup><mi>E</mi><mi>I</mi></mrow><mrow><mo stretchy="false">(</mo><mi>K</mi><mi>L</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi>λ</mi><mo>=</mo><mfrac><mrow><mi>K</mi><mi>L</mi></mrow><mi>r</mi></mfrac><mo separator="true">,</mo><mtext> </mtext><mi>r</mi><mo>=</mo><msqrt><mrow><mi>I</mi><mi mathvariant="normal">/</mi><mi>A</mi></mrow></msqrt><mo separator="true">,</mo><mspace width="2em"/><mi>δ</mi><mo>=</mo><mfrac><msub><mi>e</mi><mn>0</mn></msub><mrow><mn>1</mn><mo>−</mo><mi>P</mi><mi mathvariant="normal">/</mi><msub><mi>P</mi><mrow><mi>c</mi><mi>r</mi></mrow></msub></mrow></mfrac></mrow><annotation encoding="application/x-tex">P_{cr}=\frac{\pi^2EI}{(KL)^2},\qquad \lambda=\frac{KL}r,\ r=\sqrt{I/A},\qquad \delta=\frac{e_0}{1-P/P_{cr}}</annotation></semantics></math></span></div>
  <ol class="steps"><li>Effective length factor K: pinned–pinned 1, fixed–free 2, fixed–fixed 0.5.</li><li>Slender columns (λ above λc = √(2π²E/σy) ≈ 126 for this steel) follow Euler.</li><li>Stocky columns yield before they buckle: Johnson's parabola.</li></ol>
  <div class="worked"><h4>Worked example</h4>A 50 mm bar, 3 m long, pinned: I = π·0.05⁴/64 = 3.07·10⁻⁷ m⁴, P_cr = π²·200·10⁹·3.07·10⁻⁷/9 = 67 kN. Its stress is then only 34 MPa, far below yield.</div>
  <div class="pitfall"><h4>Common mistake</h4>Checking only σ = P/A &lt; σy. A slender column fails at a small fraction of the yield stress.</div>
  <div class="try"><h4>Try it</h4>Switch the ends from pinned to fixed–free: the critical load drops to a quarter. Make the column short and thick: it yields before it buckles.</div>
</section>
<section data-case="buckling" data-example="flagpole"><h3>Fixed–free</h3><p>A flagpole behaves like half of a pinned column twice as long: K = 2, a quarter of the critical load.</p></section>
<section data-case="buckling" data-example="clamped"><h3>Fixed–fixed</h3><p>Clamping both ends halves the effective length: four times the critical load.</p></section>
<section data-case="buckling" data-example="stocky"><h3>Short and stocky</h3><p>L = 0.9 m: λ = 72, below λc. The column reaches yield before Euler's load, and Johnson's curve governs.</p></section>
</template>
