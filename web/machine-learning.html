<template id="explain-neighbours-trees"><section data-case="knn">
  <h3>k-nearest neighbours</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the training points (blue class 0, yellow class 1) and the shading the method gives every spot of the plane. The orange point is a query: grey lines join it to its k nearest neighbours, the circle reaches the farthest of them. Top right: accuracy on the training points and on new points against k. Bottom right: the neighbours' distances, coloured by class.</div>
  <p>The simplest classifier there is: to label a new point, look at the k closest labelled points and take a vote. There is no training — the data itself is the model.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mover accent="true"><mi>p</mi><mo>^</mo></mover><mo stretchy="false">(</mo><mtext>class 1</mtext><mo>∣</mo><mi mathvariant="bold">x</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mi mathvariant="normal">#</mi><mo stretchy="false">{</mo><mtext>class-1 points among the </mtext><mi>k</mi><mtext> nearest</mtext><mo stretchy="false">}</mo></mrow><mi>k</mi></mfrac></mrow><annotation encoding="application/x-tex">\hat p(\text{class 1}\mid\mathbf x)=\frac{\#\{\text{class-1 points among the }k\text{ nearest}\}}{k}</annotation></semantics></math></span></div>
  <ol class="steps"><li>Measure the distance from the query to every training point.</li><li>Keep the k smallest.</li><li>The majority class wins.</li></ol>
  <div class="worked"><h4>Worked example</h4>k = 5, neighbours: 3 yellow and 2 blue → class 1, with p̂ = 0.6.</div>
  <div class="pitfall"><h4>Common mistakes</h4>Judging k on the training points: k = 1 is always 100% right there, because every point is its own nearest neighbour. And forgetting to scale the inputs: a feature in metres and one in millimetres do not weigh the same in a distance.</div>
</section>
<section data-case="knn" data-example="one"><h3>k = 1</h3><p>Islands around every noisy point: perfect on training data, worse on new data. Overfitting.</p></section>
<section data-case="knn" data-example="many"><h3>k = 41</h3><p>The vote spans a wide area: the border is smooth and ignores single noisy points. Push k much higher and the tips of the moons get outvoted by the other class: underfitting.</p></section>
<section data-case="knn" data-example="edge"><h3>On the border</h3><p>Near the boundary the vote is close and changes as k changes: these are the uncertain points.</p></section>
<section data-case="tree">
  <h3>Decision trees</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the boxes the tree cuts the plane into, shaded by their majority class, with the cut lines in grey. Top right: accuracy on training and new points against the maximum depth. Bottom right: the tree itself (top levels), with the question at each node and the class of each leaf.</div>
  <p>A tree asks yes/no questions of the form "is x₁ below 0.3?", one after another. Each question is chosen so that the two groups it creates are as pure as possible.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>Gini</mtext><mo>=</mo><mn>2</mn><mi>p</mi><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><mtext>split</mtext><mo>=</mo><mi>arg</mi><mo>⁡</mo><mi>min</mi><mo>⁡</mo><mtext>  </mtext><mfrac><mrow><msub><mi>n</mi><mi>L</mi></msub><mtext> </mtext><msub><mtext>Gini</mtext><mi>L</mi></msub><mo>+</mo><msub><mi>n</mi><mi>R</mi></msub><mtext> </mtext><msub><mtext>Gini</mtext><mi>R</mi></msub></mrow><mi>n</mi></mfrac></mrow><annotation encoding="application/x-tex">\text{Gini}=2p(1-p),\qquad \text{split}=\arg\min\;\frac{n_L\,\text{Gini}_L+n_R\,\text{Gini}_R}{n}</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>A node with 10 points, 5 of each class: Gini = 0.5. A split into (5 blue, 1 yellow) and (0 blue, 4 yellow) gives (6·0.28 + 4·0)/10 = 0.17: a large drop, a good question.</div>
  <div class="pitfall"><h4>Common mistake</h4>Growing the tree until every leaf is pure. It then has a box for every noisy point. Limit the depth, or average many trees (a random forest).</div>
</section>
<section data-case="tree" data-example="stump"><h3>A stump</h3><p>One question, two boxes: easy to read, but far too simple for the moons.</p></section>
<section data-case="tree" data-example="deep"><h3>Depth 10</h3><p>Training accuracy reaches 100%; accuracy on new data drops. The tiny boxes are memorized noise.</p></section>
<section data-case="tree" data-example="blobs"><h3>A diagonal border</h3><p>Trees can only cut along the axes, so a slanted border becomes a staircase of boxes.</p></section>
<section data-case="kmeans">
  <h3>k-means clustering</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the points coloured by the centre they belong to; the black dots are the centres, and their grey trails show how they move. Top right: the inertia (total squared distance of points to their centre) iteration by iteration. Bottom right: the final inertia for every k — the "elbow" plot.</div>
  <p>No labels this time: the algorithm must find groups by itself. It alternates two simple steps until nothing changes.</p>
  <ol class="steps"><li>Assign every point to its nearest centre.</li><li>Move every centre to the mean of its points.</li></ol>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>J</mi><mo>=</mo><munder><mo>∑</mo><mi>i</mi></munder><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">∥</mo><msub><mi mathvariant="bold">x</mi><mi>i</mi></msub><mo>−</mo><msub><mi mathvariant="bold-italic">μ</mi><mrow><mi>c</mi><mo stretchy="false">(</mo><mi>i</mi><mo stretchy="false">)</mo></mrow></msub><msup><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">∥</mo><mn>2</mn></msup><mspace width="1em"/><mtext>never increases</mtext></mrow><annotation encoding="application/x-tex">J=\sum_i\big\|\mathbf x_i-\boldsymbol\mu_{c(i)}\big\|^2\quad\text{never increases}</annotation></semantics></math></span></div>
  <div class="worked"><h4>Choosing k</h4>J always falls when k grows (k = number of points gives J = 0). Look for the elbow: the k after which adding a cluster gains little.</div>
  <div class="pitfall"><h4>Common mistake</h4>Trusting one run. The result depends on where the centres start; run it several times and keep the lowest J.</div>
</section>
<section data-case="kmeans" data-example="badstart"><h3>Unlucky start</h3><p>Two centres start in the same group: they split it, and two real groups are merged. A local minimum.</p></section>
<section data-case="kmeans" data-example="uneven"><h3>Uneven clusters</h3><p>The border sits halfway between the centres, so the big cluster loses points to the small one.</p></section>
<section data-case="kmeans" data-example="moons"><h3>Moons</h3><p>k-means borders are straight lines: it cuts the moons in the wrong place.</p></section>
<section data-case="pca">
  <h3>Principal component analysis</h3>
  <div class="look"><h4>What you are looking at</h4>Left: a cloud of points. A line sweeps through all directions θ, and every point is projected onto it (thin grey lines, orange dots). Green and red arrows: the principal components, 2 standard deviations long. Top right: the variance along θ (blue) and what is left over across it (orange). Bottom right: the share of variance each component keeps. Bottom: the projected points as a histogram.</div>
  <p>PCA finds the directions along which the data spreads most. Keeping only the first few compresses the data with the smallest possible loss.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="normal">Σ</mi><mo>=</mo><mfrac><mn>1</mn><mi>n</mi></mfrac><munder><mo>∑</mo><mi>i</mi></munder><mo stretchy="false">(</mo><msub><mi mathvariant="bold">x</mi><mi>i</mi></msub><mo>−</mo><mover accent="true"><mi mathvariant="bold">x</mi><mo>ˉ</mo></mover><mo stretchy="false">)</mo><mo stretchy="false">(</mo><msub><mi mathvariant="bold">x</mi><mi>i</mi></msub><mo>−</mo><mover accent="true"><mi mathvariant="bold">x</mi><mo>ˉ</mo></mover><msup><mo stretchy="false">)</mo><mi mathvariant="normal">⊤</mi></msup><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="normal">Σ</mi><msub><mi mathvariant="bold">v</mi><mi>k</mi></msub><mo>=</mo><msub><mi>λ</mi><mi>k</mi></msub><msub><mi mathvariant="bold">v</mi><mi>k</mi></msub></mrow><annotation encoding="application/x-tex">\Sigma=\frac1n\sum_i(\mathbf x_i-\bar{\mathbf x})(\mathbf x_i-\bar{\mathbf x})^\top,\qquad \Sigma\mathbf v_k=\lambda_k\mathbf v_k</annotation></semantics></math></span></div>
  <ol class="steps"><li>Centre the data.</li><li>Compute the covariance matrix.</li><li>Its eigenvectors are the principal directions, its eigenvalues the variances along them.</li></ol>
  <div class="worked"><h4>Two views of the same thing</h4>At every θ, variance along + left over = total. So the direction with the largest variance is also the one with the smallest error after squashing to 1D.</div>
  <div class="pitfall"><h4>Common mistake</h4>Running PCA on features with different units without standardizing: the feature with the largest numbers wins regardless of its meaning.</div>
</section>
<section data-case="pca" data-example="thin"><h3>Almost a line</h3><p>PC1 keeps over 99% of the variance: one number per point describes it.</p></section>
<section data-case="pca" data-example="round"><h3>A round cloud</h3><p>The variance is the same in every direction: the blue curve is flat and PC1 is arbitrary.</p></section>
</template>
<template id="explain-clustering-pca"><section data-case="knn">
  <h3>k-nearest neighbours</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the training points (blue class 0, yellow class 1) and the shading the method gives every spot of the plane. The orange point is a query: grey lines join it to its k nearest neighbours, the circle reaches the farthest of them. Top right: accuracy on the training points and on new points against k. Bottom right: the neighbours' distances, coloured by class.</div>
  <p>The simplest classifier there is: to label a new point, look at the k closest labelled points and take a vote. There is no training — the data itself is the model.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mover accent="true"><mi>p</mi><mo>^</mo></mover><mo stretchy="false">(</mo><mtext>class 1</mtext><mo>∣</mo><mi mathvariant="bold">x</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mi mathvariant="normal">#</mi><mo stretchy="false">{</mo><mtext>class-1 points among the </mtext><mi>k</mi><mtext> nearest</mtext><mo stretchy="false">}</mo></mrow><mi>k</mi></mfrac></mrow><annotation encoding="application/x-tex">\hat p(\text{class 1}\mid\mathbf x)=\frac{\#\{\text{class-1 points among the }k\text{ nearest}\}}{k}</annotation></semantics></math></span></div>
  <ol class="steps"><li>Measure the distance from the query to every training point.</li><li>Keep the k smallest.</li><li>The majority class wins.</li></ol>
  <div class="worked"><h4>Worked example</h4>k = 5, neighbours: 3 yellow and 2 blue → class 1, with p̂ = 0.6.</div>
  <div class="pitfall"><h4>Common mistakes</h4>Judging k on the training points: k = 1 is always 100% right there, because every point is its own nearest neighbour. And forgetting to scale the inputs: a feature in metres and one in millimetres do not weigh the same in a distance.</div>
</section>
<section data-case="knn" data-example="one"><h3>k = 1</h3><p>Islands around every noisy point: perfect on training data, worse on new data. Overfitting.</p></section>
<section data-case="knn" data-example="many"><h3>k = 41</h3><p>The vote spans a wide area: the border is smooth and ignores single noisy points. Push k much higher and the tips of the moons get outvoted by the other class: underfitting.</p></section>
<section data-case="knn" data-example="edge"><h3>On the border</h3><p>Near the boundary the vote is close and changes as k changes: these are the uncertain points.</p></section>
<section data-case="tree">
  <h3>Decision trees</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the boxes the tree cuts the plane into, shaded by their majority class, with the cut lines in grey. Top right: accuracy on training and new points against the maximum depth. Bottom right: the tree itself (top levels), with the question at each node and the class of each leaf.</div>
  <p>A tree asks yes/no questions of the form "is x₁ below 0.3?", one after another. Each question is chosen so that the two groups it creates are as pure as possible.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>Gini</mtext><mo>=</mo><mn>2</mn><mi>p</mi><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><mtext>split</mtext><mo>=</mo><mi>arg</mi><mo>⁡</mo><mi>min</mi><mo>⁡</mo><mtext>  </mtext><mfrac><mrow><msub><mi>n</mi><mi>L</mi></msub><mtext> </mtext><msub><mtext>Gini</mtext><mi>L</mi></msub><mo>+</mo><msub><mi>n</mi><mi>R</mi></msub><mtext> </mtext><msub><mtext>Gini</mtext><mi>R</mi></msub></mrow><mi>n</mi></mfrac></mrow><annotation encoding="application/x-tex">\text{Gini}=2p(1-p),\qquad \text{split}=\arg\min\;\frac{n_L\,\text{Gini}_L+n_R\,\text{Gini}_R}{n}</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>A node with 10 points, 5 of each class: Gini = 0.5. A split into (5 blue, 1 yellow) and (0 blue, 4 yellow) gives (6·0.28 + 4·0)/10 = 0.17: a large drop, a good question.</div>
  <div class="pitfall"><h4>Common mistake</h4>Growing the tree until every leaf is pure. It then has a box for every noisy point. Limit the depth, or average many trees (a random forest).</div>
</section>
<section data-case="tree" data-example="stump"><h3>A stump</h3><p>One question, two boxes: easy to read, but far too simple for the moons.</p></section>
<section data-case="tree" data-example="deep"><h3>Depth 10</h3><p>Training accuracy reaches 100%; accuracy on new data drops. The tiny boxes are memorized noise.</p></section>
<section data-case="tree" data-example="blobs"><h3>A diagonal border</h3><p>Trees can only cut along the axes, so a slanted border becomes a staircase of boxes.</p></section>
<section data-case="kmeans">
  <h3>k-means clustering</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the points coloured by the centre they belong to; the black dots are the centres, and their grey trails show how they move. Top right: the inertia (total squared distance of points to their centre) iteration by iteration. Bottom right: the final inertia for every k — the "elbow" plot.</div>
  <p>No labels this time: the algorithm must find groups by itself. It alternates two simple steps until nothing changes.</p>
  <ol class="steps"><li>Assign every point to its nearest centre.</li><li>Move every centre to the mean of its points.</li></ol>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>J</mi><mo>=</mo><munder><mo>∑</mo><mi>i</mi></munder><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">∥</mo><msub><mi mathvariant="bold">x</mi><mi>i</mi></msub><mo>−</mo><msub><mi mathvariant="bold-italic">μ</mi><mrow><mi>c</mi><mo stretchy="false">(</mo><mi>i</mi><mo stretchy="false">)</mo></mrow></msub><msup><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">∥</mo><mn>2</mn></msup><mspace width="1em"/><mtext>never increases</mtext></mrow><annotation encoding="application/x-tex">J=\sum_i\big\|\mathbf x_i-\boldsymbol\mu_{c(i)}\big\|^2\quad\text{never increases}</annotation></semantics></math></span></div>
  <div class="worked"><h4>Choosing k</h4>J always falls when k grows (k = number of points gives J = 0). Look for the elbow: the k after which adding a cluster gains little.</div>
  <div class="pitfall"><h4>Common mistake</h4>Trusting one run. The result depends on where the centres start; run it several times and keep the lowest J.</div>
</section>

  <h3>Principal component analysis</h3>

  <p>PCA finds the directions along which the data spreads most. Keeping only the first few compresses the data with the smallest possible loss.</p>

<template id="explain-linear-regression"><section data-case="least-squares">
  <h3>Least squares</h3>
  <div class="look"><h4>What you are looking at</h4>Left: 24 data points and a line you set with the slope and intercept sliders. Grey: each point's residual, its vertical distance to the line; red: the square built on it. Top right: the total squared error for every slope. Bottom right: the residuals themselves.</div>
  <p>To fit a line to noisy data we need a score for how bad a line is. Least squares takes each point's vertical miss, squares it, and adds them up: literally the total area of the red squares. The best line is the one with the smallest total. Squaring makes every miss count positively, makes big misses count much more than small ones, and gives a smooth bowl-shaped score with a single bottom that a formula can find directly.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>SSE</mtext><mo stretchy="false">(</mo><mi>m</mi><mo separator="true">,</mo><mi>c</mi><mo stretchy="false">)</mo><mo>=</mo><munder><mo>∑</mo><mi>i</mi></munder><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><msub><mi>y</mi><mi>i</mi></msub><mo>−</mo><mo stretchy="false">(</mo><mi>m</mi><msub><mi>x</mi><mi>i</mi></msub><mo>+</mo><mi>c</mi><mo stretchy="false">)</mo><msup><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mn>2</mn></msup><mo separator="true">,</mo><mspace width="2em"/><mi>m</mi><mo>=</mo><mfrac><mrow><mo>∑</mo><mo stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mo>−</mo><mover accent="true"><mi>x</mi><mo>ˉ</mo></mover><mo stretchy="false">)</mo><mo stretchy="false">(</mo><msub><mi>y</mi><mi>i</mi></msub><mo>−</mo><mover accent="true"><mi>y</mi><mo>ˉ</mo></mover><mo stretchy="false">)</mo></mrow><mrow><mo>∑</mo><mo stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mo>−</mo><mover accent="true"><mi>x</mi><mo>ˉ</mo></mover><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac><mo separator="true">,</mo><mspace width="1em"/><mi>c</mi><mo>=</mo><mover accent="true"><mi>y</mi><mo>ˉ</mo></mover><mo>−</mo><mi>m</mi><mover accent="true"><mi>x</mi><mo>ˉ</mo></mover><mo separator="true">,</mo><mspace width="2em"/><msup><mi>R</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn><mo>−</mo><mfrac><mtext>SSE</mtext><mrow><mo>∑</mo><mo stretchy="false">(</mo><msub><mi>y</mi><mi>i</mi></msub><mo>−</mo><mover accent="true"><mi>y</mi><mo>ˉ</mo></mover><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac></mrow><annotation encoding="application/x-tex">\text{SSE}(m, c) = \sum_i \big(y_i - (m x_i + c)\big)^2, \qquad m = \frac{\sum (x_i - \bar x)(y_i - \bar y)}{\sum (x_i - \bar x)^2}, \quad c = \bar y - m\bar x, \qquad R^2 = 1 - \frac{\text{SSE}}{\sum (y_i - \bar y)^2}</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Residual of each point: y − (mx + c).</li>
    <li>Square and add: SSE.</li>
    <li>Set the two partial derivatives to zero: the formulas above.</li>
    <li>R² compares with the dumbest line, flat at the mean: 1 is perfect, 0 no better.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>These 24 points: least squares gives m = 0.643, c = 0.846, SSE = 14.8, R² = 0.83 (the data were made from y = 1.2 + 0.6x + noise). The starting line m = 0.3, c = 3 has SSE 39.2, R² = 0.54.</div>
  <div class="pitfall"><h4>Common mistakes</h4>Measuring distance perpendicular to the line: least squares uses vertical distances, the errors in y. Reading a high R² as "the line explains why": it only measures fit.</div>
  <div class="try"><h4>Try it</h4>Tune m and c by hand to make the red squares as small as you can, then tick "Use the least-squares line".</div>
</section>
<section data-case="least-squares" data-example="best"><h3>The least-squares line</h3><p>m = 0.643, c = 0.846: the top-right marker sits at the bottom of the bowl, and the residuals below scatter evenly around zero.</p></section>
<section data-case="least-squares" data-example="flat"><h3>A flat line at the mean</h3><p>y = ȳ = 4.11 ignores x entirely: SSE = 86.0 and R² = 0. This is the baseline R² compares with.</p></section>
<section data-case="least-squares" data-example="outlier"><h3>One outlier</h3><p>One point at (9, −3) would have a huge square, so the line tilts to shrink it: the slope drops from 0.64 to 0.45 and R² from 0.83 to 0.28. Squaring makes least squares sensitive to outliers.</p></section>

<section data-case="gradient">
  <h3>Gradient descent on the same problem</h3>
  <div class="look"><h4>What you are looking at</h4>Gradient descent starting from a bad line. Top right: the loss landscape over (slope, intercept) on a log scale, with the path taken; the dot is the least-squares answer. Bottom right: the loss per step.</div>
  <p>Least squares has a formula, but most models do not: they are trained by walking downhill on the loss, a step against the gradient at a time. Here the landscape is a long narrow valley, because x runs from 0 to 10: changing the slope changes the error a lot more than changing the intercept. A step small enough not to overshoot across the valley is far too small to travel along it, so descent crawls. Standardising x (subtract its mean, divide by its spread) turns the valley into a round bowl.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mo stretchy="false">(</mo><mi>m</mi><mo separator="true">,</mo><mi>c</mi><mo stretchy="false">)</mo><mo>←</mo><mo stretchy="false">(</mo><mi>m</mi><mo separator="true">,</mo><mi>c</mi><mo stretchy="false">)</mo><mo>−</mo><mi>η</mi><mtext> </mtext><mi mathvariant="normal">∇</mi><mtext>MSE</mtext><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="normal">∇</mi><mtext>MSE</mtext><mo>=</mo><mfrac><mn>2</mn><mi>n</mi></mfrac><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>e</mi><mi>i</mi></msub><mtext> </mtext><mo stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mo separator="true">,</mo><mn>1</mn><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><mi>η</mi><mo>&lt;</mo><mfrac><mn>2</mn><msub><mi>λ</mi><mtext>max</mtext></msub></mfrac><mo>≈</mo><mfrac><mn>1</mn><mover accent="true"><msup><mi>x</mi><mn>2</mn></msup><mo stretchy="true">‾</mo></mover></mfrac><mo>=</mo><mn>0.030</mn></mrow><annotation encoding="application/x-tex">(m, c) \leftarrow (m, c) - \eta\,\nabla \text{MSE}, \qquad \nabla \text{MSE} = \frac{2}{n}\sum_i e_i\,(x_i, 1), \qquad \eta &lt; \frac{2}{\lambda_\text{max}} \approx \frac{1}{\overline{x^2}} = 0.030</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Compute the residuals e of the current line.</li>
    <li>The gradient points uphill; step the other way by η.</li>
    <li>Too large η: each step overshoots more than the last, and it explodes.</li>
    <li>Scaled features: one η suits every direction.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>η = 0.01 on raw x: after 200 steps the slope has only reached 0.23, still far from 0.643. η = 0.032 diverges. With x standardised and η = 0.3 it lands on the least-squares line in 6 steps.</div>
  <div class="pitfall"><h4>Common mistake</h4>Blaming the learning rate alone for slow training. Badly scaled inputs make any single step size wrong; normalising them is usually the first fix.</div>
  <div class="try"><h4>Try it</h4>Raise η towards 0.03 and watch the path start to zigzag across the valley, then cross the limit.</div>
</section>
<section data-case="gradient" data-example="unstable"><h3>Step too large</h3><p>η = 0.032 is just over the stability limit for the steep direction: each step overshoots further, and within 60 steps the slope is in the millions.</p></section>
<section data-case="gradient" data-example="scaled"><h3>Feature scaling</h3><p>With u = (x − x̄)/s the landscape is a round bowl: the gradient points straight at the minimum, and η = 0.3 gets there in six steps.</p></section>

<section data-case="logistic">
  <h3>Logistic regression</h3>
  <div class="look"><h4>What you are looking at</h4>Points with label 0 (blue, bottom) or 1 (gold, top) along x. The green curve is the model's probability of label 1; the dashed line is where it is ½. Top right: the average log loss as the curve gets steeper. Bottom right: each point's own loss.</div>
  <p>For yes/no labels a straight line makes no sense: it would predict values below 0 and above 1. Logistic regression passes the line through the sigmoid, turning any score into a probability. It is fitted by maximum likelihood: make the observed labels as probable as possible, which means minimising the log loss. That loss is mild for correct confident answers and severe for confident mistakes.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>y</mi><mo>=</mo><mn>1</mn><mo>∣</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><mi>σ</mi><mo stretchy="false">(</mo><mi>w</mi><mi>x</mi><mo>+</mo><mi>b</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mrow><mn>1</mn><mo>+</mo><msup><mi>e</mi><mrow><mo>−</mo><mo stretchy="false">(</mo><mi>w</mi><mi>x</mi><mo>+</mo><mi>b</mi><mo stretchy="false">)</mo></mrow></msup></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi>L</mi><mo>=</mo><mo>−</mo><mfrac><mn>1</mn><mi>n</mi></mfrac><mo>∑</mo><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">[</mo><mi>y</mi><mi>ln</mi><mo>⁡</mo><mi>p</mi><mo>+</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>y</mi><mo stretchy="false">)</mo><mi>ln</mi><mo>⁡</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><mo stretchy="false">)</mo><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">]</mo></mrow><annotation encoding="application/x-tex">p(y = 1 \mid x) = \sigma(wx + b) = \frac{1}{1 + e^{-(wx + b)}}, \qquad L = -\frac1n\sum\big[y\ln p + (1 - y)\ln(1 - p)\big]</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>The score wx + b is the log-odds, ln(p/(1 − p)).</li>
    <li>Boundary p = ½ at x = −b/w; w sets how sharply p changes.</li>
    <li>No closed form: minimise L numerically (Newton's method here, gradient descent in general).</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>These 40 points: Newton gives w = 1.27, b = −6.68, boundary at x = 5.28 (the labels were drawn around 5), average loss 0.28. The starting curve, w = 0.8, b = −4, has loss 0.31.</div>
  <div class="pitfall"><h4>Common mistake</h4>Treating the probability as a hard answer. 0.6 means "class 1, not sure"; thresholds other than ½ are often better (see ROC curves).</div>
  <div class="try"><h4>Try it</h4>Make w large: the curve becomes a step, and the points on the wrong side of the boundary get very tall loss bars.</div>
</section>
<section data-case="logistic" data-example="lfit"><h3>Maximum likelihood</h3><p>w = 1.27, b = −6.68: the marker sits at the bottom of the loss curve. The points near x = 5, where labels are mixed, carry most of the loss.</p></section>
<section data-case="logistic" data-example="separable"><h3>Separable data</h3><p>Every point left of 5 is 0, every one right is 1. Then a steeper curve always fits better (loss 0.046 at w = 3, 0.006 at w = 10): the best fit is an infinitely sharp step. In practice a penalty on large w (regularisation) keeps it finite.</p></section>

</details>

<template id="explain-logistic-regression"><section data-case="least-squares">
  <h3>Least squares</h3>
  <div class="look"><h4>What you are looking at</h4>Left: 24 data points and a line you set with the slope and intercept sliders. Grey: each point's residual, its vertical distance to the line; red: the square built on it. Top right: the total squared error for every slope. Bottom right: the residuals themselves.</div>
  <p>To fit a line to noisy data we need a score for how bad a line is. Least squares takes each point's vertical miss, squares it, and adds them up: literally the total area of the red squares. The best line is the one with the smallest total. Squaring makes every miss count positively, makes big misses count much more than small ones, and gives a smooth bowl-shaped score with a single bottom that a formula can find directly.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>SSE</mtext><mo stretchy="false">(</mo><mi>m</mi><mo separator="true">,</mo><mi>c</mi><mo stretchy="false">)</mo><mo>=</mo><munder><mo>∑</mo><mi>i</mi></munder><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><msub><mi>y</mi><mi>i</mi></msub><mo>−</mo><mo stretchy="false">(</mo><mi>m</mi><msub><mi>x</mi><mi>i</mi></msub><mo>+</mo><mi>c</mi><mo stretchy="false">)</mo><msup><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mn>2</mn></msup><mo separator="true">,</mo><mspace width="2em"/><mi>m</mi><mo>=</mo><mfrac><mrow><mo>∑</mo><mo stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mo>−</mo><mover accent="true"><mi>x</mi><mo>ˉ</mo></mover><mo stretchy="false">)</mo><mo stretchy="false">(</mo><msub><mi>y</mi><mi>i</mi></msub><mo>−</mo><mover accent="true"><mi>y</mi><mo>ˉ</mo></mover><mo stretchy="false">)</mo></mrow><mrow><mo>∑</mo><mo stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mo>−</mo><mover accent="true"><mi>x</mi><mo>ˉ</mo></mover><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac><mo separator="true">,</mo><mspace width="1em"/><mi>c</mi><mo>=</mo><mover accent="true"><mi>y</mi><mo>ˉ</mo></mover><mo>−</mo><mi>m</mi><mover accent="true"><mi>x</mi><mo>ˉ</mo></mover><mo separator="true">,</mo><mspace width="2em"/><msup><mi>R</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn><mo>−</mo><mfrac><mtext>SSE</mtext><mrow><mo>∑</mo><mo stretchy="false">(</mo><msub><mi>y</mi><mi>i</mi></msub><mo>−</mo><mover accent="true"><mi>y</mi><mo>ˉ</mo></mover><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac></mrow><annotation encoding="application/x-tex">\text{SSE}(m, c) = \sum_i \big(y_i - (m x_i + c)\big)^2, \qquad m = \frac{\sum (x_i - \bar x)(y_i - \bar y)}{\sum (x_i - \bar x)^2}, \quad c = \bar y - m\bar x, \qquad R^2 = 1 - \frac{\text{SSE}}{\sum (y_i - \bar y)^2}</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Residual of each point: y − (mx + c).</li>
    <li>Square and add: SSE.</li>
    <li>Set the two partial derivatives to zero: the formulas above.</li>
    <li>R² compares with the dumbest line, flat at the mean: 1 is perfect, 0 no better.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>These 24 points: least squares gives m = 0.643, c = 0.846, SSE = 14.8, R² = 0.83 (the data were made from y = 1.2 + 0.6x + noise). The starting line m = 0.3, c = 3 has SSE 39.2, R² = 0.54.</div>
  <div class="pitfall"><h4>Common mistakes</h4>Measuring distance perpendicular to the line: least squares uses vertical distances, the errors in y. Reading a high R² as "the line explains why": it only measures fit.</div>
  <div class="try"><h4>Try it</h4>Tune m and c by hand to make the red squares as small as you can, then tick "Use the least-squares line".</div>
</section>
<section data-case="least-squares" data-example="best"><h3>The least-squares line</h3><p>m = 0.643, c = 0.846: the top-right marker sits at the bottom of the bowl, and the residuals below scatter evenly around zero.</p></section>
<section data-case="least-squares" data-example="flat"><h3>A flat line at the mean</h3><p>y = ȳ = 4.11 ignores x entirely: SSE = 86.0 and R² = 0. This is the baseline R² compares with.</p></section>
<section data-case="least-squares" data-example="outlier"><h3>One outlier</h3><p>One point at (9, −3) would have a huge square, so the line tilts to shrink it: the slope drops from 0.64 to 0.45 and R² from 0.83 to 0.28. Squaring makes least squares sensitive to outliers.</p></section>

<section data-case="gradient">
  <h3>Gradient descent on the same problem</h3>
  <div class="look"><h4>What you are looking at</h4>Gradient descent starting from a bad line. Top right: the loss landscape over (slope, intercept) on a log scale, with the path taken; the dot is the least-squares answer. Bottom right: the loss per step.</div>
  <p>Least squares has a formula, but most models do not: they are trained by walking downhill on the loss, a step against the gradient at a time. Here the landscape is a long narrow valley, because x runs from 0 to 10: changing the slope changes the error a lot more than changing the intercept. A step small enough not to overshoot across the valley is far too small to travel along it, so descent crawls. Standardising x (subtract its mean, divide by its spread) turns the valley into a round bowl.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mo stretchy="false">(</mo><mi>m</mi><mo separator="true">,</mo><mi>c</mi><mo stretchy="false">)</mo><mo>←</mo><mo stretchy="false">(</mo><mi>m</mi><mo separator="true">,</mo><mi>c</mi><mo stretchy="false">)</mo><mo>−</mo><mi>η</mi><mtext> </mtext><mi mathvariant="normal">∇</mi><mtext>MSE</mtext><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="normal">∇</mi><mtext>MSE</mtext><mo>=</mo><mfrac><mn>2</mn><mi>n</mi></mfrac><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>e</mi><mi>i</mi></msub><mtext> </mtext><mo stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mo separator="true">,</mo><mn>1</mn><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><mi>η</mi><mo>&lt;</mo><mfrac><mn>2</mn><msub><mi>λ</mi><mtext>max</mtext></msub></mfrac><mo>≈</mo><mfrac><mn>1</mn><mover accent="true"><msup><mi>x</mi><mn>2</mn></msup><mo stretchy="true">‾</mo></mover></mfrac><mo>=</mo><mn>0.030</mn></mrow><annotation encoding="application/x-tex">(m, c) \leftarrow (m, c) - \eta\,\nabla \text{MSE}, \qquad \nabla \text{MSE} = \frac{2}{n}\sum_i e_i\,(x_i, 1), \qquad \eta &lt; \frac{2}{\lambda_\text{max}} \approx \frac{1}{\overline{x^2}} = 0.030</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Compute the residuals e of the current line.</li>
    <li>The gradient points uphill; step the other way by η.</li>
    <li>Too large η: each step overshoots more than the last, and it explodes.</li>
    <li>Scaled features: one η suits every direction.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>η = 0.01 on raw x: after 200 steps the slope has only reached 0.23, still far from 0.643. η = 0.032 diverges. With x standardised and η = 0.3 it lands on the least-squares line in 6 steps.</div>
  <div class="pitfall"><h4>Common mistake</h4>Blaming the learning rate alone for slow training. Badly scaled inputs make any single step size wrong; normalising them is usually the first fix.</div>
  <div class="try"><h4>Try it</h4>Raise η towards 0.03 and watch the path start to zigzag across the valley, then cross the limit.</div>
</section>
<section data-case="gradient" data-example="unstable"><h3>Step too large</h3><p>η = 0.032 is just over the stability limit for the steep direction: each step overshoots further, and within 60 steps the slope is in the millions.</p></section>
<section data-case="gradient" data-example="scaled"><h3>Feature scaling</h3><p>With u = (x − x̄)/s the landscape is a round bowl: the gradient points straight at the minimum, and η = 0.3 gets there in six steps.</p></section>

<section data-case="logistic">
  <h3>Logistic regression</h3>
  <div class="look"><h4>What you are looking at</h4>Points with label 0 (blue, bottom) or 1 (gold, top) along x. The green curve is the model's probability of label 1; the dashed line is where it is ½. Top right: the average log loss as the curve gets steeper. Bottom right: each point's own loss.</div>
  <p>For yes/no labels a straight line makes no sense: it would predict values below 0 and above 1. Logistic regression passes the line through the sigmoid, turning any score into a probability. It is fitted by maximum likelihood: make the observed labels as probable as possible, which means minimising the log loss. That loss is mild for correct confident answers and severe for confident mistakes.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>y</mi><mo>=</mo><mn>1</mn><mo>∣</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><mi>σ</mi><mo stretchy="false">(</mo><mi>w</mi><mi>x</mi><mo>+</mo><mi>b</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mrow><mn>1</mn><mo>+</mo><msup><mi>e</mi><mrow><mo>−</mo><mo stretchy="false">(</mo><mi>w</mi><mi>x</mi><mo>+</mo><mi>b</mi><mo stretchy="false">)</mo></mrow></msup></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi>L</mi><mo>=</mo><mo>−</mo><mfrac><mn>1</mn><mi>n</mi></mfrac><mo>∑</mo><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">[</mo><mi>y</mi><mi>ln</mi><mo>⁡</mo><mi>p</mi><mo>+</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>y</mi><mo stretchy="false">)</mo><mi>ln</mi><mo>⁡</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><mo stretchy="false">)</mo><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">]</mo></mrow><annotation encoding="application/x-tex">p(y = 1 \mid x) = \sigma(wx + b) = \frac{1}{1 + e^{-(wx + b)}}, \qquad L = -\frac1n\sum\big[y\ln p + (1 - y)\ln(1 - p)\big]</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>The score wx + b is the log-odds, ln(p/(1 − p)).</li>
    <li>Boundary p = ½ at x = −b/w; w sets how sharply p changes.</li>
    <li>No closed form: minimise L numerically (Newton's method here, gradient descent in general).</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>These 40 points: Newton gives w = 1.27, b = −6.68, boundary at x = 5.28 (the labels were drawn around 5), average loss 0.28. The starting curve, w = 0.8, b = −4, has loss 0.31.</div>
  <div class="pitfall"><h4>Common mistake</h4>Treating the probability as a hard answer. 0.6 means "class 1, not sure"; thresholds other than ½ are often better (see ROC curves).</div>
  <div class="try"><h4>Try it</h4>Make w large: the curve becomes a step, and the points on the wrong side of the boundary get very tall loss bars.</div>
</section>
<section data-case="logistic" data-example="lfit"><h3>Maximum likelihood</h3><p>w = 1.27, b = −6.68: the marker sits at the bottom of the loss curve. The points near x = 5, where labels are mixed, carry most of the loss.</p></section>
<section data-case="logistic" data-example="separable"><h3>Separable data</h3><p>Every point left of 5 is 0, every one right is 1. Then a steeper curve always fits better (loss 0.046 at w = 3, 0.006 at w = 10): the best fit is an infinitely sharp step. In practice a penalty on large w (regularisation) keeps it finite.</p></section>
<details><summary>About the model</summary>
  <p>Least squares by the closed form; gradient descent on the mean squared error, optionally on the standardised feature; one-variable logistic regression by Newton's method. Tests: zero gradient and a true minimum at the least-squares line, R² of the mean line is 0; gradient descent reaches the least-squares slope (raw in 3000 steps, scaled in 30), and η = 0.035 diverges; Newton's solution has zero gradient with its boundary near 5; on separable data the loss keeps falling as w grows.</p>
</details>
</template>
<template id="explain-svm"><section data-case="margin">
  <h3>The maximum-margin classifier</h3>
  <div class="look"><h4>What you are looking at</h4>Two classes of points, the SVM's decision line (orange), and the edges of its "street" (dashed), where y·f(x) = 1. Red rings mark the support vectors. Top right: street width against C. Bottom right: each point's dual weight α. Below: y·f(x) for every point, sorted.</div>
  <p>Many lines separate the two clouds. The SVM picks the one with the widest empty street between them, the line that stays as far as possible from both classes, because a decision that is not close to any training point is less likely to flip on new data. Remarkably, the answer depends only on the few points that touch the edges of the street: the support vectors. All the other points could be moved or deleted without changing anything.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><munder><mrow><mi>min</mi><mo>⁡</mo></mrow><mrow><mi mathvariant="bold">w</mi><mo separator="true">,</mo><mi>b</mi></mrow></munder><mtext> </mtext><mstyle scriptlevel="0" displaystyle="false"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi mathvariant="normal">∥</mi><mi mathvariant="bold">w</mi><msup><mi mathvariant="normal">∥</mi><mn>2</mn></msup><mo>+</mo><mi>C</mi><munder><mo>∑</mo><mi>i</mi></munder><mi>max</mi><mo>⁡</mo><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><mn>0</mn><mo separator="true">,</mo><mtext> </mtext><mn>1</mn><mo>−</mo><msub><mi>y</mi><mi>i</mi></msub><mo stretchy="false">(</mo><mi mathvariant="bold">w</mi><mo>⋅</mo><msub><mi mathvariant="bold">x</mi><mi>i</mi></msub><mo>+</mo><mi>b</mi><mo stretchy="false">)</mo><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mo separator="true">,</mo><mspace width="2em"/><mtext>width</mtext><mo>=</mo><mfrac><mn>2</mn><mrow><mi mathvariant="normal">∥</mi><mi mathvariant="bold">w</mi><mi mathvariant="normal">∥</mi></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="bold">w</mi><mo>=</mo><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>α</mi><mi>i</mi></msub><msub><mi>y</mi><mi>i</mi></msub><msub><mi mathvariant="bold">x</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">\min_{\mathbf w, b}\ \tfrac12\|\mathbf w\|^2 + C\sum_i \max\big(0,\, 1 - y_i(\mathbf w\cdot\mathbf x_i + b)\big), \qquad \text{width} = \frac{2}{\|\mathbf w\|}, \qquad \mathbf w = \sum_i \alpha_i y_i\mathbf x_i</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Labels y = ±1; score f(x) = w·x + b; predicted class = sign of f.</li>
    <li>Demand y·f ≥ 1 for every point: outside the street on its own side.</li>
    <li>Make ‖w‖ small: the street wide.</li>
    <li>C prices violations: large C, a hard margin; small C, a wider street that lets some points in.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>These 40 points, C = 100: street width 1.15, set by just 3 support vectors; every point has y·f ≥ 1. Trying every direction by brute force gives the same widest gap (the model test).</div>
  <div class="pitfall"><h4>Common mistake</h4>Thinking all training points shape the boundary. Only the support vectors (α &gt; 0) appear in w.</div>
  <div class="try"><h4>Try it</h4>Lower C step by step: the street widens and more points become support vectors.</div>
</section>
<section data-case="margin" data-example="soft"><h3>Small C</h3><p>C = 0.05: violations are cheap, so the street widens to 2.55 and 20 points end up inside it, all of them support vectors. Still 100 % right: being inside the street is not the same as being on the wrong side.</p></section>
<section data-case="margin" data-example="outlier"><h3>An outlier</h3><p>One blue point sits deep among the gold ones. A hard margin must still keep it outside the street: the width collapses from 1.15 to 0.20 and the line tilts.</p></section>
<section data-case="margin" data-example="outlier-soft"><h3>Soft margin and the outlier</h3><p>C = 0.5: the SVM accepts the one mistake and keeps a sensible street, width 1.42, 97.6 % of training points right. This is what C is for.</p></section>

<section data-case="kernel">
  <h3>The kernel trick</h3>
  <div class="look"><h4>What you are looking at</h4>One class in a disc, the other in a ring around it: no straight line can split them. The colours show the SVM's score f(x) with an RBF kernel; red rings are the support vectors. Top right: how similarity falls with distance for the current γ. Bottom right: accuracy on training and unseen points for every γ.</div>
  <p>The SVM only ever uses the data through dot products between pairs of points. Replace each dot product by a kernel K(x, z), a similarity score, and the SVM behaves as if the points had been mapped into a much richer space where a flat boundary is enough, without ever computing that space. With the RBF kernel, similarity is 1 for identical points and falls off with distance; the decision function becomes a weighted sum of bumps centred on the support vectors.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>K</mi><mo stretchy="false">(</mo><mi mathvariant="bold">x</mi><mo separator="true">,</mo><mi mathvariant="bold">z</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>γ</mi><mi mathvariant="normal">∥</mi><mi mathvariant="bold">x</mi><mo>−</mo><mi mathvariant="bold">z</mi><msup><mi mathvariant="normal">∥</mi><mn>2</mn></msup></mrow></msup><mo separator="true">,</mo><mspace width="2em"/><mi>f</mi><mo stretchy="false">(</mo><mi mathvariant="bold">x</mi><mo stretchy="false">)</mo><mo>=</mo><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>α</mi><mi>i</mi></msub><msub><mi>y</mi><mi>i</mi></msub><mi>K</mi><mo stretchy="false">(</mo><msub><mi mathvariant="bold">x</mi><mi>i</mi></msub><mo separator="true">,</mo><mi mathvariant="bold">x</mi><mo stretchy="false">)</mo><mo>+</mo><mi>b</mi></mrow><annotation encoding="application/x-tex">K(\mathbf x, \mathbf z) = e^{-\gamma\|\mathbf x - \mathbf z\|^2}, \qquad f(\mathbf x) = \sum_i \alpha_i y_i K(\mathbf x_i, \mathbf x) + b</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>γ sets the reach of each point: small γ, wide bumps (smooth boundary); large γ, narrow bumps.</li>
    <li>The dual problem is the same as before with K in place of x·z.</li>
    <li>Few support vectors and good test accuracy: a well-chosen γ.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>120 points, C = 10: γ = 0.01 gets only 73 % (too smooth, nearly linear); γ = 0.3, 100 % on unseen points with 14 support vectors; γ = 100, 100 % on training but 87 % on unseen points, with 116 of 120 points as support vectors.</div>
  <div class="pitfall"><h4>Common mistake</h4>Picking γ by training accuracy: large γ always reaches 100 % there. Choose it on held-out data, as the bottom-right chart does.</div>
  <div class="try"><h4>Try it</h4>Sweep γ from 0.01 to 100 and watch the boundary go from a blurry ellipse to a ring to islands.</div>
</section>
<section data-case="kernel" data-example="smooth"><h3>γ = 0.01</h3><p>Every point is similar to every other: the bumps are so wide that the boundary can barely bend. 73 % right, and almost every point is a support vector.</p></section>
<section data-case="kernel" data-example="best"><h3>γ = 0.3</h3><p>A clean ring boundary from just 14 support vectors, 100 % on unseen points. A small number of support vectors is a good sign of a simple model.</p></section>
<section data-case="kernel" data-example="islands"><h3>γ = 100</h3><p>Each point's bump is tiny: the model draws a little island round each gold point. Perfect on the training data, 87 % on new points: overfitting.</p></section>
<details><summary>About the model</summary>
  <p>Dual coordinate descent (one α at a time, clipped to [0, C]); the linear SVM carries its bias as a constant feature (10), the kernel SVM adds 1 to the kernel. Tests: with large C every point has y·f ≥ 1 and support vectors sit at y·f = 1 (10⁻³); the margin 2/‖w‖ matches the widest gap found by trying 7200 directions (1 %); smaller C gives a wider margin and more support vectors; on rings an RBF SVM exceeds 95 % on new points while a linear SVM stays below 70 %.</p>
</details>
</template>
<template id="explain-kernel-trick"><section data-case="margin">
  <h3>The maximum-margin classifier</h3>
  <div class="look"><h4>What you are looking at</h4>Two classes of points, the SVM's decision line (orange), and the edges of its "street" (dashed), where y·f(x) = 1. Red rings mark the support vectors. Top right: street width against C. Bottom right: each point's dual weight α. Below: y·f(x) for every point, sorted.</div>
  <p>Many lines separate the two clouds. The SVM picks the one with the widest empty street between them, the line that stays as far as possible from both classes, because a decision that is not close to any training point is less likely to flip on new data. Remarkably, the answer depends only on the few points that touch the edges of the street: the support vectors. All the other points could be moved or deleted without changing anything.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><munder><mrow><mi>min</mi><mo>⁡</mo></mrow><mrow><mi mathvariant="bold">w</mi><mo separator="true">,</mo><mi>b</mi></mrow></munder><mtext> </mtext><mstyle scriptlevel="0" displaystyle="false"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi mathvariant="normal">∥</mi><mi mathvariant="bold">w</mi><msup><mi mathvariant="normal">∥</mi><mn>2</mn></msup><mo>+</mo><mi>C</mi><munder><mo>∑</mo><mi>i</mi></munder><mi>max</mi><mo>⁡</mo><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><mn>0</mn><mo separator="true">,</mo><mtext> </mtext><mn>1</mn><mo>−</mo><msub><mi>y</mi><mi>i</mi></msub><mo stretchy="false">(</mo><mi mathvariant="bold">w</mi><mo>⋅</mo><msub><mi mathvariant="bold">x</mi><mi>i</mi></msub><mo>+</mo><mi>b</mi><mo stretchy="false">)</mo><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mo separator="true">,</mo><mspace width="2em"/><mtext>width</mtext><mo>=</mo><mfrac><mn>2</mn><mrow><mi mathvariant="normal">∥</mi><mi mathvariant="bold">w</mi><mi mathvariant="normal">∥</mi></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="bold">w</mi><mo>=</mo><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>α</mi><mi>i</mi></msub><msub><mi>y</mi><mi>i</mi></msub><msub><mi mathvariant="bold">x</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">\min_{\mathbf w, b}\ \tfrac12\|\mathbf w\|^2 + C\sum_i \max\big(0,\, 1 - y_i(\mathbf w\cdot\mathbf x_i + b)\big), \qquad \text{width} = \frac{2}{\|\mathbf w\|}, \qquad \mathbf w = \sum_i \alpha_i y_i\mathbf x_i</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Labels y = ±1; score f(x) = w·x + b; predicted class = sign of f.</li>
    <li>Demand y·f ≥ 1 for every point: outside the street on its own side.</li>
    <li>Make ‖w‖ small: the street wide.</li>
    <li>C prices violations: large C, a hard margin; small C, a wider street that lets some points in.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>These 40 points, C = 100: street width 1.15, set by just 3 support vectors; every point has y·f ≥ 1. Trying every direction by brute force gives the same widest gap (the model test).</div>
  <div class="pitfall"><h4>Common mistake</h4>Thinking all training points shape the boundary. Only the support vectors (α &gt; 0) appear in w.</div>
  <div class="try"><h4>Try it</h4>Lower C step by step: the street widens and more points become support vectors.</div>
</section>
<section data-case="margin" data-example="soft"><h3>Small C</h3><p>C = 0.05: violations are cheap, so the street widens to 2.55 and 20 points end up inside it, all of them support vectors. Still 100 % right: being inside the street is not the same as being on the wrong side.</p></section>
<section data-case="margin" data-example="outlier"><h3>An outlier</h3><p>One blue point sits deep among the gold ones. A hard margin must still keep it outside the street: the width collapses from 1.15 to 0.20 and the line tilts.</p></section>
<section data-case="margin" data-example="outlier-soft"><h3>Soft margin and the outlier</h3><p>C = 0.5: the SVM accepts the one mistake and keeps a sensible street, width 1.42, 97.6 % of training points right. This is what C is for.</p></section>

<section data-case="kernel">
  <h3>The kernel trick</h3>
  <div class="look"><h4>What you are looking at</h4>One class in a disc, the other in a ring around it: no straight line can split them. The colours show the SVM's score f(x) with an RBF kernel; red rings are the support vectors. Top right: how similarity falls with distance for the current γ. Bottom right: accuracy on training and unseen points for every γ.</div>
  <p>The SVM only ever uses the data through dot products between pairs of points. Replace each dot product by a kernel K(x, z), a similarity score, and the SVM behaves as if the points had been mapped into a much richer space where a flat boundary is enough, without ever computing that space. With the RBF kernel, similarity is 1 for identical points and falls off with distance; the decision function becomes a weighted sum of bumps centred on the support vectors.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>K</mi><mo stretchy="false">(</mo><mi mathvariant="bold">x</mi><mo separator="true">,</mo><mi mathvariant="bold">z</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>γ</mi><mi mathvariant="normal">∥</mi><mi mathvariant="bold">x</mi><mo>−</mo><mi mathvariant="bold">z</mi><msup><mi mathvariant="normal">∥</mi><mn>2</mn></msup></mrow></msup><mo separator="true">,</mo><mspace width="2em"/><mi>f</mi><mo stretchy="false">(</mo><mi mathvariant="bold">x</mi><mo stretchy="false">)</mo><mo>=</mo><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>α</mi><mi>i</mi></msub><msub><mi>y</mi><mi>i</mi></msub><mi>K</mi><mo stretchy="false">(</mo><msub><mi mathvariant="bold">x</mi><mi>i</mi></msub><mo separator="true">,</mo><mi mathvariant="bold">x</mi><mo stretchy="false">)</mo><mo>+</mo><mi>b</mi></mrow><annotation encoding="application/x-tex">K(\mathbf x, \mathbf z) = e^{-\gamma\|\mathbf x - \mathbf z\|^2}, \qquad f(\mathbf x) = \sum_i \alpha_i y_i K(\mathbf x_i, \mathbf x) + b</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>γ sets the reach of each point: small γ, wide bumps (smooth boundary); large γ, narrow bumps.</li>
    <li>The dual problem is the same as before with K in place of x·z.</li>
    <li>Few support vectors and good test accuracy: a well-chosen γ.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>120 points, C = 10: γ = 0.01 gets only 73 % (too smooth, nearly linear); γ = 0.3, 100 % on unseen points with 14 support vectors; γ = 100, 100 % on training but 87 % on unseen points, with 116 of 120 points as support vectors.</div>
  <div class="pitfall"><h4>Common mistake</h4>Picking γ by training accuracy: large γ always reaches 100 % there. Choose it on held-out data, as the bottom-right chart does.</div>
  <div class="try"><h4>Try it</h4>Sweep γ from 0.01 to 100 and watch the boundary go from a blurry ellipse to a ring to islands.</div>
</section>
<section data-case="kernel" data-example="smooth"><h3>γ = 0.01</h3><p>Every point is similar to every other: the bumps are so wide that the boundary can barely bend. 73 % right, and almost every point is a support vector.</p></section>
<section data-case="kernel" data-example="best"><h3>γ = 0.3</h3><p>A clean ring boundary from just 14 support vectors, 100 % on unseen points. A small number of support vectors is a good sign of a simple model.</p></section>
<section data-case="kernel" data-example="islands"><h3>γ = 100</h3><p>Each point's bump is tiny: the model draws a little island round each gold point. Perfect on the training data, 87 % on new points: overfitting.</p></section>
<details><summary>About the model</summary>
  <p>Dual coordinate descent (one α at a time, clipped to [0, C]); the linear SVM carries its bias as a constant feature (10), the kernel SVM adds 1 to the kernel. Tests: with large C every point has y·f ≥ 1 and support vectors sit at y·f = 1 (10⁻³); the margin 2/‖w‖ matches the widest gap found by trying 7200 directions (1 %); smaller C gives a wider margin and more support vectors; on rings an RBF SVM exceeds 95 % on new points while a linear SVM stays below 70 %.</p>
</details>
</template>
<template id="explain-random-forest"><section data-case="forest">
  <h3>Bagging: a forest of trees</h3>
  <div class="look"><h4>What you are looking at</h4>200 noisy points of two moons, and the vote of 20 decision trees (gold = class 1, blue = class 0, dark = undecided). Top right: accuracy on unseen points as trees are added (orange) and each tree on its own (grey dots). Bottom right: where the trees disagree.</div>
  <p>A deep decision tree fits its training data in great detail, including the noise, so a slightly different sample gives a quite different tree: high variance. Bagging turns that weakness into strength. Draw many bootstrap samples (200 points picked at random with replacement), grow a tree on each, and let them vote. Their individual quirks point in different directions and cancel; what they agree on is the real pattern. The disagreement map shows where the answer is genuinely uncertain: along the boundary and in the noisy overlap.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mover accent="true"><mi>p</mi><mo>^</mo></mover><mo stretchy="false">(</mo><mi mathvariant="bold">x</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mi>T</mi></mfrac><munderover><mo>∑</mo><mrow><mi>t</mi><mo>=</mo><mn>1</mn></mrow><mi>T</mi></munderover><msub><mover accent="true"><mi>p</mi><mo>^</mo></mover><mi>t</mi></msub><mo stretchy="false">(</mo><mi mathvariant="bold">x</mi><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="normal">Var</mi><mo>⁡</mo><mo stretchy="false">(</mo><mtext>average</mtext><mo stretchy="false">)</mo><mo>=</mo><mi>ρ</mi><mtext> </mtext><msup><mi>σ</mi><mn>2</mn></msup><mo>+</mo><mfrac><mrow><mn>1</mn><mo>−</mo><mi>ρ</mi></mrow><mi>T</mi></mfrac><msup><mi>σ</mi><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">\hat p(\mathbf x) = \frac1T\sum_{t=1}^T \hat p_t(\mathbf x), \qquad \operatorname{Var}(\text{average}) = \rho\,\sigma^2 + \frac{1 - \rho}{T}\sigma^2</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Bootstrap: sample n points with replacement (about 63 % distinct each time).</li>
    <li>Grow a deep tree on it.</li>
    <li>Repeat T times; average the trees' probabilities.</li>
    <li>The more different the trees (small ρ), the more averaging helps.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>Depth-10 trees on these moons: one tree on its bootstrap sample, 81 % on unseen points; trees alone average 86 %; the vote of 5 trees, 91 %; of 60, 91.5 %. A single tree on all the data: 88.5 %.</div>
  <div class="pitfall"><h4>Common mistake</h4>Expecting more trees to overfit. Adding trees only reduces variance; past a few dozen the vote simply stops changing.</div>
  <div class="try"><h4>Try it</h4>Step T from 1 to 10 and watch the jagged blocks melt into a smooth boundary.</div>
</section>
<section data-case="forest" data-example="one"><h3>One tree</h3><p>A single bootstrapped tree: rectangular patches carved around individual noisy points, 81 % on unseen points.</p></section>
<section data-case="forest" data-example="sixty"><h3>Sixty trees</h3><p>The vote is smooth and stable, 91.5 %. A real random forest also picks a random subset of features at every split, to make the trees even more different; with two features there is little to choose.</p></section>
<section data-case="forest" data-example="stumpy"><h3>Shallow trees</h3><p>Depth-2 trees are too simple to follow the moons (high bias). Averaging 60 of them helps (90 %) but cannot remove a bias they all share: bagging fixes variance, not bias.</p></section>

<section data-case="boosting">
  <h3>Boosting: adding weak learners one by one</h3>
  <div class="look"><h4>What you are looking at</h4>AdaBoost after M rounds. Each round adds one decision stump, a single straight cut (the newest in red). Point size shows its weight for the next round. Top right: accuracy on training and unseen points by round. Bottom right: each stump's say α. Below: each stump's weighted error.</div>
  <p>Boosting builds a strong model from very weak ones, one at a time, each focusing on what the others get wrong. Start with all points equally weighted; fit the best stump; give it a say α that grows with its accuracy; then increase the weights of the points it misclassified and lower the rest. The next stump, fitted to the new weights, concentrates on the hard points. The final model is the weighted vote of all the stumps.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>ε</mi><mi>m</mi></msub><mo>=</mo><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>w</mi><mi>i</mi></msub><mo stretchy="false">[</mo><msub><mi>h</mi><mi>m</mi></msub><mo stretchy="false">(</mo><msub><mi mathvariant="bold">x</mi><mi>i</mi></msub><mo stretchy="false">)</mo><mo mathvariant="normal">≠</mo><msub><mi>y</mi><mi>i</mi></msub><mo stretchy="false">]</mo><mo separator="true">,</mo><mspace width="2em"/><msub><mi>α</mi><mi>m</mi></msub><mo>=</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi>ln</mi><mo>⁡</mo><mfrac><mrow><mn>1</mn><mo>−</mo><msub><mi>ε</mi><mi>m</mi></msub></mrow><msub><mi>ε</mi><mi>m</mi></msub></mfrac><mo separator="true">,</mo><mspace width="2em"/><msub><mi>w</mi><mi>i</mi></msub><mo>←</mo><msub><mi>w</mi><mi>i</mi></msub><mtext> </mtext><msup><mi>e</mi><mrow><mo>−</mo><msub><mi>α</mi><mi>m</mi></msub><msub><mi>y</mi><mi>i</mi></msub><msub><mi>h</mi><mi>m</mi></msub><mo stretchy="false">(</mo><msub><mi mathvariant="bold">x</mi><mi>i</mi></msub><mo stretchy="false">)</mo></mrow></msup><mo separator="true">,</mo><mspace width="2em"/><mi>F</mi><mo stretchy="false">(</mo><mi mathvariant="bold">x</mi><mo stretchy="false">)</mo><mo>=</mo><mi mathvariant="normal">sign</mi><mo>⁡</mo><munder><mo>∑</mo><mi>m</mi></munder><msub><mi>α</mi><mi>m</mi></msub><msub><mi>h</mi><mi>m</mi></msub><mo stretchy="false">(</mo><mi mathvariant="bold">x</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\varepsilon_m = \sum_i w_i [h_m(\mathbf x_i) \ne y_i], \qquad \alpha_m = \tfrac12\ln\frac{1 - \varepsilon_m}{\varepsilon_m}, \qquad w_i \leftarrow w_i\, e^{-\alpha_m y_i h_m(\mathbf x_i)}, \qquad F(\mathbf x) = \operatorname{sign}\sum_m \alpha_m h_m(\mathbf x)</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Fit the stump with the lowest weighted error ε (always below ½).</li>
    <li>Say: α large when ε is small.</li>
    <li>Re-weight: mistakes × e^α, correct points × e^(−α), then normalise.</li>
    <li>Repeat; the training error falls below Π 2√(ε(1 − ε)).</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>Round 1: the best single cut has ε = 0.155 and α = 0.85; 84.5 % right on training, 79.5 % on unseen points. After 20 rounds: 93 % and 87.5 %. After 80: 97.5 % and 88 %.</div>
  <div class="pitfall"><h4>Common mistake</h4>Assuming boosting cannot overfit because it is made of weak parts. On noisy data it keeps chasing the hardest (mislabelled) points: training accuracy climbs while unseen accuracy stalls.</div>
  <div class="try"><h4>Try it</h4>Step M one at a time: the big dots are always where the next cut goes.</div>
</section>
<section data-case="boosting" data-example="first"><h3>One stump</h3><p>A single straight cut, the best available: 84.5 % of training points right. Notice which points grew big: the ones it misclassified.</p></section>
<section data-case="boosting" data-example="five"><h3>Five rounds</h3><p>Five cuts with different says already make a staircase that follows the moons: 85 % on unseen points.</p></section>
<section data-case="boosting" data-example="eighty"><h3>Eighty rounds</h3><p>97.5 % on training, 88 % on unseen points: later stumps mostly carve out noise. In practice one stops boosting when the held-out accuracy stops improving.</p></section>
<details><summary>About the model</summary>
  <p>CART trees (Gini) grown on bootstrap samples, averaged; AdaBoost with exhaustive axis-aligned stumps. 200 training and 200 unseen points from two noisy moons. Tests: 50 bagged depth-10 trees beat one tree by more than 2 points on unseen data; every stump has ε &lt; ½ and the weights stay normalised; training accuracy rises from round 1 to above 95 % by round 100; the training error stays below the bound Π 2√(ε(1 − ε)) at every round.</p>
</details>
</template>

<section data-case="boosting" data-example="five"><h3>Five rounds</h3><p>Five cuts with different says already make a staircase that follows the moons: 85 % on unseen points.</p></section>
<section data-case="boosting" data-example="eighty"><h3>Eighty rounds</h3><p>97.5 % on training, 88 % on unseen points: later stumps mostly carve out noise. In practice one stops boosting when the held-out accuracy stops improving.</p></section>
<details><summary>About the model</summary>
  <p>CART trees (Gini) grown on bootstrap samples, averaged; AdaBoost with exhaustive axis-aligned stumps. 200 training and 200 unseen points from two noisy moons. Tests: 50 bagged depth-10 trees beat one tree by more than 2 points on unseen data; every stump has ε &lt; ½ and the weights stay normalised; training accuracy rises from round 1 to above 95 % by round 100; the training error stays below the bound Π 2√(ε(1 − ε)) at every round.</p>

<template id="explain-overfitting"><section>
  <p>A model is useful only on data it has not seen. Everything here uses polynomial fits to 20–30 noisy samples of a smooth curve (dashed), and a large separate <b>test set</b> (grey dots) that the fits never touch.</p>
</section>
<section data-case="capacity">
  <h3>Capacity: training error always improves</h3>
  <div class="look"><h4>What you are looking at</h4>Top: training points (yellow), test points (grey), the true curve (dashed) and the fit (blue). Bottom: training and test error against the polynomial degree, on a log scale.</div>
  <p>A degree-d polynomial contains every lower-degree one, so raising d can only lower the <i>training</i> error. Training error measures capacity, not quality. The test error falls while the model learns the curve, then rises when it starts fitting the noise.</p>
  <div class="worked"><h4>Worked example</h4>20 points: degree 3 gives test error ≈ 0.1 (close to the noise σ² = 0.09); degree 12 drives training error toward zero and test error up about fivefold.</div>
  <div class="pitfall"><h4>Common mistake</h4>Reporting the training score. More data (the "60 points" example) pushes the overfitting point to higher degrees.</div>
</section>
<section data-case="capacity" data-example="under"><h3>Degree 1</h3><p>A straight line cannot follow the curve: both errors high — underfitting.</p></section>
<section data-case="capacity" data-example="over"><h3>Degree 12</h3><p>The fit threads every training point and swings wildly between them.</p></section>
<section data-case="capacity" data-example="more"><h3>60 points</h3><p>Same degree, three times the data: the swings mostly disappear.</p></section>
<section data-case="biasvar">
  <h3>Where the error comes from: bias and variance</h3>
  <div class="look"><h4>What you are looking at</h4>Top: the same model trained on 40 different noisy datasets (grey), their average (blue) and the truth (dashed). Bottom: bias², variance and their sum against the degree.</div>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="double-struck">E</mi><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">[</mo><mo stretchy="false">(</mo><mi>y</mi><mo>−</mo><mover accent="true"><mi>f</mi><mo>^</mo></mover><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">]</mo><mo>=</mo><munder><munder><mrow><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><mi mathvariant="double-struck">E</mi><mo stretchy="false">[</mo><mover accent="true"><mi>f</mi><mo>^</mo></mover><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo stretchy="false">]</mo><mo>−</mo><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><msup><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mn>2</mn></msup></mrow><mo stretchy="true">⏟</mo></munder><msup><mtext>bias</mtext><mn>2</mn></msup></munder><mo>+</mo><munder><munder><mrow><mi mathvariant="double-struck">E</mi><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">[</mo><mo stretchy="false">(</mo><mover accent="true"><mi>f</mi><mo>^</mo></mover><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>−</mo><mi mathvariant="double-struck">E</mi><mo stretchy="false">[</mo><mover accent="true"><mi>f</mi><mo>^</mo></mover><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo stretchy="false">]</mo><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">]</mo></mrow><mo stretchy="true">⏟</mo></munder><mtext>variance</mtext></munder><mo>+</mo><munder><munder><msup><mi>σ</mi><mn>2</mn></msup><mo stretchy="true">⏟</mo></munder><mtext>noise</mtext></munder></mrow><annotation encoding="application/x-tex">\mathbb E\big[(y-\hat f(x))^2\big]=\underbrace{\big(\mathbb E[\hat f(x)]-f(x)\big)^2}_{\text{bias}^2}+\underbrace{\mathbb E\big[(\hat f(x)-\mathbb E[\hat f(x)])^2\big]}_{\text{variance}}+\underbrace{\sigma^2}_{\text{noise}}</annotation></semantics></math></span></div>
  <p>Bias is how wrong the model is on average; variance is how much it changes with the particular sample. Flexible models trade one for the other.</p>
</section>
<section data-case="biasvar" data-example="rigid"><h3>Degree 1</h3><p>All 40 lines nearly identical (low variance) and all equally wrong (high bias).</p></section>
<section data-case="biasvar" data-example="wild"><h3>Degree 10</h3><p>The average is close to the truth (low bias), but each single fit is wild, especially near the edges (high variance).</p></section>
<section data-case="ridge">
  <h3>Ridge: keep the capacity, penalise the coefficients</h3>
  <div class="look"><h4>What you are looking at</h4>Top: a degree-12 fit with penalty λ. Bottom: training and test error against log λ. Bottom plot: the size of each coefficient.</div>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mover accent="true"><mi mathvariant="bold">w</mi><mo>^</mo></mover><mo>=</mo><mi>arg</mi><mo>⁡</mo><munder><mrow><mi>min</mi><mo>⁡</mo></mrow><mi mathvariant="bold">w</mi></munder><mtext> </mtext><mi mathvariant="normal">∥</mi><mi>A</mi><mi mathvariant="bold">w</mi><mo>−</mo><mi mathvariant="bold">y</mi><msup><mi mathvariant="normal">∥</mi><mn>2</mn></msup><mo>+</mo><mi>λ</mi><mi mathvariant="normal">∥</mi><mi mathvariant="bold">w</mi><msup><mi mathvariant="normal">∥</mi><mn>2</mn></msup><mo>=</mo><mo stretchy="false">(</mo><msup><mi>A</mi><mi mathvariant="normal">⊤</mi></msup><mi>A</mi><mo>+</mo><mi>λ</mi><mi>I</mi><msup><mo stretchy="false">)</mo><mrow><mo>−</mo><mn>1</mn></mrow></msup><msup><mi>A</mi><mi mathvariant="normal">⊤</mi></msup><mi mathvariant="bold">y</mi></mrow><annotation encoding="application/x-tex">\hat{\mathbf w}=\arg\min_{\mathbf w}\ \|A\mathbf w-\mathbf y\|^2+\lambda\|\mathbf w\|^2=(A^\top A+\lambda I)^{-1}A^\top\mathbf y</annotation></semantics></math></span></div>
  <p>Wiggles need large coefficients; making them expensive smooths the fit without lowering the degree. λ is a dial from overfitting (λ → 0) to underfitting (λ large).</p>
</section>
<section data-case="ridge" data-example="none"><h3>λ ≈ 0</h3><p>No penalty: the degree-12 wiggles of plain least squares.</p></section>
<section data-case="ridge" data-example="strong"><h3>λ = 10</h3><p>Everything shrunk: the fit flattens toward zero.</p></section>
<section data-case="early">
  <h3>Early stopping: a regularizer for free</h3>
  <div class="look"><h4>What you are looking at</h4>The same degree-12 model trained by gradient descent from all-zero weights. Top: the fit as training goes on. Bottom: training and test error against iteration; green = the best moment to stop.</div>
  <p>Gradient descent learns the directions the data constrains best first — the broad shape — and the poorly constrained wiggles last. Stopping when the test (validation) error is lowest keeps the weights small, much like ridge.</p>
</section>
<section data-case="cv">
  <h3>Choosing without touching the test set</h3>
  <div class="look"><h4>What you are looking at</h4>Top: the training points coloured by fold. Bottom: k-fold cross-validation error against degree (green), compared with the real test error (blue).</div>
  <p>Picking d or λ by looking at the test error is cheating: the test set becomes part of training. k-fold cross-validation splits the <i>training</i> data into k parts, trains k times leaving one part out, and averages the errors on the left-out parts.</p>
  <div class="pitfall"><h4>Common mistake</h4>Shuffling time series or groups (the same patient in train and validation): the folds must be independent.</div>
</section>
<section data-case="cv" data-example="loo"><h3>k = 10</h3><p>More folds: each model sees 90% of the data; the estimate is less biased but costs 10 fits.</p></section>
<section data-case="imbalance">
  <h3>When classes are rare, accuracy lies</h3>
  <div class="look"><h4>What you are looking at</h4>Top: the classifier's score for 920 healthy (blue) and 80 ill (orange) people, and the decision threshold. Bottom: true positives, false negatives, false positives, true negatives. Bottom plot: accuracy, precision and recall against the threshold.</div>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>precision</mtext><mo>=</mo><mfrac><mrow><mi>T</mi><mi>P</mi></mrow><mrow><mi>T</mi><mi>P</mi><mo>+</mo><mi>F</mi><mi>P</mi></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mtext>recall</mtext><mo>=</mo><mfrac><mrow><mi>T</mi><mi>P</mi></mrow><mrow><mi>T</mi><mi>P</mi><mo>+</mo><mi>F</mi><mi>N</mi></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mtext>accuracy</mtext><mo>=</mo><mfrac><mrow><mi>T</mi><mi>P</mi><mo>+</mo><mi>T</mi><mi>N</mi></mrow><mi>N</mi></mfrac></mrow><annotation encoding="application/x-tex">\text{precision}=\frac{TP}{TP+FP},\qquad \text{recall}=\frac{TP}{TP+FN},\qquad \text{accuracy}=\frac{TP+TN}{N}</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>With 8% positives, answering "healthy" to everyone is 92% accurate and finds no one: recall 0.</div>
</section>

<section data-case="imbalance" data-example="low"><h3>Low threshold</h3><p>Nearly every ill person found (high recall), at the cost of many false alarms (low precision).</p></section>
