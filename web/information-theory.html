<template id="explain-entropy"><section>
  <p><b>Information theory</b> measures information in bits: how surprising a message is, how short it can be made, and how much of it a noisy channel can carry. Claude Shannon set it up in 1948, and every compressor, modem and phone still works within his limits.</p>
</section>
<section data-case="entropy">
  <h3>Surprisal and entropy</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the probability of each of five symbols (blue) and its surprisal log₂(1/p), scaled down by 8 (orange). Top right: the entropy of a coin as a function of its bias. Bottom right: a long random message from the source; the average surprisal of the symbols so far settles on the entropy (blue dashed). Below: each symbol's share of the entropy.</div>
  <p>Learning that an event of probability p happened gives log₂(1/p) bits of information: a fair coin toss 1 bit, a 1-in-8 event 3 bits, a certain event 0 bits. The <b>entropy</b> is the average over the source: the information per symbol.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>I</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>2</mn></msub><mfrac><mn>1</mn><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi>H</mi><mo>=</mo><munder><mo>∑</mo><mi>x</mi></munder><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>2</mn></msub><mfrac><mn>1</mn><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac><mtext> bits</mtext><mo separator="true">,</mo><mspace width="2em"/><mn>0</mn><mo>≤</mo><mi>H</mi><mo>≤</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>2</mn></msub><mi>N</mi></mrow><annotation encoding="application/x-tex">I(x)=\log_2\frac1{p(x)},\qquad H=\sum_x p(x)\log_2\frac1{p(x)}\ \text{bits},\qquad 0\le H\le\log_2 N</annotation></semantics></math></span></div>
  <ol class="steps"><li>Equal probabilities give the most entropy, log₂ N.</li><li>A source that almost always sends the same symbol has entropy near 0.</li><li>H is the smallest average number of bits per symbol any lossless code can reach (the source coding theorem).</li></ol>
  <div class="worked"><h4>Worked example</h4>Weights 4, 2, 2, 1, 1 give p = 0.4, 0.2, 0.2, 0.1, 0.1. H = 0.4·1.32 + 2·0.2·2.32 + 2·0.1·3.32 = 0.53 + 0.93 + 0.66 = 2.12 bits, compared with 2.32 for five equal symbols.</div>
  <div class="pitfall"><h4>Common mistake</h4>Thinking of information as meaning. Entropy measures only unpredictability: a page of random letters has more of it than a page of English.</div>
  <div class="try"><h4>Try it</h4>Drag one weight up to 10: the entropy falls towards 0, and rare symbols get larger surprisals.</div>
</section>
<section data-case="entropy" data-example="uniform"><h3>All equal</h3><p>No symbol is more predictable than another: H = log₂ 5 ≈ 2.32 bits, the most five symbols can carry.</p></section>
<section data-case="entropy" data-example="certain"><h3>Almost certain</h3><p>A is sent 96 % of the time: H ≈ 0.3 bits. Each rare symbol is very surprising, but rare.</p></section>
<section data-case="entropy" data-example="coin"><h3>A biased coin</h3><p>P(heads) = 0.1: H₂ = 0.47 bits. A thousand such tosses could be compressed into about 470 bits.</p></section>
<section data-case="huffman">
  <h3>The Huffman code</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the code tree built merge by merge. Each merge joins the two least likely nodes; the left branch is 0 (blue), the right is 1 (orange). Reading from the top down to a leaf gives its codeword. Top right: codeword lengths against the ideal log₂(1/p). Bottom right: entropy, Huffman average length, and a fixed 3-bit code. Below: bits used to send a random message.</div>
  <p>Give short codewords to frequent symbols and long ones to rare symbols. Huffman's algorithm does this optimally: no prefix-free code has a smaller average length.</p>
  <ol class="steps"><li>List the symbols with their probabilities.</li><li>Join the two least likely into a node whose probability is their sum.</li><li>Repeat until one node is left: the root.</li><li>Label the branches 0 and 1; each symbol's codeword is the path from the root.</li></ol>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>H</mi><mo>≤</mo><mi>L</mi><mo>=</mo><munder><mo>∑</mo><mi>x</mi></munder><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mtext> </mtext><mi mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>&lt;</mo><mi>H</mi><mo>+</mo><mn>1</mn><mo separator="true">,</mo><mspace width="2em"/><munder><mo>∑</mo><mi>x</mi></munder><msup><mn>2</mn><mrow><mo>−</mo><mi mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></msup><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">H\le L=\sum_x p(x)\,\ell(x)&lt;H+1,\qquad \sum_x 2^{-\ell(x)}=1</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>p = 0.4, 0.2, 0.2, 0.1, 0.1: lengths 2, 2, 2, 3, 3 (1, 3, 3, 3, 3 is just as good). L = 2·0.8 + 3·0.2 = 2.2 bits against H = 2.12; a fixed-length code needs 3 bits.</div>
  <div class="pitfall"><h4>Common mistake</h4>Expecting L = H. Codeword lengths are whole numbers, so L meets H only when every probability is a power of ½. Coding blocks of symbols (or arithmetic coding) closes the gap.</div>
</section>
<section data-case="huffman" data-example="dyadic"><h3>Powers of ½</h3><p>p = ½, ¼, ⅛, 1/16, 1/16: lengths 1, 2, 3, 4, 4 equal log₂(1/p) exactly, so L = H = 1.875 bits.</p></section>
<section data-case="huffman" data-example="flat"><h3>Nearly uniform</h3><p>With nothing to exploit the code uses lengths 2 and 3, about 2.3 bits: not much better than 3-bit words.</p></section>
<section data-case="channel">
  <h3>The binary symmetric channel</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the channel. Each bit arrives intact with probability 1 − e (green) or flipped with probability e (red); line thickness follows probability, and the input and output probabilities are written beside each node. Top right: the information that gets through per use, against the input probability. Bottom right: the capacity against e.</div>
  <p>The output Y tells us something about the input X, but not everything. The <b>mutual information</b> is the uncertainty about Y minus the part due only to noise. Its maximum over all inputs is the channel <b>capacity</b>.</p>

<template id="explain-huffman"><section>
  <p><b>Information theory</b> measures information in bits: how surprising a message is, how short it can be made, and how much of it a noisy channel can carry. Claude Shannon set it up in 1948, and every compressor, modem and phone still works within his limits.</p>
</section>
<section data-case="entropy">
  <h3>Surprisal and entropy</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the probability of each of five symbols (blue) and its surprisal log₂(1/p), scaled down by 8 (orange). Top right: the entropy of a coin as a function of its bias. Bottom right: a long random message from the source; the average surprisal of the symbols so far settles on the entropy (blue dashed). Below: each symbol's share of the entropy.</div>
  <p>Learning that an event of probability p happened gives log₂(1/p) bits of information: a fair coin toss 1 bit, a 1-in-8 event 3 bits, a certain event 0 bits. The <b>entropy</b> is the average over the source: the information per symbol.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>I</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>2</mn></msub><mfrac><mn>1</mn><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi>H</mi><mo>=</mo><munder><mo>∑</mo><mi>x</mi></munder><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>2</mn></msub><mfrac><mn>1</mn><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac><mtext> bits</mtext><mo separator="true">,</mo><mspace width="2em"/><mn>0</mn><mo>≤</mo><mi>H</mi><mo>≤</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>2</mn></msub><mi>N</mi></mrow><annotation encoding="application/x-tex">I(x)=\log_2\frac1{p(x)},\qquad H=\sum_x p(x)\log_2\frac1{p(x)}\ \text{bits},\qquad 0\le H\le\log_2 N</annotation></semantics></math></span></div>
  <ol class="steps"><li>Equal probabilities give the most entropy, log₂ N.</li><li>A source that almost always sends the same symbol has entropy near 0.</li><li>H is the smallest average number of bits per symbol any lossless code can reach (the source coding theorem).</li></ol>
  <div class="worked"><h4>Worked example</h4>Weights 4, 2, 2, 1, 1 give p = 0.4, 0.2, 0.2, 0.1, 0.1. H = 0.4·1.32 + 2·0.2·2.32 + 2·0.1·3.32 = 0.53 + 0.93 + 0.66 = 2.12 bits, compared with 2.32 for five equal symbols.</div>

  <div class="try"><h4>Try it</h4>Drag one weight up to 10: the entropy falls towards 0, and rare symbols get larger surprisals.</div>
</section>
<section data-case="entropy" data-example="uniform"><h3>All equal</h3><p>No symbol is more predictable than another: H = log₂ 5 ≈ 2.32 bits, the most five symbols can carry.</p></section>
<section data-case="entropy" data-example="certain"><h3>Almost certain</h3><p>A is sent 96 % of the time: H ≈ 0.3 bits. Each rare symbol is very surprising, but rare.</p></section>
<section data-case="entropy" data-example="coin"><h3>A biased coin</h3><p>P(heads) = 0.1: H₂ = 0.47 bits. A thousand such tosses could be compressed into about 470 bits.</p></section>
<section data-case="huffman">
  <h3>The Huffman code</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the code tree built merge by merge. Each merge joins the two least likely nodes; the left branch is 0 (blue), the right is 1 (orange). Reading from the top down to a leaf gives its codeword. Top right: codeword lengths against the ideal log₂(1/p). Bottom right: entropy, Huffman average length, and a fixed 3-bit code. Below: bits used to send a random message.</div>
  <p>Give short codewords to frequent symbols and long ones to rare symbols. Huffman's algorithm does this optimally: no prefix-free code has a smaller average length.</p>
  <ol class="steps"><li>List the symbols with their probabilities.</li><li>Join the two least likely into a node whose probability is their sum.</li><li>Repeat until one node is left: the root.</li><li>Label the branches 0 and 1; each symbol's codeword is the path from the root.</li></ol>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>H</mi><mo>≤</mo><mi>L</mi><mo>=</mo><munder><mo>∑</mo><mi>x</mi></munder><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mtext> </mtext><mi mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>&lt;</mo><mi>H</mi><mo>+</mo><mn>1</mn><mo separator="true">,</mo><mspace width="2em"/><munder><mo>∑</mo><mi>x</mi></munder><msup><mn>2</mn><mrow><mo>−</mo><mi mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></msup><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">H\le L=\sum_x p(x)\,\ell(x)&lt;H+1,\qquad \sum_x 2^{-\ell(x)}=1</annotation></semantics></math></span></div>

<template id="explain-repetition-code"><section>
  <p>A <b>channel code</b> adds redundant bits so that the receiver can detect and correct errors made by the channel. A code's rate is the share of data bits among all bits sent; it trades against how many errors the code can fix.</p>
</section>
<section data-case="repetition">
  <h3>The repetition code</h3>
  <div class="look"><h4>What you are looking at</h4>Left: 24 message bits, columns from left to right. The top row is what was sent (blue = 1, grey = 0), the middle rows are the n received copies with flips in red, and the bottom row is the majority vote, with wrong decisions shown as big red dots. Top right: bit error rate after the vote against n. Bottom right: error rate against rate 1/n, with the capacity C dashed. Below: the measured error rate of a long run.</div>
  <p>Send each bit n times (n odd) and take the majority. The decision is wrong only if more than half of the copies flipped, which becomes very unlikely as n grows.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>P</mi><mi>b</mi></msub><mo>=</mo><munder><mo>∑</mo><mrow><mi>j</mi><mo>&gt;</mo><mi>n</mi><mi mathvariant="normal">/</mi><mn>2</mn></mrow></munder><mrow><mo fence="true">(</mo><mfrac linethickness="0px"><mi>n</mi><mi>j</mi></mfrac><mo fence="true">)</mo></mrow><msup><mi>e</mi><mi>j</mi></msup><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>e</mi><msup><mo stretchy="false">)</mo><mrow><mi>n</mi><mo>−</mo><mi>j</mi></mrow></msup><mo separator="true">,</mo><mspace width="2em"/><mi>n</mi><mo>=</mo><mn>3</mn><mo>:</mo><mtext> </mtext><msub><mi>P</mi><mi>b</mi></msub><mo>=</mo><mn>3</mn><msup><mi>e</mi><mn>2</mn></msup><mo>−</mo><mn>2</mn><msup><mi>e</mi><mn>3</mn></msup></mrow><annotation encoding="application/x-tex">P_b=\sum_{j&gt;n/2}\binom nj e^j(1-e)^{n-j},\qquad n=3:\ P_b=3e^2-2e^3</annotation></semantics></math></span></div>

<section data-case="repetition" data-example="none"><h3>No code</h3><p>n = 1: every flip is an error and the error rate is e.</p></section>

<section data-case="hamming">
  <h3>The Hamming (7,4) code</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the seven bits of a codeword placed in the regions of three circles. Each circle holds four bits and must contain an even number of 1s; a circle that does not is red. Top right: sent and received bits by position. Bottom right: the distance from the received word to each of the 16 codewords; the sent one is green, and the decoder picks the nearest. Below: block error rate with and without the code.</div>
  <p>Four data bits get three parity bits, a rate of 4/7. Each parity bit makes its circle even. If one bit flips, exactly the circles containing it become odd, and every position is in a different set of circles, so the odd circles point to the culprit.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>s</mi><mo>=</mo><mo stretchy="false">(</mo><msub><mi>s</mi><mn>4</mn></msub><msub><mi>s</mi><mn>2</mn></msub><msub><mi>s</mi><mn>1</mn></msub><msub><mo stretchy="false">)</mo><mn>2</mn></msub><mo>=</mo><mtext>position of the flipped bit</mtext><mo separator="true">,</mo><mspace width="2em"/><msub><mi>s</mi><mi>j</mi></msub><mo>=</mo><munder><mo>⨁</mo><mrow><mi>i</mi><mtext> </mtext><mo>:</mo><mtext> </mtext><mi>i</mi><mtext> </mtext><mi mathvariant="normal">&amp;</mi><mtext> </mtext><mi>j</mi></mrow></munder><msub><mi>r</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">s=(s_4s_2s_1)_2=\text{position of the flipped bit},\qquad s_j=\bigoplus_{i\,:\,i\,\&amp;\,j}r_i</annotation></semantics></math></span></div>

<section data-case="hamming" data-example="one"><h3>Flip d₂</h3><p>Position 5 = 101: circles 1 and 4 turn red, circle 2 stays green. Only position 5 sits in exactly those two.</p></section>
