<template id="explain-entropy"><section>
  <p><b>Information theory</b> measures information in bits: how surprising a message is, how short it can be made, and how much of it a noisy channel can carry. Claude Shannon set it up in 1948, and every compressor, modem and phone still works within his limits.</p>
</section>
<section data-case="entropy">
  <h3>Surprisal and entropy</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the probability of each of five symbols (blue) and its surprisal log₂(1/p), scaled down by 8 (orange). Top right: the entropy of a coin as a function of its bias. Bottom right: a long random message from the source; the average surprisal of the symbols so far settles on the entropy (blue dashed). Below: each symbol's share of the entropy.</div>
  <p>Learning that an event of probability p happened gives log₂(1/p) bits of information: a fair coin toss 1 bit, a 1-in-8 event 3 bits, a certain event 0 bits. The <b>entropy</b> is the average over the source: the information per symbol.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>I</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>2</mn></msub><mfrac><mn>1</mn><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi>H</mi><mo>=</mo><munder><mo>∑</mo><mi>x</mi></munder><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>2</mn></msub><mfrac><mn>1</mn><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac><mtext> bits</mtext><mo separator="true">,</mo><mspace width="2em"/><mn>0</mn><mo>≤</mo><mi>H</mi><mo>≤</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>2</mn></msub><mi>N</mi></mrow><annotation encoding="application/x-tex">I(x)=\log_2\frac1{p(x)},\qquad H=\sum_x p(x)\log_2\frac1{p(x)}\ \text{bits},\qquad 0\le H\le\log_2 N</annotation></semantics></math></span></div>
  <ol class="steps"><li>Equal probabilities give the most entropy, log₂ N.</li><li>A source that almost always sends the same symbol has entropy near 0.</li><li>H is the smallest average number of bits per symbol any lossless code can reach (the source coding theorem).</li></ol>
  <div class="worked"><h4>Worked example</h4>Weights 4, 2, 2, 1, 1 give p = 0.4, 0.2, 0.2, 0.1, 0.1. H = 0.4·1.32 + 2·0.2·2.32 + 2·0.1·3.32 = 0.53 + 0.93 + 0.66 = 2.12 bits, compared with 2.32 for five equal symbols.</div>
  <div class="pitfall"><h4>Common mistake</h4>Thinking of information as meaning. Entropy measures only unpredictability: a page of random letters has more of it than a page of English.</div>
  <div class="try"><h4>Try it</h4>Drag one weight up to 10: the entropy falls towards 0, and rare symbols get larger surprisals.</div>
</section>
<section data-case="entropy" data-example="uniform"><h3>All equal</h3><p>No symbol is more predictable than another: H = log₂ 5 ≈ 2.32 bits, the most five symbols can carry.</p></section>
<section data-case="entropy" data-example="certain"><h3>Almost certain</h3><p>A is sent 96 % of the time: H ≈ 0.3 bits. Each rare symbol is very surprising, but rare.</p></section>
<section data-case="entropy" data-example="coin"><h3>A biased coin</h3><p>P(heads) = 0.1: H₂ = 0.47 bits. A thousand such tosses could be compressed into about 470 bits.</p></section>
<section data-case="huffman">
  <h3>The Huffman code</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the code tree built merge by merge. Each merge joins the two least likely nodes; the left branch is 0 (blue), the right is 1 (orange). Reading from the top down to a leaf gives its codeword. Top right: codeword lengths against the ideal log₂(1/p). Bottom right: entropy, Huffman average length, and a fixed 3-bit code. Below: bits used to send a random message.</div>
  <p>Give short codewords to frequent symbols and long ones to rare symbols. Huffman's algorithm does this optimally: no prefix-free code has a smaller average length.</p>
  <ol class="steps"><li>List the symbols with their probabilities.</li><li>Join the two least likely into a node whose probability is their sum.</li><li>Repeat until one node is left: the root.</li><li>Label the branches 0 and 1; each symbol's codeword is the path from the root.</li></ol>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>H</mi><mo>≤</mo><mi>L</mi><mo>=</mo><munder><mo>∑</mo><mi>x</mi></munder><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mtext> </mtext><mi mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>&lt;</mo><mi>H</mi><mo>+</mo><mn>1</mn><mo separator="true">,</mo><mspace width="2em"/><munder><mo>∑</mo><mi>x</mi></munder><msup><mn>2</mn><mrow><mo>−</mo><mi mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></msup><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">H\le L=\sum_x p(x)\,\ell(x)&lt;H+1,\qquad \sum_x 2^{-\ell(x)}=1</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>p = 0.4, 0.2, 0.2, 0.1, 0.1: lengths 2, 2, 2, 3, 3 (1, 3, 3, 3, 3 is just as good). L = 2·0.8 + 3·0.2 = 2.2 bits against H = 2.12; a fixed-length code needs 3 bits.</div>
  <div class="pitfall"><h4>Common mistake</h4>Expecting L = H. Codeword lengths are whole numbers, so L meets H only when every probability is a power of ½. Coding blocks of symbols (or arithmetic coding) closes the gap.</div>
  <div class="try"><h4>Try it</h4>Make one symbol much more likely: it gets the shortest code word and the average length falls toward the entropy.</div>
</section>
<section data-case="huffman" data-example="dyadic"><h3>Powers of ½</h3><p>p = ½, ¼, ⅛, 1/16, 1/16: lengths 1, 2, 3, 4, 4 equal log₂(1/p) exactly, so L = H = 1.875 bits.</p></section>
<section data-case="huffman" data-example="flat"><h3>Nearly uniform</h3><p>With nothing to exploit the code uses lengths 2 and 3, about 2.3 bits: not much better than 3-bit words.</p></section>
<section data-case="channel">
  <h3>The binary symmetric channel</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the channel. Each bit arrives intact with probability 1 − e (green) or flipped with probability e (red); line thickness follows probability, and the input and output probabilities are written beside each node. Top right: the information that gets through per use, against the input probability. Bottom right: the capacity against e.</div>
  <p>The output Y tells us something about the input X, but not everything. The <b>mutual information</b> is the uncertainty about Y minus the part due only to noise. Its maximum over all inputs is the channel <b>capacity</b>.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>I</mi><mo stretchy="false">(</mo><mi>X</mi><mo separator="true">;</mo><mi>Y</mi><mo stretchy="false">)</mo><mo>=</mo><mi>H</mi><mo stretchy="false">(</mo><mi>Y</mi><mo stretchy="false">)</mo><mo>−</mo><mi>H</mi><mo stretchy="false">(</mo><mi>Y</mi><mo>∣</mo><mi>X</mi><mo stretchy="false">)</mo><mo>=</mo><msub><mi>H</mi><mn>2</mn></msub><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><mi>q</mi><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>e</mi><mo stretchy="false">)</mo><mo>+</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>q</mi><mo stretchy="false">)</mo><mi>e</mi><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mo>−</mo><msub><mi>H</mi><mn>2</mn></msub><mo stretchy="false">(</mo><mi>e</mi><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><mi>C</mi><mo>=</mo><mn>1</mn><mo>−</mo><msub><mi>H</mi><mn>2</mn></msub><mo stretchy="false">(</mo><mi>e</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">I(X;Y)=H(Y)-H(Y\mid X)=H_2\big(q(1-e)+(1-q)e\big)-H_2(e),\qquad C=1-H_2(e)</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>e = 0.11: H₂(0.11) ≈ 0.5, so C ≈ 0.5. Half of every bit sent is lost to noise; at best one data bit gets through every two channel uses.</div>
  <div class="pitfall"><h4>Common mistake</h4>Thinking capacity is "1 − e". With e = 0.11 the channel delivers 89 % of bits correctly, but you do not know which ones; that uncertainty costs H₂(e) bits per use.</div>
  <div class="try"><h4>Try it</h4>Raise the flip probability to 0.5: the capacity falls to zero. Move the input probability away from ½ and the mutual information drops below capacity.</div>
</section>
<section data-case="channel" data-example="half"><h3>e = ½</h3><p>The output is a fair coin regardless of the input: H(Y) = H(Y|X) = 1, and nothing gets through.</p></section>
<section data-case="channel" data-example="skew"><h3>Unequal inputs</h3><p>Sending mostly zeros lowers H(Y) while the noise H(Y|X) stays the same: less information per use. For this channel, equal inputs are best.</p></section>
</template>
<template id="explain-typical-sequences"><section data-case="typical">
  <h3>Typical sequences and compression</h3>
  <div class="look"><h4>What you are looking at</h4>Left: every sequence of n coin flips, grouped by its surprise per flip, −log₂P(sequence)/n, and stacked by probability. Green bars are inside the typical band H ± δ. Top right: the probability of the typical set as n grows. Bottom right: the bits per flip needed to give every typical sequence its own number (green), against the entropy H and against 1 bit per flip. Below: the cumulative distribution of the surprise.</div>
  <p>A biased coin (say P(1) = 0.2) has 2ⁿ possible sequences of n flips, but they are far from equally likely. The surprise of a sequence, −log₂ of its probability, is a sum of n independent surprises, so by the law of large numbers its average per flip settles on the entropy H. For long sequences almost all the probability sits on <b>typical sequences</b>, whose surprise is close to nH, and each has probability about 2^(−nH). So there are only about 2^(nH) of them. Numbering them takes nH bits instead of n: that is why H bits per symbol are enough, and why no lossless code can do better.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mo>−</mo><mfrac><mn>1</mn><mi>n</mi></mfrac><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>2</mn></msub><mi>P</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mn>1</mn></msub><mo>…</mo><msub><mi>x</mi><mi>n</mi></msub><mo stretchy="false">)</mo><mo>→</mo><mi>H</mi><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="normal">∣</mi><msubsup><mi>T</mi><mi>δ</mi><mrow><mo stretchy="false">(</mo><mi>n</mi><mo stretchy="false">)</mo></mrow></msubsup><mi mathvariant="normal">∣</mi><mo>≈</mo><msup><mn>2</mn><mrow><mi>n</mi><mi>H</mi></mrow></msup><mo separator="true">,</mo><mspace width="2em"/><mi>P</mi><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><msubsup><mi>T</mi><mi>δ</mi><mrow><mo stretchy="false">(</mo><mi>n</mi><mo stretchy="false">)</mo></mrow></msubsup><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mo>→</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">-\frac1n\log_2 P(x_1\ldots x_n) \to H, \qquad |T_\delta^{(n)}| \approx 2^{nH}, \qquad P\big(T_\delta^{(n)}\big) \to 1</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>A sequence with k ones has probability p^k (1 − p)^(n − k); its surprise per flip depends only on k/n.</li>
    <li>k/n concentrates near p, so the surprise concentrates near H.</li>
    <li>Give every typical sequence a number (nH bits) and spend a little extra on the rare others.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>P(1) = 0.2: H = 0.722 bit. With δ = 0.05, the typical set holds 30 % of the probability for 10 flips, 47 % for 100, and 99.5 % for 2000 flips, where it has about 2^(0.77·2000) members, against 2^2000 sequences in all.</div>
  <div class="pitfall"><h4>Common mistakes</h4>Thinking the most likely sequence is typical. All zeros is the single most probable sequence here, but its surprise is far below H, and the set of such sequences carries almost no probability.</div>
  <div class="try"><h4>Try it</h4>Raise n from 10 to 2000 and watch the probability gather into the green band around H, while the bits needed per flip settle near H.</div>
</section>
<section data-case="typical" data-example="short"><h3>10 flips: no concentration yet</h3><p>With so few flips the surprise still spreads widely, and the typical band holds under a third of the probability.</p></section>
<section data-case="typical" data-example="long"><h3>2000 flips: almost all typical</h3><p>99.5 % of the probability is within ±0.05 bit of H. That is the source coding theorem at work.</p></section>
<section data-case="typical" data-example="fair"><h3>Fair coin: every sequence typical</h3><p>p = ½: every sequence has probability 2⁻ⁿ and surprise exactly 1 bit = H. Nothing can be compressed.</p></section>

<section data-case="mutual">
  <h3>Mutual information</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the joint probability of sending symbol x and receiving y through a symmetric channel; the diagonal is "received correctly". Top right: the information diagram. H(X) on top, H(Y) in the middle, H(X, Y) at the bottom; the green overlap is the mutual information I(X; Y), the grey part H(X|Y), the orange part H(Y|X). Bottom right: I against the error probability, for this input and for a uniform input. Below: I against the input skew.</div>
  <p>Before you look at the output, your uncertainty about the input is H(X). After you look, it is H(X|Y), what the noise leaves you not knowing. The difference is the <b>mutual information</b>: how many bits per symbol the output carries about the input. It is symmetric, I(X; Y) = I(Y; X), it is never negative, and it is zero exactly when input and output are independent. Maximised over the input distribution it is the channel's <b>capacity</b>; for a symmetric channel the best input is uniform.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>I</mi><mo stretchy="false">(</mo><mi>X</mi><mo separator="true">;</mo><mi>Y</mi><mo stretchy="false">)</mo><mo>=</mo><mi>H</mi><mo stretchy="false">(</mo><mi>X</mi><mo stretchy="false">)</mo><mo>−</mo><mi>H</mi><mo stretchy="false">(</mo><mi>X</mi><mo>∣</mo><mi>Y</mi><mo stretchy="false">)</mo><mo>=</mo><mi>H</mi><mo stretchy="false">(</mo><mi>Y</mi><mo stretchy="false">)</mo><mo>−</mo><mi>H</mi><mo stretchy="false">(</mo><mi>Y</mi><mo>∣</mo><mi>X</mi><mo stretchy="false">)</mo><mo>=</mo><mi>H</mi><mo stretchy="false">(</mo><mi>X</mi><mo stretchy="false">)</mo><mo>+</mo><mi>H</mi><mo stretchy="false">(</mo><mi>Y</mi><mo stretchy="false">)</mo><mo>−</mo><mi>H</mi><mo stretchy="false">(</mo><mi>X</mi><mo separator="true">,</mo><mi>Y</mi><mo stretchy="false">)</mo><mo>=</mo><munder><mo>∑</mo><mrow><mi>x</mi><mo separator="true">,</mo><mi>y</mi></mrow></munder><mi>P</mi><mo stretchy="false">(</mo><mi>x</mi><mo separator="true">,</mo><mi>y</mi><mo stretchy="false">)</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>2</mn></msub><mfrac><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>x</mi><mo separator="true">,</mo><mi>y</mi><mo stretchy="false">)</mo></mrow><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mi>P</mi><mo stretchy="false">(</mo><mi>y</mi><mo stretchy="false">)</mo></mrow></mfrac></mrow><annotation encoding="application/x-tex">I(X;Y) = H(X) - H(X\mid Y) = H(Y) - H(Y\mid X) = H(X) + H(Y) - H(X,Y) = \sum_{x,y}P(x,y)\log_2\frac{P(x,y)}{P(x)P(y)}</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Build the joint table: input probability times the chance of each output.</li>
    <li>Sum rows and columns for the two marginals; compute the three entropies.</li>
    <li>I is the overlap: H(X) + H(Y) − H(X, Y).</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>Four symbols, error probability 0.1, uniform input: I = 2 − H_b(0.1) − 0.1·log₂3 = 2 − 0.469 − 0.158 = 1.37 bits per symbol, the capacity. Skew the input (skew 1) and H(X) drops to 0.66 bit, I to 0.42.</div>
  <div class="pitfall"><h4>Common mistakes</h4>Confusing correlation with mutual information. I catches any dependence, not only a linear one, and it is measured in bits, not on a −1 to 1 scale.</div>
  <div class="try"><h4>Try it</h4>Raise the error probability from 0 to 0.75: the green overlap shrinks from all of H(X) to nothing. Then lower it a little and skew the input.</div>
</section>
<section data-case="mutual" data-example="clean"><h3>e = 0: I = H(X)</h3><p>The output is the input: the two entropy bars overlap completely, and H(X|Y) = 0.</p></section>
<section data-case="mutual" data-example="useless"><h3>e = ¾: nothing gets through</h3><p>With four symbols, e = ¾ makes every output equally likely whatever was sent: X and Y are independent and the overlap vanishes.</p></section>
<section data-case="mutual" data-example="skew"><h3>Skewed input: less than capacity</h3><p>An input that favours a few symbols carries less uncertainty to begin with, so less can get through: I falls below the capacity of 1.37 bits.</p></section>

<section data-case="crc">
  <h3>CRC: detecting errors</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the message with r zeros appended, divided by the generator over GF(2). Each "+" row is the generator (addition over GF(2) is XOR) aligned under a leading 1, each "=" row the result of the XOR. At the bottom: the remainder, the codeword sent, what is received, and the receiver's own remainder. Top right: the share of error patterns with 1 to 4 flipped bits that go unnoticed (every pattern checked). Bottom right: the same for bursts of each length.</div>
  <p>A <b>cyclic redundancy check</b> treats the bits as the coefficients of a polynomial and arithmetic as XOR, with no carries. The sender appends r zeros, divides by a fixed generator polynomial of degree r, and sends the remainder after the data. The codeword is then an exact multiple of the generator. The receiver divides again: a nonzero remainder means an error. An error pattern goes unseen only if it is itself a multiple of the generator. With a good generator that rules out every single error and every burst up to r bits, and lets through only about 2^(−r) of everything else.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>c</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><mi>m</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mtext> </mtext><msup><mi>x</mi><mi>r</mi></msup><mo>+</mo><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><mi>m</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mtext> </mtext><msup><mi>x</mi><mi>r</mi></msup><mtext> </mtext><mo lspace="0.22em" rspace="0.22em"><mrow><mi mathvariant="normal">m</mi><mi mathvariant="normal">o</mi><mi mathvariant="normal">d</mi></mrow></mo><mtext> </mtext><mi>g</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mo separator="true">,</mo><mspace width="2em"/><mi>c</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mtext> </mtext><mo lspace="0.22em" rspace="0.22em"><mrow><mi mathvariant="normal">m</mi><mi mathvariant="normal">o</mi><mi mathvariant="normal">d</mi></mrow></mo><mtext> </mtext><mi>g</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><mn>0</mn><mo separator="true">,</mo><mspace width="2em"/><mtext>undetected</mtext><mtext>  </mtext><mo>⟺</mo><mtext>  </mtext><mi>e</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mtext> </mtext><mo lspace="0.22em" rspace="0.22em"><mrow><mi mathvariant="normal">m</mi><mi mathvariant="normal">o</mi><mi mathvariant="normal">d</mi></mrow></mo><mtext> </mtext><mi>g</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">c(x) = m(x)\,x^r + \big(m(x)\,x^r \bmod g(x)\big), \qquad c(x) \bmod g(x) = 0, \qquad \text{undetected} \iff e(x) \bmod g(x) = 0</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Shift: append r zeros to the message.</li>
    <li>Divide: wherever the leading bit is 1, XOR the generator in; the last r bits are the remainder.</li>
    <li>Send message + remainder; the receiver's division must give zero.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>The textbook case: 11010011101100 divided by 1011 (x³ + x + 1) leaves 100. For 1101011011 the codeword is 1101011011100. Flipping bits 4, 6 and 7 adds 1011 shifted, a multiple of the generator, and the receiver's remainder is 000: missed. One flip anywhere is always caught.</div>
  <div class="pitfall"><h4>Common mistakes</h4>Expecting a CRC to correct errors. It only detects them (the receiver asks for a resend). And it is not security: anyone can recompute it for a tampered message.</div>
  <div class="try"><h4>Try it</h4>Flip one bit anywhere: the receiver's remainder is never zero. Then switch to CRC-8 and try three flips: patterns that fooled the 3-bit CRC are now caught.</div>
</section>
<section data-case="crc" data-example="one"><h3>One flipped bit: caught</h3><p>A single error is x^k, never a multiple of a generator with more than one term: always detected.</p></section>
<section data-case="crc" data-example="burst"><h3>A burst of 3: caught</h3><p>Three adjacent flips: a burst no longer than r = 3 cannot be a multiple of a degree-3 generator, so it is detected.</p></section>
<section data-case="crc" data-example="miss"><h3>Flips that look like the generator: missed</h3><p>Bits 4, 6 and 7 flipped make the error pattern 1011, the generator itself: the received word still divides, and the error slips through. A longer generator makes such coincidences rarer.</p></section>

<section data-case="viterbi">
  <h3>Convolutional codes and the Viterbi decoder</h3>
  <div class="look"><h4>What you are looking at</h4>The trellis: the encoder's four states (its last two input bits) as rows, time as columns. Grey lines are every possible branch; blue the survivor kept at each state; green, at the end, the path the decoder chooses. The numbers are path metrics, how many received bits each path disagrees with. Along the top are the received bit pairs (✗ marks a flipped pair); along the bottom, what was sent and what was decoded. Top right: the path metrics as decoding proceeds. Bottom right: bit error rate with and without the code. Below: the best metric so far.</div>
  <p>A <b>convolutional code</b> does not cut the data into blocks: each input bit, together with the two before it, produces two output bits (rate ½). The encoder is a small state machine, and every possible message is a path through its trellis. The decoder looks for the path whose output is closest to what was received. Trying every message is hopeless, 2ⁿ of them, but the <b>Viterbi algorithm</b> notices that of two paths entering the same state only the cheaper one can ever be part of the best path. It keeps one survivor per state and stage, and the work grows only linearly with the length.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>v</mi><mn>1</mn></msub><mo>=</mo><msub><mi>u</mi><mi>k</mi></msub><mo>⊕</mo><msub><mi>u</mi><mrow><mi>k</mi><mo>−</mo><mn>1</mn></mrow></msub><mo>⊕</mo><msub><mi>u</mi><mrow><mi>k</mi><mo>−</mo><mn>2</mn></mrow></msub><mo separator="true">,</mo><mspace width="1em"/><msub><mi>v</mi><mn>2</mn></msub><mo>=</mo><msub><mi>u</mi><mi>k</mi></msub><mo>⊕</mo><msub><mi>u</mi><mrow><mi>k</mi><mo>−</mo><mn>2</mn></mrow></msub><mtext>  </mtext><mo stretchy="false">(</mo><mtext>generators </mtext><mn>7</mn><mo separator="true">,</mo><mn>5</mn><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><msub><mi>M</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub><mo stretchy="false">(</mo><msup><mi>s</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo stretchy="false">)</mo><mo>=</mo><munder><mrow><mi>min</mi><mo>⁡</mo></mrow><mrow><mi>s</mi><mo>→</mo><msup><mi>s</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup></mrow></munder><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><msub><mi>M</mi><mi>k</mi></msub><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>+</mo><msub><mi>d</mi><mi>H</mi></msub><mo stretchy="false">(</mo><mtext>branch</mtext><mo separator="true">,</mo><msub><mi>r</mi><mi>k</mi></msub><mo stretchy="false">)</mo><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo></mrow><annotation encoding="application/x-tex">v_1 = u_k \oplus u_{k-1} \oplus u_{k-2},\quad v_2 = u_k \oplus u_{k-2}\ \ (\text{generators } 7, 5), \qquad M_{k+1}(s&#x27;) = \min_{s \to s&#x27;}\big(M_k(s) + d_H(\text{branch}, r_k)\big)</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>For every state at stage k + 1, look at the two branches arriving.</li>
    <li>Add each branch's disagreement with the received pair to its starting metric; keep the smaller (the survivor).</li>
    <li>At the end (tail bits bring the encoder back to state 00), trace the survivors back.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>10 message bits plus 2 tail bits give 24 channel bits. Flip bits 3 and 16: the best path ends with metric 2 (it believes in exactly two flips) and decodes perfectly. Flip bits 5, 6 and 8, close together: a wrong path explains the received bits just as cheaply, and two message bits come out wrong. The code's free distance is 5: it can always fix 2 errors that are far enough apart.</div>
  <div class="pitfall"><h4>Common mistakes</h4>Assuming more redundancy always fixes more. Errors that come in clusters defeat short-memory codes; real systems interleave the bits so that a burst becomes scattered single errors.</div>
  <div class="try"><h4>Try it</h4>Set one flip and move it along the codeword: it is always corrected. Then add a second and a third and bring them closer until the decoded bits start to go wrong.</div>
</section>
<section data-case="viterbi" data-example="two"><h3>Two flips far apart: corrected</h3><p>Each flip raises the correct path's metric by 1; every wrong path differs from the right one in at least 5 bits, so it stays more expensive.</p></section>
<section data-case="viterbi" data-example="close"><h3>Three flips close together: fooled</h3><p>Three errors within a few stages: now a wrong path is just as close to what was received, and the decoder follows it for a while before rejoining.</p></section>
</template>
<template id="explain-huffman"><section>
  <p><b>Information theory</b> measures information in bits: how surprising a message is, how short it can be made, and how much of it a noisy channel can carry. Claude Shannon set it up in 1948, and every compressor, modem and phone still works within his limits.</p>
</section>
<section data-case="entropy">
  <h3>Surprisal and entropy</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the probability of each of five symbols (blue) and its surprisal log₂(1/p), scaled down by 8 (orange). Top right: the entropy of a coin as a function of its bias. Bottom right: a long random message from the source; the average surprisal of the symbols so far settles on the entropy (blue dashed). Below: each symbol's share of the entropy.</div>
  <p>Learning that an event of probability p happened gives log₂(1/p) bits of information: a fair coin toss 1 bit, a 1-in-8 event 3 bits, a certain event 0 bits. The <b>entropy</b> is the average over the source: the information per symbol.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>I</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>2</mn></msub><mfrac><mn>1</mn><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi>H</mi><mo>=</mo><munder><mo>∑</mo><mi>x</mi></munder><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>2</mn></msub><mfrac><mn>1</mn><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac><mtext> bits</mtext><mo separator="true">,</mo><mspace width="2em"/><mn>0</mn><mo>≤</mo><mi>H</mi><mo>≤</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>2</mn></msub><mi>N</mi></mrow><annotation encoding="application/x-tex">I(x)=\log_2\frac1{p(x)},\qquad H=\sum_x p(x)\log_2\frac1{p(x)}\ \text{bits},\qquad 0\le H\le\log_2 N</annotation></semantics></math></span></div>
  <ol class="steps"><li>Equal probabilities give the most entropy, log₂ N.</li><li>A source that almost always sends the same symbol has entropy near 0.</li><li>H is the smallest average number of bits per symbol any lossless code can reach (the source coding theorem).</li></ol>
  <div class="worked"><h4>Worked example</h4>Weights 4, 2, 2, 1, 1 give p = 0.4, 0.2, 0.2, 0.1, 0.1. H = 0.4·1.32 + 2·0.2·2.32 + 2·0.1·3.32 = 0.53 + 0.93 + 0.66 = 2.12 bits, compared with 2.32 for five equal symbols.</div>
  <div class="pitfall"><h4>Common mistake</h4>Thinking of information as meaning. Entropy measures only unpredictability: a page of random letters has more of it than a page of English.</div>
  <div class="try"><h4>Try it</h4>Drag one weight up to 10: the entropy falls towards 0, and rare symbols get larger surprisals.</div>
</section>
<section data-case="entropy" data-example="uniform"><h3>All equal</h3><p>No symbol is more predictable than another: H = log₂ 5 ≈ 2.32 bits, the most five symbols can carry.</p></section>
<section data-case="entropy" data-example="certain"><h3>Almost certain</h3><p>A is sent 96 % of the time: H ≈ 0.3 bits. Each rare symbol is very surprising, but rare.</p></section>
<section data-case="entropy" data-example="coin"><h3>A biased coin</h3><p>P(heads) = 0.1: H₂ = 0.47 bits. A thousand such tosses could be compressed into about 470 bits.</p></section>
<section data-case="huffman">
  <h3>The Huffman code</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the code tree built merge by merge. Each merge joins the two least likely nodes; the left branch is 0 (blue), the right is 1 (orange). Reading from the top down to a leaf gives its codeword. Top right: codeword lengths against the ideal log₂(1/p). Bottom right: entropy, Huffman average length, and a fixed 3-bit code. Below: bits used to send a random message.</div>
  <p>Give short codewords to frequent symbols and long ones to rare symbols. Huffman's algorithm does this optimally: no prefix-free code has a smaller average length.</p>
  <ol class="steps"><li>List the symbols with their probabilities.</li><li>Join the two least likely into a node whose probability is their sum.</li><li>Repeat until one node is left: the root.</li><li>Label the branches 0 and 1; each symbol's codeword is the path from the root.</li></ol>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>H</mi><mo>≤</mo><mi>L</mi><mo>=</mo><munder><mo>∑</mo><mi>x</mi></munder><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mtext> </mtext><mi mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>&lt;</mo><mi>H</mi><mo>+</mo><mn>1</mn><mo separator="true">,</mo><mspace width="2em"/><munder><mo>∑</mo><mi>x</mi></munder><msup><mn>2</mn><mrow><mo>−</mo><mi mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></msup><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">H\le L=\sum_x p(x)\,\ell(x)&lt;H+1,\qquad \sum_x 2^{-\ell(x)}=1</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>p = 0.4, 0.2, 0.2, 0.1, 0.1: lengths 2, 2, 2, 3, 3 (1, 3, 3, 3, 3 is just as good). L = 2·0.8 + 3·0.2 = 2.2 bits against H = 2.12; a fixed-length code needs 3 bits.</div>
  <div class="pitfall"><h4>Common mistake</h4>Expecting L = H. Codeword lengths are whole numbers, so L meets H only when every probability is a power of ½. Coding blocks of symbols (or arithmetic coding) closes the gap.</div>
  <div class="try"><h4>Try it</h4>Make one symbol much more likely: it gets the shortest code word and the average length falls toward the entropy.</div>
</section>
<section data-case="huffman" data-example="dyadic"><h3>Powers of ½</h3><p>p = ½, ¼, ⅛, 1/16, 1/16: lengths 1, 2, 3, 4, 4 equal log₂(1/p) exactly, so L = H = 1.875 bits.</p></section>
<section data-case="huffman" data-example="flat"><h3>Nearly uniform</h3><p>With nothing to exploit the code uses lengths 2 and 3, about 2.3 bits: not much better than 3-bit words.</p></section>
<section data-case="channel">
  <h3>The binary symmetric channel</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the channel. Each bit arrives intact with probability 1 − e (green) or flipped with probability e (red); line thickness follows probability, and the input and output probabilities are written beside each node. Top right: the information that gets through per use, against the input probability. Bottom right: the capacity against e.</div>
  <p>The output Y tells us something about the input X, but not everything. The <b>mutual information</b> is the uncertainty about Y minus the part due only to noise. Its maximum over all inputs is the channel <b>capacity</b>.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>I</mi><mo stretchy="false">(</mo><mi>X</mi><mo separator="true">;</mo><mi>Y</mi><mo stretchy="false">)</mo><mo>=</mo><mi>H</mi><mo stretchy="false">(</mo><mi>Y</mi><mo stretchy="false">)</mo><mo>−</mo><mi>H</mi><mo stretchy="false">(</mo><mi>Y</mi><mo>∣</mo><mi>X</mi><mo stretchy="false">)</mo><mo>=</mo><msub><mi>H</mi><mn>2</mn></msub><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><mi>q</mi><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>e</mi><mo stretchy="false">)</mo><mo>+</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>q</mi><mo stretchy="false">)</mo><mi>e</mi><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mo>−</mo><msub><mi>H</mi><mn>2</mn></msub><mo stretchy="false">(</mo><mi>e</mi><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><mi>C</mi><mo>=</mo><mn>1</mn><mo>−</mo><msub><mi>H</mi><mn>2</mn></msub><mo stretchy="false">(</mo><mi>e</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">I(X;Y)=H(Y)-H(Y\mid X)=H_2\big(q(1-e)+(1-q)e\big)-H_2(e),\qquad C=1-H_2(e)</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>e = 0.11: H₂(0.11) ≈ 0.5, so C ≈ 0.5. Half of every bit sent is lost to noise; at best one data bit gets through every two channel uses.</div>
  <div class="pitfall"><h4>Common mistake</h4>Thinking capacity is "1 − e". With e = 0.11 the channel delivers 89 % of bits correctly, but you do not know which ones; that uncertainty costs H₂(e) bits per use.</div>
  <div class="try"><h4>Try it</h4>Raise the flip probability to 0.5: the capacity falls to zero. Move the input probability away from ½ and the mutual information drops below capacity.</div>
</section>
<section data-case="channel" data-example="half"><h3>e = ½</h3><p>The output is a fair coin regardless of the input: H(Y) = H(Y|X) = 1, and nothing gets through.</p></section>
<section data-case="channel" data-example="skew"><h3>Unequal inputs</h3><p>Sending mostly zeros lowers H(Y) while the noise H(Y|X) stays the same: less information per use. For this channel, equal inputs are best.</p></section>
</template>
<template id="explain-mutual-information"><section data-case="typical">
  <h3>Typical sequences and compression</h3>
  <div class="look"><h4>What you are looking at</h4>Left: every sequence of n coin flips, grouped by its surprise per flip, −log₂P(sequence)/n, and stacked by probability. Green bars are inside the typical band H ± δ. Top right: the probability of the typical set as n grows. Bottom right: the bits per flip needed to give every typical sequence its own number (green), against the entropy H and against 1 bit per flip. Below: the cumulative distribution of the surprise.</div>
  <p>A biased coin (say P(1) = 0.2) has 2ⁿ possible sequences of n flips, but they are far from equally likely. The surprise of a sequence, −log₂ of its probability, is a sum of n independent surprises, so by the law of large numbers its average per flip settles on the entropy H. For long sequences almost all the probability sits on <b>typical sequences</b>, whose surprise is close to nH, and each has probability about 2^(−nH). So there are only about 2^(nH) of them. Numbering them takes nH bits instead of n: that is why H bits per symbol are enough, and why no lossless code can do better.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mo>−</mo><mfrac><mn>1</mn><mi>n</mi></mfrac><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>2</mn></msub><mi>P</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mn>1</mn></msub><mo>…</mo><msub><mi>x</mi><mi>n</mi></msub><mo stretchy="false">)</mo><mo>→</mo><mi>H</mi><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="normal">∣</mi><msubsup><mi>T</mi><mi>δ</mi><mrow><mo stretchy="false">(</mo><mi>n</mi><mo stretchy="false">)</mo></mrow></msubsup><mi mathvariant="normal">∣</mi><mo>≈</mo><msup><mn>2</mn><mrow><mi>n</mi><mi>H</mi></mrow></msup><mo separator="true">,</mo><mspace width="2em"/><mi>P</mi><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><msubsup><mi>T</mi><mi>δ</mi><mrow><mo stretchy="false">(</mo><mi>n</mi><mo stretchy="false">)</mo></mrow></msubsup><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mo>→</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">-\frac1n\log_2 P(x_1\ldots x_n) \to H, \qquad |T_\delta^{(n)}| \approx 2^{nH}, \qquad P\big(T_\delta^{(n)}\big) \to 1</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>A sequence with k ones has probability p^k (1 − p)^(n − k); its surprise per flip depends only on k/n.</li>
    <li>k/n concentrates near p, so the surprise concentrates near H.</li>
    <li>Give every typical sequence a number (nH bits) and spend a little extra on the rare others.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>P(1) = 0.2: H = 0.722 bit. With δ = 0.05, the typical set holds 30 % of the probability for 10 flips, 47 % for 100, and 99.5 % for 2000 flips, where it has about 2^(0.77·2000) members, against 2^2000 sequences in all.</div>
  <div class="pitfall"><h4>Common mistakes</h4>Thinking the most likely sequence is typical. All zeros is the single most probable sequence here, but its surprise is far below H, and the set of such sequences carries almost no probability.</div>
  <div class="try"><h4>Try it</h4>Raise n from 10 to 2000 and watch the probability gather into the green band around H, while the bits needed per flip settle near H.</div>
</section>
<section data-case="typical" data-example="short"><h3>10 flips: no concentration yet</h3><p>With so few flips the surprise still spreads widely, and the typical band holds under a third of the probability.</p></section>
<section data-case="typical" data-example="long"><h3>2000 flips: almost all typical</h3><p>99.5 % of the probability is within ±0.05 bit of H. That is the source coding theorem at work.</p></section>
<section data-case="typical" data-example="fair"><h3>Fair coin: every sequence typical</h3><p>p = ½: every sequence has probability 2⁻ⁿ and surprise exactly 1 bit = H. Nothing can be compressed.</p></section>

<section data-case="mutual">
  <h3>Mutual information</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the joint probability of sending symbol x and receiving y through a symmetric channel; the diagonal is "received correctly". Top right: the information diagram. H(X) on top, H(Y) in the middle, H(X, Y) at the bottom; the green overlap is the mutual information I(X; Y), the grey part H(X|Y), the orange part H(Y|X). Bottom right: I against the error probability, for this input and for a uniform input. Below: I against the input skew.</div>
  <p>Before you look at the output, your uncertainty about the input is H(X). After you look, it is H(X|Y), what the noise leaves you not knowing. The difference is the <b>mutual information</b>: how many bits per symbol the output carries about the input. It is symmetric, I(X; Y) = I(Y; X), it is never negative, and it is zero exactly when input and output are independent. Maximised over the input distribution it is the channel's <b>capacity</b>; for a symmetric channel the best input is uniform.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>I</mi><mo stretchy="false">(</mo><mi>X</mi><mo separator="true">;</mo><mi>Y</mi><mo stretchy="false">)</mo><mo>=</mo><mi>H</mi><mo stretchy="false">(</mo><mi>X</mi><mo stretchy="false">)</mo><mo>−</mo><mi>H</mi><mo stretchy="false">(</mo><mi>X</mi><mo>∣</mo><mi>Y</mi><mo stretchy="false">)</mo><mo>=</mo><mi>H</mi><mo stretchy="false">(</mo><mi>Y</mi><mo stretchy="false">)</mo><mo>−</mo><mi>H</mi><mo stretchy="false">(</mo><mi>Y</mi><mo>∣</mo><mi>X</mi><mo stretchy="false">)</mo><mo>=</mo><mi>H</mi><mo stretchy="false">(</mo><mi>X</mi><mo stretchy="false">)</mo><mo>+</mo><mi>H</mi><mo stretchy="false">(</mo><mi>Y</mi><mo stretchy="false">)</mo><mo>−</mo><mi>H</mi><mo stretchy="false">(</mo><mi>X</mi><mo separator="true">,</mo><mi>Y</mi><mo stretchy="false">)</mo><mo>=</mo><munder><mo>∑</mo><mrow><mi>x</mi><mo separator="true">,</mo><mi>y</mi></mrow></munder><mi>P</mi><mo stretchy="false">(</mo><mi>x</mi><mo separator="true">,</mo><mi>y</mi><mo stretchy="false">)</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>2</mn></msub><mfrac><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>x</mi><mo separator="true">,</mo><mi>y</mi><mo stretchy="false">)</mo></mrow><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mi>P</mi><mo stretchy="false">(</mo><mi>y</mi><mo stretchy="false">)</mo></mrow></mfrac></mrow><annotation encoding="application/x-tex">I(X;Y) = H(X) - H(X\mid Y) = H(Y) - H(Y\mid X) = H(X) + H(Y) - H(X,Y) = \sum_{x,y}P(x,y)\log_2\frac{P(x,y)}{P(x)P(y)}</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Build the joint table: input probability times the chance of each output.</li>
    <li>Sum rows and columns for the two marginals; compute the three entropies.</li>
    <li>I is the overlap: H(X) + H(Y) − H(X, Y).</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>Four symbols, error probability 0.1, uniform input: I = 2 − H_b(0.1) − 0.1·log₂3 = 2 − 0.469 − 0.158 = 1.37 bits per symbol, the capacity. Skew the input (skew 1) and H(X) drops to 0.66 bit, I to 0.42.</div>
  <div class="pitfall"><h4>Common mistakes</h4>Confusing correlation with mutual information. I catches any dependence, not only a linear one, and it is measured in bits, not on a −1 to 1 scale.</div>
  <div class="try"><h4>Try it</h4>Raise the error probability from 0 to 0.75: the green overlap shrinks from all of H(X) to nothing. Then lower it a little and skew the input.</div>
</section>
<section data-case="mutual" data-example="clean"><h3>e = 0: I = H(X)</h3><p>The output is the input: the two entropy bars overlap completely, and H(X|Y) = 0.</p></section>
<section data-case="mutual" data-example="useless"><h3>e = ¾: nothing gets through</h3><p>With four symbols, e = ¾ makes every output equally likely whatever was sent: X and Y are independent and the overlap vanishes.</p></section>
<section data-case="mutual" data-example="skew"><h3>Skewed input: less than capacity</h3><p>An input that favours a few symbols carries less uncertainty to begin with, so less can get through: I falls below the capacity of 1.37 bits.</p></section>

<section data-case="crc">
  <h3>CRC: detecting errors</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the message with r zeros appended, divided by the generator over GF(2). Each "+" row is the generator (addition over GF(2) is XOR) aligned under a leading 1, each "=" row the result of the XOR. At the bottom: the remainder, the codeword sent, what is received, and the receiver's own remainder. Top right: the share of error patterns with 1 to 4 flipped bits that go unnoticed (every pattern checked). Bottom right: the same for bursts of each length.</div>
  <p>A <b>cyclic redundancy check</b> treats the bits as the coefficients of a polynomial and arithmetic as XOR, with no carries. The sender appends r zeros, divides by a fixed generator polynomial of degree r, and sends the remainder after the data. The codeword is then an exact multiple of the generator. The receiver divides again: a nonzero remainder means an error. An error pattern goes unseen only if it is itself a multiple of the generator. With a good generator that rules out every single error and every burst up to r bits, and lets through only about 2^(−r) of everything else.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>c</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><mi>m</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mtext> </mtext><msup><mi>x</mi><mi>r</mi></msup><mo>+</mo><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><mi>m</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mtext> </mtext><msup><mi>x</mi><mi>r</mi></msup><mtext> </mtext><mo lspace="0.22em" rspace="0.22em"><mrow><mi mathvariant="normal">m</mi><mi mathvariant="normal">o</mi><mi mathvariant="normal">d</mi></mrow></mo><mtext> </mtext><mi>g</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mo separator="true">,</mo><mspace width="2em"/><mi>c</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mtext> </mtext><mo lspace="0.22em" rspace="0.22em"><mrow><mi mathvariant="normal">m</mi><mi mathvariant="normal">o</mi><mi mathvariant="normal">d</mi></mrow></mo><mtext> </mtext><mi>g</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><mn>0</mn><mo separator="true">,</mo><mspace width="2em"/><mtext>undetected</mtext><mtext>  </mtext><mo>⟺</mo><mtext>  </mtext><mi>e</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mtext> </mtext><mo lspace="0.22em" rspace="0.22em"><mrow><mi mathvariant="normal">m</mi><mi mathvariant="normal">o</mi><mi mathvariant="normal">d</mi></mrow></mo><mtext> </mtext><mi>g</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">c(x) = m(x)\,x^r + \big(m(x)\,x^r \bmod g(x)\big), \qquad c(x) \bmod g(x) = 0, \qquad \text{undetected} \iff e(x) \bmod g(x) = 0</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>Shift: append r zeros to the message.</li>
    <li>Divide: wherever the leading bit is 1, XOR the generator in; the last r bits are the remainder.</li>
    <li>Send message + remainder; the receiver's division must give zero.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>The textbook case: 11010011101100 divided by 1011 (x³ + x + 1) leaves 100. For 1101011011 the codeword is 1101011011100. Flipping bits 4, 6 and 7 adds 1011 shifted, a multiple of the generator, and the receiver's remainder is 000: missed. One flip anywhere is always caught.</div>
  <div class="pitfall"><h4>Common mistakes</h4>Expecting a CRC to correct errors. It only detects them (the receiver asks for a resend). And it is not security: anyone can recompute it for a tampered message.</div>
  <div class="try"><h4>Try it</h4>Flip one bit anywhere: the receiver's remainder is never zero. Then switch to CRC-8 and try three flips: patterns that fooled the 3-bit CRC are now caught.</div>
</section>
<section data-case="crc" data-example="one"><h3>One flipped bit: caught</h3><p>A single error is x^k, never a multiple of a generator with more than one term: always detected.</p></section>
<section data-case="crc" data-example="burst"><h3>A burst of 3: caught</h3><p>Three adjacent flips: a burst no longer than r = 3 cannot be a multiple of a degree-3 generator, so it is detected.</p></section>
<section data-case="crc" data-example="miss"><h3>Flips that look like the generator: missed</h3><p>Bits 4, 6 and 7 flipped make the error pattern 1011, the generator itself: the received word still divides, and the error slips through. A longer generator makes such coincidences rarer.</p></section>

<section data-case="viterbi">
  <h3>Convolutional codes and the Viterbi decoder</h3>
  <div class="look"><h4>What you are looking at</h4>The trellis: the encoder's four states (its last two input bits) as rows, time as columns. Grey lines are every possible branch; blue the survivor kept at each state; green, at the end, the path the decoder chooses. The numbers are path metrics, how many received bits each path disagrees with. Along the top are the received bit pairs (✗ marks a flipped pair); along the bottom, what was sent and what was decoded. Top right: the path metrics as decoding proceeds. Bottom right: bit error rate with and without the code. Below: the best metric so far.</div>
  <p>A <b>convolutional code</b> does not cut the data into blocks: each input bit, together with the two before it, produces two output bits (rate ½). The encoder is a small state machine, and every possible message is a path through its trellis. The decoder looks for the path whose output is closest to what was received. Trying every message is hopeless, 2ⁿ of them, but the <b>Viterbi algorithm</b> notices that of two paths entering the same state only the cheaper one can ever be part of the best path. It keeps one survivor per state and stage, and the work grows only linearly with the length.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>v</mi><mn>1</mn></msub><mo>=</mo><msub><mi>u</mi><mi>k</mi></msub><mo>⊕</mo><msub><mi>u</mi><mrow><mi>k</mi><mo>−</mo><mn>1</mn></mrow></msub><mo>⊕</mo><msub><mi>u</mi><mrow><mi>k</mi><mo>−</mo><mn>2</mn></mrow></msub><mo separator="true">,</mo><mspace width="1em"/><msub><mi>v</mi><mn>2</mn></msub><mo>=</mo><msub><mi>u</mi><mi>k</mi></msub><mo>⊕</mo><msub><mi>u</mi><mrow><mi>k</mi><mo>−</mo><mn>2</mn></mrow></msub><mtext>  </mtext><mo stretchy="false">(</mo><mtext>generators </mtext><mn>7</mn><mo separator="true">,</mo><mn>5</mn><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><msub><mi>M</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub><mo stretchy="false">(</mo><msup><mi>s</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo stretchy="false">)</mo><mo>=</mo><munder><mrow><mi>min</mi><mo>⁡</mo></mrow><mrow><mi>s</mi><mo>→</mo><msup><mi>s</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup></mrow></munder><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><msub><mi>M</mi><mi>k</mi></msub><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>+</mo><msub><mi>d</mi><mi>H</mi></msub><mo stretchy="false">(</mo><mtext>branch</mtext><mo separator="true">,</mo><msub><mi>r</mi><mi>k</mi></msub><mo stretchy="false">)</mo><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo></mrow><annotation encoding="application/x-tex">v_1 = u_k \oplus u_{k-1} \oplus u_{k-2},\quad v_2 = u_k \oplus u_{k-2}\ \ (\text{generators } 7, 5), \qquad M_{k+1}(s&#x27;) = \min_{s \to s&#x27;}\big(M_k(s) + d_H(\text{branch}, r_k)\big)</annotation></semantics></math></span></div>
  <ol class="steps">
    <li>For every state at stage k + 1, look at the two branches arriving.</li>
    <li>Add each branch's disagreement with the received pair to its starting metric; keep the smaller (the survivor).</li>
    <li>At the end (tail bits bring the encoder back to state 00), trace the survivors back.</li>
  </ol>
  <div class="worked"><h4>Worked example</h4>10 message bits plus 2 tail bits give 24 channel bits. Flip bits 3 and 16: the best path ends with metric 2 (it believes in exactly two flips) and decodes perfectly. Flip bits 5, 6 and 8, close together: a wrong path explains the received bits just as cheaply, and two message bits come out wrong. The code's free distance is 5: it can always fix 2 errors that are far enough apart.</div>
  <div class="pitfall"><h4>Common mistakes</h4>Assuming more redundancy always fixes more. Errors that come in clusters defeat short-memory codes; real systems interleave the bits so that a burst becomes scattered single errors.</div>
  <div class="try"><h4>Try it</h4>Set one flip and move it along the codeword: it is always corrected. Then add a second and a third and bring them closer until the decoded bits start to go wrong.</div>
</section>
<section data-case="viterbi" data-example="two"><h3>Two flips far apart: corrected</h3><p>Each flip raises the correct path's metric by 1; every wrong path differs from the right one in at least 5 bits, so it stays more expensive.</p></section>
<section data-case="viterbi" data-example="close"><h3>Three flips close together: fooled</h3><p>Three errors within a few stages: now a wrong path is just as close to what was received, and the decoder follows it for a while before rejoining.</p></section>
</template>
<template id="explain-channel-capacity"><section>
  <p><b>Information theory</b> measures information in bits: how surprising a message is, how short it can be made, and how much of it a noisy channel can carry. Claude Shannon set it up in 1948, and every compressor, modem and phone still works within his limits.</p>
</section>
<section data-case="entropy">
  <h3>Surprisal and entropy</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the probability of each of five symbols (blue) and its surprisal log₂(1/p), scaled down by 8 (orange). Top right: the entropy of a coin as a function of its bias. Bottom right: a long random message from the source; the average surprisal of the symbols so far settles on the entropy (blue dashed). Below: each symbol's share of the entropy.</div>
  <p>Learning that an event of probability p happened gives log₂(1/p) bits of information: a fair coin toss 1 bit, a 1-in-8 event 3 bits, a certain event 0 bits. The <b>entropy</b> is the average over the source: the information per symbol.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>I</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>2</mn></msub><mfrac><mn>1</mn><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi>H</mi><mo>=</mo><munder><mo>∑</mo><mi>x</mi></munder><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>2</mn></msub><mfrac><mn>1</mn><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac><mtext> bits</mtext><mo separator="true">,</mo><mspace width="2em"/><mn>0</mn><mo>≤</mo><mi>H</mi><mo>≤</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>2</mn></msub><mi>N</mi></mrow><annotation encoding="application/x-tex">I(x)=\log_2\frac1{p(x)},\qquad H=\sum_x p(x)\log_2\frac1{p(x)}\ \text{bits},\qquad 0\le H\le\log_2 N</annotation></semantics></math></span></div>
  <ol class="steps"><li>Equal probabilities give the most entropy, log₂ N.</li><li>A source that almost always sends the same symbol has entropy near 0.</li><li>H is the smallest average number of bits per symbol any lossless code can reach (the source coding theorem).</li></ol>
  <div class="worked"><h4>Worked example</h4>Weights 4, 2, 2, 1, 1 give p = 0.4, 0.2, 0.2, 0.1, 0.1. H = 0.4·1.32 + 2·0.2·2.32 + 2·0.1·3.32 = 0.53 + 0.93 + 0.66 = 2.12 bits, compared with 2.32 for five equal symbols.</div>
  <div class="pitfall"><h4>Common mistake</h4>Thinking of information as meaning. Entropy measures only unpredictability: a page of random letters has more of it than a page of English.</div>
  <div class="try"><h4>Try it</h4>Drag one weight up to 10: the entropy falls towards 0, and rare symbols get larger surprisals.</div>
</section>
<section data-case="entropy" data-example="uniform"><h3>All equal</h3><p>No symbol is more predictable than another: H = log₂ 5 ≈ 2.32 bits, the most five symbols can carry.</p></section>
<section data-case="entropy" data-example="certain"><h3>Almost certain</h3><p>A is sent 96 % of the time: H ≈ 0.3 bits. Each rare symbol is very surprising, but rare.</p></section>
<section data-case="entropy" data-example="coin"><h3>A biased coin</h3><p>P(heads) = 0.1: H₂ = 0.47 bits. A thousand such tosses could be compressed into about 470 bits.</p></section>
<section data-case="huffman">
  <h3>The Huffman code</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the code tree built merge by merge. Each merge joins the two least likely nodes; the left branch is 0 (blue), the right is 1 (orange). Reading from the top down to a leaf gives its codeword. Top right: codeword lengths against the ideal log₂(1/p). Bottom right: entropy, Huffman average length, and a fixed 3-bit code. Below: bits used to send a random message.</div>
  <p>Give short codewords to frequent symbols and long ones to rare symbols. Huffman's algorithm does this optimally: no prefix-free code has a smaller average length.</p>
  <ol class="steps"><li>List the symbols with their probabilities.</li><li>Join the two least likely into a node whose probability is their sum.</li><li>Repeat until one node is left: the root.</li><li>Label the branches 0 and 1; each symbol's codeword is the path from the root.</li></ol>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>H</mi><mo>≤</mo><mi>L</mi><mo>=</mo><munder><mo>∑</mo><mi>x</mi></munder><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mtext> </mtext><mi mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>&lt;</mo><mi>H</mi><mo>+</mo><mn>1</mn><mo separator="true">,</mo><mspace width="2em"/><munder><mo>∑</mo><mi>x</mi></munder><msup><mn>2</mn><mrow><mo>−</mo><mi mathvariant="normal">ℓ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></msup><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">H\le L=\sum_x p(x)\,\ell(x)&lt;H+1,\qquad \sum_x 2^{-\ell(x)}=1</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>p = 0.4, 0.2, 0.2, 0.1, 0.1: lengths 2, 2, 2, 3, 3 (1, 3, 3, 3, 3 is just as good). L = 2·0.8 + 3·0.2 = 2.2 bits against H = 2.12; a fixed-length code needs 3 bits.</div>
  <div class="pitfall"><h4>Common mistake</h4>Expecting L = H. Codeword lengths are whole numbers, so L meets H only when every probability is a power of ½. Coding blocks of symbols (or arithmetic coding) closes the gap.</div>
  <div class="try"><h4>Try it</h4>Make one symbol much more likely: it gets the shortest code word and the average length falls toward the entropy.</div>
</section>
<section data-case="huffman" data-example="dyadic"><h3>Powers of ½</h3><p>p = ½, ¼, ⅛, 1/16, 1/16: lengths 1, 2, 3, 4, 4 equal log₂(1/p) exactly, so L = H = 1.875 bits.</p></section>
<section data-case="huffman" data-example="flat"><h3>Nearly uniform</h3><p>With nothing to exploit the code uses lengths 2 and 3, about 2.3 bits: not much better than 3-bit words.</p></section>
<section data-case="channel">
  <h3>The binary symmetric channel</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the channel. Each bit arrives intact with probability 1 − e (green) or flipped with probability e (red); line thickness follows probability, and the input and output probabilities are written beside each node. Top right: the information that gets through per use, against the input probability. Bottom right: the capacity against e.</div>
  <p>The output Y tells us something about the input X, but not everything. The <b>mutual information</b> is the uncertainty about Y minus the part due only to noise. Its maximum over all inputs is the channel <b>capacity</b>.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>I</mi><mo stretchy="false">(</mo><mi>X</mi><mo separator="true">;</mo><mi>Y</mi><mo stretchy="false">)</mo><mo>=</mo><mi>H</mi><mo stretchy="false">(</mo><mi>Y</mi><mo stretchy="false">)</mo><mo>−</mo><mi>H</mi><mo stretchy="false">(</mo><mi>Y</mi><mo>∣</mo><mi>X</mi><mo stretchy="false">)</mo><mo>=</mo><msub><mi>H</mi><mn>2</mn></msub><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><mi>q</mi><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>e</mi><mo stretchy="false">)</mo><mo>+</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>q</mi><mo stretchy="false">)</mo><mi>e</mi><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mo>−</mo><msub><mi>H</mi><mn>2</mn></msub><mo stretchy="false">(</mo><mi>e</mi><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><mi>C</mi><mo>=</mo><mn>1</mn><mo>−</mo><msub><mi>H</mi><mn>2</mn></msub><mo stretchy="false">(</mo><mi>e</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">I(X;Y)=H(Y)-H(Y\mid X)=H_2\big(q(1-e)+(1-q)e\big)-H_2(e),\qquad C=1-H_2(e)</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>e = 0.11: H₂(0.11) ≈ 0.5, so C ≈ 0.5. Half of every bit sent is lost to noise; at best one data bit gets through every two channel uses.</div>
  <div class="pitfall"><h4>Common mistake</h4>Thinking capacity is "1 − e". With e = 0.11 the channel delivers 89 % of bits correctly, but you do not know which ones; that uncertainty costs H₂(e) bits per use.</div>
  <div class="try"><h4>Try it</h4>Raise the flip probability to 0.5: the capacity falls to zero. Move the input probability away from ½ and the mutual information drops below capacity.</div>
</section>
<section data-case="channel" data-example="half"><h3>e = ½</h3><p>The output is a fair coin regardless of the input: H(Y) = H(Y|X) = 1, and nothing gets through.</p></section>
<section data-case="channel" data-example="skew"><h3>Unequal inputs</h3><p>Sending mostly zeros lowers H(Y) while the noise H(Y|X) stays the same: less information per use. For this channel, equal inputs are best.</p></section>
</template>
<template id="explain-repetition-code"><section>
  <p>A <b>channel code</b> adds redundant bits so that the receiver can detect and correct errors made by the channel. A code's rate is the share of data bits among all bits sent; it trades against how many errors the code can fix.</p>
</section>
<section data-case="repetition">
  <h3>The repetition code</h3>
  <div class="look"><h4>What you are looking at</h4>Left: 24 message bits, columns from left to right. The top row is what was sent (blue = 1, grey = 0), the middle rows are the n received copies with flips in red, and the bottom row is the majority vote, with wrong decisions shown as big red dots. Top right: bit error rate after the vote against n. Bottom right: error rate against rate 1/n, with the capacity C dashed. Below: the measured error rate of a long run.</div>
  <p>Send each bit n times (n odd) and take the majority. The decision is wrong only if more than half of the copies flipped, which becomes very unlikely as n grows.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>P</mi><mi>b</mi></msub><mo>=</mo><munder><mo>∑</mo><mrow><mi>j</mi><mo>&gt;</mo><mi>n</mi><mi mathvariant="normal">/</mi><mn>2</mn></mrow></munder><mrow><mo fence="true">(</mo><mfrac linethickness="0px"><mi>n</mi><mi>j</mi></mfrac><mo fence="true">)</mo></mrow><msup><mi>e</mi><mi>j</mi></msup><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>e</mi><msup><mo stretchy="false">)</mo><mrow><mi>n</mi><mo>−</mo><mi>j</mi></mrow></msup><mo separator="true">,</mo><mspace width="2em"/><mi>n</mi><mo>=</mo><mn>3</mn><mo>:</mo><mtext> </mtext><msub><mi>P</mi><mi>b</mi></msub><mo>=</mo><mn>3</mn><msup><mi>e</mi><mn>2</mn></msup><mo>−</mo><mn>2</mn><msup><mi>e</mi><mn>3</mn></msup></mrow><annotation encoding="application/x-tex">P_b=\sum_{j&gt;n/2}\binom nj e^j(1-e)^{n-j},\qquad n=3:\ P_b=3e^2-2e^3</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>e = 0.1, n = 3: P_b = 0.03 − 0.002 = 0.028, about 3.5 times fewer errors, at the cost of sending three times as many bits.</div>
  <div class="pitfall"><h4>Common mistake</h4>Concluding that reliability costs rate. Repetition drives the rate to zero, but Shannon proved that codes at any fixed rate below C can make errors as rare as you like. LDPC and turbo codes come close to that limit.</div>
  <div class="try"><h4>Try it</h4>Set e = 0.3 and raise n: the errors still go away, but the point in the bottom chart slides towards rate 0.</div>
</section>
<section data-case="repetition" data-example="none"><h3>No code</h3><p>n = 1: every flip is an error and the error rate is e.</p></section>
<section data-case="repetition" data-example="seven"><h3>Seven copies</h3><p>Four of seven must flip: about 0.3 % errors at e = 0.1, but only one data bit per seven channel uses.</p></section>
<section data-case="hamming">
  <h3>The Hamming (7,4) code</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the seven bits of a codeword placed in the regions of three circles. Each circle holds four bits and must contain an even number of 1s; a circle that does not is red. Top right: sent and received bits by position. Bottom right: the distance from the received word to each of the 16 codewords; the sent one is green, and the decoder picks the nearest. Below: block error rate with and without the code.</div>
  <p>Four data bits get three parity bits, a rate of 4/7. Each parity bit makes its circle even. If one bit flips, exactly the circles containing it become odd, and every position is in a different set of circles, so the odd circles point to the culprit.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>s</mi><mo>=</mo><mo stretchy="false">(</mo><msub><mi>s</mi><mn>4</mn></msub><msub><mi>s</mi><mn>2</mn></msub><msub><mi>s</mi><mn>1</mn></msub><msub><mo stretchy="false">)</mo><mn>2</mn></msub><mo>=</mo><mtext>position of the flipped bit</mtext><mo separator="true">,</mo><mspace width="2em"/><msub><mi>s</mi><mi>j</mi></msub><mo>=</mo><munder><mo>⨁</mo><mrow><mi>i</mi><mtext> </mtext><mo>:</mo><mtext> </mtext><mi>i</mi><mtext> </mtext><mi mathvariant="normal">&amp;</mi><mtext> </mtext><mi>j</mi></mrow></munder><msub><mi>r</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">s=(s_4s_2s_1)_2=\text{position of the flipped bit},\qquad s_j=\bigoplus_{i\,:\,i\,\&amp;\,j}r_i</annotation></semantics></math></span></div>
  <ol class="steps"><li>Position i belongs to the circle j if bit j is set in the binary form of i (5 = 101: circles 1 and 4).</li><li>Parity bits sit at positions 1, 2 and 4, each in only its own circle.</li><li>The receiver recomputes the three checks; read as a binary number they give the syndrome.</li><li>Syndrome 0: accept. Otherwise flip the bit at that position.</li></ol>
  <div class="worked"><h4>Worked example</h4>Data 1011 gives codeword 0110011. Flip position 5: checks 1 and 4 fail, check 2 passes, syndrome 101 = 5, corrected.</div>
  <div class="pitfall"><h4>Common mistake</h4>Trusting the decoder with two errors. Every pair of codewords differs in at least 3 places, so one error can be corrected, but two errors land nearer to a different codeword and get "corrected" into a third error.</div>
  <div class="try"><h4>Try it</h4>Flip one data bit: the circles that contain it complain and point to it. Add a second flip: the decoder 'corrects' the wrong bit.</div>
</section>
<section data-case="hamming" data-example="one"><h3>Flip d₂</h3><p>Position 5 = 101: circles 1 and 4 turn red, circle 2 stays green. Only position 5 sits in exactly those two.</p></section>
<section data-case="hamming" data-example="parity"><h3>Flip p₄</h3><p>A parity bit can be hit too: only circle 4 complains, and the data are untouched.</p></section>
<section data-case="hamming" data-example="two"><h3>Two flips</h3><p>Positions 3 and 6 flip: the syndrome is 3 ⊕ 6 = 5, so the decoder flips position 5 as well and outputs wrong data. A distance-3 code corrects one error, not two.</p></section>
</template>
