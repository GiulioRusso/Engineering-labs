<template id="explain-function-explorer"><h2>Functions</h2>
<p>A function gives one output <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics></math></span> for each input <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span>. Drag the round handles: the graph, its equation and its key points follow.</p>
<section data-highlight="curve">
  <h3>Linear: a constant rate</h3>
  <p>Two points fix a line. Its slope is the rise over the run, the same everywhere.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>+</mo><mi>q</mi><mo separator="true">,</mo><mspace width="2em"/><mi>m</mi><mo>=</mo><mfrac><mrow><msub><mi>y</mi><mn>2</mn></msub><mo>−</mo><msub><mi>y</mi><mn>1</mn></msub></mrow><mrow><msub><mi>x</mi><mn>2</mn></msub><mo>−</mo><msub><mi>x</mi><mn>1</mn></msub></mrow></mfrac></mrow><annotation encoding="application/x-tex">y = m x + q, \qquad m = \frac{y_2 - y_1}{x_2 - x_1}</annotation></semantics></math></span></div>
</section>
<section data-highlight="points">
  <h3>Quadratic: a parabola</h3>
  <p>The vertex form shows the turning point <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>h</mi><mo separator="true">,</mo><mi>k</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(h, k)</annotation></semantics></math></span> directly; <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics></math></span> sets how steep and which way it opens. The discriminant counts the real roots.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>y</mi><mo>=</mo><mi>a</mi><mo stretchy="false">(</mo><mi>x</mi><mo>−</mo><mi>h</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo>+</mo><mi>k</mi><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="normal">Δ</mi><mo>=</mo><msup><mi>b</mi><mn>2</mn></msup><mo>−</mo><mn>4</mn><mi>a</mi><mi>c</mi><mo separator="true">,</mo><mspace width="2em"/><msub><mi>x</mi><mrow><mn>1</mn><mo separator="true">,</mo><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mo>−</mo><mi>b</mi><mo>±</mo><msqrt><mi mathvariant="normal">Δ</mi></msqrt></mrow><mrow><mn>2</mn><mi>a</mi></mrow></mfrac></mrow><annotation encoding="application/x-tex">y = a(x-h)^2 + k, \qquad \Delta = b^2 - 4ac, \qquad x_{1,2} = \frac{-b \pm \sqrt\Delta}{2a}</annotation></semantics></math></span></div>
</section>
<section data-highlight="inverse">
  <h3>Exponential and logarithm</h3>
  <p>An exponential multiplies by the same factor for every step in <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span>: it never reaches zero. The logarithm undoes it: its graph is the mirror image across <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi><mo>=</mo><mi>x</mi></mrow><annotation encoding="application/x-tex">y = x</annotation></semantics></math></span>.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>y</mi><mo>=</mo><mi>A</mi><mtext> </mtext><msup><mi>b</mi><mi>x</mi></msup><mspace width="1em"/><mo>⟺</mo><mspace width="1em"/><mi>x</mi><mo>=</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mi>b</mi></msub><mfrac><mi>y</mi><mi>A</mi></mfrac><mo separator="true">,</mo><mspace width="2em"/><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mi>b</mi></msub><mi>b</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">y = A\,b^x \quad\Longleftrightarrow\quad x = \log_b \frac{y}{A}, \qquad \log_b b = 1</annotation></semantics></math></span></div>
</section>
</template>
<template id="explain-unit-circle"><h2>The unit circle</h2>
<p>A point goes round a circle of radius 1. Its height is the sine of the angle, its horizontal position the cosine. Unroll the angle along a third axis and the point traces a helix whose shadows are the familiar waves.</p>
<section data-highlight="circle">
  <h3>Sine and cosine are coordinates</h3>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo><mo>=</mo><mo stretchy="false">(</mo><mi>cos</mi><mo>⁡</mo><mi>θ</mi><mo separator="true">,</mo><mtext> </mtext><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><msup><mrow><mi>cos</mi><mo>⁡</mo></mrow><mn>2</mn></msup><mi>θ</mi><mo>+</mo><msup><mrow><mi>sin</mi><mo>⁡</mo></mrow><mn>2</mn></msup><mi>θ</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">P(\theta) = (\cos\theta,\ \sin\theta), \qquad \cos^2\theta + \sin^2\theta = 1</annotation></semantics></math></span></div>
  <p>The identity is just Pythagoras on the right triangle under the point.</p>
</section>
<section data-highlight="helix">
  <h3>The helix and its shadows</h3>
  <p>Move the angle along the <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span> axis and the point draws a helix. Seen from the side it is the sine wave; seen from below, the cosine wave: the same motion, a quarter turn apart.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>cos</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mi>sin</mi><mo>⁡</mo><mtext> ⁣</mtext><mrow><mo fence="true">(</mo><mi>θ</mi><mo>+</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><mi>π</mi><mn>2</mn></mfrac></mstyle><mo fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">\cos\theta = \sin\!\left(\theta + \tfrac{\pi}{2}\right)</annotation></semantics></math></span></div>
</section>
<section data-highlight="tangent">
  <h3>The tangent</h3>
  <p>Extend the radius until it meets the vertical line <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">x = 1</annotation></semantics></math></span>: the height there is <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>tan</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding="application/x-tex">\tan\theta</annotation></semantics></math></span>. It blows up at <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>90</mn><mi mathvariant="normal">°</mi></mrow><annotation encoding="application/x-tex">90°</annotation></semantics></math></span>, where the radius is parallel to that line.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>tan</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mfrac><mrow><mi>sin</mi><mo>⁡</mo><mi>θ</mi></mrow><mrow><mi>cos</mi><mo>⁡</mo><mi>θ</mi></mrow></mfrac></mrow><annotation encoding="application/x-tex">\tan\theta = \frac{\sin\theta}{\cos\theta}</annotation></semantics></math></span></div>
</section>
<section data-highlight="radians">
  <h3>Radians</h3>
  <p>An angle in radians is the length of arc it cuts on the unit circle: a full turn is <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2</mn><mi>π</mi></mrow><annotation encoding="application/x-tex">2\pi</annotation></semantics></math></span>.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>θ</mi><mtext>rad</mtext></msub><mo>=</mo><msub><mi>θ</mi><mtext>deg</mtext></msub><mo>⋅</mo><mfrac><mi>π</mi><mn>180</mn></mfrac></mrow><annotation encoding="application/x-tex">\theta_{\text{rad}} = \theta_{\text{deg}}\cdot\frac{\pi}{180}</annotation></semantics></math></span></div>
</section>
</template>
<template id="explain-complex-plane"><h2>Complex numbers</h2>
<p>A complex number <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>z</mi><mo>=</mo><mi>a</mi><mo>+</mo><mi>b</mi><mi>i</mi></mrow><annotation encoding="application/x-tex">z = a + bi</annotation></semantics></math></span> is a point in the plane: real part across, imaginary part up. Every operation is a piece of geometry. Drag <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>z</mi></mrow><annotation encoding="application/x-tex">z</annotation></semantics></math></span> and <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>w</mi></mrow><annotation encoding="application/x-tex">w</annotation></semantics></math></span>.</p>
<section data-highlight="add">
  <h3>Adding is joining arrows</h3>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>z</mi><mo>+</mo><mi>w</mi><mo>=</mo><mo stretchy="false">(</mo><mi>a</mi><mo>+</mo><mi>c</mi><mo stretchy="false">)</mo><mo>+</mo><mo stretchy="false">(</mo><mi>b</mi><mo>+</mo><mi>d</mi><mo stretchy="false">)</mo><mtext> </mtext><mi>i</mi></mrow><annotation encoding="application/x-tex">z + w = (a + c) + (b + d)\,i</annotation></semantics></math></span></div>
  <p>The sum is the diagonal of the parallelogram built on the two arrows.</p>
</section>
<section data-highlight="mul">
  <h3>Multiplying is rotating and stretching</h3>
  <p>In polar form a number is a length and an angle. Multiplying multiplies the lengths and adds the angles; multiplying by <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics></math></span> is a quarter turn.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>z</mi><mo>=</mo><mi>r</mi><msup><mi>e</mi><mrow><mi>i</mi><mi>θ</mi></mrow></msup><mo separator="true">,</mo><mspace width="2em"/><mi>z</mi><mtext> </mtext><mi>w</mi><mo>=</mo><msub><mi>r</mi><mi>z</mi></msub><msub><mi>r</mi><mi>w</mi></msub><mtext> </mtext><msup><mi>e</mi><mrow><mi>i</mi><mo stretchy="false">(</mo><msub><mi>θ</mi><mi>z</mi></msub><mo>+</mo><msub><mi>θ</mi><mi>w</mi></msub><mo stretchy="false">)</mo></mrow></msup></mrow><annotation encoding="application/x-tex">z = r e^{i\theta}, \qquad z\,w = r_z r_w\, e^{i(\theta_z + \theta_w)}</annotation></semantics></math></span></div>
</section>
<section data-highlight="pow">
  <h3>Powers spiral</h3>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msup><mi>z</mi><mi>n</mi></msup><mo>=</mo><msup><mi>r</mi><mi>n</mi></msup><msup><mi>e</mi><mrow><mi>i</mi><mi>n</mi><mi>θ</mi></mrow></msup><mspace width="1em"/><mtext>(de Moivre)</mtext></mrow><annotation encoding="application/x-tex">z^n = r^n e^{i n\theta} \quad\text{(de Moivre)}</annotation></semantics></math></span></div>
  <p>If <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><mi>z</mi><mi mathvariant="normal">∣</mi><mo>&gt;</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">|z| &gt; 1</annotation></semantics></math></span> the powers spiral out, if <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><mi>z</mi><mi mathvariant="normal">∣</mi><mo>&lt;</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">|z| &lt; 1</annotation></semantics></math></span> they spiral in, and on the unit circle they just turn.</p>
</section>
<section data-highlight="roots">
  <h3>Roots sit on a regular polygon</h3>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mroot><mi>z</mi><mi>n</mi></mroot><mo>=</mo><msup><mi>r</mi><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mi>n</mi></mrow></msup><msup><mi>e</mi><mrow><mi>i</mi><mo stretchy="false">(</mo><mi>θ</mi><mo>+</mo><mn>2</mn><mi>π</mi><mi>k</mi><mo stretchy="false">)</mo><mi mathvariant="normal">/</mi><mi>n</mi></mrow></msup><mo separator="true">,</mo><mspace width="1em"/><mi>k</mi><mo>=</mo><mn>0</mn><mo separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><mi>n</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\sqrt[n]{z} = r^{1/n} e^{i(\theta + 2\pi k)/n}, \quad k = 0, \dots, n-1</annotation></semantics></math></span></div>
  <p>Every non-zero number has exactly <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span> different <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span>-th roots, evenly spaced around a circle. They add up to zero.</p>
</section>
</template>
<template id="explain-calculus"><h2>Derivative, integral, Taylor</h2>
<p>Three ideas built on one picture: a smooth curve, looked at very close up (derivative), added up in thin strips (integral), or copied by a polynomial (Taylor).</p>
<section data-highlight="derivative">
  <h3>The derivative is a limit of slopes</h3>
  <p>Draw a secant through <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>x</mi><mn>0</mn></msub></mrow><annotation encoding="application/x-tex">x_0</annotation></semantics></math></span> and <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>x</mi><mn>0</mn></msub><mo>+</mo><mi>h</mi></mrow><annotation encoding="application/x-tex">x_0 + h</annotation></semantics></math></span>. As <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>h</mi></mrow><annotation encoding="application/x-tex">h</annotation></semantics></math></span> shrinks, the secant turns into the tangent and its slope into the derivative.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msup><mi>f</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo stretchy="false">(</mo><msub><mi>x</mi><mn>0</mn></msub><mo stretchy="false">)</mo><mo>=</mo><munder><mrow><mi>lim</mi><mo>⁡</mo></mrow><mrow><mi>h</mi><mo>→</mo><mn>0</mn></mrow></munder><mfrac><mrow><mi>f</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mn>0</mn></msub><mo>+</mo><mi>h</mi><mo stretchy="false">)</mo><mo>−</mo><mi>f</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mn>0</mn></msub><mo stretchy="false">)</mo></mrow><mi>h</mi></mfrac></mrow><annotation encoding="application/x-tex">f&#x27;(x_0) = \lim_{h\to 0} \frac{f(x_0 + h) - f(x_0)}{h}</annotation></semantics></math></span></div>
</section>
<section data-highlight="integral">
  <h3>The integral is a limit of sums</h3>
  <p>Cut the area into <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span> strips and add their areas. More strips, smaller error. Taking the height at the strip's midpoint is much better than at its edge: the error falls like <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><msup><mi>n</mi><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">1/n^2</annotation></semantics></math></span> instead of <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mi>n</mi></mrow><annotation encoding="application/x-tex">1/n</annotation></semantics></math></span>.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msubsup><mo>∫</mo><mi>a</mi><mi>b</mi></msubsup><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mtext> </mtext><mi>d</mi><mi>x</mi><mo>=</mo><munder><mrow><mi>lim</mi><mo>⁡</mo></mrow><mrow><mi>n</mi><mo>→</mo><mi mathvariant="normal">∞</mi></mrow></munder><munderover><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mi>f</mi><mo stretchy="false">(</mo><msubsup><mi>x</mi><mi>i</mi><mo>∗</mo></msubsup><mo stretchy="false">)</mo><mtext> </mtext><mi mathvariant="normal">Δ</mi><mi>x</mi><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="normal">Δ</mi><mi>x</mi><mo>=</mo><mfrac><mrow><mi>b</mi><mo>−</mo><mi>a</mi></mrow><mi>n</mi></mfrac></mrow><annotation encoding="application/x-tex">\int_a^b f(x)\,dx = \lim_{n\to\infty} \sum_{i=1}^{n} f(x_i^*)\,\Delta x, \qquad \Delta x = \frac{b-a}{n}</annotation></semantics></math></span></div>
</section>
<section data-highlight="taylor">
  <h3>Taylor: a polynomial that copies the curve</h3>
  <p>Match the value, the slope, the curvature… at one point. Each extra term hugs the curve over a wider range.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>T</mi><mi>N</mi></msub><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><munderover><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mi>N</mi></munderover><mfrac><mrow><msup><mi>f</mi><mrow><mo stretchy="false">(</mo><mi>n</mi><mo stretchy="false">)</mo></mrow></msup><mo stretchy="false">(</mo><msub><mi>x</mi><mn>0</mn></msub><mo stretchy="false">)</mo></mrow><mrow><mi>n</mi><mo stretchy="false">!</mo></mrow></mfrac><mo stretchy="false">(</mo><mi>x</mi><mo>−</mo><msub><mi>x</mi><mn>0</mn></msub><msup><mo stretchy="false">)</mo><mi>n</mi></msup></mrow><annotation encoding="application/x-tex">T_N(x) = \sum_{n=0}^{N} \frac{f^{(n)}(x_0)}{n!}(x - x_0)^n</annotation></semantics></math></span></div>
</section>
</template>
<template id="explain-linear-maps"><h2>Linear maps on the unit cube</h2>
<p>A <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>3</mn><mo>×</mo><mn>3</mn></mrow><annotation encoding="application/x-tex">3\times3</annotation></semantics></math></span> matrix moves every point of space. Its columns are where the three unit vectors land, and that is enough to know where everything else goes. Drag the tips of the three coloured arrows.</p>
<section data-highlight="columns">
  <h3>Columns are the images of the axes</h3>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>A</mi><mtext> </mtext><msub><mi mathvariant="bold">e</mi><mn>1</mn></msub><mo>=</mo><msub><mi mathvariant="bold">c</mi><mn>1</mn></msub><mo separator="true">,</mo><mspace width="1em"/><mi>A</mi><mtext> </mtext><msub><mi mathvariant="bold">e</mi><mn>2</mn></msub><mo>=</mo><msub><mi mathvariant="bold">c</mi><mn>2</mn></msub><mo separator="true">,</mo><mspace width="1em"/><mi>A</mi><mtext> </mtext><msub><mi mathvariant="bold">e</mi><mn>3</mn></msub><mo>=</mo><msub><mi mathvariant="bold">c</mi><mn>3</mn></msub><mo separator="true">,</mo><mspace width="2em"/><mi>A</mi><mi mathvariant="bold">x</mi><mo>=</mo><msub><mi>x</mi><mn>1</mn></msub><msub><mi mathvariant="bold">c</mi><mn>1</mn></msub><mo>+</mo><msub><mi>x</mi><mn>2</mn></msub><msub><mi mathvariant="bold">c</mi><mn>2</mn></msub><mo>+</mo><msub><mi>x</mi><mn>3</mn></msub><msub><mi mathvariant="bold">c</mi><mn>3</mn></msub></mrow><annotation encoding="application/x-tex">A\,\mathbf e_1 = \mathbf c_1,\quad A\,\mathbf e_2 = \mathbf c_2,\quad A\,\mathbf e_3 = \mathbf c_3, \qquad A\mathbf x = x_1\mathbf c_1 + x_2\mathbf c_2 + x_3\mathbf c_3</annotation></semantics></math></span></div>
</section>
<section data-highlight="det">
  <h3>The determinant is a volume</h3>
  <p>The unit cube becomes a parallelepiped. Its signed volume is the determinant: negative if the map turns space inside out, zero if it flattens it (then the matrix has no inverse).</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>det</mi><mo>⁡</mo><mi>A</mi><mo>=</mo><msub><mi mathvariant="bold">c</mi><mn>1</mn></msub><mo>⋅</mo><mo stretchy="false">(</mo><msub><mi mathvariant="bold">c</mi><mn>2</mn></msub><mo>×</mo><msub><mi mathvariant="bold">c</mi><mn>3</mn></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\det A = \mathbf c_1 \cdot (\mathbf c_2 \times \mathbf c_3)</annotation></semantics></math></span></div>
</section>
<section data-highlight="eigen">
  <h3>Eigenvectors keep their direction</h3>
  <p>Most vectors are turned by the map. An eigenvector is only stretched, by the factor <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>λ</mi></mrow><annotation encoding="application/x-tex">\lambda</annotation></semantics></math></span>. A rotation has just one: its axis.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>A</mi><mi mathvariant="bold">v</mi><mo>=</mo><mi>λ</mi><mi mathvariant="bold">v</mi><mo separator="true">,</mo><mspace width="2em"/><mi>det</mi><mo>⁡</mo><mo stretchy="false">(</mo><mi>A</mi><mo>−</mo><mi>λ</mi><mi>I</mi><mo stretchy="false">)</mo><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">A\mathbf v = \lambda \mathbf v, \qquad \det(A - \lambda I) = 0</annotation></semantics></math></span></div>
</section>
</template>
<template id="explain-surfaces-gradient"><h2>Surfaces and the gradient</h2>
<p>A function of two variables is a landscape: height <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>z</mi><mo>=</mo><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo separator="true">,</mo><mi>y</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">z = f(x, y)</annotation></semantics></math></span> over the floor. Drag the point to walk on it.</p>
<section data-highlight="gradient">
  <h3>The gradient points uphill</h3>
  <p>Its components are the slopes in the <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span> and <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics></math></span> directions. Together they point the way the ground rises fastest, and their length is that steepest slope.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="normal">∇</mi><mi>f</mi><mo>=</mo><mrow><mo fence="true">(</mo><mfrac><mrow><mi mathvariant="normal">∂</mi><mi>f</mi></mrow><mrow><mi mathvariant="normal">∂</mi><mi>x</mi></mrow></mfrac><mo separator="true">,</mo><mtext> </mtext><mfrac><mrow><mi mathvariant="normal">∂</mi><mi>f</mi></mrow><mrow><mi mathvariant="normal">∂</mi><mi>y</mi></mrow></mfrac><mo fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">\nabla f = \left(\frac{\partial f}{\partial x},\ \frac{\partial f}{\partial y}\right)</annotation></semantics></math></span></div>
</section>
<section data-highlight="contours">
  <h3>…and it is perpendicular to the level curves</h3>
  <p>Walking along a contour line keeps the height constant, so the slope along it is zero: the gradient has no component along the contour.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="normal">∇</mi><mi>f</mi><mo>⋅</mo><mi mathvariant="bold">t</mi><mo>=</mo><mn>0</mn><mspace width="1em"/><mtext>for any </mtext><mi mathvariant="bold">t</mi><mtext> tangent to </mtext><mi>f</mi><mo>=</mo><mtext>const</mtext></mrow><annotation encoding="application/x-tex">\nabla f \cdot \mathbf t = 0 \quad\text{for any } \mathbf t \text{ tangent to } f = \text{const}</annotation></semantics></math></span></div>
</section>
<section data-highlight="plane">
  <h3>The tangent plane</h3>
  <p>Close to the point the surface is almost flat. The best flat approximation uses the value and the gradient there. Its error grows like the square of the distance.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>z</mi><mo>≈</mo><mi>f</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mn>0</mn></msub><mo separator="true">,</mo><msub><mi>y</mi><mn>0</mn></msub><mo stretchy="false">)</mo><mo>+</mo><mi mathvariant="normal">∇</mi><mi>f</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mn>0</mn></msub><mo separator="true">,</mo><msub><mi>y</mi><mn>0</mn></msub><mo stretchy="false">)</mo><mo>⋅</mo><mo stretchy="false">(</mo><mi>x</mi><mo>−</mo><msub><mi>x</mi><mn>0</mn></msub><mo separator="true">,</mo><mtext> </mtext><mi>y</mi><mo>−</mo><msub><mi>y</mi><mn>0</mn></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">z \approx f(x_0, y_0) + \nabla f(x_0, y_0)\cdot(x - x_0,\ y - y_0)</annotation></semantics></math></span></div>
</section>
</template>
