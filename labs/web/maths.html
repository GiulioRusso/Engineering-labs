<section data-case="taylor" data-example="n9"><h3>Order 9</h3><p>Five terms of <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi><mo>−</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><msup><mi>x</mi><mn>3</mn></msup><mrow><mn>3</mn><mo stretchy="false">!</mo></mrow></mfrac></mstyle><mo>+</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><msup><mi>x</mi><mn>5</mn></msup><mrow><mn>5</mn><mo stretchy="false">!</mo></mrow></mfrac></mstyle><mo>−</mo><mo>…</mo></mrow><annotation encoding="application/x-tex">x - \tfrac{x^3}{3!} + \tfrac{x^5}{5!} - \dots</annotation></semantics></math></span> follow the sine for more than a full half-wave. The series converges for every <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span>.</p></section>
<section data-case="taylor" data-example="exp"><h3>Exponential</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>e</mi><mrow><mi>x</mi><mi mathvariant="normal">/</mi><mn>2</mn></mrow></msup><mo>=</mo><mo>∑</mo><mo stretchy="false">(</mo><mi>x</mi><mi mathvariant="normal">/</mi><mn>2</mn><msup><mo stretchy="false">)</mo><mi>n</mi></msup><mi mathvariant="normal">/</mi><mi>n</mi><mo stretchy="false">!</mo></mrow><annotation encoding="application/x-tex">e^{x/2} = \sum (x/2)^n / n!</annotation></semantics></math></span>: all terms positive, the fit improves fastest on the right.</p></section>
<section data-case="taylor" data-example="fail"><h3>Far from the centre</h3><p>Near <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>x</mi><mn>0</mn></msub></mrow><annotation encoding="application/x-tex">x_0</annotation></semantics></math></span> the polynomial is excellent, but a polynomial must eventually shoot off to <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>±</mo><mi mathvariant="normal">∞</mi></mrow><annotation encoding="application/x-tex">\pm\infty</annotation></semantics></math></span> while the bell curve goes to 0. More terms widen the good region slowly.</p></section>
</template>
<template id="explain-matrices"><section data-case="stretch rotation shear reflection projection general">
  <p>A <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>3</mn><mo>×</mo><mn>3</mn></mrow><annotation encoding="application/x-tex">3\times3</annotation></semantics></math></span> matrix moves every point of space. Its columns are where the three unit vectors land (red, green, blue arrows), and that is enough to know where everything goes. Drag the arrow tips. The cube's volume is <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>det</mi><mo>⁡</mo><mi>A</mi></mrow><annotation encoding="application/x-tex">\det A</annotation></semantics></math></span>; yellow lines are eigenvectors.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>A</mi><mi mathvariant="bold">x</mi><mo>=</mo><msub><mi>x</mi><mn>1</mn></msub><msub><mi mathvariant="bold">c</mi><mn>1</mn></msub><mo>+</mo><msub><mi>x</mi><mn>2</mn></msub><msub><mi mathvariant="bold">c</mi><mn>2</mn></msub><mo>+</mo><msub><mi>x</mi><mn>3</mn></msub><msub><mi mathvariant="bold">c</mi><mn>3</mn></msub><mo separator="true">,</mo><mspace width="2em"/><mi>det</mi><mo>⁡</mo><mi>A</mi><mo>=</mo><msub><mi mathvariant="bold">c</mi><mn>1</mn></msub><mo>⋅</mo><mo stretchy="false">(</mo><msub><mi mathvariant="bold">c</mi><mn>2</mn></msub><mo>×</mo><msub><mi mathvariant="bold">c</mi><mn>3</mn></msub><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><mi>A</mi><mi mathvariant="bold">v</mi><mo>=</mo><mi>λ</mi><mi mathvariant="bold">v</mi></mrow><annotation encoding="application/x-tex">A\mathbf x = x_1\mathbf c_1 + x_2\mathbf c_2 + x_3\mathbf c_3, \qquad \det A = \mathbf c_1\cdot(\mathbf c_2\times\mathbf c_3), \qquad A\mathbf v = \lambda\mathbf v</annotation></semantics></math></span></div>
</section>
<section data-case="stretch"><h3>Stretch</h3><p>A diagonal matrix scales each axis by its own factor. The axes are the eigenvectors, the factors the eigenvalues, the volume their product.</p></section>
<section data-case="stretch" data-example="identity"><h3>Identity</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>I</mi></mrow><annotation encoding="application/x-tex">I</annotation></semantics></math></span> leaves every point where it is: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>det</mi><mo>⁡</mo><mi>I</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\det I = 1</annotation></semantics></math></span>, every vector is an eigenvector with <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>λ</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\lambda = 1</annotation></semantics></math></span>.</p></section>
<section data-case="stretch" data-example="uniform"><h3>Uniform scale</h3><p>Every direction is stretched by 1.5, so every vector is an eigenvector. The volume grows by <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>1.5</mn><mn>3</mn></msup><mo>=</mo><mn>3.375</mn></mrow><annotation encoding="application/x-tex">1.5^3 = 3.375</annotation></semantics></math></span>.</p></section>
<section data-case="stretch" data-example="squash"><h3>Squash</h3><p>Only <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>z</mi></mrow><annotation encoding="application/x-tex">z</annotation></semantics></math></span> shrinks, to 0.3: the volume is 0.3.</p></section>
<section data-case="rotation"><h3>Rotation</h3><p>Lengths and angles are kept, so the volume stays 1. Only the axis keeps its direction: it is the one real eigenvector (<span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>λ</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\lambda = 1</annotation></semantics></math></span>).</p><div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>R</mi><mi>z</mi></msub><mo stretchy="false">(</mo><mi>φ</mi><mo stretchy="false">)</mo><mo>=</mo><mrow><mo fence="true">(</mo><mtable rowspacing="0.16em" columnalign="center center center" columnspacing="1em"><mtr><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mi>cos</mi><mo>⁡</mo><mi>φ</mi></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mo>−</mo><mi>sin</mi><mo>⁡</mo><mi>φ</mi></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mn>0</mn></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mi>sin</mi><mo>⁡</mo><mi>φ</mi></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mi>cos</mi><mo>⁡</mo><mi>φ</mi></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mn>0</mn></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="false"><mn>0</mn></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mn>0</mn></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mn>1</mn></mstyle></mtd></mtr></mtable><mo fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">R_z(\varphi) = \begin{pmatrix}\cos\varphi &amp; -\sin\varphi &amp; 0\\ \sin\varphi &amp; \cos\varphi &amp; 0\\ 0 &amp; 0 &amp; 1\end{pmatrix}</annotation></semantics></math></span></div></section>
<section data-case="rotation" data-example="r90"><h3>A quarter turn</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span> goes to <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics></math></span>, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics></math></span> to <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mi>x</mi></mrow><annotation encoding="application/x-tex">-x</annotation></semantics></math></span>. Two of the eigenvalues are complex, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>±</mo><mi>i</mi></mrow><annotation encoding="application/x-tex">\pm i</annotation></semantics></math></span>.</p></section>
<section data-case="rotation" data-example="r180"><h3>A half turn</h3><p>Now every vector in the <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi><mi>y</mi></mrow><annotation encoding="application/x-tex">xy</annotation></semantics></math></span> plane is flipped: eigenvalue <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">-1</annotation></semantics></math></span>, twice. Still <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>det</mi><mo>⁡</mo><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\det = 1</annotation></semantics></math></span>: turning is not mirroring.</p></section>
<section data-case="shear"><h3>Shear</h3><p>Layers slide over each other like a deck of cards. The volume does not change: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>det</mi><mo>⁡</mo><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\det = 1</annotation></semantics></math></span>.</p></section>
<section data-case="shear" data-example="small"><h3>Gentle shear</h3><p>The top of the cube moves 0.4 along <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span>. The <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span> axis is the only eigenvector.</p></section>
<section data-case="shear" data-example="two"><h3>Along z</h3><p>Higher layers slide diagonally; the floor stays fixed.</p></section>
<section data-case="reflection"><h3>Reflection</h3><p>A mirror flips one direction: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>det</mi><mo>⁡</mo><mo>=</mo><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\det = -1</annotation></semantics></math></span>, space turned inside out (a right hand becomes a left hand).</p></section>
<section data-case="reflection" data-example="floor"><h3>Mirror in the floor</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>z</mi><mo>→</mo><mo>−</mo><mi>z</mi></mrow><annotation encoding="application/x-tex">z \to -z</annotation></semantics></math></span>: the cube hangs below the floor.</p></section>
<section data-case="reflection" data-example="point"><h3>Through the origin</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mi>I</mi></mrow><annotation encoding="application/x-tex">-I</annotation></semantics></math></span> flips all three axes: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>det</mi><mo>⁡</mo><mo>=</mo><mo stretchy="false">(</mo><mo>−</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mn>3</mn></msup><mo>=</mo><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\det = (-1)^3 = -1</annotation></semantics></math></span>.</p></section>
<section data-case="projection"><h3>Projection</h3><p>Space is flattened onto a plane: the cube has no volume, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>det</mi><mo>⁡</mo><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\det = 0</annotation></semantics></math></span>. Information is lost, so there is no inverse.</p></section>
<section data-case="projection" data-example="floor"><h3>Straight down</h3><p>Every point drops to <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>z</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">z = 0</annotation></semantics></math></span>: the shadow at noon.</p></section>
<section data-case="projection" data-example="line"><h3>Onto a line</h3><p>Only one column is left: the whole space lands on the <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span> axis. The rank (dimension of the image) is 1.</p></section>
<section data-case="general"><h3>Any matrix</h3><p>This one is symmetric, so its three eigenvectors are real and at right angles: in that frame it is just a stretch.</p></section>
<section data-case="general" data-example="inverse"><h3>The inverse</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>A</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup></mrow><annotation encoding="application/x-tex">A^{-1}</annotation></semantics></math></span> undoes <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>A</mi></mrow><annotation encoding="application/x-tex">A</annotation></semantics></math></span>: its determinant is <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mi>det</mi><mo>⁡</mo><mi>A</mi></mrow><annotation encoding="application/x-tex">1/\det A</annotation></semantics></math></span> and it has the same eigenvectors with eigenvalues <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mi>λ</mi></mrow><annotation encoding="application/x-tex">1/\lambda</annotation></semantics></math></span>.</p></section>
</template>
<template id="explain-surfaces"><section data-case="bowl saddle hills ripple">
  <p>A function of two variables is a landscape: height <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>z</mi><mo>=</mo><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo separator="true">,</mo><mi>y</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">z = f(x, y)</annotation></semantics></math></span> over the floor. Drag the point to walk on it. The gradient (purple) points uphill and is perpendicular to the level curves; the tangent plane is the flat approximation at the point.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="normal">∇</mi><mi>f</mi><mo>=</mo><mrow><mo fence="true">(</mo><mfrac><mrow><mi mathvariant="normal">∂</mi><mi>f</mi></mrow><mrow><mi mathvariant="normal">∂</mi><mi>x</mi></mrow></mfrac><mo separator="true">,</mo><mtext> </mtext><mfrac><mrow><mi mathvariant="normal">∂</mi><mi>f</mi></mrow><mrow><mi mathvariant="normal">∂</mi><mi>y</mi></mrow></mfrac><mo fence="true">)</mo></mrow><mo separator="true">,</mo><mspace width="2em"/><mi>z</mi><mo>≈</mo><mi>f</mi><mo stretchy="false">(</mo><msub><mi mathvariant="bold">x</mi><mn>0</mn></msub><mo stretchy="false">)</mo><mo>+</mo><mi mathvariant="normal">∇</mi><mi>f</mi><mo stretchy="false">(</mo><msub><mi mathvariant="bold">x</mi><mn>0</mn></msub><mo stretchy="false">)</mo><mo>⋅</mo><mo stretchy="false">(</mo><mi mathvariant="bold">x</mi><mo>−</mo><msub><mi mathvariant="bold">x</mi><mn>0</mn></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\nabla f = \left(\frac{\partial f}{\partial x},\ \frac{\partial f}{\partial y}\right), \qquad z \approx f(\mathbf x_0) + \nabla f(\mathbf x_0)\cdot(\mathbf x - \mathbf x_0)</annotation></semantics></math></span></div>
</section>
<section data-case="bowl"><h3>Bowl</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>f</mi><mo>=</mo><mo stretchy="false">(</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo stretchy="false">)</mo><mi mathvariant="normal">/</mi><mn>4</mn></mrow><annotation encoding="application/x-tex">f = (x^2 + y^2)/4</annotation></semantics></math></span>: level curves are circles, the gradient <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>x</mi><mo separator="true">,</mo><mi>y</mi><mo stretchy="false">)</mo><mi mathvariant="normal">/</mi><mn>2</mn></mrow><annotation encoding="application/x-tex">(x, y)/2</annotation></semantics></math></span> points straight away from the bottom and grows with the distance.</p></section>
<section data-case="bowl" data-example="bottom"><h3>At the bottom</h3><p>The tangent plane is horizontal: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∇</mi><mi>f</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\nabla f = 0</annotation></semantics></math></span>. A point where the gradient vanishes is a critical point; here it is a minimum.</p></section>
<section data-case="bowl" data-example="far"><h3>Far out</h3><p>Twice as far, twice as steep: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><mi mathvariant="normal">∇</mi><mi>f</mi><mi mathvariant="normal">∣</mi><mo>=</mo><mi>r</mi><mi mathvariant="normal">/</mi><mn>2</mn></mrow><annotation encoding="application/x-tex">|\nabla f| = r/2</annotation></semantics></math></span>.</p></section>
<section data-case="saddle"><h3>Saddle</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>f</mi><mo>=</mo><mo stretchy="false">(</mo><msup><mi>x</mi><mn>2</mn></msup><mo>−</mo><msup><mi>y</mi><mn>2</mn></msup><mo stretchy="false">)</mo><mi mathvariant="normal">/</mi><mn>4</mn></mrow><annotation encoding="application/x-tex">f = (x^2 - y^2)/4</annotation></semantics></math></span>: up along <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span>, down along <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics></math></span>. The level curves are hyperbolas.</p></section>
<section data-case="saddle" data-example="centre"><h3>A saddle point</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∇</mi><mi>f</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\nabla f = 0</annotation></semantics></math></span> and the tangent plane is flat, yet it is neither a top nor a bottom: a critical point need not be an extremum.</p></section>
<section data-case="saddle" data-example="x"><h3>Along x</h3><p>On the <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span> axis <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>f</mi><mo>=</mo><msup><mi>x</mi><mn>2</mn></msup><mi mathvariant="normal">/</mi><mn>4</mn></mrow><annotation encoding="application/x-tex">f = x^2/4</annotation></semantics></math></span>: the gradient points along <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>+</mo><mi>x</mi></mrow><annotation encoding="application/x-tex">+x</annotation></semantics></math></span>, away from the centre.</p></section>
<section data-case="saddle" data-example="y"><h3>Along y</h3><p>On the <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics></math></span> axis <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>f</mi><mo>=</mo><mo>−</mo><msup><mi>y</mi><mn>2</mn></msup><mi mathvariant="normal">/</mi><mn>4</mn></mrow><annotation encoding="application/x-tex">f = -y^2/4</annotation></semantics></math></span>: uphill is back towards the centre.</p></section>
<section data-case="hills"><h3>Hills and a valley</h3><p>Follow the gradient and you climb the nearest hill. The contour lines crowd where the ground is steep.</p></section>
<section data-case="hills" data-example="top"><h3>On a summit</h3><p>At the top of a hill <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∇</mi><mi>f</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\nabla f = 0</annotation></semantics></math></span>: every direction goes down. A local maximum.</p></section>
<section data-case="hills" data-example="valley"><h3>In the hollow</h3><p>At the bottom of the hollow, again <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∇</mi><mi>f</mi><mo>≈</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\nabla f \approx 0</annotation></semantics></math></span>: a local minimum.</p></section>
<section data-case="ripple"><h3>Ripple</h3><p>Circular level curves: the gradient is radial, pointing outward on a rising slope and inward on a falling one.</p></section>
<section data-case="ripple" data-example="trough"><h3>In the trough</h3><p>At the bottom of the first ring the gradient vanishes, and along the ring the height is constant: a whole circle of minima, not a single point.</p></section>
</template>
<template id="explain-vector-calculus"><section data-case="dot">
  <h3>The dot product</h3>
  <p>How much two vectors point the same way: the length of <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">a</mi></mrow><annotation encoding="application/x-tex">\mathbf a</annotation></semantics></math></span> times the shadow of <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">b</mi></mrow><annotation encoding="application/x-tex">\mathbf b</annotation></semantics></math></span> on it (green). A number, not a vector. Drag the tips of <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">a</mi></mrow><annotation encoding="application/x-tex">\mathbf a</annotation></semantics></math></span> and <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">b</mi></mrow><annotation encoding="application/x-tex">\mathbf b</annotation></semantics></math></span>.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="bold">a</mi><mo>⋅</mo><mi mathvariant="bold">b</mi><mo>=</mo><msub><mi>a</mi><mi>x</mi></msub><msub><mi>b</mi><mi>x</mi></msub><mo>+</mo><msub><mi>a</mi><mi>y</mi></msub><msub><mi>b</mi><mi>y</mi></msub><mo>+</mo><msub><mi>a</mi><mi>z</mi></msub><msub><mi>b</mi><mi>z</mi></msub><mo>=</mo><mi mathvariant="normal">∣</mi><mi mathvariant="bold">a</mi><mi mathvariant="normal">∣</mi><mi mathvariant="normal">∣</mi><mi mathvariant="bold">b</mi><mi mathvariant="normal">∣</mi><mi>cos</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding="application/x-tex">\mathbf a\cdot\mathbf b = a_x b_x + a_y b_y + a_z b_z = |\mathbf a||\mathbf b|\cos\theta</annotation></semantics></math></span></div>
</section>
<section data-case="dot" data-example="perp"><h3>Perpendicular</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>θ</mi><mo>=</mo><mn>90</mn><mi mathvariant="normal">°</mi></mrow><annotation encoding="application/x-tex">\theta = 90°</annotation></semantics></math></span>, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>cos</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\cos\theta = 0</annotation></semantics></math></span>: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">b</mi></mrow><annotation encoding="application/x-tex">\mathbf b</annotation></semantics></math></span> casts no shadow on <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">a</mi></mrow><annotation encoding="application/x-tex">\mathbf a</annotation></semantics></math></span>, so <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">a</mi><mo>⋅</mo><mi mathvariant="bold">b</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\mathbf a\cdot\mathbf b = 0</annotation></semantics></math></span>. This is the test for perpendicular vectors.</p></section>
<section data-case="dot" data-example="same"><h3>Same direction</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>θ</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\theta = 0</annotation></semantics></math></span>, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>cos</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\cos\theta = 1</annotation></semantics></math></span>: the dot product is as large as it can be, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><mi mathvariant="bold">a</mi><mi mathvariant="normal">∣</mi><mi mathvariant="normal">∣</mi><mi mathvariant="bold">b</mi><mi mathvariant="normal">∣</mi></mrow><annotation encoding="application/x-tex">|\mathbf a||\mathbf b|</annotation></semantics></math></span>.</p></section>
<section data-case="dot" data-example="obtuse"><h3>Obtuse angle</h3><p>Beyond 90° the shadow falls behind the origin: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>cos</mi><mo>⁡</mo><mi>θ</mi><mo>&lt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\cos\theta &lt; 0</annotation></semantics></math></span> and the dot product is negative.</p></section>
<section data-case="dot" data-example="opposite"><h3>Opposite</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>θ</mi><mo>=</mo><mn>180</mn><mi mathvariant="normal">°</mi></mrow><annotation encoding="application/x-tex">\theta = 180°</annotation></semantics></math></span>: the most negative value, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mi mathvariant="normal">∣</mi><mi mathvariant="bold">a</mi><mi mathvariant="normal">∣</mi><mi mathvariant="normal">∣</mi><mi mathvariant="bold">b</mi><mi mathvariant="normal">∣</mi></mrow><annotation encoding="application/x-tex">-|\mathbf a||\mathbf b|</annotation></semantics></math></span>.</p></section>

<section data-case="cross">
  <h3>The cross product</h3>
  <p>A vector at right angles to both <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">a</mi></mrow><annotation encoding="application/x-tex">\mathbf a</annotation></semantics></math></span> and <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">b</mi></mrow><annotation encoding="application/x-tex">\mathbf b</annotation></semantics></math></span>, as long as the area of the parallelogram they span. Its direction follows the right-hand rule.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="normal">∣</mi><mi mathvariant="bold">a</mi><mo>×</mo><mi mathvariant="bold">b</mi><mi mathvariant="normal">∣</mi><mo>=</mo><mi mathvariant="normal">∣</mi><mi mathvariant="bold">a</mi><mi mathvariant="normal">∣</mi><mi mathvariant="normal">∣</mi><mi mathvariant="bold">b</mi><mi mathvariant="normal">∣</mi><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="bold">a</mi><mo>×</mo><mi mathvariant="bold">b</mi><mo>=</mo><mo>−</mo><mtext> </mtext><mi mathvariant="bold">b</mi><mo>×</mo><mi mathvariant="bold">a</mi></mrow><annotation encoding="application/x-tex">|\mathbf a\times\mathbf b| = |\mathbf a||\mathbf b|\sin\theta, \qquad \mathbf a\times\mathbf b = -\,\mathbf b\times\mathbf a</annotation></semantics></math></span></div>
</section>
<section data-case="cross" data-example="axes"><h3>The axes</h3><p>Unit vectors along <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span> and <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics></math></span>: the square they span has area 1 and the cross product is the unit vector along <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>z</mi></mrow><annotation encoding="application/x-tex">z</annotation></semantics></math></span>.</p></section>
<section data-case="cross" data-example="perp"><h3>At 90°</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\sin\theta = 1</annotation></semantics></math></span>: the parallelogram is a rectangle, the area is largest.</p></section>
<section data-case="cross" data-example="parallel"><h3>Parallel</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\sin\theta = 0</annotation></semantics></math></span>: the parallelogram is flat, the cross product is the zero vector.</p></section>
<section data-case="cross" data-example="swap"><h3>Order matters</h3><p>Swapping the vectors flips the result: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">b</mi><mo>×</mo><mi mathvariant="bold">a</mi><mo>=</mo><mo>−</mo><mi mathvariant="bold">a</mi><mo>×</mo><mi mathvariant="bold">b</mi></mrow><annotation encoding="application/x-tex">\mathbf b\times\mathbf a = -\mathbf a\times\mathbf b</annotation></semantics></math></span>. Curl the fingers of the right hand from the first to the second: the thumb gives the direction.</p></section>

<section data-case="gravity">
  <h3>A gravitational field</h3>
  <p>Every point of space gets an arrow: the pull a 1 kg test mass would feel there. Fields of several masses simply add. Drag the masses and the probe.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="bold">g</mi><mo>=</mo><mo>−</mo><munder><mo>∑</mo><mi>i</mi></munder><mfrac><mrow><mi>G</mi><msub><mi>M</mi><mi>i</mi></msub></mrow><msubsup><mi>r</mi><mi>i</mi><mn>2</mn></msubsup></mfrac><mtext> </mtext><msub><mover accent="true"><mi mathvariant="bold">r</mi><mo>^</mo></mover><mi>i</mi></msub><mo>=</mo><mo>−</mo><mi mathvariant="normal">∇</mi><mi>V</mi><mo separator="true">,</mo><mspace width="2em"/><mi>V</mi><mo>=</mo><mo>−</mo><munder><mo>∑</mo><mi>i</mi></munder><mfrac><mrow><mi>G</mi><msub><mi>M</mi><mi>i</mi></msub></mrow><msub><mi>r</mi><mi>i</mi></msub></mfrac></mrow><annotation encoding="application/x-tex">\mathbf g = -\sum_i \frac{G M_i}{r_i^2}\,\hat{\mathbf r}_i = -\nabla V, \qquad V = -\sum_i \frac{G M_i}{r_i}</annotation></semantics></math></span></div>
</section>
<section data-case="gravity" data-example="equal"><h3>Equal masses</h3><p>Midway between them the two pulls are equal and opposite: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">g</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\mathbf g = 0</annotation></semantics></math></span>. A body placed there stays (but any nudge sends it to one side).</p></section>
<section data-case="gravity" data-example="unequal"><h3>Unequal masses</h3><p>The point where the pulls cancel moves towards the small mass: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>M</mi><mn>1</mn></msub><mi mathvariant="normal">/</mi><msubsup><mi>r</mi><mn>1</mn><mn>2</mn></msubsup><mo>=</mo><msub><mi>M</mi><mn>2</mn></msub><mi mathvariant="normal">/</mi><msubsup><mi>r</mi><mn>2</mn><mn>2</mn></msubsup></mrow><annotation encoding="application/x-tex">M_1/r_1^2 = M_2/r_2^2</annotation></semantics></math></span>.</p></section>
<section data-case="gravity" data-example="far"><h3>Far away</h3><p>Seen from far, the two masses act like one mass <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>M</mi><mn>1</mn></msub><mo>+</mo><msub><mi>M</mi><mn>2</mn></msub></mrow><annotation encoding="application/x-tex">M_1 + M_2</annotation></semantics></math></span> at their centre of mass.</p></section>

<section data-case="div">
  <h3>Divergence</h3>
  <p>Put a tiny circle in the flow. The net flow out of it, per unit area, is the divergence: a source (<span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">&gt; 0</annotation></semantics></math></span>) or a sink (<span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>&lt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">&lt; 0</annotation></semantics></math></span>). The tracer dots spread out or crowd in. Drag the circle.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="normal">∇</mi><mo>⋅</mo><mi mathvariant="bold">F</mi><mo>=</mo><mfrac><mrow><mi mathvariant="normal">∂</mi><msub><mi>F</mi><mi>x</mi></msub></mrow><mrow><mi mathvariant="normal">∂</mi><mi>x</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mi mathvariant="normal">∂</mi><msub><mi>F</mi><mi>y</mi></msub></mrow><mrow><mi mathvariant="normal">∂</mi><mi>y</mi></mrow></mfrac><mo>=</mo><munder><mrow><mi>lim</mi><mo>⁡</mo></mrow><mrow><mi>A</mi><mo>→</mo><mn>0</mn></mrow></munder><mfrac><mn>1</mn><mi>A</mi></mfrac><mo>∮</mo><mi mathvariant="bold">F</mi><mo>⋅</mo><mover accent="true"><mi mathvariant="bold">n</mi><mo>^</mo></mover><mtext> </mtext><mi>d</mi><mi mathvariant="normal">ℓ</mi></mrow><annotation encoding="application/x-tex">\nabla\cdot\mathbf F = \frac{\partial F_x}{\partial x} + \frac{\partial F_y}{\partial y} = \lim_{A\to 0}\frac{1}{A}\oint \mathbf F\cdot\hat{\mathbf n}\,d\ell</annotation></semantics></math></span></div>
</section>
<section data-case="div" data-example="sink"><h3>A sink</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">F</mi><mo>=</mo><mo>−</mo><mo stretchy="false">(</mo><mi>x</mi><mo separator="true">,</mo><mi>y</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\mathbf F = -(x, y)</annotation></semantics></math></span>: everything flows inwards, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∇</mi><mo>⋅</mo><mi mathvariant="bold">F</mi><mo>=</mo><mo>−</mo><mn>2</mn></mrow><annotation encoding="application/x-tex">\nabla\cdot\mathbf F = -2</annotation></semantics></math></span> everywhere.</p></section>
<section data-case="div" data-example="vortex"><h3>A vortex</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">F</mi><mo>=</mo><mo stretchy="false">(</mo><mo>−</mo><mi>y</mi><mo separator="true">,</mo><mi>x</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\mathbf F = (-y, x)</annotation></semantics></math></span> only goes round: as much flows in as out of any circle, so the divergence is 0.</p></section>
<section data-case="div" data-example="bump"><h3>Changing sign</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">F</mi><mo>=</mo><mo stretchy="false">(</mo><mi>x</mi><mo separator="true">,</mo><mi>y</mi><mo stretchy="false">)</mo><msup><mi>e</mi><mrow><mo>−</mo><msup><mi>r</mi><mn>2</mn></msup></mrow></msup></mrow><annotation encoding="application/x-tex">\mathbf F = (x, y)e^{-r^2}</annotation></semantics></math></span> spreads near the centre (div <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">&gt; 0</annotation></semantics></math></span>) but slows down further out, so there the dots crowd (div <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>&lt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">&lt; 0</annotation></semantics></math></span>). The sign changes at <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>r</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">r = 1</annotation></semantics></math></span>.</p></section>

<section data-case="curl">
  <h3>Curl</h3>
  <p>The flow around the tiny circle, per unit area: would a little paddle wheel spin? The tracer dots turn.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mo stretchy="false">(</mo><mi mathvariant="normal">∇</mi><mo>×</mo><mi mathvariant="bold">F</mi><msub><mo stretchy="false">)</mo><mi>z</mi></msub><mo>=</mo><mfrac><mrow><mi mathvariant="normal">∂</mi><msub><mi>F</mi><mi>y</mi></msub></mrow><mrow><mi mathvariant="normal">∂</mi><mi>x</mi></mrow></mfrac><mo>−</mo><mfrac><mrow><mi mathvariant="normal">∂</mi><msub><mi>F</mi><mi>x</mi></msub></mrow><mrow><mi mathvariant="normal">∂</mi><mi>y</mi></mrow></mfrac><mo>=</mo><munder><mrow><mi>lim</mi><mo>⁡</mo></mrow><mrow><mi>A</mi><mo>→</mo><mn>0</mn></mrow></munder><mfrac><mn>1</mn><mi>A</mi></mfrac><mo>∮</mo><mi mathvariant="bold">F</mi><mo>⋅</mo><mi>d</mi><mi mathvariant="bold">ℓ</mi></mrow><annotation encoding="application/x-tex">(\nabla\times\mathbf F)_z = \frac{\partial F_y}{\partial x} - \frac{\partial F_x}{\partial y} = \lim_{A\to 0}\frac{1}{A}\oint \mathbf F\cdot d\boldsymbol\ell</annotation></semantics></math></span></div>
</section>
<section data-case="curl" data-example="source"><h3>A source</h3><p>Straight out from the centre: nothing goes round, the curl is 0.</p></section>
<section data-case="curl" data-example="shear"><h3>Shear</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">F</mi><mo>=</mo><mo stretchy="false">(</mo><mi>y</mi><mo separator="true">,</mo><mn>0</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\mathbf F = (y, 0)</annotation></semantics></math></span>: all streamlines are straight, yet the top moves faster than the bottom, so a paddle wheel turns. Curl <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>=</mo><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">= -1</annotation></semantics></math></span>.</p></section>
<section data-case="curl" data-example="spiral"><h3>A spiral</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">F</mi><mo>=</mo><mo stretchy="false">(</mo><mi>x</mi><mo>−</mo><mi>y</mi><mo separator="true">,</mo><mi>x</mi><mo>+</mo><mi>y</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\mathbf F = (x - y, x + y)</annotation></semantics></math></span> both spreads and turns: divergence 2 and curl 2.</p></section>
