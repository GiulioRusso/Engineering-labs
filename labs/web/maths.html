<template id="explain-functions"><section data-case="line">
  <h3>The line</h3>
  <p>Two points fix a line. The slope <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>m</mi></mrow><annotation encoding="application/x-tex">m</annotation></semantics></math></span> is rise over run, the same everywhere; <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>q</mi></mrow><annotation encoding="application/x-tex">q</annotation></semantics></math></span> is where it crosses the <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics></math></span> axis. Drag the two handles.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>+</mo><mi>q</mi><mo separator="true">,</mo><mspace width="2em"/><mi>m</mi><mo>=</mo><mfrac><mrow><msub><mi>y</mi><mn>2</mn></msub><mo>−</mo><msub><mi>y</mi><mn>1</mn></msub></mrow><mrow><msub><mi>x</mi><mn>2</mn></msub><mo>−</mo><msub><mi>x</mi><mn>1</mn></msub></mrow></mfrac></mrow><annotation encoding="application/x-tex">y = m x + q, \qquad m = \frac{y_2 - y_1}{x_2 - x_1}</annotation></semantics></math></span></div>
</section>
<section data-case="line" data-example="flat"><h3>Slope zero</h3><p>Same height at both points: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>m</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">m = 0</annotation></semantics></math></span>, the line is horizontal, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi><mo>=</mo><mi>q</mi></mrow><annotation encoding="application/x-tex">y = q</annotation></semantics></math></span>. It never crosses the <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span> axis unless <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>q</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">q = 0</annotation></semantics></math></span>.</p></section>
<section data-case="line" data-example="origin"><h3>Through the origin</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>q</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">q = 0</annotation></semantics></math></span>: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi></mrow><annotation encoding="application/x-tex">y = m x</annotation></semantics></math></span>. Doubling <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span> doubles <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics></math></span>: direct proportion.</p></section>
<section data-case="line" data-example="down"><h3>Negative slope</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>m</mi><mo>&lt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">m &lt; 0</annotation></semantics></math></span>: the line falls to the right. The root is at <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi><mo>=</mo><mo>−</mo><mi>q</mi><mi mathvariant="normal">/</mi><mi>m</mi></mrow><annotation encoding="application/x-tex">x = -q/m</annotation></semantics></math></span>.</p></section>
<section data-case="line" data-example="steep"><h3>Steep</h3><p>One step right, four steps up: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>m</mi><mo>=</mo><mn>4</mn></mrow><annotation encoding="application/x-tex">m = 4</annotation></semantics></math></span>. The bigger <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><mi>m</mi><mi mathvariant="normal">∣</mi></mrow><annotation encoding="application/x-tex">|m|</annotation></semantics></math></span>, the steeper.</p></section>

<section data-case="parabola">
  <h3>The parabola</h3>
  <p>The vertex form shows the turning point <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>h</mi><mo separator="true">,</mo><mi>k</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(h, k)</annotation></semantics></math></span>; <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics></math></span> sets the opening. Drag the vertex. The discriminant <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Δ</mi></mrow><annotation encoding="application/x-tex">\Delta</annotation></semantics></math></span> counts the real roots.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>y</mi><mo>=</mo><mi>a</mi><mo stretchy="false">(</mo><mi>x</mi><mo>−</mo><mi>h</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo>+</mo><mi>k</mi><mo>=</mo><mi>a</mi><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>b</mi><mi>x</mi><mo>+</mo><mi>c</mi><mo separator="true">,</mo><mspace width="2em"/><msub><mi>x</mi><mrow><mn>1</mn><mo separator="true">,</mo><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mo>−</mo><mi>b</mi><mo>±</mo><msqrt><mi mathvariant="normal">Δ</mi></msqrt></mrow><mrow><mn>2</mn><mi>a</mi></mrow></mfrac><mo separator="true">,</mo><mspace width="1em"/><mi mathvariant="normal">Δ</mi><mo>=</mo><msup><mi>b</mi><mn>2</mn></msup><mo>−</mo><mn>4</mn><mi>a</mi><mi>c</mi></mrow><annotation encoding="application/x-tex">y = a(x-h)^2 + k = a x^2 + b x + c, \qquad x_{1,2} = \frac{-b \pm \sqrt\Delta}{2a}, \quad \Delta = b^2 - 4ac</annotation></semantics></math></span></div>
</section>
<section data-case="parabola" data-example="two"><h3>Two roots</h3><p>The vertex is below the axis and the parabola opens up, so it crosses twice: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Δ</mi><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\Delta &gt; 0</annotation></semantics></math></span>. Here <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi><mo>=</mo><msup><mi>x</mi><mn>2</mn></msup><mo>−</mo><mn>2</mn></mrow><annotation encoding="application/x-tex">y = x^2 - 2</annotation></semantics></math></span>, roots <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>±</mo><msqrt><mn>2</mn></msqrt></mrow><annotation encoding="application/x-tex">\pm\sqrt 2</annotation></semantics></math></span>.</p></section>
<section data-case="parabola" data-example="one"><h3>One root</h3><p>The vertex sits on the axis: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Δ</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\Delta = 0</annotation></semantics></math></span>, a double root at <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi><mo>=</mo><mi>h</mi></mrow><annotation encoding="application/x-tex">x = h</annotation></semantics></math></span>. Here <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi><mo>=</mo><mo stretchy="false">(</mo><mi>x</mi><mo>−</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">y = (x-1)^2</annotation></semantics></math></span>.</p></section>
<section data-case="parabola" data-example="none"><h3>No roots</h3><p>Vertex above the axis, opening up: the curve never reaches <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">y = 0</annotation></semantics></math></span>. <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Δ</mi><mo>&lt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\Delta &lt; 0</annotation></semantics></math></span>: the roots are complex.</p></section>
<section data-case="parabola" data-example="down"><h3>Opens down</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>a</mi><mo>&lt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">a &lt; 0</annotation></semantics></math></span> flips the parabola: the vertex is now a maximum.</p></section>
<section data-case="parabola" data-example="wide"><h3>Wider</h3><p>Small <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><mi>a</mi><mi mathvariant="normal">∣</mi></mrow><annotation encoding="application/x-tex">|a|</annotation></semantics></math></span>: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics></math></span> grows slowly away from the vertex, so the parabola is wide. Large <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><mi>a</mi><mi mathvariant="normal">∣</mi></mrow><annotation encoding="application/x-tex">|a|</annotation></semantics></math></span> makes it narrow.</p></section>

<section data-case="exponential">
  <h3>The exponential</h3>
  <p>Every step of 1 in <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span> multiplies <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics></math></span> by the same factor <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>b</mi></mrow><annotation encoding="application/x-tex">b</annotation></semantics></math></span>. It starts at <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>A</mi></mrow><annotation encoding="application/x-tex">A</annotation></semantics></math></span> for <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">x = 0</annotation></semantics></math></span> and never reaches zero: the <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span> axis is an asymptote.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>y</mi><mo>=</mo><mi>A</mi><mtext> </mtext><msup><mi>b</mi><mi>x</mi></msup><mo separator="true">,</mo><mspace width="2em"/><mi>y</mi><mo stretchy="false">(</mo><mi>x</mi><mo>+</mo><mn>1</mn><mo stretchy="false">)</mo><mo>=</mo><mi>b</mi><mtext> </mtext><mi>y</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">y = A\,b^x, \qquad y(x + 1) = b\,y(x)</annotation></semantics></math></span></div>
</section>
<section data-case="exponential" data-example="decay"><h3>Decay</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>0</mn><mo>&lt;</mo><mi>b</mi><mo>&lt;</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">0 &lt; b &lt; 1</annotation></semantics></math></span>: each step halves <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics></math></span> (here <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>b</mi><mo>=</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow><annotation encoding="application/x-tex">b = \tfrac12</annotation></semantics></math></span>). Same curve as <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>2</mn><mrow><mo>−</mo><mi>x</mi></mrow></msup></mrow><annotation encoding="application/x-tex">2^{-x}</annotation></semantics></math></span>: the growth curve mirrored left to right.</p></section>
<section data-case="exponential" data-example="e"><h3>Base e</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>e</mi><mo>≈</mo><mn>2.718</mn></mrow><annotation encoding="application/x-tex">e \approx 2.718</annotation></semantics></math></span> is the base whose curve has slope equal to its height at every point: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><msup><mi>e</mi><mi>x</mi></msup><msup><mo stretchy="false">)</mo><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo>=</mo><msup><mi>e</mi><mi>x</mi></msup></mrow><annotation encoding="application/x-tex">(e^x)&#x27; = e^x</annotation></semantics></math></span>.</p></section>
<section data-case="exponential" data-example="scale"><h3>Starting value</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>A</mi></mrow><annotation encoding="application/x-tex">A</annotation></semantics></math></span> is the value at <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">x = 0</annotation></semantics></math></span>. Changing it stretches the curve vertically; the doubling stays the same.</p></section>
<section data-case="exponential" data-example="inverse"><h3>The inverse</h3><p>Swap <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span> and <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics></math></span>: the mirror across <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi><mo>=</mo><mi>x</mi></mrow><annotation encoding="application/x-tex">y = x</annotation></semantics></math></span> is the logarithm. It answers “which power gives <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics></math></span>?”.</p><div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>y</mi><mo>=</mo><mi>A</mi><msup><mi>b</mi><mi>x</mi></msup><mtext>  </mtext><mo>⟺</mo><mtext>  </mtext><mi>x</mi><mo>=</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mi>b</mi></msub><mfrac><mi>y</mi><mi>A</mi></mfrac></mrow><annotation encoding="application/x-tex">y = A b^x \iff x = \log_b \frac{y}{A}</annotation></semantics></math></span></div></section>

<section data-case="logarithm">
  <h3>The logarithm</h3>
  <p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mi>b</mi></msub><mi>x</mi></mrow><annotation encoding="application/x-tex">\log_b x</annotation></semantics></math></span> is the power you raise <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>b</mi></mrow><annotation encoding="application/x-tex">b</annotation></semantics></math></span> to in order to get <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span>. It exists only for <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">x &gt; 0</annotation></semantics></math></span>, crosses the axis at <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">x = 1</annotation></semantics></math></span> and reaches 1 at <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi><mo>=</mo><mi>b</mi></mrow><annotation encoding="application/x-tex">x = b</annotation></semantics></math></span>: drag that handle.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>y</mi><mo>=</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mi>b</mi></msub><mi>x</mi><mtext>  </mtext><mo>⟺</mo><mtext>  </mtext><msup><mi>b</mi><mi>y</mi></msup><mo>=</mo><mi>x</mi><mo separator="true">,</mo><mspace width="2em"/><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mi>b</mi></msub><mo stretchy="false">(</mo><mi>x</mi><mi>y</mi><mo stretchy="false">)</mo><mo>=</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mi>b</mi></msub><mi>x</mi><mo>+</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mi>b</mi></msub><mi>y</mi></mrow><annotation encoding="application/x-tex">y = \log_b x \iff b^y = x, \qquad \log_b(xy) = \log_b x + \log_b y</annotation></semantics></math></span></div>
</section>
<section data-case="logarithm" data-example="ln"><h3>Natural logarithm</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ln</mi><mo>⁡</mo><mi>x</mi><mo>=</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mi>e</mi></msub><mi>x</mi></mrow><annotation encoding="application/x-tex">\ln x = \log_e x</annotation></semantics></math></span>, the inverse of <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>e</mi><mi>x</mi></msup></mrow><annotation encoding="application/x-tex">e^x</annotation></semantics></math></span>. Its slope at <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span> is <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mi>x</mi></mrow><annotation encoding="application/x-tex">1/x</annotation></semantics></math></span>.</p></section>
<section data-case="logarithm" data-example="below"><h3>Base below 1</h3><p>With <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>b</mi><mo>&lt;</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">b &lt; 1</annotation></semantics></math></span> the logarithm falls: bigger <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span> needs a more negative power of <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>b</mi></mrow><annotation encoding="application/x-tex">b</annotation></semantics></math></span>.</p></section>
<section data-case="logarithm" data-example="inverse"><h3>Mirror of the exponential</h3><p>The dashed curve is <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>2</mn><mi>x</mi></msup></mrow><annotation encoding="application/x-tex">2^x</annotation></semantics></math></span>, the mirror image across <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi><mo>=</mo><mi>x</mi></mrow><annotation encoding="application/x-tex">y = x</annotation></semantics></math></span>. Every point <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>a</mi><mo separator="true">,</mo><mi>b</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(a, b)</annotation></semantics></math></span> of one is <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>b</mi><mo separator="true">,</mo><mi>a</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(b, a)</annotation></semantics></math></span> on the other.</p></section>
</template>
<template id="explain-trigonometry"><section data-case="circle">
  <h3>Sine and cosine are coordinates</h3>
  <p>A point on a circle of radius 1, at angle <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics></math></span> from the <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span> axis: its horizontal position is <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>cos</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding="application/x-tex">\cos\theta</annotation></semantics></math></span>, its height <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>sin</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding="application/x-tex">\sin\theta</annotation></semantics></math></span>. The identity is Pythagoras on the triangle under the point. Drag the point.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>θ</mi><mo stretchy="false">)</mo><mo>=</mo><mo stretchy="false">(</mo><mi>cos</mi><mo>⁡</mo><mi>θ</mi><mo separator="true">,</mo><mtext> </mtext><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><msup><mrow><mi>cos</mi><mo>⁡</mo></mrow><mn>2</mn></msup><mi>θ</mi><mo>+</mo><msup><mrow><mi>sin</mi><mo>⁡</mo></mrow><mn>2</mn></msup><mi>θ</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">P(\theta) = (\cos\theta,\ \sin\theta), \qquad \cos^2\theta + \sin^2\theta = 1</annotation></semantics></math></span></div>
</section>
<section data-case="circle" data-example="d30"><h3>30°</h3><p>The triangle is half an equilateral triangle of side 1, so the height is exactly <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mstyle scriptlevel="0" displaystyle="false"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow><annotation encoding="application/x-tex">\tfrac12</annotation></semantics></math></span> and <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>cos</mi><mo>⁡</mo><mn>30</mn><mi mathvariant="normal">°</mi><mo>=</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><msqrt><mn>3</mn></msqrt><mn>2</mn></mfrac></mstyle></mrow><annotation encoding="application/x-tex">\cos 30° = \tfrac{\sqrt3}{2}</annotation></semantics></math></span>.</p></section>
<section data-case="circle" data-example="d45"><h3>45°</h3><p>The triangle is isosceles: both legs equal, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>sin</mi><mo>⁡</mo><mn>45</mn><mi mathvariant="normal">°</mi><mo>=</mo><mi>cos</mi><mo>⁡</mo><mn>45</mn><mi mathvariant="normal">°</mi><mo>=</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><msqrt><mn>2</mn></msqrt><mn>2</mn></mfrac></mstyle><mo>≈</mo><mn>0.707</mn></mrow><annotation encoding="application/x-tex">\sin 45° = \cos 45° = \tfrac{\sqrt2}{2} \approx 0.707</annotation></semantics></math></span>.</p></section>
<section data-case="circle" data-example="d90"><h3>90°</h3><p>The point is at the top: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>sin</mi><mo>⁡</mo><mn>90</mn><mi mathvariant="normal">°</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\sin 90° = 1</annotation></semantics></math></span>, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>cos</mi><mo>⁡</mo><mn>90</mn><mi mathvariant="normal">°</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\cos 90° = 0</annotation></semantics></math></span>.</p></section>
<section data-case="circle" data-example="q2"><h3>Second quadrant</h3><p>Past 90° the point is left of the axis, so <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>cos</mi><mo>⁡</mo><mi>θ</mi><mo>&lt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\cos\theta &lt; 0</annotation></semantics></math></span> while <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>sin</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding="application/x-tex">\sin\theta</annotation></semantics></math></span> is still positive. The signs of (cos, sin) tell the quadrant.</p></section>
<section data-case="circle" data-example="rad"><h3>Radians</h3><p>An angle in radians is the arc length it cuts on the unit circle. One radian is an arc as long as the radius, about 57.3°; a full turn is <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2</mn><mi>π</mi></mrow><annotation encoding="application/x-tex">2\pi</annotation></semantics></math></span>.</p><div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>θ</mi><mtext>rad</mtext></msub><mo>=</mo><msub><mi>θ</mi><mtext>deg</mtext></msub><mo>⋅</mo><mfrac><mi>π</mi><mn>180</mn></mfrac></mrow><annotation encoding="application/x-tex">\theta_{\text{rad}} = \theta_{\text{deg}}\cdot\frac{\pi}{180}</annotation></semantics></math></span></div></section>
<section data-case="circle" data-example="spin"><h3>Turning</h3><p>At constant angular speed <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ω</mi></mrow><annotation encoding="application/x-tex">\omega</annotation></semantics></math></span> the angle grows as <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>θ</mi><mo>=</mo><mi>ω</mi><mi>t</mi></mrow><annotation encoding="application/x-tex">\theta = \omega t</annotation></semantics></math></span>: sine and cosine repeat every <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2</mn><mi>π</mi><mi mathvariant="normal">/</mi><mi>ω</mi></mrow><annotation encoding="application/x-tex">2\pi/\omega</annotation></semantics></math></span> seconds.</p></section>

<section data-case="waves">
  <h3>The helix and its shadows</h3>
  <p>Unroll the angle along the <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span> axis and the turning point draws a helix. Its shadow on the side wall is the sine wave, on the floor the cosine wave.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>cos</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mi>sin</mi><mo>⁡</mo><mtext> ⁣</mtext><mrow><mo fence="true">(</mo><mi>θ</mi><mo>+</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><mi>π</mi><mn>2</mn></mfrac></mstyle><mo fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">\cos\theta = \sin\!\left(\theta + \tfrac{\pi}{2}\right)</annotation></semantics></math></span></div>
</section>
<section data-case="waves" data-example="side"><h3>Seen from the side</h3><p>Looking along the circle's plane you see only the height: the helix becomes <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi><mo>=</mo><mi>sin</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding="application/x-tex">y = \sin\theta</annotation></semantics></math></span>.</p></section>
<section data-case="waves" data-example="shift"><h3>A quarter turn apart</h3><p>At <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>θ</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\theta = 0</annotation></semantics></math></span> the cosine is at its top (1) while the sine is at zero. The sine reaches the top a quarter turn (90°) later: same wave, shifted.</p></section>
<section data-case="waves" data-example="fast"><h3>Higher frequency</h3><p>A faster turn packs more waves into the same time: the frequency is <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>f</mi><mo>=</mo><mi>ω</mi><mi mathvariant="normal">/</mi><mn>2</mn><mi>π</mi></mrow><annotation encoding="application/x-tex">f = \omega / 2\pi</annotation></semantics></math></span>, the period <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>T</mi><mo>=</mo><mn>1</mn><mi mathvariant="normal">/</mi><mi>f</mi></mrow><annotation encoding="application/x-tex">T = 1/f</annotation></semantics></math></span>.</p></section>

<section data-case="tangent">
  <h3>The tangent</h3>
  <p>Extend the radius until it meets the vertical line <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">x = 1</annotation></semantics></math></span>: the height there is <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>tan</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding="application/x-tex">\tan\theta</annotation></semantics></math></span>, by similar triangles.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>tan</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mfrac><mrow><mi>sin</mi><mo>⁡</mo><mi>θ</mi></mrow><mrow><mi>cos</mi><mo>⁡</mo><mi>θ</mi></mrow></mfrac></mrow><annotation encoding="application/x-tex">\tan\theta = \frac{\sin\theta}{\cos\theta}</annotation></semantics></math></span></div>
</section>
<section data-case="tangent" data-example="t45"><h3>45°</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>sin</mi><mo>⁡</mo><mo>=</mo><mi>cos</mi><mo>⁡</mo></mrow><annotation encoding="application/x-tex">\sin = \cos</annotation></semantics></math></span>, so <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>tan</mi><mo>⁡</mo><mn>45</mn><mi mathvariant="normal">°</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\tan 45° = 1</annotation></semantics></math></span>: the radius meets the line at height 1.</p></section>
<section data-case="tangent" data-example="t90"><h3>Near 90°</h3><p>The radius is almost parallel to the line <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">x = 1</annotation></semantics></math></span>; they meet very high up. At exactly 90° <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>cos</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\cos\theta = 0</annotation></semantics></math></span> and <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>tan</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding="application/x-tex">\tan\theta</annotation></semantics></math></span> is undefined.</p></section>
<section data-case="tangent" data-example="neg"><h3>Second quadrant</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>sin</mi><mo>⁡</mo><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\sin &gt; 0</annotation></semantics></math></span>, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>cos</mi><mo>⁡</mo><mo>&lt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\cos &lt; 0</annotation></semantics></math></span>: the tangent is negative. Extended backwards, the radius meets the line below the axis.</p></section>
</template>
<template id="explain-complex-numbers"><section data-case="add mul div pow roots">
  <p>A complex number <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>z</mi><mo>=</mo><mi>a</mi><mo>+</mo><mi>b</mi><mi>i</mi></mrow><annotation encoding="application/x-tex">z = a + bi</annotation></semantics></math></span> is a point in the plane: real part across, imaginary part up. In polar form it is a length and an angle. Drag <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>z</mi></mrow><annotation encoding="application/x-tex">z</annotation></semantics></math></span> and <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>w</mi></mrow><annotation encoding="application/x-tex">w</annotation></semantics></math></span>.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>z</mi><mo>=</mo><mi>a</mi><mo>+</mo><mi>b</mi><mi>i</mi><mo>=</mo><mi>r</mi><mtext> </mtext><msup><mi>e</mi><mrow><mi>i</mi><mi>θ</mi></mrow></msup><mo separator="true">,</mo><mspace width="2em"/><mi>r</mi><mo>=</mo><mi mathvariant="normal">∣</mi><mi>z</mi><mi mathvariant="normal">∣</mi><mo>=</mo><msqrt><mrow><msup><mi>a</mi><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup></mrow></msqrt><mo separator="true">,</mo><mspace width="1em"/><msup><mi>i</mi><mn>2</mn></msup><mo>=</mo><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">z = a + bi = r\,e^{i\theta}, \qquad r = |z| = \sqrt{a^2 + b^2}, \quad i^2 = -1</annotation></semantics></math></span></div>
</section>
<section data-case="add"><h3>Adding is joining arrows</h3><p>Add real parts and imaginary parts separately. The sum is the diagonal of the parallelogram on the two arrows.</p><div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>z</mi><mo>+</mo><mi>w</mi><mo>=</mo><mo stretchy="false">(</mo><mi>a</mi><mo>+</mo><mi>c</mi><mo stretchy="false">)</mo><mo>+</mo><mo stretchy="false">(</mo><mi>b</mi><mo>+</mo><mi>d</mi><mo stretchy="false">)</mo><mtext> </mtext><mi>i</mi></mrow><annotation encoding="application/x-tex">z + w = (a + c) + (b + d)\,i</annotation></semantics></math></span></div></section>
<section data-case="add" data-example="real"><h3>Two real numbers</h3><p>On the real axis, complex addition is ordinary addition: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2</mn><mo>+</mo><mn>1</mn><mo>=</mo><mn>3</mn></mrow><annotation encoding="application/x-tex">2 + 1 = 3</annotation></semantics></math></span>.</p></section>
<section data-case="add" data-example="conj"><h3>Number plus conjugate</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mover accent="true"><mi>z</mi><mo>ˉ</mo></mover><mo>=</mo><mi>a</mi><mo>−</mo><mi>b</mi><mi>i</mi></mrow><annotation encoding="application/x-tex">\bar z = a - bi</annotation></semantics></math></span> is the mirror image across the real axis. The imaginary parts cancel: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>z</mi><mo>+</mo><mover accent="true"><mi>z</mi><mo>ˉ</mo></mover><mo>=</mo><mn>2</mn><mi>a</mi></mrow><annotation encoding="application/x-tex">z + \bar z = 2a</annotation></semantics></math></span>.</p></section>
<section data-case="add" data-example="opp"><h3>Opposite numbers</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mi>z</mi></mrow><annotation encoding="application/x-tex">-z</annotation></semantics></math></span> points the other way; the parallelogram collapses and the sum is 0.</p></section>

<section data-case="mul"><h3>Multiplying: rotate and stretch</h3><p>Lengths multiply, angles add.</p><div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>z</mi><mtext> </mtext><mi>w</mi><mo>=</mo><msub><mi>r</mi><mi>z</mi></msub><msub><mi>r</mi><mi>w</mi></msub><mtext> </mtext><msup><mi>e</mi><mrow><mi>i</mi><mo stretchy="false">(</mo><msub><mi>θ</mi><mi>z</mi></msub><mo>+</mo><msub><mi>θ</mi><mi>w</mi></msub><mo stretchy="false">)</mo></mrow></msup></mrow><annotation encoding="application/x-tex">z\,w = r_z r_w\, e^{i(\theta_z + \theta_w)}</annotation></semantics></math></span></div></section>
<section data-case="mul" data-example="real"><h3>Times a real number</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>w</mi><mo>=</mo><mn>2</mn></mrow><annotation encoding="application/x-tex">w = 2</annotation></semantics></math></span> has angle 0: the product is <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>z</mi></mrow><annotation encoding="application/x-tex">z</annotation></semantics></math></span> stretched twice as long, same direction.</p></section>
<section data-case="mul" data-example="i"><h3>Times i</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics></math></span> has length 1 and angle 90°: multiplying by it is a quarter turn, no stretch. <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mn>2</mn><mo>+</mo><mi>i</mi><mo stretchy="false">)</mo><mtext> </mtext><mi>i</mi><mo>=</mo><mo>−</mo><mn>1</mn><mo>+</mo><mn>2</mn><mi>i</mi></mrow><annotation encoding="application/x-tex">(2 + i)\,i = -1 + 2i</annotation></semantics></math></span>.</p></section>
<section data-case="mul" data-example="ii"><h3>i times i</h3><p>Two quarter turns make a half turn: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>i</mi><mn>2</mn></msup><mo>=</mo><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">i^2 = -1</annotation></semantics></math></span>. This is why <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics></math></span> is needed: no real number squares to <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">-1</annotation></semantics></math></span>.</p></section>
<section data-case="mul" data-example="conj"><h3>Number times conjugate</h3><p>The angles <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics></math></span> and <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mi>θ</mi></mrow><annotation encoding="application/x-tex">-\theta</annotation></semantics></math></span> cancel: the product is real and equals <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><mi>z</mi><msup><mi mathvariant="normal">∣</mi><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">|z|^2</annotation></semantics></math></span>. Here <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mi>i</mi><mo stretchy="false">)</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>i</mi><mo stretchy="false">)</mo><mo>=</mo><mn>2</mn></mrow><annotation encoding="application/x-tex">(1 + i)(1 - i) = 2</annotation></semantics></math></span>.</p></section>

<section data-case="div"><h3>Dividing: rotate back and shrink</h3><p>Lengths divide, angles subtract.</p><div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mfrac><mi>z</mi><mi>w</mi></mfrac><mo>=</mo><mfrac><msub><mi>r</mi><mi>z</mi></msub><msub><mi>r</mi><mi>w</mi></msub></mfrac><mtext> </mtext><msup><mi>e</mi><mrow><mi>i</mi><mo stretchy="false">(</mo><msub><mi>θ</mi><mi>z</mi></msub><mo>−</mo><msub><mi>θ</mi><mi>w</mi></msub><mo stretchy="false">)</mo></mrow></msup><mo>=</mo><mfrac><mrow><mi>z</mi><mtext> </mtext><mover accent="true"><mi>w</mi><mo>ˉ</mo></mover></mrow><mrow><mi mathvariant="normal">∣</mi><mi>w</mi><msup><mi mathvariant="normal">∣</mi><mn>2</mn></msup></mrow></mfrac></mrow><annotation encoding="application/x-tex">\frac{z}{w} = \frac{r_z}{r_w}\, e^{i(\theta_z - \theta_w)} = \frac{z\,\bar w}{|w|^2}</annotation></semantics></math></span></div></section>
<section data-case="div" data-example="self"><h3>A number over itself</h3><p>Same length, same angle: the quotient is 1.</p></section>
<section data-case="div" data-example="i"><h3>Divide by i</h3><p>Undo a quarter turn: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>z</mi><mi mathvariant="normal">/</mi><mi>i</mi><mo>=</mo><mo>−</mo><mi>i</mi><mtext> </mtext><mi>z</mi></mrow><annotation encoding="application/x-tex">z / i = -i\,z</annotation></semantics></math></span>, a turn of −90°.</p></section>

<section data-case="pow"><h3>Powers spiral</h3><p>Each power multiplies by <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>z</mi></mrow><annotation encoding="application/x-tex">z</annotation></semantics></math></span> again: the angle steps by <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>θ</mi></mrow><annotation encoding="application/x-tex">\theta</annotation></semantics></math></span>, the length by <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>r</mi></mrow><annotation encoding="application/x-tex">r</annotation></semantics></math></span> (de Moivre).</p><div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msup><mi>z</mi><mi>n</mi></msup><mo>=</mo><msup><mi>r</mi><mi>n</mi></msup><msup><mi>e</mi><mrow><mi>i</mi><mi>n</mi><mi>θ</mi></mrow></msup></mrow><annotation encoding="application/x-tex">z^n = r^n e^{i n\theta}</annotation></semantics></math></span></div></section>
<section data-case="pow" data-example="out"><h3>Spiralling out</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><mi>z</mi><mi mathvariant="normal">∣</mi><mo>&gt;</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">|z| &gt; 1</annotation></semantics></math></span>: every power is longer than the last.</p></section>
<section data-case="pow" data-example="in"><h3>Spiralling in</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><mi>z</mi><mi mathvariant="normal">∣</mi><mo>&lt;</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">|z| &lt; 1</annotation></semantics></math></span>: the powers shrink towards 0.</p></section>
<section data-case="pow" data-example="i"><h3>Powers of i</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>i</mi><mo separator="true">,</mo><mo>−</mo><mn>1</mn><mo separator="true">,</mo><mo>−</mo><mi>i</mi><mo separator="true">,</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">i, -1, -i, 1</annotation></semantics></math></span>: four quarter turns bring you back. The powers repeat every 4.</p></section>

<section data-case="roots"><h3>Roots sit on a regular polygon</h3><p>Every non-zero number has exactly <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span> different <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span>-th roots, evenly spaced around a circle of radius <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>r</mi><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mi>n</mi></mrow></msup></mrow><annotation encoding="application/x-tex">r^{1/n}</annotation></semantics></math></span>. They add up to zero.</p><div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mroot><mi>z</mi><mi>n</mi></mroot><mo>=</mo><msup><mi>r</mi><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mi>n</mi></mrow></msup><msup><mi>e</mi><mrow><mi>i</mi><mo stretchy="false">(</mo><mi>θ</mi><mo>+</mo><mn>2</mn><mi>π</mi><mi>k</mi><mo stretchy="false">)</mo><mi mathvariant="normal">/</mi><mi>n</mi></mrow></msup><mo separator="true">,</mo><mspace width="1em"/><mi>k</mi><mo>=</mo><mn>0</mn><mo separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><mi>n</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\sqrt[n]{z} = r^{1/n} e^{i(\theta + 2\pi k)/n}, \quad k = 0, \dots, n-1</annotation></semantics></math></span></div></section>
<section data-case="roots" data-example="square"><h3>Square roots of 1</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn></mrow><annotation encoding="application/x-tex">1</annotation></semantics></math></span> and <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">-1</annotation></semantics></math></span>: both square to 1, half a turn apart.</p></section>
<section data-case="roots" data-example="hex"><h3>Sixth roots of unity</h3><p>Six points 60° apart: a regular hexagon.</p></section>
<section data-case="roots" data-example="i"><h3>Square roots of i</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics></math></span> is at 90°, so its roots are at 45° and 225°: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>±</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><msqrt><mn>2</mn></msqrt><mn>2</mn></mfrac></mstyle><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mi>i</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\pm\tfrac{\sqrt2}{2}(1 + i)</annotation></semantics></math></span>.</p></section>
<section data-case="roots" data-example="minus"><h3>Cube roots of −1</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">-1</annotation></semantics></math></span> itself is one of them; the other two are <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mstyle scriptlevel="0" displaystyle="false"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mo>±</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><msqrt><mn>3</mn></msqrt><mn>2</mn></mfrac></mstyle><mi>i</mi></mrow><annotation encoding="application/x-tex">\tfrac12 \pm \tfrac{\sqrt3}{2} i</annotation></semantics></math></span>.</p></section>
</template>
<template id="explain-vectors"><section data-case="dot">
  <h3>The dot product</h3>
  <p>How much two vectors point the same way: the length of <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">a</mi></mrow><annotation encoding="application/x-tex">\mathbf a</annotation></semantics></math></span> times the shadow of <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">b</mi></mrow><annotation encoding="application/x-tex">\mathbf b</annotation></semantics></math></span> on it (green). A number, not a vector. Drag the tips of <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">a</mi></mrow><annotation encoding="application/x-tex">\mathbf a</annotation></semantics></math></span> and <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">b</mi></mrow><annotation encoding="application/x-tex">\mathbf b</annotation></semantics></math></span>.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="bold">a</mi><mo>⋅</mo><mi mathvariant="bold">b</mi><mo>=</mo><msub><mi>a</mi><mi>x</mi></msub><msub><mi>b</mi><mi>x</mi></msub><mo>+</mo><msub><mi>a</mi><mi>y</mi></msub><msub><mi>b</mi><mi>y</mi></msub><mo>+</mo><msub><mi>a</mi><mi>z</mi></msub><msub><mi>b</mi><mi>z</mi></msub><mo>=</mo><mi mathvariant="normal">∣</mi><mi mathvariant="bold">a</mi><mi mathvariant="normal">∣</mi><mi mathvariant="normal">∣</mi><mi mathvariant="bold">b</mi><mi mathvariant="normal">∣</mi><mi>cos</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding="application/x-tex">\mathbf a\cdot\mathbf b = a_x b_x + a_y b_y + a_z b_z = |\mathbf a||\mathbf b|\cos\theta</annotation></semantics></math></span></div>
</section>
<section data-case="dot" data-example="perp"><h3>Perpendicular</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>θ</mi><mo>=</mo><mn>90</mn><mi mathvariant="normal">°</mi></mrow><annotation encoding="application/x-tex">\theta = 90°</annotation></semantics></math></span>, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>cos</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\cos\theta = 0</annotation></semantics></math></span>: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">b</mi></mrow><annotation encoding="application/x-tex">\mathbf b</annotation></semantics></math></span> casts no shadow on <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">a</mi></mrow><annotation encoding="application/x-tex">\mathbf a</annotation></semantics></math></span>, so <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">a</mi><mo>⋅</mo><mi mathvariant="bold">b</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\mathbf a\cdot\mathbf b = 0</annotation></semantics></math></span>. This is the test for perpendicular vectors.</p></section>
<section data-case="dot" data-example="same"><h3>Same direction</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>θ</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\theta = 0</annotation></semantics></math></span>, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>cos</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\cos\theta = 1</annotation></semantics></math></span>: the dot product is as large as it can be, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><mi mathvariant="bold">a</mi><mi mathvariant="normal">∣</mi><mi mathvariant="normal">∣</mi><mi mathvariant="bold">b</mi><mi mathvariant="normal">∣</mi></mrow><annotation encoding="application/x-tex">|\mathbf a||\mathbf b|</annotation></semantics></math></span>.</p></section>
<section data-case="dot" data-example="obtuse"><h3>Obtuse angle</h3><p>Beyond 90° the shadow falls behind the origin: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>cos</mi><mo>⁡</mo><mi>θ</mi><mo>&lt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\cos\theta &lt; 0</annotation></semantics></math></span> and the dot product is negative.</p></section>
<section data-case="dot" data-example="opposite"><h3>Opposite</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>θ</mi><mo>=</mo><mn>180</mn><mi mathvariant="normal">°</mi></mrow><annotation encoding="application/x-tex">\theta = 180°</annotation></semantics></math></span>: the most negative value, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mi mathvariant="normal">∣</mi><mi mathvariant="bold">a</mi><mi mathvariant="normal">∣</mi><mi mathvariant="normal">∣</mi><mi mathvariant="bold">b</mi><mi mathvariant="normal">∣</mi></mrow><annotation encoding="application/x-tex">-|\mathbf a||\mathbf b|</annotation></semantics></math></span>.</p></section>

<section data-case="cross">
  <h3>The cross product</h3>
  <p>A vector at right angles to both <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">a</mi></mrow><annotation encoding="application/x-tex">\mathbf a</annotation></semantics></math></span> and <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">b</mi></mrow><annotation encoding="application/x-tex">\mathbf b</annotation></semantics></math></span>, as long as the area of the parallelogram they span. Its direction follows the right-hand rule.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="normal">∣</mi><mi mathvariant="bold">a</mi><mo>×</mo><mi mathvariant="bold">b</mi><mi mathvariant="normal">∣</mi><mo>=</mo><mi mathvariant="normal">∣</mi><mi mathvariant="bold">a</mi><mi mathvariant="normal">∣</mi><mi mathvariant="normal">∣</mi><mi mathvariant="bold">b</mi><mi mathvariant="normal">∣</mi><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="bold">a</mi><mo>×</mo><mi mathvariant="bold">b</mi><mo>=</mo><mo>−</mo><mtext> </mtext><mi mathvariant="bold">b</mi><mo>×</mo><mi mathvariant="bold">a</mi></mrow><annotation encoding="application/x-tex">|\mathbf a\times\mathbf b| = |\mathbf a||\mathbf b|\sin\theta, \qquad \mathbf a\times\mathbf b = -\,\mathbf b\times\mathbf a</annotation></semantics></math></span></div>
</section>
<section data-case="cross" data-example="axes"><h3>The axes</h3><p>Unit vectors along <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span> and <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi></mrow><annotation encoding="application/x-tex">y</annotation></semantics></math></span>: the square they span has area 1 and the cross product is the unit vector along <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>z</mi></mrow><annotation encoding="application/x-tex">z</annotation></semantics></math></span>.</p></section>
<section data-case="cross" data-example="perp"><h3>At 90°</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\sin\theta = 1</annotation></semantics></math></span>: the parallelogram is a rectangle, the area is largest.</p></section>
<section data-case="cross" data-example="parallel"><h3>Parallel</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\sin\theta = 0</annotation></semantics></math></span>: the parallelogram is flat, the cross product is the zero vector.</p></section>
<section data-case="cross" data-example="swap"><h3>Order matters</h3><p>Swapping the vectors flips the result: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">b</mi><mo>×</mo><mi mathvariant="bold">a</mi><mo>=</mo><mo>−</mo><mi mathvariant="bold">a</mi><mo>×</mo><mi mathvariant="bold">b</mi></mrow><annotation encoding="application/x-tex">\mathbf b\times\mathbf a = -\mathbf a\times\mathbf b</annotation></semantics></math></span>. Curl the fingers of the right hand from the first to the second: the thumb gives the direction.</p></section>

<section data-case="gravity">
  <h3>A gravitational field</h3>
  <p>Every point of space gets an arrow: the pull a 1 kg test mass would feel there. Fields of several masses simply add. Drag the masses and the probe.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="bold">g</mi><mo>=</mo><mo>−</mo><munder><mo>∑</mo><mi>i</mi></munder><mfrac><mrow><mi>G</mi><msub><mi>M</mi><mi>i</mi></msub></mrow><msubsup><mi>r</mi><mi>i</mi><mn>2</mn></msubsup></mfrac><mtext> </mtext><msub><mover accent="true"><mi mathvariant="bold">r</mi><mo>^</mo></mover><mi>i</mi></msub><mo>=</mo><mo>−</mo><mi mathvariant="normal">∇</mi><mi>V</mi><mo separator="true">,</mo><mspace width="2em"/><mi>V</mi><mo>=</mo><mo>−</mo><munder><mo>∑</mo><mi>i</mi></munder><mfrac><mrow><mi>G</mi><msub><mi>M</mi><mi>i</mi></msub></mrow><msub><mi>r</mi><mi>i</mi></msub></mfrac></mrow><annotation encoding="application/x-tex">\mathbf g = -\sum_i \frac{G M_i}{r_i^2}\,\hat{\mathbf r}_i = -\nabla V, \qquad V = -\sum_i \frac{G M_i}{r_i}</annotation></semantics></math></span></div>
</section>
<section data-case="gravity" data-example="equal"><h3>Equal masses</h3><p>Midway between them the two pulls are equal and opposite: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">g</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\mathbf g = 0</annotation></semantics></math></span>. A body placed there stays (but any nudge sends it to one side).</p></section>
<section data-case="gravity" data-example="unequal"><h3>Unequal masses</h3><p>The point where the pulls cancel moves towards the small mass: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>M</mi><mn>1</mn></msub><mi mathvariant="normal">/</mi><msubsup><mi>r</mi><mn>1</mn><mn>2</mn></msubsup><mo>=</mo><msub><mi>M</mi><mn>2</mn></msub><mi mathvariant="normal">/</mi><msubsup><mi>r</mi><mn>2</mn><mn>2</mn></msubsup></mrow><annotation encoding="application/x-tex">M_1/r_1^2 = M_2/r_2^2</annotation></semantics></math></span>.</p></section>
<section data-case="gravity" data-example="far"><h3>Far away</h3><p>Seen from far, the two masses act like one mass <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>M</mi><mn>1</mn></msub><mo>+</mo><msub><mi>M</mi><mn>2</mn></msub></mrow><annotation encoding="application/x-tex">M_1 + M_2</annotation></semantics></math></span> at their centre of mass.</p></section>

<section data-case="div">
  <h3>Divergence</h3>
  <p>Put a tiny circle in the flow. The net flow out of it, per unit area, is the divergence: a source (<span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">&gt; 0</annotation></semantics></math></span>) or a sink (<span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>&lt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">&lt; 0</annotation></semantics></math></span>). The tracer dots spread out or crowd in. Drag the circle.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="normal">∇</mi><mo>⋅</mo><mi mathvariant="bold">F</mi><mo>=</mo><mfrac><mrow><mi mathvariant="normal">∂</mi><msub><mi>F</mi><mi>x</mi></msub></mrow><mrow><mi mathvariant="normal">∂</mi><mi>x</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mi mathvariant="normal">∂</mi><msub><mi>F</mi><mi>y</mi></msub></mrow><mrow><mi mathvariant="normal">∂</mi><mi>y</mi></mrow></mfrac><mo>=</mo><munder><mrow><mi>lim</mi><mo>⁡</mo></mrow><mrow><mi>A</mi><mo>→</mo><mn>0</mn></mrow></munder><mfrac><mn>1</mn><mi>A</mi></mfrac><mo>∮</mo><mi mathvariant="bold">F</mi><mo>⋅</mo><mover accent="true"><mi mathvariant="bold">n</mi><mo>^</mo></mover><mtext> </mtext><mi>d</mi><mi mathvariant="normal">ℓ</mi></mrow><annotation encoding="application/x-tex">\nabla\cdot\mathbf F = \frac{\partial F_x}{\partial x} + \frac{\partial F_y}{\partial y} = \lim_{A\to 0}\frac{1}{A}\oint \mathbf F\cdot\hat{\mathbf n}\,d\ell</annotation></semantics></math></span></div>
</section>
<section data-case="div" data-example="sink"><h3>A sink</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">F</mi><mo>=</mo><mo>−</mo><mo stretchy="false">(</mo><mi>x</mi><mo separator="true">,</mo><mi>y</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\mathbf F = -(x, y)</annotation></semantics></math></span>: everything flows inwards, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∇</mi><mo>⋅</mo><mi mathvariant="bold">F</mi><mo>=</mo><mo>−</mo><mn>2</mn></mrow><annotation encoding="application/x-tex">\nabla\cdot\mathbf F = -2</annotation></semantics></math></span> everywhere.</p></section>
<section data-case="div" data-example="vortex"><h3>A vortex</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">F</mi><mo>=</mo><mo stretchy="false">(</mo><mo>−</mo><mi>y</mi><mo separator="true">,</mo><mi>x</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\mathbf F = (-y, x)</annotation></semantics></math></span> only goes round: as much flows in as out of any circle, so the divergence is 0.</p></section>
<section data-case="div" data-example="bump"><h3>Changing sign</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">F</mi><mo>=</mo><mo stretchy="false">(</mo><mi>x</mi><mo separator="true">,</mo><mi>y</mi><mo stretchy="false">)</mo><msup><mi>e</mi><mrow><mo>−</mo><msup><mi>r</mi><mn>2</mn></msup></mrow></msup></mrow><annotation encoding="application/x-tex">\mathbf F = (x, y)e^{-r^2}</annotation></semantics></math></span> spreads near the centre (div <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">&gt; 0</annotation></semantics></math></span>) but slows down further out, so there the dots crowd (div <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>&lt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">&lt; 0</annotation></semantics></math></span>). The sign changes at <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>r</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">r = 1</annotation></semantics></math></span>.</p></section>

<section data-case="curl">
  <h3>Curl</h3>
  <p>The flow around the tiny circle, per unit area: would a little paddle wheel spin? The tracer dots turn.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mo stretchy="false">(</mo><mi mathvariant="normal">∇</mi><mo>×</mo><mi mathvariant="bold">F</mi><msub><mo stretchy="false">)</mo><mi>z</mi></msub><mo>=</mo><mfrac><mrow><mi mathvariant="normal">∂</mi><msub><mi>F</mi><mi>y</mi></msub></mrow><mrow><mi mathvariant="normal">∂</mi><mi>x</mi></mrow></mfrac><mo>−</mo><mfrac><mrow><mi mathvariant="normal">∂</mi><msub><mi>F</mi><mi>x</mi></msub></mrow><mrow><mi mathvariant="normal">∂</mi><mi>y</mi></mrow></mfrac><mo>=</mo><munder><mrow><mi>lim</mi><mo>⁡</mo></mrow><mrow><mi>A</mi><mo>→</mo><mn>0</mn></mrow></munder><mfrac><mn>1</mn><mi>A</mi></mfrac><mo>∮</mo><mi mathvariant="bold">F</mi><mo>⋅</mo><mi>d</mi><mi mathvariant="bold">ℓ</mi></mrow><annotation encoding="application/x-tex">(\nabla\times\mathbf F)_z = \frac{\partial F_y}{\partial x} - \frac{\partial F_x}{\partial y} = \lim_{A\to 0}\frac{1}{A}\oint \mathbf F\cdot d\boldsymbol\ell</annotation></semantics></math></span></div>
</section>
<section data-case="curl" data-example="source"><h3>A source</h3><p>Straight out from the centre: nothing goes round, the curl is 0.</p></section>
<section data-case="curl" data-example="shear"><h3>Shear</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">F</mi><mo>=</mo><mo stretchy="false">(</mo><mi>y</mi><mo separator="true">,</mo><mn>0</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\mathbf F = (y, 0)</annotation></semantics></math></span>: all streamlines are straight, yet the top moves faster than the bottom, so a paddle wheel turns. Curl <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>=</mo><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">= -1</annotation></semantics></math></span>.</p></section>
<section data-case="curl" data-example="spiral"><h3>A spiral</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">F</mi><mo>=</mo><mo stretchy="false">(</mo><mi>x</mi><mo>−</mo><mi>y</mi><mo separator="true">,</mo><mi>x</mi><mo>+</mo><mi>y</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\mathbf F = (x - y, x + y)</annotation></semantics></math></span> both spreads and turns: divergence 2 and curl 2.</p></section>
</template>
<template id="explain-calculus"><section data-case="derivative">
  <h3>The derivative is a limit of slopes</h3>
  <p>Draw a secant through <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>x</mi><mn>0</mn></msub></mrow><annotation encoding="application/x-tex">x_0</annotation></semantics></math></span> and <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>x</mi><mn>0</mn></msub><mo>+</mo><mi>h</mi></mrow><annotation encoding="application/x-tex">x_0 + h</annotation></semantics></math></span>. As <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>h</mi></mrow><annotation encoding="application/x-tex">h</annotation></semantics></math></span> shrinks it turns into the tangent, and its slope into the derivative. Drag the point.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msup><mi>f</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo stretchy="false">(</mo><msub><mi>x</mi><mn>0</mn></msub><mo stretchy="false">)</mo><mo>=</mo><munder><mrow><mi>lim</mi><mo>⁡</mo></mrow><mrow><mi>h</mi><mo>→</mo><mn>0</mn></mrow></munder><mfrac><mrow><mi>f</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mn>0</mn></msub><mo>+</mo><mi>h</mi><mo stretchy="false">)</mo><mo>−</mo><mi>f</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mn>0</mn></msub><mo stretchy="false">)</mo></mrow><mi>h</mi></mfrac></mrow><annotation encoding="application/x-tex">f&#x27;(x_0) = \lim_{h\to 0} \frac{f(x_0 + h) - f(x_0)}{h}</annotation></semantics></math></span></div>
</section>
<section data-case="derivative" data-example="limit"><h3>h → 0</h3><p>For <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>f</mi><mo>=</mo><msup><mi>x</mi><mn>2</mn></msup><mi mathvariant="normal">/</mi><mn>2</mn></mrow><annotation encoding="application/x-tex">f = x^2/2</annotation></semantics></math></span> the secant slope is <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>x</mi><mn>0</mn></msub><mo>+</mo><mi>h</mi><mi mathvariant="normal">/</mi><mn>2</mn></mrow><annotation encoding="application/x-tex">x_0 + h/2</annotation></semantics></math></span>: with <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>h</mi><mo>=</mo><mn>0.01</mn></mrow><annotation encoding="application/x-tex">h = 0.01</annotation></semantics></math></span> it is 1.005, almost exactly <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>f</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">f&#x27;(1) = 1</annotation></semantics></math></span>.</p></section>
<section data-case="derivative" data-example="flat"><h3>Slope zero</h3><p>At the bottom of the curve the tangent is horizontal: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>f</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">f&#x27;(0) = 0</annotation></semantics></math></span>. Minima and maxima are where the derivative vanishes.</p></section>
<section data-case="derivative" data-example="sin"><h3>The derivative of sine</h3><p>At <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">x = 0</annotation></semantics></math></span> the sine rises with slope 1 <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>=</mo><mi>cos</mi><mo>⁡</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">= \cos 0</annotation></semantics></math></span>. Everywhere, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>sin</mi><mo>⁡</mo><mi>x</mi><msup><mo stretchy="false">)</mo><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo>=</mo><mi>cos</mi><mo>⁡</mo><mi>x</mi></mrow><annotation encoding="application/x-tex">(\sin x)&#x27; = \cos x</annotation></semantics></math></span>.</p></section>
<section data-case="derivative" data-example="peak"><h3>Top of the sine</h3><p>At <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi><mo>=</mo><mi>π</mi><mi mathvariant="normal">/</mi><mn>2</mn></mrow><annotation encoding="application/x-tex">x = \pi/2</annotation></semantics></math></span> the sine peaks: slope <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>cos</mi><mo>⁡</mo><mo stretchy="false">(</mo><mi>π</mi><mi mathvariant="normal">/</mi><mn>2</mn><mo stretchy="false">)</mo><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\cos(\pi/2) = 0</annotation></semantics></math></span>.</p></section>
<section data-case="derivative" data-example="exp"><h3>Exponential</h3><p>For <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>e</mi><mrow><mi>x</mi><mi mathvariant="normal">/</mi><mn>2</mn></mrow></msup></mrow><annotation encoding="application/x-tex">e^{x/2}</annotation></semantics></math></span> the slope is half the height at every point: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><msup><mi>e</mi><mrow><mi>k</mi><mi>x</mi></mrow></msup><msup><mo stretchy="false">)</mo><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo>=</mo><mi>k</mi><mtext> </mtext><msup><mi>e</mi><mrow><mi>k</mi><mi>x</mi></mrow></msup></mrow><annotation encoding="application/x-tex">(e^{kx})&#x27; = k\,e^{kx}</annotation></semantics></math></span>.</p></section>

<section data-case="integral">
  <h3>The integral is a limit of sums</h3>
  <p>Cut the area between <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics></math></span> and <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>b</mi></mrow><annotation encoding="application/x-tex">b</annotation></semantics></math></span> into <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span> strips and add their areas. Drag <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics></math></span> and <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>b</mi></mrow><annotation encoding="application/x-tex">b</annotation></semantics></math></span>.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msubsup><mo>∫</mo><mi>a</mi><mi>b</mi></msubsup><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mtext> </mtext><mi>d</mi><mi>x</mi><mo>=</mo><munder><mrow><mi>lim</mi><mo>⁡</mo></mrow><mrow><mi>n</mi><mo>→</mo><mi mathvariant="normal">∞</mi></mrow></munder><munderover><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mi>f</mi><mo stretchy="false">(</mo><msubsup><mi>x</mi><mi>i</mi><mo>∗</mo></msubsup><mo stretchy="false">)</mo><mtext> </mtext><mi mathvariant="normal">Δ</mi><mi>x</mi><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="normal">Δ</mi><mi>x</mi><mo>=</mo><mfrac><mrow><mi>b</mi><mo>−</mo><mi>a</mi></mrow><mi>n</mi></mfrac></mrow><annotation encoding="application/x-tex">\int_a^b f(x)\,dx = \lim_{n\to\infty} \sum_{i=1}^{n} f(x_i^*)\,\Delta x, \qquad \Delta x = \frac{b-a}{n}</annotation></semantics></math></span></div>
</section>
<section data-case="integral" data-example="many"><h3>More strips</h3><p>With the left rule the error shrinks like <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mi>n</mi></mrow><annotation encoding="application/x-tex">1/n</annotation></semantics></math></span>: 50 strips are 12 times better than 4. The exact area of <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>x</mi><mn>2</mn></msup><mi mathvariant="normal">/</mi><mn>2</mn></mrow><annotation encoding="application/x-tex">x^2/2</annotation></semantics></math></span> from 0 to 2 is <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>4</mn><mi mathvariant="normal">/</mi><mn>3</mn></mrow><annotation encoding="application/x-tex">4/3</annotation></semantics></math></span>.</p></section>
<section data-case="integral" data-example="mid"><h3>Midpoint rule</h3><p>Taking each strip's height in its middle cancels most of the error: it falls like <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><msup><mi>n</mi><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">1/n^2</annotation></semantics></math></span>.</p></section>
<section data-case="integral" data-example="trap"><h3>Trapezoids</h3><p>Join the curve's values at the strip edges with straight lines. Also <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><msup><mi>n</mi><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">1/n^2</annotation></semantics></math></span>, about twice the midpoint error with the opposite sign.</p></section>
<section data-case="integral" data-example="signed"><h3>Signed area</h3><p>Below the axis, area counts negative. Over a full period the sine's positive and negative halves cancel: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msubsup><mo>∫</mo><mn>0</mn><mrow><mn>2</mn><mi>π</mi></mrow></msubsup><mi>sin</mi><mo>⁡</mo><mi>x</mi><mtext> </mtext><mi>d</mi><mi>x</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\int_0^{2\pi}\sin x\,dx = 0</annotation></semantics></math></span>.</p></section>

<section data-case="taylor">
  <h3>Taylor: a polynomial that copies the curve</h3>
  <p>Match the value, the slope, the curvature… at one point <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>x</mi><mn>0</mn></msub></mrow><annotation encoding="application/x-tex">x_0</annotation></semantics></math></span>. Each extra term hugs the curve over a wider range. Order 1 is the tangent line.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>T</mi><mi>N</mi></msub><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><munderover><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mi>N</mi></munderover><mfrac><mrow><msup><mi>f</mi><mrow><mo stretchy="false">(</mo><mi>n</mi><mo stretchy="false">)</mo></mrow></msup><mo stretchy="false">(</mo><msub><mi>x</mi><mn>0</mn></msub><mo stretchy="false">)</mo></mrow><mrow><mi>n</mi><mo stretchy="false">!</mo></mrow></mfrac><mo stretchy="false">(</mo><mi>x</mi><mo>−</mo><msub><mi>x</mi><mn>0</mn></msub><msup><mo stretchy="false">)</mo><mi>n</mi></msup></mrow><annotation encoding="application/x-tex">T_N(x) = \sum_{n=0}^{N} \frac{f^{(n)}(x_0)}{n!}(x - x_0)^n</annotation></semantics></math></span></div>
</section>
<section data-case="taylor" data-example="n3"><h3>Order 3</h3><p><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>sin</mi><mo>⁡</mo><mi>x</mi><mo>≈</mo><mi>x</mi><mo>−</mo><msup><mi>x</mi><mn>3</mn></msup><mi mathvariant="normal">/</mi><mn>6</mn></mrow><annotation encoding="application/x-tex">\sin x \approx x - x^3/6</annotation></semantics></math></span>: good up to about <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><mi>x</mi><mi mathvariant="normal">∣</mi><mo>=</mo><mn>1.5</mn></mrow><annotation encoding="application/x-tex">|x| = 1.5</annotation></semantics></math></span>.</p></section>
