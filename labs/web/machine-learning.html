<template id="explain-neuron"><section data-case="neuron">
  <h3>A neuron is a tilted sheet</h3>
  <div class="look"><h4>What you are looking at</h4>A 3D view: the floor is the input plane (x₁, x₂). Blue crosses are class 0 (drawn on the floor), yellow crosses class 1 (drawn at height 1). The coloured sheet is the neuron's output p for every point of the plane; the orange line is where p = ½ — the decision boundary. Drag to rotate.</div>
  <p>A neuron does two things. It <b>projects</b> each point onto the direction of its weights, collapsing the plane to one number z = w·x + b; then it <b>squashes</b> z into a probability with the sigmoid. Lines of equal z are straight, so the boundary is always a straight line.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>p</mi><mo>=</mo><mi>σ</mi><mo stretchy="false">(</mo><msub><mi>w</mi><mn>1</mn></msub><msub><mi>x</mi><mn>1</mn></msub><mo>+</mo><msub><mi>w</mi><mn>2</mn></msub><msub><mi>x</mi><mn>2</mn></msub><mo>+</mo><mi>b</mi><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><mi>σ</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mrow><mn>1</mn><mo>+</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>z</mi></mrow></msup></mrow></mfrac></mrow><annotation encoding="application/x-tex">p=\sigma(w_1x_1+w_2x_2+b),\qquad \sigma(z)=\frac{1}{1+e^{-z}}</annotation></semantics></math></span></div>
  <ol class="steps"><li>The direction of (w₁, w₂) is the direction the sheet climbs.</li><li>Its length |w| is how steeply: large weights make a cliff, small weights a gentle ramp.</li><li>The bias b slides the whole sheet sideways without turning it.</li></ol>
  <div class="worked"><h4>Worked example</h4>w = (1, 1), b = 0: the boundary is x₁ + x₂ = 0. The point (1, 1) has z = 2, p = σ(2) = 0.88: "88% class 1".</div>
  <div class="pitfall"><h4>Common mistake</h4>Reading p as certainty. With huge weights every point gets p near 0 or 1, even points far from any data the neuron has seen.</div>
  <div class="try"><h4>Try it</h4>Turn the weights until the sheet rises under the yellow crosses and stays low under the blue ones; watch the accuracy and the loss.</div>
</section>
<section data-case="neuron" data-example="steep"><h3>Large weights</h3><p>Same line, much steeper sheet: a sharp yes/no.</p></section>
<section data-case="neuron" data-example="flat"><h3>Small weights</h3><p>p stays close to ½ everywhere: the neuron is unsure about every point.</p></section>
<section data-case="neuron" data-example="bias"><h3>The bias</h3><p>b = 2 moves the line by b/|w| towards the lower-left: more points are called class 1.</p></section>
<section data-case="neuron" data-example="wrong"><h3>The wrong way</h3><p>The sheet climbs away from the yellow points: low accuracy, high loss.</p></section>
<section data-case="descent">
  <h3>Learning is walking downhill</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the data and the neuron's current boundary (background shading = p). Top right: the loss for every pair of weights — a landscape, dark = low — and the path the weights take. Bottom right: the loss step by step.</div>
  <p>Turning the line by hand does not scale. Instead, give every possible line a score — the loss, low when the neuron is right and confident — and roll downhill. The gradient ∇L points uphill; step the other way.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>L</mi><mo>=</mo><mo>−</mo><mfrac><mn>1</mn><mi>N</mi></mfrac><munder><mo>∑</mo><mi>i</mi></munder><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">[</mo><msub><mi>y</mi><mi>i</mi></msub><mi>log</mi><mo>⁡</mo><msub><mi>p</mi><mi>i</mi></msub><mo>+</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><msub><mi>y</mi><mi>i</mi></msub><mo stretchy="false">)</mo><mi>log</mi><mo>⁡</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><msub><mi>p</mi><mi>i</mi></msub><mo stretchy="false">)</mo><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">]</mo><mo separator="true">,</mo><mspace width="2em"/><msub><mi mathvariant="normal">∇</mi><mi>w</mi></msub><mi>L</mi><mo>=</mo><mfrac><mn>1</mn><mi>N</mi></mfrac><munder><mo>∑</mo><mi>i</mi></munder><mo stretchy="false">(</mo><msub><mi>p</mi><mi>i</mi></msub><mo>−</mo><msub><mi>y</mi><mi>i</mi></msub><mo stretchy="false">)</mo><mtext> </mtext><msub><mi mathvariant="bold">x</mi><mi>i</mi></msub><mo separator="true">,</mo><mspace width="2em"/><mi>w</mi><mo>←</mo><mi>w</mi><mo>−</mo><mi>η</mi><mi mathvariant="normal">∇</mi><mi>L</mi></mrow><annotation encoding="application/x-tex">L=-\frac1N\sum_i\big[y_i\log p_i+(1-y_i)\log(1-p_i)\big],\qquad \nabla_wL=\frac1N\sum_i(p_i-y_i)\,\mathbf x_i,\qquad w\leftarrow w-\eta\nabla L</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>A point with y = 1 and p = 0.3 contributes (0.3 − 1)·x = −0.7x to the gradient: the weights move by +0.7ηx, towards that point.</div>
  <div class="pitfall"><h4>Common mistakes</h4>Too small η: many tiny steps. Too large: the steps overshoot. And on the moons no setting helps: the problem is the shape of the boundary, not the training.</div>
</section>
<section data-case="descent" data-example="slow"><h3>η = 0.05</h3><p>The path is correct but slow: after 300 steps it is still on the way.</p></section>
<section data-case="descent" data-example="fast"><h3>η = 3</h3><p>Big steps reach the valley quickly; on this smooth loss they do not blow up.</p></section>
<section data-case="descent" data-example="moons"><h3>Moons</h3><p>The best straight line still misclassifies the tips of both moons: accuracy stalls around 85%.</p></section>
<section data-case="hidden">
  <h3>A hidden layer bends the plane</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the network's decision region on the moons, with each hidden unit's own line in grey. Top right: with 2 hidden units, the data as the output neuron sees it (the hidden space); otherwise the accuracy. Bottom right: the loss as training goes on.</div>
  <p>One line cannot cut the moons apart. A hidden layer draws H lines at once and passes each through a non-linearity: the plane is bent (tanh) or folded (ReLU) along those lines. In the bent space a single straight line can separate the classes — and mapped back to the input it is a curve.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>h</mi><mi>j</mi></msub><mo>=</mo><mi>f</mi><mo stretchy="false">(</mo><msub><mi mathvariant="bold">w</mi><mi>j</mi></msub><mo>⋅</mo><mi mathvariant="bold">x</mi><mo>+</mo><msub><mi>b</mi><mi>j</mi></msub><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><mi>p</mi><mo>=</mo><mi>σ</mi><mo fence="false" stretchy="true" minsize="1.8em" maxsize="1.8em">(</mo><munder><mo>∑</mo><mi>j</mi></munder><msub><mi>v</mi><mi>j</mi></msub><msub><mi>h</mi><mi>j</mi></msub><mo>+</mo><mi>c</mi><mo fence="false" stretchy="true" minsize="1.8em" maxsize="1.8em">)</mo></mrow><annotation encoding="application/x-tex">h_j=f(\mathbf w_j\cdot\mathbf x+b_j),\qquad p=\sigma\Big(\sum_j v_jh_j+c\Big)</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>With 2 hidden units the hidden space is a plane again: watch the two moons get pulled apart in the top-right chart until the orange line separates them.</div>
  <div class="pitfall"><h4>Common mistake</h4>Thinking more units is always better: 16 units fit these 200 points easily, but with noisy data they also fit the noise (see Generalization).</div>
</section>
<section data-case="hidden" data-example="two"><h3>Two units</h3><p>The smallest network that can do it: the hidden plane shows the bending directly.</p></section>
<section data-case="hidden" data-example="relu"><h3>ReLU</h3><p>ReLU is zero on one side of its line and straight on the other: the boundary is made of straight pieces with corners.</p></section>
<section data-case="hidden" data-example="wide"><h3>Sixteen units</h3><p>Many lines: a smoother, more flexible boundary, learned faster.</p></section>

<template id="explain-activations"><section>
  <p>A layer is not a black box: it is a small amount of arithmetic applied in a pattern. Here every multiply and add is drawn. Cell colours: yellow = positive, blue = negative, grey = zero.</p>
</section>
<section data-case="activation">
  <h3>Activation functions: the bend in every layer</h3>
  <div class="look"><h4>What you are looking at</h4>Top: five common activation functions f(z), the selected one in bold, with your input z marked. Bottom: their slopes f′(z) — the factor by which gradients are multiplied on the way back during training.</div>
  <p>Each layer computes a weighted sum z = w·x + b and passes it through an activation. Without it, any stack of layers would collapse into a single linear map: the activation is what lets a network bend the space.</p>
  <ol class="steps"><li><b>Sigmoid, tanh</b>: smooth and bounded, but flat for large |z| — their slope tends to 0 (vanishing gradients).</li><li><b>ReLU</b>: max(0, z). Slope 1 or 0: simple, fast, the default; a unit stuck at z &lt; 0 stops learning ("dead ReLU").</li><li><b>Leaky ReLU, GELU</b>: keep a little slope for z &lt; 0.</li></ol>
  <div class="worked"><h4>Worked example</h4>Ten sigmoid layers each pass back at most 0.25 of the gradient: 0.25¹⁰ ≈ 10⁻⁶. Ten ReLU layers in their active region pass back 1.</div>
</section>
<section data-case="activation" data-example="sig"><h3>Sigmoid at z = 4</h3><p>Output 0.98, slope 0.018: nearly no gradient.</p></section>
<section data-case="activation" data-example="dead"><h3>ReLU at z = −2</h3><p>Output 0 and slope 0: this unit contributes nothing and receives no update.</p></section>
<section data-case="dense">
  <h3>The dense layer: one dot product per output</h3>
  <div class="look"><h4>What you are looking at</h4>The input vector x, the weight matrix W, the bias b and the output y. Output j is built step by step from row j of W (orange) times the whole input; the current pair is outlined in white.</div>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>y</mi><mi>j</mi></msub><mo>=</mo><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>W</mi><mrow><mi>j</mi><mi>i</mi></mrow></msub><msub><mi>x</mi><mi>i</mi></msub><mo>+</mo><msub><mi>b</mi><mi>j</mi></msub></mrow><annotation encoding="application/x-tex">y_j=\sum_iW_{ji}x_i+b_j</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>y₁ = 0.5·1 + (−1)·2 + 0.3·(−1) + 2·0.5 + 0.1 = −0.7.</div>
  <div class="pitfall"><h4>Common mistake</h4>Feeding an image to a dense layer flattens it: neighbouring pixels end up far apart in the vector, and the layer has to learn every position separately — 784 × 100 weights for a small MNIST layer.</div>
</section>
<section data-case="conv">
  <h3>Convolution: one small window, reused everywhere</h3>
  <div class="look"><h4>What you are looking at</h4>Left: a 7×7 image of a "7" (padding cells darker). Middle: the 3×3 kernel. Right: the output map filling in as the window (outlined) slides. The bottom line spells out the sum for the current output.</div>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>O</mi><mrow><mi>m</mi><mi>n</mi></mrow></msub><mo>=</mo><munder><mo>∑</mo><mrow><mi>u</mi><mo separator="true">,</mo><mi>v</mi></mrow></munder><msub><mi>K</mi><mrow><mi>u</mi><mi>v</mi></mrow></msub><mtext> </mtext><msub><mi>X</mi><mrow><mi>m</mi><mi>s</mi><mo>+</mo><mi>u</mi><mi>d</mi><mo>−</mo><mi>p</mi><mo separator="true">,</mo><mtext>  </mtext><mi>n</mi><mi>s</mi><mo>+</mo><mi>v</mi><mi>d</mi><mo>−</mo><mi>p</mi></mrow></msub><mo separator="true">,</mo><mspace width="2em"/><msub><mi>N</mi><mtext>out</mtext></msub><mo>=</mo><mrow><mo fence="true">⌊</mo><mfrac><mrow><mi>N</mi><mo>+</mo><mn>2</mn><mi>p</mi><mo>−</mo><mi>d</mi><mo stretchy="false">(</mo><mi>k</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mo>−</mo><mn>1</mn></mrow><mi>s</mi></mfrac><mo fence="true">⌋</mo></mrow><mo>+</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">O_{mn}=\sum_{u,v}K_{uv}\,X_{m s+u d-p,\;n s+v d-p},\qquad N_\text{out}=\left\lfloor\frac{N+2p-d(k-1)-1}{s}\right\rfloor+1</annotation></semantics></math></span></div>
  <ol class="steps"><li>Place the kernel on a patch; multiply cell by cell; add: one output number.</li><li>Slide by the stride s and repeat.</li><li>Padding p adds a border of zeros; dilation d spaces the taps apart.</li></ol>
  <div class="worked"><h4>Worked example</h4>N = 7, k = 3: no padding, stride 1 → 5×5; padding 1 → 7×7; stride 2 → 3×3; dilation 2 → 3×3.</div>

</section>
<section data-case="conv" data-example="stride"><h3>Stride 2</h3><p>The window jumps two cells at a time: output 3×3.</p></section>
<section data-case="conv" data-example="pad"><h3>Padding 1</h3><p>A ring of zeros: the kernel can centre on border pixels, the output stays 7×7.</p></section>
<section data-case="conv" data-example="dil"><h3>Dilation 2</h3><p>The taps are spread over a 5×5 area: a wider view without more weights.</p></section>
<section data-case="conv" data-example="blur"><h3>Blur</h3><p>All weights 1/9: each output is the average of its patch.</p></section>
<section data-case="pool">
  <h3>Pooling: summarise each window</h3>
  <div class="look"><h4>What you are looking at</h4>A 6×6 feature map and the 3×3 result of 2×2 pooling with stride 2; the current window is outlined.</div>
  <p>Pooling has no parameters. It keeps the strongest (max) or the average response in each window, halving the size. It discards exact position: a feature that moves by one pixel often gives the same output.</p>
</section>
<section data-case="pool" data-example="avg"><h3>Average pooling</h3><p>Smoother, keeps more of the weak responses; max keeps only the peaks.</p></section>
<section data-case="channels">
  <h3>Channels: a filter is a block</h3>
  <div class="look"><h4>What you are looking at</h4>A 3D view: three input channels stacked as slabs, the 3×3×3 filter block (orange posts, white outlines on each slab), and the single output map it produces. Drag to rotate.</div>
  <p>The step most often misunderstood. With C input channels, one filter is a k × k × C block. It multiplies every cell of all channels at that position and adds everything into <b>one</b> number. F filters give F output maps — the next layer's channels.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>O</mi><mrow><mi>m</mi><mi>n</mi></mrow></msub><mo>=</mo><munderover><mo>∑</mo><mrow><mi>c</mi><mo>=</mo><mn>1</mn></mrow><mi>C</mi></munderover><munder><mo>∑</mo><mrow><mi>u</mi><mo separator="true">,</mo><mi>v</mi></mrow></munder><msubsup><mi>K</mi><mrow><mi>u</mi><mi>v</mi></mrow><mrow><mo stretchy="false">(</mo><mi>c</mi><mo stretchy="false">)</mo></mrow></msubsup><msubsup><mi>X</mi><mrow><mi>m</mi><mo>+</mo><mi>u</mi><mo separator="true">,</mo><mi>n</mi><mo>+</mo><mi>v</mi></mrow><mrow><mo stretchy="false">(</mo><mi>c</mi><mo stretchy="false">)</mo></mrow></msubsup><mo>+</mo><mi>b</mi><mo separator="true">,</mo><mspace width="2em"/><mtext>parameters</mtext><mo>=</mo><mo stretchy="false">(</mo><msup><mi>k</mi><mn>2</mn></msup><mi>C</mi><mo>+</mo><mn>1</mn><mo stretchy="false">)</mo><mi>F</mi></mrow><annotation encoding="application/x-tex">O_{mn}=\sum_{c=1}^{C}\sum_{u,v}K^{(c)}_{uv}X^{(c)}_{m+u,n+v}+b,\qquad \text{parameters}=(k^2C+1)F</annotation></semantics></math></span></div>
</section>
<section data-case="stack">
  <h3>A whole CNN: shapes and parameters</h3>
  <div class="look"><h4>What you are looking at</h4>Each block is a layer's output: height ∝ spatial size, width ∝ channels; underneath, its shape and parameter count.</div>
  <p>Two patterns appear at once: spatial size shrinks while channels grow — the network trades resolution for description. And most parameters usually sit in the final dense layer, not in the convolutions.</p>

</section>
<section data-case="stack" data-example="wide"><h3>More filters</h3><p>32 and 64 filters: the conv layers grow quadratically with the channel counts.</p></section>

<template id="explain-hidden-layer"><section data-case="neuron">
  <h3>A neuron is a tilted sheet</h3>
  <div class="look"><h4>What you are looking at</h4>A 3D view: the floor is the input plane (x₁, x₂). Blue crosses are class 0 (drawn on the floor), yellow crosses class 1 (drawn at height 1). The coloured sheet is the neuron's output p for every point of the plane; the orange line is where p = ½ — the decision boundary. Drag to rotate.</div>
  <p>A neuron does two things. It <b>projects</b> each point onto the direction of its weights, collapsing the plane to one number z = w·x + b; then it <b>squashes</b> z into a probability with the sigmoid. Lines of equal z are straight, so the boundary is always a straight line.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>p</mi><mo>=</mo><mi>σ</mi><mo stretchy="false">(</mo><msub><mi>w</mi><mn>1</mn></msub><msub><mi>x</mi><mn>1</mn></msub><mo>+</mo><msub><mi>w</mi><mn>2</mn></msub><msub><mi>x</mi><mn>2</mn></msub><mo>+</mo><mi>b</mi><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><mi>σ</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mrow><mn>1</mn><mo>+</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>z</mi></mrow></msup></mrow></mfrac></mrow><annotation encoding="application/x-tex">p=\sigma(w_1x_1+w_2x_2+b),\qquad \sigma(z)=\frac{1}{1+e^{-z}}</annotation></semantics></math></span></div>
  <ol class="steps"><li>The direction of (w₁, w₂) is the direction the sheet climbs.</li><li>Its length |w| is how steeply: large weights make a cliff, small weights a gentle ramp.</li><li>The bias b slides the whole sheet sideways without turning it.</li></ol>
  <div class="worked"><h4>Worked example</h4>w = (1, 1), b = 0: the boundary is x₁ + x₂ = 0. The point (1, 1) has z = 2, p = σ(2) = 0.88: "88% class 1".</div>
  <div class="pitfall"><h4>Common mistake</h4>Reading p as certainty. With huge weights every point gets p near 0 or 1, even points far from any data the neuron has seen.</div>
  <div class="try"><h4>Try it</h4>Turn the weights until the sheet rises under the yellow crosses and stays low under the blue ones; watch the accuracy and the loss.</div>
</section>
<section data-case="neuron" data-example="steep"><h3>Large weights</h3><p>Same line, much steeper sheet: a sharp yes/no.</p></section>
<section data-case="neuron" data-example="flat"><h3>Small weights</h3><p>p stays close to ½ everywhere: the neuron is unsure about every point.</p></section>
<section data-case="neuron" data-example="bias"><h3>The bias</h3><p>b = 2 moves the line by b/|w| towards the lower-left: more points are called class 1.</p></section>
<section data-case="neuron" data-example="wrong"><h3>The wrong way</h3><p>The sheet climbs away from the yellow points: low accuracy, high loss.</p></section>
<section data-case="descent">
  <h3>Learning is walking downhill</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the data and the neuron's current boundary (background shading = p). Top right: the loss for every pair of weights — a landscape, dark = low — and the path the weights take. Bottom right: the loss step by step.</div>
  <p>Turning the line by hand does not scale. Instead, give every possible line a score — the loss, low when the neuron is right and confident — and roll downhill. The gradient ∇L points uphill; step the other way.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>L</mi><mo>=</mo><mo>−</mo><mfrac><mn>1</mn><mi>N</mi></mfrac><munder><mo>∑</mo><mi>i</mi></munder><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">[</mo><msub><mi>y</mi><mi>i</mi></msub><mi>log</mi><mo>⁡</mo><msub><mi>p</mi><mi>i</mi></msub><mo>+</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><msub><mi>y</mi><mi>i</mi></msub><mo stretchy="false">)</mo><mi>log</mi><mo>⁡</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><msub><mi>p</mi><mi>i</mi></msub><mo stretchy="false">)</mo><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">]</mo><mo separator="true">,</mo><mspace width="2em"/><msub><mi mathvariant="normal">∇</mi><mi>w</mi></msub><mi>L</mi><mo>=</mo><mfrac><mn>1</mn><mi>N</mi></mfrac><munder><mo>∑</mo><mi>i</mi></munder><mo stretchy="false">(</mo><msub><mi>p</mi><mi>i</mi></msub><mo>−</mo><msub><mi>y</mi><mi>i</mi></msub><mo stretchy="false">)</mo><mtext> </mtext><msub><mi mathvariant="bold">x</mi><mi>i</mi></msub><mo separator="true">,</mo><mspace width="2em"/><mi>w</mi><mo>←</mo><mi>w</mi><mo>−</mo><mi>η</mi><mi mathvariant="normal">∇</mi><mi>L</mi></mrow><annotation encoding="application/x-tex">L=-\frac1N\sum_i\big[y_i\log p_i+(1-y_i)\log(1-p_i)\big],\qquad \nabla_wL=\frac1N\sum_i(p_i-y_i)\,\mathbf x_i,\qquad w\leftarrow w-\eta\nabla L</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>A point with y = 1 and p = 0.3 contributes (0.3 − 1)·x = −0.7x to the gradient: the weights move by +0.7ηx, towards that point.</div>
  <div class="pitfall"><h4>Common mistakes</h4>Too small η: many tiny steps. Too large: the steps overshoot. And on the moons no setting helps: the problem is the shape of the boundary, not the training.</div>
</section>
<section data-case="descent" data-example="slow"><h3>η = 0.05</h3><p>The path is correct but slow: after 300 steps it is still on the way.</p></section>
<section data-case="descent" data-example="fast"><h3>η = 3</h3><p>Big steps reach the valley quickly; on this smooth loss they do not blow up.</p></section>
<section data-case="descent" data-example="moons"><h3>Moons</h3><p>The best straight line still misclassifies the tips of both moons: accuracy stalls around 85%.</p></section>
<section data-case="hidden">
  <h3>A hidden layer bends the plane</h3>
  <div class="look"><h4>What you are looking at</h4>Left: the network's decision region on the moons, with each hidden unit's own line in grey. Top right: with 2 hidden units, the data as the output neuron sees it (the hidden space); otherwise the accuracy. Bottom right: the loss as training goes on.</div>
  <p>One line cannot cut the moons apart. A hidden layer draws H lines at once and passes each through a non-linearity: the plane is bent (tanh) or folded (ReLU) along those lines. In the bent space a single straight line can separate the classes — and mapped back to the input it is a curve.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>h</mi><mi>j</mi></msub><mo>=</mo><mi>f</mi><mo stretchy="false">(</mo><msub><mi mathvariant="bold">w</mi><mi>j</mi></msub><mo>⋅</mo><mi mathvariant="bold">x</mi><mo>+</mo><msub><mi>b</mi><mi>j</mi></msub><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><mi>p</mi><mo>=</mo><mi>σ</mi><mo fence="false" stretchy="true" minsize="1.8em" maxsize="1.8em">(</mo><munder><mo>∑</mo><mi>j</mi></munder><msub><mi>v</mi><mi>j</mi></msub><msub><mi>h</mi><mi>j</mi></msub><mo>+</mo><mi>c</mi><mo fence="false" stretchy="true" minsize="1.8em" maxsize="1.8em">)</mo></mrow><annotation encoding="application/x-tex">h_j=f(\mathbf w_j\cdot\mathbf x+b_j),\qquad p=\sigma\Big(\sum_j v_jh_j+c\Big)</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>With 2 hidden units the hidden space is a plane again: watch the two moons get pulled apart in the top-right chart until the orange line separates them.</div>
  <div class="pitfall"><h4>Common mistake</h4>Thinking more units is always better: 16 units fit these 200 points easily, but with noisy data they also fit the noise (see Generalization).</div>
</section>
<section data-case="hidden" data-example="two"><h3>Two units</h3><p>The smallest network that can do it: the hidden plane shows the bending directly.</p></section>
<section data-case="hidden" data-example="relu"><h3>ReLU</h3><p>ReLU is zero on one side of its line and straight on the other: the boundary is made of straight pieces with corners.</p></section>
<section data-case="hidden" data-example="wide"><h3>Sixteen units</h3><p>Many lines: a smoother, more flexible boundary, learned faster.</p></section>

<template id="explain-conv-layer"><section>
  <p>A layer is not a black box: it is a small amount of arithmetic applied in a pattern. Here every multiply and add is drawn. Cell colours: yellow = positive, blue = negative, grey = zero.</p>
</section>
<section data-case="activation">
  <h3>Activation functions: the bend in every layer</h3>
  <div class="look"><h4>What you are looking at</h4>Top: five common activation functions f(z), the selected one in bold, with your input z marked. Bottom: their slopes f′(z) — the factor by which gradients are multiplied on the way back during training.</div>
  <p>Each layer computes a weighted sum z = w·x + b and passes it through an activation. Without it, any stack of layers would collapse into a single linear map: the activation is what lets a network bend the space.</p>
  <ol class="steps"><li><b>Sigmoid, tanh</b>: smooth and bounded, but flat for large |z| — their slope tends to 0 (vanishing gradients).</li><li><b>ReLU</b>: max(0, z). Slope 1 or 0: simple, fast, the default; a unit stuck at z &lt; 0 stops learning ("dead ReLU").</li><li><b>Leaky ReLU, GELU</b>: keep a little slope for z &lt; 0.</li></ol>
  <div class="worked"><h4>Worked example</h4>Ten sigmoid layers each pass back at most 0.25 of the gradient: 0.25¹⁰ ≈ 10⁻⁶. Ten ReLU layers in their active region pass back 1.</div>
</section>
<section data-case="activation" data-example="sig"><h3>Sigmoid at z = 4</h3><p>Output 0.98, slope 0.018: nearly no gradient.</p></section>
<section data-case="activation" data-example="dead"><h3>ReLU at z = −2</h3><p>Output 0 and slope 0: this unit contributes nothing and receives no update.</p></section>
<section data-case="dense">
  <h3>The dense layer: one dot product per output</h3>
  <div class="look"><h4>What you are looking at</h4>The input vector x, the weight matrix W, the bias b and the output y. Output j is built step by step from row j of W (orange) times the whole input; the current pair is outlined in white.</div>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>y</mi><mi>j</mi></msub><mo>=</mo><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>W</mi><mrow><mi>j</mi><mi>i</mi></mrow></msub><msub><mi>x</mi><mi>i</mi></msub><mo>+</mo><msub><mi>b</mi><mi>j</mi></msub></mrow><annotation encoding="application/x-tex">y_j=\sum_iW_{ji}x_i+b_j</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>y₁ = 0.5·1 + (−1)·2 + 0.3·(−1) + 2·0.5 + 0.1 = −0.7.</div>
  <div class="pitfall"><h4>Common mistake</h4>Feeding an image to a dense layer flattens it: neighbouring pixels end up far apart in the vector, and the layer has to learn every position separately — 784 × 100 weights for a small MNIST layer.</div>
</section>
<section data-case="conv">
  <h3>Convolution: one small window, reused everywhere</h3>
  <div class="look"><h4>What you are looking at</h4>Left: a 7×7 image of a "7" (padding cells darker). Middle: the 3×3 kernel. Right: the output map filling in as the window (outlined) slides. The bottom line spells out the sum for the current output.</div>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>O</mi><mrow><mi>m</mi><mi>n</mi></mrow></msub><mo>=</mo><munder><mo>∑</mo><mrow><mi>u</mi><mo separator="true">,</mo><mi>v</mi></mrow></munder><msub><mi>K</mi><mrow><mi>u</mi><mi>v</mi></mrow></msub><mtext> </mtext><msub><mi>X</mi><mrow><mi>m</mi><mi>s</mi><mo>+</mo><mi>u</mi><mi>d</mi><mo>−</mo><mi>p</mi><mo separator="true">,</mo><mtext>  </mtext><mi>n</mi><mi>s</mi><mo>+</mo><mi>v</mi><mi>d</mi><mo>−</mo><mi>p</mi></mrow></msub><mo separator="true">,</mo><mspace width="2em"/><msub><mi>N</mi><mtext>out</mtext></msub><mo>=</mo><mrow><mo fence="true">⌊</mo><mfrac><mrow><mi>N</mi><mo>+</mo><mn>2</mn><mi>p</mi><mo>−</mo><mi>d</mi><mo stretchy="false">(</mo><mi>k</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mo>−</mo><mn>1</mn></mrow><mi>s</mi></mfrac><mo fence="true">⌋</mo></mrow><mo>+</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">O_{mn}=\sum_{u,v}K_{uv}\,X_{m s+u d-p,\;n s+v d-p},\qquad N_\text{out}=\left\lfloor\frac{N+2p-d(k-1)-1}{s}\right\rfloor+1</annotation></semantics></math></span></div>
  <ol class="steps"><li>Place the kernel on a patch; multiply cell by cell; add: one output number.</li><li>Slide by the stride s and repeat.</li><li>Padding p adds a border of zeros; dilation d spaces the taps apart.</li></ol>
  <div class="worked"><h4>Worked example</h4>N = 7, k = 3: no padding, stride 1 → 5×5; padding 1 → 7×7; stride 2 → 3×3; dilation 2 → 3×3.</div>
  <div class="pitfall"><h4>Common mistake</h4>Forgetting that the same 9 weights are used at every position: that is what makes convolution cheap and translation-equivariant.</div>
</section>
<section data-case="conv" data-example="stride"><h3>Stride 2</h3><p>The window jumps two cells at a time: output 3×3.</p></section>
<section data-case="conv" data-example="pad"><h3>Padding 1</h3><p>A ring of zeros: the kernel can centre on border pixels, the output stays 7×7.</p></section>
<section data-case="conv" data-example="dil"><h3>Dilation 2</h3><p>The taps are spread over a 5×5 area: a wider view without more weights.</p></section>
<section data-case="conv" data-example="blur"><h3>Blur</h3><p>All weights 1/9: each output is the average of its patch.</p></section>
<section data-case="pool">
  <h3>Pooling: summarise each window</h3>
  <div class="look"><h4>What you are looking at</h4>A 6×6 feature map and the 3×3 result of 2×2 pooling with stride 2; the current window is outlined.</div>
  <p>Pooling has no parameters. It keeps the strongest (max) or the average response in each window, halving the size. It discards exact position: a feature that moves by one pixel often gives the same output.</p>
</section>
<section data-case="pool" data-example="avg"><h3>Average pooling</h3><p>Smoother, keeps more of the weak responses; max keeps only the peaks.</p></section>
<section data-case="channels">
  <h3>Channels: a filter is a block</h3>
  <div class="look"><h4>What you are looking at</h4>A 3D view: three input channels stacked as slabs, the 3×3×3 filter block (orange posts, white outlines on each slab), and the single output map it produces. Drag to rotate.</div>
  <p>The step most often misunderstood. With C input channels, one filter is a k × k × C block. It multiplies every cell of all channels at that position and adds everything into <b>one</b> number. F filters give F output maps — the next layer's channels.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>O</mi><mrow><mi>m</mi><mi>n</mi></mrow></msub><mo>=</mo><munderover><mo>∑</mo><mrow><mi>c</mi><mo>=</mo><mn>1</mn></mrow><mi>C</mi></munderover><munder><mo>∑</mo><mrow><mi>u</mi><mo separator="true">,</mo><mi>v</mi></mrow></munder><msubsup><mi>K</mi><mrow><mi>u</mi><mi>v</mi></mrow><mrow><mo stretchy="false">(</mo><mi>c</mi><mo stretchy="false">)</mo></mrow></msubsup><msubsup><mi>X</mi><mrow><mi>m</mi><mo>+</mo><mi>u</mi><mo separator="true">,</mo><mi>n</mi><mo>+</mo><mi>v</mi></mrow><mrow><mo stretchy="false">(</mo><mi>c</mi><mo stretchy="false">)</mo></mrow></msubsup><mo>+</mo><mi>b</mi><mo separator="true">,</mo><mspace width="2em"/><mtext>parameters</mtext><mo>=</mo><mo stretchy="false">(</mo><msup><mi>k</mi><mn>2</mn></msup><mi>C</mi><mo>+</mo><mn>1</mn><mo stretchy="false">)</mo><mi>F</mi></mrow><annotation encoding="application/x-tex">O_{mn}=\sum_{c=1}^{C}\sum_{u,v}K^{(c)}_{uv}X^{(c)}_{m+u,n+v}+b,\qquad \text{parameters}=(k^2C+1)F</annotation></semantics></math></span></div>
</section>
<section data-case="stack">
  <h3>A whole CNN: shapes and parameters</h3>
  <div class="look"><h4>What you are looking at</h4>Each block is a layer's output: height ∝ spatial size, width ∝ channels; underneath, its shape and parameter count.</div>
  <p>Two patterns appear at once: spatial size shrinks while channels grow — the network trades resolution for description. And most parameters usually sit in the final dense layer, not in the convolutions.</p>
  <div class="worked"><h4>Worked example</h4>28×28 input, 8 then 16 filters: conv1 has (9·1 + 1)·8 = 80 parameters, conv2 (9·8 + 1)·16 = 1168, and the dense layer (7·7·16 + 1)·10 = 7850.</div>
</section>
<section data-case="stack" data-example="wide"><h3>More filters</h3><p>32 and 64 filters: the conv layers grow quadratically with the channel counts.</p></section>

<template id="explain-softmax"><section>
  <p>A loss does two jobs. Its <b>minimum</b> decides what the model converges to; its <b>derivative</b> decides how hard each example pushes, and whether training moves at all.</p>
</section>
<section data-case="regress">
  <h3>Squared, absolute and Huber</h3>
  <div class="look"><h4>What you are looking at</h4>Top: twelve points with one outlier and the straight line each loss fits (bold = selected). For the squared loss each residual is drawn as a real square — its area is the penalty. Bottom: penalty against residual for the three losses, with the points of the selected fit.</div>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi mathvariant="normal">ℓ</mi><mn>2</mn></msub><mo>=</mo><msup><mi>r</mi><mn>2</mn></msup><mo separator="true">,</mo><mspace width="2em"/><msub><mi mathvariant="normal">ℓ</mi><mn>1</mn></msub><mo>=</mo><mi mathvariant="normal">∣</mi><mi>r</mi><mi mathvariant="normal">∣</mi><mo separator="true">,</mo><mspace width="2em"/><msub><mi mathvariant="normal">ℓ</mi><mi>δ</mi></msub><mo>=</mo><mrow><mo fence="true">{</mo><mtable rowspacing="0.36em" columnalign="left left" columnspacing="1em"><mtr><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mstyle scriptlevel="0" displaystyle="false"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><msup><mi>r</mi><mn>2</mn></msup></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mi mathvariant="normal">∣</mi><mi>r</mi><mi mathvariant="normal">∣</mi><mo>≤</mo><mi>δ</mi></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mi>δ</mi><mo stretchy="false">(</mo><mi mathvariant="normal">∣</mi><mi>r</mi><mi mathvariant="normal">∣</mi><mo>−</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi>δ</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mi mathvariant="normal">∣</mi><mi>r</mi><mi mathvariant="normal">∣</mi><mo>&gt;</mo><mi>δ</mi></mrow></mstyle></mtd></mtr></mtable></mrow></mrow><annotation encoding="application/x-tex">\ell_2=r^2,\qquad \ell_1=|r|,\qquad \ell_\delta=\begin{cases}\tfrac12r^2&amp;|r|\le\delta\\ \delta(|r|-\tfrac12\delta)&amp;|r|&gt;\delta\end{cases}</annotation></semantics></math></span></div>

  <div class="worked"><h4>Worked example</h4>An outlier 8 units off contributes 64 to the squared loss — as much as 64 points 1 unit off. The squared fit tilts towards it; the absolute fit hardly moves.</div>

<section data-case="regress" data-example="huber"><h3>Huber</h3><p>Squares only for residuals within δ; beyond, the penalty grows linearly.</p></section>
<section data-case="regress" data-example="none"><h3>No outlier</h3><p>With clean data all three lines coincide.</p></section>
<section data-case="trap">
  <h3>The sigmoid trap</h3>
  <div class="look"><h4>What you are looking at</h4>One example with true label 1 and a neuron that starts confidently wrong (z = −6, p ≈ 0.002). Top: the loss as a function of the score z for squared error (blue) and cross-entropy (orange), with each one's current position. Bottom: how z moves during training.</div>
  <p>Squared error on a probability looks reasonable — its minimum is in the right place. But differentiate through the sigmoid and a factor p(1 − p) appears, which is almost zero when p is near 0 or 1. Exactly when the model is confidently wrong, it barely learns. Cross-entropy's derivative is simply p − y: largest when most wrong.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mfrac><mi mathvariant="normal">∂</mi><mrow><mi mathvariant="normal">∂</mi><mi>z</mi></mrow></mfrac><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo>=</mo><mo>−</mo><mn>2</mn><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><mo stretchy="false">)</mo><mtext> </mtext><mi>p</mi><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><mfrac><mi mathvariant="normal">∂</mi><mrow><mi mathvariant="normal">∂</mi><mi>z</mi></mrow></mfrac><mo stretchy="false">(</mo><mo>−</mo><mi>log</mi><mo>⁡</mo><mi>p</mi><mo stretchy="false">)</mo><mo>=</mo><mi>p</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\frac{\partial}{\partial z}(1-p)^2=-2(1-p)\,p(1-p),\qquad \frac{\partial}{\partial z}(-\log p)=p-1</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>At z = −6: the squared-error gradient is about −0.005; cross-entropy's is −0.998 — two hundred times stronger.</div>
  <div class="pitfall"><h4>Common mistake</h4>Training a classifier with MSE and blaming the learning rate for the plateau.</div>
</section>
<section data-case="softmax">
  <h3>Softmax and temperature</h3>
  <div class="look"><h4>What you are looking at</h4>Top: four raw scores (logits). Bottom: the probabilities softmax makes of them; the true class in orange. Bottom plot: each probability as the temperature changes.</div>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>p</mi><mi>k</mi></msub><mo>=</mo><mfrac><msup><mi>e</mi><mrow><msub><mi>z</mi><mi>k</mi></msub><mi mathvariant="normal">/</mi><mi>T</mi></mrow></msup><mrow><munder><mo>∑</mo><mi>j</mi></munder><msup><mi>e</mi><mrow><msub><mi>z</mi><mi>j</mi></msub><mi mathvariant="normal">/</mi><mi>T</mi></mrow></msup></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="normal">ℓ</mi><mo>=</mo><mo>−</mo><mi>log</mi><mo>⁡</mo><msub><mi>p</mi><mtext>true</mtext></msub></mrow><annotation encoding="application/x-tex">p_k=\frac{e^{z_k/T}}{\sum_je^{z_j/T}},\qquad \ell=-\log p_\text{true}</annotation></semantics></math></span></div>
  <ol class="steps"><li>Exponentiate (all positive), normalise (sum to 1).</li><li>Only differences between scores matter: adding the same number to all changes nothing.</li><li>T &lt; 1 sharpens towards the largest; T &gt; 1 flattens towards uniform.</li></ol>
  <div class="worked"><h4>Worked example</h4>Scores (2, 1, 0.5, −1) at T = 1: p ≈ (0.57, 0.21, 0.13, 0.03). If class 1 is true, loss = −log 0.57 = 0.56.</div>
</section>
<section data-case="softmax" data-example="cold"><h3>T = 0.2</h3><p>The biggest score takes nearly all the probability (used in sampling to be conservative).</p></section>
<section data-case="softmax" data-example="hot"><h3>T = 5</h3><p>All classes nearly equal (used in distillation to show the "dark knowledge" between classes).</p></section>
<section data-case="softmax" data-example="wrong"><h3>True class scored low</h3><p>p_true ≈ 0.03: loss ≈ 3.5, a strong push.</p></section>
<section data-case="margin">
  <h3>One picture of every classification loss</h3>
  <div class="look"><h4>What you are looking at</h4>Top: each loss as a function of the margin m = y·f(x) (y = ±1): positive means correct, larger means more confident. Bottom: the value of each at your margin; bottom plot: their slopes.</div>
  <p>What we actually want is the 0–1 loss — count the mistakes. But it is a step: zero gradient everywhere, nothing to follow. Every practical loss is a smooth stand-in above it.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>hinge</mtext><mo>=</mo><mi>max</mi><mo>⁡</mo><mo stretchy="false">(</mo><mn>0</mn><mo separator="true">,</mo><mn>1</mn><mo>−</mo><mi>m</mi><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="1em"/><mtext>logistic</mtext><mo>=</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>2</mn></msub><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>m</mi></mrow></msup><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="1em"/><mtext>exponential</mtext><mo>=</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>m</mi></mrow></msup><mo separator="true">,</mo><mspace width="1em"/><mtext>squared</mtext><mo>=</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>m</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">\text{hinge}=\max(0,1-m),\quad \text{logistic}=\log_2(1+e^{-m}),\quad \text{exponential}=e^{-m},\quad \text{squared}=(1-m)^2</annotation></semantics></math></span></div>
  <div class="pitfall"><h4>Common mistake</h4>Squared loss rises again for m &gt; 1: it penalises points for being too correct. Exponential explodes for m &lt; 0: one mislabelled point dominates.</div>
</section>
<section data-case="margin" data-example="wrongside"><h3>m = −1</h3><p>A clear mistake: exponential e ≈ 2.7, hinge 2, logistic 1.9 — all pushing back.</p></section>

<template id="explain-cnn-stack"><section>
  <p>A layer is not a black box: it is a small amount of arithmetic applied in a pattern. Here every multiply and add is drawn. Cell colours: yellow = positive, blue = negative, grey = zero.</p>
</section>
<section data-case="activation">
  <h3>Activation functions: the bend in every layer</h3>
  <div class="look"><h4>What you are looking at</h4>Top: five common activation functions f(z), the selected one in bold, with your input z marked. Bottom: their slopes f′(z) — the factor by which gradients are multiplied on the way back during training.</div>
  <p>Each layer computes a weighted sum z = w·x + b and passes it through an activation. Without it, any stack of layers would collapse into a single linear map: the activation is what lets a network bend the space.</p>
  <ol class="steps"><li><b>Sigmoid, tanh</b>: smooth and bounded, but flat for large |z| — their slope tends to 0 (vanishing gradients).</li><li><b>ReLU</b>: max(0, z). Slope 1 or 0: simple, fast, the default; a unit stuck at z &lt; 0 stops learning ("dead ReLU").</li><li><b>Leaky ReLU, GELU</b>: keep a little slope for z &lt; 0.</li></ol>
  <div class="worked"><h4>Worked example</h4>Ten sigmoid layers each pass back at most 0.25 of the gradient: 0.25¹⁰ ≈ 10⁻⁶. Ten ReLU layers in their active region pass back 1.</div>
</section>
<section data-case="activation" data-example="sig"><h3>Sigmoid at z = 4</h3><p>Output 0.98, slope 0.018: nearly no gradient.</p></section>
<section data-case="activation" data-example="dead"><h3>ReLU at z = −2</h3><p>Output 0 and slope 0: this unit contributes nothing and receives no update.</p></section>
<section data-case="dense">
  <h3>The dense layer: one dot product per output</h3>
  <div class="look"><h4>What you are looking at</h4>The input vector x, the weight matrix W, the bias b and the output y. Output j is built step by step from row j of W (orange) times the whole input; the current pair is outlined in white.</div>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>y</mi><mi>j</mi></msub><mo>=</mo><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>W</mi><mrow><mi>j</mi><mi>i</mi></mrow></msub><msub><mi>x</mi><mi>i</mi></msub><mo>+</mo><msub><mi>b</mi><mi>j</mi></msub></mrow><annotation encoding="application/x-tex">y_j=\sum_iW_{ji}x_i+b_j</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>y₁ = 0.5·1 + (−1)·2 + 0.3·(−1) + 2·0.5 + 0.1 = −0.7.</div>
  <div class="pitfall"><h4>Common mistake</h4>Feeding an image to a dense layer flattens it: neighbouring pixels end up far apart in the vector, and the layer has to learn every position separately — 784 × 100 weights for a small MNIST layer.</div>
</section>
<section data-case="conv">
  <h3>Convolution: one small window, reused everywhere</h3>
  <div class="look"><h4>What you are looking at</h4>Left: a 7×7 image of a "7" (padding cells darker). Middle: the 3×3 kernel. Right: the output map filling in as the window (outlined) slides. The bottom line spells out the sum for the current output.</div>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>O</mi><mrow><mi>m</mi><mi>n</mi></mrow></msub><mo>=</mo><munder><mo>∑</mo><mrow><mi>u</mi><mo separator="true">,</mo><mi>v</mi></mrow></munder><msub><mi>K</mi><mrow><mi>u</mi><mi>v</mi></mrow></msub><mtext> </mtext><msub><mi>X</mi><mrow><mi>m</mi><mi>s</mi><mo>+</mo><mi>u</mi><mi>d</mi><mo>−</mo><mi>p</mi><mo separator="true">,</mo><mtext>  </mtext><mi>n</mi><mi>s</mi><mo>+</mo><mi>v</mi><mi>d</mi><mo>−</mo><mi>p</mi></mrow></msub><mo separator="true">,</mo><mspace width="2em"/><msub><mi>N</mi><mtext>out</mtext></msub><mo>=</mo><mrow><mo fence="true">⌊</mo><mfrac><mrow><mi>N</mi><mo>+</mo><mn>2</mn><mi>p</mi><mo>−</mo><mi>d</mi><mo stretchy="false">(</mo><mi>k</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mo>−</mo><mn>1</mn></mrow><mi>s</mi></mfrac><mo fence="true">⌋</mo></mrow><mo>+</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">O_{mn}=\sum_{u,v}K_{uv}\,X_{m s+u d-p,\;n s+v d-p},\qquad N_\text{out}=\left\lfloor\frac{N+2p-d(k-1)-1}{s}\right\rfloor+1</annotation></semantics></math></span></div>
  <ol class="steps"><li>Place the kernel on a patch; multiply cell by cell; add: one output number.</li><li>Slide by the stride s and repeat.</li><li>Padding p adds a border of zeros; dilation d spaces the taps apart.</li></ol>
  <div class="worked"><h4>Worked example</h4>N = 7, k = 3: no padding, stride 1 → 5×5; padding 1 → 7×7; stride 2 → 3×3; dilation 2 → 3×3.</div>
  <div class="pitfall"><h4>Common mistake</h4>Forgetting that the same 9 weights are used at every position: that is what makes convolution cheap and translation-equivariant.</div>
</section>
<section data-case="conv" data-example="stride"><h3>Stride 2</h3><p>The window jumps two cells at a time: output 3×3.</p></section>
<section data-case="conv" data-example="pad"><h3>Padding 1</h3><p>A ring of zeros: the kernel can centre on border pixels, the output stays 7×7.</p></section>
<section data-case="conv" data-example="dil"><h3>Dilation 2</h3><p>The taps are spread over a 5×5 area: a wider view without more weights.</p></section>
<section data-case="conv" data-example="blur"><h3>Blur</h3><p>All weights 1/9: each output is the average of its patch.</p></section>
<section data-case="pool">
  <h3>Pooling: summarise each window</h3>
  <div class="look"><h4>What you are looking at</h4>A 6×6 feature map and the 3×3 result of 2×2 pooling with stride 2; the current window is outlined.</div>
  <p>Pooling has no parameters. It keeps the strongest (max) or the average response in each window, halving the size. It discards exact position: a feature that moves by one pixel often gives the same output.</p>
</section>
<section data-case="pool" data-example="avg"><h3>Average pooling</h3><p>Smoother, keeps more of the weak responses; max keeps only the peaks.</p></section>
<section data-case="channels">
  <h3>Channels: a filter is a block</h3>
  <div class="look"><h4>What you are looking at</h4>A 3D view: three input channels stacked as slabs, the 3×3×3 filter block (orange posts, white outlines on each slab), and the single output map it produces. Drag to rotate.</div>
  <p>The step most often misunderstood. With C input channels, one filter is a k × k × C block. It multiplies every cell of all channels at that position and adds everything into <b>one</b> number. F filters give F output maps — the next layer's channels.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>O</mi><mrow><mi>m</mi><mi>n</mi></mrow></msub><mo>=</mo><munderover><mo>∑</mo><mrow><mi>c</mi><mo>=</mo><mn>1</mn></mrow><mi>C</mi></munderover><munder><mo>∑</mo><mrow><mi>u</mi><mo separator="true">,</mo><mi>v</mi></mrow></munder><msubsup><mi>K</mi><mrow><mi>u</mi><mi>v</mi></mrow><mrow><mo stretchy="false">(</mo><mi>c</mi><mo stretchy="false">)</mo></mrow></msubsup><msubsup><mi>X</mi><mrow><mi>m</mi><mo>+</mo><mi>u</mi><mo separator="true">,</mo><mi>n</mi><mo>+</mo><mi>v</mi></mrow><mrow><mo stretchy="false">(</mo><mi>c</mi><mo stretchy="false">)</mo></mrow></msubsup><mo>+</mo><mi>b</mi><mo separator="true">,</mo><mspace width="2em"/><mtext>parameters</mtext><mo>=</mo><mo stretchy="false">(</mo><msup><mi>k</mi><mn>2</mn></msup><mi>C</mi><mo>+</mo><mn>1</mn><mo stretchy="false">)</mo><mi>F</mi></mrow><annotation encoding="application/x-tex">O_{mn}=\sum_{c=1}^{C}\sum_{u,v}K^{(c)}_{uv}X^{(c)}_{m+u,n+v}+b,\qquad \text{parameters}=(k^2C+1)F</annotation></semantics></math></span></div>
</section>
<section data-case="stack">
  <h3>A whole CNN: shapes and parameters</h3>
  <div class="look"><h4>What you are looking at</h4>Each block is a layer's output: height ∝ spatial size, width ∝ channels; underneath, its shape and parameter count.</div>
  <p>Two patterns appear at once: spatial size shrinks while channels grow — the network trades resolution for description. And most parameters usually sit in the final dense layer, not in the convolutions.</p>
  <div class="worked"><h4>Worked example</h4>28×28 input, 8 then 16 filters: conv1 has (9·1 + 1)·8 = 80 parameters, conv2 (9·8 + 1)·16 = 1168, and the dense layer (7·7·16 + 1)·10 = 7850.</div>
</section>
<section data-case="stack" data-example="wide"><h3>More filters</h3><p>32 and 64 filters: the conv layers grow quadratically with the channel counts.</p></section>

  <div class="look"><h4>What you are looking at</h4>One example with true label 1 and a neuron that starts confidently wrong (z = −6, p ≈ 0.002). Top: the loss as a function of the score z for squared error (blue) and cross-entropy (orange), with each one's current position. Bottom: how z moves during training.</div>

  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mfrac><mi mathvariant="normal">∂</mi><mrow><mi mathvariant="normal">∂</mi><mi>z</mi></mrow></mfrac><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo>=</mo><mo>−</mo><mn>2</mn><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><mo stretchy="false">)</mo><mtext> </mtext><mi>p</mi><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="2em"/><mfrac><mi mathvariant="normal">∂</mi><mrow><mi mathvariant="normal">∂</mi><mi>z</mi></mrow></mfrac><mo stretchy="false">(</mo><mo>−</mo><mi>log</mi><mo>⁡</mo><mi>p</mi><mo stretchy="false">)</mo><mo>=</mo><mi>p</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\frac{\partial}{\partial z}(1-p)^2=-2(1-p)\,p(1-p),\qquad \frac{\partial}{\partial z}(-\log p)=p-1</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>At z = −6: the squared-error gradient is about −0.005; cross-entropy's is −0.998 — two hundred times stronger.</div>
  <div class="pitfall"><h4>Common mistake</h4>Training a classifier with MSE and blaming the learning rate for the plateau.</div>
</section>
<section data-case="softmax">
  <h3>Softmax and temperature</h3>
  <div class="look"><h4>What you are looking at</h4>Top: four raw scores (logits). Bottom: the probabilities softmax makes of them; the true class in orange. Bottom plot: each probability as the temperature changes.</div>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>p</mi><mi>k</mi></msub><mo>=</mo><mfrac><msup><mi>e</mi><mrow><msub><mi>z</mi><mi>k</mi></msub><mi mathvariant="normal">/</mi><mi>T</mi></mrow></msup><mrow><munder><mo>∑</mo><mi>j</mi></munder><msup><mi>e</mi><mrow><msub><mi>z</mi><mi>j</mi></msub><mi mathvariant="normal">/</mi><mi>T</mi></mrow></msup></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mi mathvariant="normal">ℓ</mi><mo>=</mo><mo>−</mo><mi>log</mi><mo>⁡</mo><msub><mi>p</mi><mtext>true</mtext></msub></mrow><annotation encoding="application/x-tex">p_k=\frac{e^{z_k/T}}{\sum_je^{z_j/T}},\qquad \ell=-\log p_\text{true}</annotation></semantics></math></span></div>
  <ol class="steps"><li>Exponentiate (all positive), normalise (sum to 1).</li><li>Only differences between scores matter: adding the same number to all changes nothing.</li><li>T &lt; 1 sharpens towards the largest; T &gt; 1 flattens towards uniform.</li></ol>
  <div class="worked"><h4>Worked example</h4>Scores (2, 1, 0.5, −1) at T = 1: p ≈ (0.57, 0.21, 0.13, 0.03). If class 1 is true, loss = −log 0.57 = 0.56.</div>
</section>
<section data-case="softmax" data-example="cold"><h3>T = 0.2</h3><p>The biggest score takes nearly all the probability (used in sampling to be conservative).</p></section>
<section data-case="softmax" data-example="hot"><h3>T = 5</h3><p>All classes nearly equal (used in distillation to show the "dark knowledge" between classes).</p></section>
<section data-case="softmax" data-example="wrong"><h3>True class scored low</h3><p>p_true ≈ 0.03: loss ≈ 3.5, a strong push.</p></section>
<section data-case="margin">
  <h3>One picture of every classification loss</h3>
  <div class="look"><h4>What you are looking at</h4>Top: each loss as a function of the margin m = y·f(x) (y = ±1): positive means correct, larger means more confident. Bottom: the value of each at your margin; bottom plot: their slopes.</div>
  <p>What we actually want is the 0–1 loss — count the mistakes. But it is a step: zero gradient everywhere, nothing to follow. Every practical loss is a smooth stand-in above it.</p>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>hinge</mtext><mo>=</mo><mi>max</mi><mo>⁡</mo><mo stretchy="false">(</mo><mn>0</mn><mo separator="true">,</mo><mn>1</mn><mo>−</mo><mi>m</mi><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="1em"/><mtext>logistic</mtext><mo>=</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>2</mn></msub><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>m</mi></mrow></msup><mo stretchy="false">)</mo><mo separator="true">,</mo><mspace width="1em"/><mtext>exponential</mtext><mo>=</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>m</mi></mrow></msup><mo separator="true">,</mo><mspace width="1em"/><mtext>squared</mtext><mo>=</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>m</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">\text{hinge}=\max(0,1-m),\quad \text{logistic}=\log_2(1+e^{-m}),\quad \text{exponential}=e^{-m},\quad \text{squared}=(1-m)^2</annotation></semantics></math></span></div>
  <div class="pitfall"><h4>Common mistake</h4>Squared loss rises again for m &gt; 1: it penalises points for being too correct. Exponential explodes for m &lt; 0: one mislabelled point dominates.</div>
</section>
<section data-case="margin" data-example="wrongside"><h3>m = −1</h3><p>A clear mistake: exponential e ≈ 2.7, hinge 2, logistic 1.9 — all pushing back.</p></section>
</template>
<template id="explain-optimizers"><section>
  <div class="look"><h4>What you are looking at</h4>A loss surface over two parameters: height = loss (log-compressed so walls and floor both show), contour lines drawn on the surface, the red cross = the common starting point. Four optimizers walk down from it: gradient descent (grey), momentum (blue), RMSProp (green), Adam (orange). Bottom: each one's loss against the step. Drag to rotate.</div>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>GD: </mtext><mi>w</mi><mo>←</mo><mi>w</mi><mo>−</mo><mi>η</mi><mi>g</mi><mspace width="2em"/><mtext>Momentum: </mtext><mi>v</mi><mo>←</mo><mi>β</mi><mi>v</mi><mo>+</mo><mi>g</mi><mo separator="true">,</mo><mtext> </mtext><mi>w</mi><mo>←</mo><mi>w</mi><mo>−</mo><mi>η</mi><mi>v</mi><mspace width="2em"/><mtext>RMSProp: </mtext><mi>s</mi><mo>←</mo><mn>0.9</mn><mi>s</mi><mo>+</mo><mn>0.1</mn><msup><mi>g</mi><mn>2</mn></msup><mo separator="true">,</mo><mtext> </mtext><mi>w</mi><mo>←</mo><mi>w</mi><mo>−</mo><mi>η</mi><mtext> </mtext><mfrac><mi>g</mi><msqrt><mi>s</mi></msqrt></mfrac><mspace width="2em"/><mtext>Adam: momentum </mtext><mo>÷</mo><mtext> </mtext><msqrt><mi>s</mi></msqrt></mrow><annotation encoding="application/x-tex">\text{GD: } w\leftarrow w-\eta g\qquad \text{Momentum: } v\leftarrow\beta v+g,\ w\leftarrow w-\eta v\qquad \text{RMSProp: } s\leftarrow0.9s+0.1g^2,\ w\leftarrow w-\eta\,\frac{g}{\sqrt s}\qquad \text{Adam: momentum}\ \div\ \sqrt{s}</annotation></semantics></math></span></div>
  <ol class="steps"><li><b>GD</b> steps straight down the steepest slope: fine on round bowls, slow and bouncy in long narrow valleys.</li><li><b>Momentum</b> keeps a running sum of past gradients: the bounces cancel, the consistent direction builds up speed.</li><li><b>RMSProp</b> divides each direction by its typical gradient size: steep directions get small steps, flat ones big steps.</li><li><b>Adam</b> does both.</li></ol>
  <div class="pitfall"><h4>Common mistake</h4>Comparing optimizers at one learning rate. Each has its own good range: the fairest picture is each at its best η.</div>
</section>
<section data-case="ravine"><h3>A narrow ravine</h3><p>Curvature 12 across, 1 along. GD's step must be small for the steep direction, so it crawls along the gentle one. Rule: GD diverges if η &gt; 2/λ_max = 2/12 ≈ 0.17.</p></section>
<section data-case="ravine" data-example="zig"><h3>η = 0.15</h3><p>Close to the limit: GD jumps from wall to wall; momentum is also oscillating but moves along the valley.</p></section>
<section data-case="ravine" data-example="blow"><h3>η = 0.18</h3><p>Above 2/12: each bounce is larger than the last — GD diverges. RMSProp and Adam, which rescale the steep direction, stay stable.</p></section>
<section data-case="rosen"><h3>The banana valley</h3><p>Rosenbrock's function: finding the valley is easy, following its curved floor to the minimum at (1, 1) takes most of the time.</p></section>
<section data-case="rosen" data-example="adam"><h3>Adam alone</h3><p>Normalised steps of size ≈ η: it follows the floor at a steady pace.</p></section>
<section data-case="saddle"><h3>A saddle point</h3><p>Starting almost exactly on the ridge, the gradient across is tiny. GD needs many steps for the small offset to grow; momentum and Adam leave sooner. In high-dimensional networks saddles are far more common than bad local minima.</p></section>
<section data-case="saddle" data-example="noise"><h3>Noisy gradients</h3><p>Mini-batch noise knocks the point off the ridge immediately: noise can help.</p></section>
<section data-case="wells"><h3>Two valleys</h3><p>A shallow valley near the start and a deeper one further away. Which one an optimizer ends in depends on its path.</p></section>
<section data-case="wells" data-example="mom"><h3>β = 0.95</h3><p>Built-up speed carries momentum over the ridge between the valleys.</p></section>
<section data-case="wells" data-example="sgd"><h3>Noise</h3><p>Noisy steps explore: each optimizer may end in a different valley than without noise.</p></section>
</template>
<template id="explain-overfitting"><section>
  <p>A model is useful only on data it has not seen. Everything here uses polynomial fits to 20–30 noisy samples of a smooth curve (dashed), and a large separate <b>test set</b> (grey dots) that the fits never touch.</p>
</section>
<section data-case="capacity">
  <h3>Capacity: training error always improves</h3>
  <div class="look"><h4>What you are looking at</h4>Top: training points (yellow), test points (grey), the true curve (dashed) and the fit (blue). Bottom: training and test error against the polynomial degree, on a log scale.</div>
  <p>A degree-d polynomial contains every lower-degree one, so raising d can only lower the <i>training</i> error. Training error measures capacity, not quality. The test error falls while the model learns the curve, then rises when it starts fitting the noise.</p>
  <div class="worked"><h4>Worked example</h4>20 points: degree 3 gives test error ≈ 0.1 (close to the noise σ² = 0.09); degree 12 drives training error toward zero and test error up about fivefold.</div>
  <div class="pitfall"><h4>Common mistake</h4>Reporting the training score. More data (the "60 points" example) pushes the overfitting point to higher degrees.</div>
</section>
<section data-case="capacity" data-example="under"><h3>Degree 1</h3><p>A straight line cannot follow the curve: both errors high — underfitting.</p></section>
<section data-case="capacity" data-example="over"><h3>Degree 12</h3><p>The fit threads every training point and swings wildly between them.</p></section>
<section data-case="capacity" data-example="more"><h3>60 points</h3><p>Same degree, three times the data: the swings mostly disappear.</p></section>
<section data-case="biasvar">
  <h3>Where the error comes from: bias and variance</h3>
  <div class="look"><h4>What you are looking at</h4>Top: the same model trained on 40 different noisy datasets (grey), their average (blue) and the truth (dashed). Bottom: bias², variance and their sum against the degree.</div>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="double-struck">E</mi><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">[</mo><mo stretchy="false">(</mo><mi>y</mi><mo>−</mo><mover accent="true"><mi>f</mi><mo>^</mo></mover><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">]</mo><mo>=</mo><munder><munder><mrow><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><mi mathvariant="double-struck">E</mi><mo stretchy="false">[</mo><mover accent="true"><mi>f</mi><mo>^</mo></mover><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo stretchy="false">]</mo><mo>−</mo><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><msup><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mn>2</mn></msup></mrow><mo stretchy="true">⏟</mo></munder><msup><mtext>bias</mtext><mn>2</mn></msup></munder><mo>+</mo><munder><munder><mrow><mi mathvariant="double-struck">E</mi><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">[</mo><mo stretchy="false">(</mo><mover accent="true"><mi>f</mi><mo>^</mo></mover><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>−</mo><mi mathvariant="double-struck">E</mi><mo stretchy="false">[</mo><mover accent="true"><mi>f</mi><mo>^</mo></mover><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo stretchy="false">]</mo><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">]</mo></mrow><mo stretchy="true">⏟</mo></munder><mtext>variance</mtext></munder><mo>+</mo><munder><munder><msup><mi>σ</mi><mn>2</mn></msup><mo stretchy="true">⏟</mo></munder><mtext>noise</mtext></munder></mrow><annotation encoding="application/x-tex">\mathbb E\big[(y-\hat f(x))^2\big]=\underbrace{\big(\mathbb E[\hat f(x)]-f(x)\big)^2}_{\text{bias}^2}+\underbrace{\mathbb E\big[(\hat f(x)-\mathbb E[\hat f(x)])^2\big]}_{\text{variance}}+\underbrace{\sigma^2}_{\text{noise}}</annotation></semantics></math></span></div>
  <p>Bias is how wrong the model is on average; variance is how much it changes with the particular sample. Flexible models trade one for the other.</p>
</section>
<section data-case="biasvar" data-example="rigid"><h3>Degree 1</h3><p>All 40 lines nearly identical (low variance) and all equally wrong (high bias).</p></section>
<section data-case="biasvar" data-example="wild"><h3>Degree 10</h3><p>The average is close to the truth (low bias), but each single fit is wild, especially near the edges (high variance).</p></section>
<section data-case="ridge">
  <h3>Ridge: keep the capacity, penalise the coefficients</h3>
  <div class="look"><h4>What you are looking at</h4>Top: a degree-12 fit with penalty λ. Bottom: training and test error against log λ. Bottom plot: the size of each coefficient.</div>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mover accent="true"><mi mathvariant="bold">w</mi><mo>^</mo></mover><mo>=</mo><mi>arg</mi><mo>⁡</mo><munder><mrow><mi>min</mi><mo>⁡</mo></mrow><mi mathvariant="bold">w</mi></munder><mtext> </mtext><mi mathvariant="normal">∥</mi><mi>A</mi><mi mathvariant="bold">w</mi><mo>−</mo><mi mathvariant="bold">y</mi><msup><mi mathvariant="normal">∥</mi><mn>2</mn></msup><mo>+</mo><mi>λ</mi><mi mathvariant="normal">∥</mi><mi mathvariant="bold">w</mi><msup><mi mathvariant="normal">∥</mi><mn>2</mn></msup><mo>=</mo><mo stretchy="false">(</mo><msup><mi>A</mi><mi mathvariant="normal">⊤</mi></msup><mi>A</mi><mo>+</mo><mi>λ</mi><mi>I</mi><msup><mo stretchy="false">)</mo><mrow><mo>−</mo><mn>1</mn></mrow></msup><msup><mi>A</mi><mi mathvariant="normal">⊤</mi></msup><mi mathvariant="bold">y</mi></mrow><annotation encoding="application/x-tex">\hat{\mathbf w}=\arg\min_{\mathbf w}\ \|A\mathbf w-\mathbf y\|^2+\lambda\|\mathbf w\|^2=(A^\top A+\lambda I)^{-1}A^\top\mathbf y</annotation></semantics></math></span></div>
  <p>Wiggles need large coefficients; making them expensive smooths the fit without lowering the degree. λ is a dial from overfitting (λ → 0) to underfitting (λ large).</p>
</section>
<section data-case="ridge" data-example="none"><h3>λ ≈ 0</h3><p>No penalty: the degree-12 wiggles of plain least squares.</p></section>
<section data-case="ridge" data-example="strong"><h3>λ = 10</h3><p>Everything shrunk: the fit flattens toward zero.</p></section>
<section data-case="early">
  <h3>Early stopping: a regularizer for free</h3>
  <div class="look"><h4>What you are looking at</h4>The same degree-12 model trained by gradient descent from all-zero weights. Top: the fit as training goes on. Bottom: training and test error against iteration; green = the best moment to stop.</div>
  <p>Gradient descent learns the directions the data constrains best first — the broad shape — and the poorly constrained wiggles last. Stopping when the test (validation) error is lowest keeps the weights small, much like ridge.</p>
</section>
<section data-case="cv">
  <h3>Choosing without touching the test set</h3>
  <div class="look"><h4>What you are looking at</h4>Top: the training points coloured by fold. Bottom: k-fold cross-validation error against degree (green), compared with the real test error (blue).</div>
  <p>Picking d or λ by looking at the test error is cheating: the test set becomes part of training. k-fold cross-validation splits the <i>training</i> data into k parts, trains k times leaving one part out, and averages the errors on the left-out parts.</p>
  <div class="pitfall"><h4>Common mistake</h4>Shuffling time series or groups (the same patient in train and validation): the folds must be independent.</div>
</section>
<section data-case="cv" data-example="loo"><h3>k = 10</h3><p>More folds: each model sees 90% of the data; the estimate is less biased but costs 10 fits.</p></section>
<section data-case="imbalance">
  <h3>When classes are rare, accuracy lies</h3>
  <div class="look"><h4>What you are looking at</h4>Top: the classifier's score for 920 healthy (blue) and 80 ill (orange) people, and the decision threshold. Bottom: true positives, false negatives, false positives, true negatives. Bottom plot: accuracy, precision and recall against the threshold.</div>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>precision</mtext><mo>=</mo><mfrac><mrow><mi>T</mi><mi>P</mi></mrow><mrow><mi>T</mi><mi>P</mi><mo>+</mo><mi>F</mi><mi>P</mi></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mtext>recall</mtext><mo>=</mo><mfrac><mrow><mi>T</mi><mi>P</mi></mrow><mrow><mi>T</mi><mi>P</mi><mo>+</mo><mi>F</mi><mi>N</mi></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mtext>accuracy</mtext><mo>=</mo><mfrac><mrow><mi>T</mi><mi>P</mi><mo>+</mo><mi>T</mi><mi>N</mi></mrow><mi>N</mi></mfrac></mrow><annotation encoding="application/x-tex">\text{precision}=\frac{TP}{TP+FP},\qquad \text{recall}=\frac{TP}{TP+FN},\qquad \text{accuracy}=\frac{TP+TN}{N}</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>With 8% positives, answering "healthy" to everyone is 92% accurate and finds no one: recall 0.</div>
</section>
<section data-case="imbalance" data-example="never"><h3>Always negative</h3><p>Accuracy 92%, recall 0%: useless, and accuracy hides it.</p></section>
<section data-case="imbalance" data-example="low"><h3>Low threshold</h3><p>Nearly every ill person found (high recall), at the cost of many false alarms (low precision).</p></section>
</template>

  <h3>Where the error comes from: bias and variance</h3>
  <div class="look"><h4>What you are looking at</h4>Top: the same model trained on 40 different noisy datasets (grey), their average (blue) and the truth (dashed). Bottom: bias², variance and their sum against the degree.</div>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="double-struck">E</mi><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">[</mo><mo stretchy="false">(</mo><mi>y</mi><mo>−</mo><mover accent="true"><mi>f</mi><mo>^</mo></mover><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">]</mo><mo>=</mo><munder><munder><mrow><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><mi mathvariant="double-struck">E</mi><mo stretchy="false">[</mo><mover accent="true"><mi>f</mi><mo>^</mo></mover><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo stretchy="false">]</mo><mo>−</mo><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><msup><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mn>2</mn></msup></mrow><mo stretchy="true">⏟</mo></munder><msup><mtext>bias</mtext><mn>2</mn></msup></munder><mo>+</mo><munder><munder><mrow><mi mathvariant="double-struck">E</mi><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">[</mo><mo stretchy="false">(</mo><mover accent="true"><mi>f</mi><mo>^</mo></mover><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>−</mo><mi mathvariant="double-struck">E</mi><mo stretchy="false">[</mo><mover accent="true"><mi>f</mi><mo>^</mo></mover><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo stretchy="false">]</mo><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">]</mo></mrow><mo stretchy="true">⏟</mo></munder><mtext>variance</mtext></munder><mo>+</mo><munder><munder><msup><mi>σ</mi><mn>2</mn></msup><mo stretchy="true">⏟</mo></munder><mtext>noise</mtext></munder></mrow><annotation encoding="application/x-tex">\mathbb E\big[(y-\hat f(x))^2\big]=\underbrace{\big(\mathbb E[\hat f(x)]-f(x)\big)^2}_{\text{bias}^2}+\underbrace{\mathbb E\big[(\hat f(x)-\mathbb E[\hat f(x)])^2\big]}_{\text{variance}}+\underbrace{\sigma^2}_{\text{noise}}</annotation></semantics></math></span></div>
  <p>Bias is how wrong the model is on average; variance is how much it changes with the particular sample. Flexible models trade one for the other.</p>
</section>
<section data-case="biasvar" data-example="rigid"><h3>Degree 1</h3><p>All 40 lines nearly identical (low variance) and all equally wrong (high bias).</p></section>
<section data-case="biasvar" data-example="wild"><h3>Degree 10</h3><p>The average is close to the truth (low bias), but each single fit is wild, especially near the edges (high variance).</p></section>
<section data-case="ridge">
  <h3>Ridge: keep the capacity, penalise the coefficients</h3>
  <div class="look"><h4>What you are looking at</h4>Top: a degree-12 fit with penalty λ. Bottom: training and test error against log λ. Bottom plot: the size of each coefficient.</div>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mover accent="true"><mi mathvariant="bold">w</mi><mo>^</mo></mover><mo>=</mo><mi>arg</mi><mo>⁡</mo><munder><mrow><mi>min</mi><mo>⁡</mo></mrow><mi mathvariant="bold">w</mi></munder><mtext> </mtext><mi mathvariant="normal">∥</mi><mi>A</mi><mi mathvariant="bold">w</mi><mo>−</mo><mi mathvariant="bold">y</mi><msup><mi mathvariant="normal">∥</mi><mn>2</mn></msup><mo>+</mo><mi>λ</mi><mi mathvariant="normal">∥</mi><mi mathvariant="bold">w</mi><msup><mi mathvariant="normal">∥</mi><mn>2</mn></msup><mo>=</mo><mo stretchy="false">(</mo><msup><mi>A</mi><mi mathvariant="normal">⊤</mi></msup><mi>A</mi><mo>+</mo><mi>λ</mi><mi>I</mi><msup><mo stretchy="false">)</mo><mrow><mo>−</mo><mn>1</mn></mrow></msup><msup><mi>A</mi><mi mathvariant="normal">⊤</mi></msup><mi mathvariant="bold">y</mi></mrow><annotation encoding="application/x-tex">\hat{\mathbf w}=\arg\min_{\mathbf w}\ \|A\mathbf w-\mathbf y\|^2+\lambda\|\mathbf w\|^2=(A^\top A+\lambda I)^{-1}A^\top\mathbf y</annotation></semantics></math></span></div>
  <p>Wiggles need large coefficients; making them expensive smooths the fit without lowering the degree. λ is a dial from overfitting (λ → 0) to underfitting (λ large).</p>
</section>
<section data-case="ridge" data-example="none"><h3>λ ≈ 0</h3><p>No penalty: the degree-12 wiggles of plain least squares.</p></section>
<section data-case="ridge" data-example="strong"><h3>λ = 10</h3><p>Everything shrunk: the fit flattens toward zero.</p></section>
<section data-case="early">
  <h3>Early stopping: a regularizer for free</h3>
  <div class="look"><h4>What you are looking at</h4>The same degree-12 model trained by gradient descent from all-zero weights. Top: the fit as training goes on. Bottom: training and test error against iteration; green = the best moment to stop.</div>
  <p>Gradient descent learns the directions the data constrains best first — the broad shape — and the poorly constrained wiggles last. Stopping when the test (validation) error is lowest keeps the weights small, much like ridge.</p>
</section>
<section data-case="cv">
  <h3>Choosing without touching the test set</h3>
  <div class="look"><h4>What you are looking at</h4>Top: the training points coloured by fold. Bottom: k-fold cross-validation error against degree (green), compared with the real test error (blue).</div>
  <p>Picking d or λ by looking at the test error is cheating: the test set becomes part of training. k-fold cross-validation splits the <i>training</i> data into k parts, trains k times leaving one part out, and averages the errors on the left-out parts.</p>
  <div class="pitfall"><h4>Common mistake</h4>Shuffling time series or groups (the same patient in train and validation): the folds must be independent.</div>
</section>
<section data-case="cv" data-example="loo"><h3>k = 10</h3><p>More folds: each model sees 90% of the data; the estimate is less biased but costs 10 fits.</p></section>
<section data-case="imbalance">
  <h3>When classes are rare, accuracy lies</h3>
  <div class="look"><h4>What you are looking at</h4>Top: the classifier's score for 920 healthy (blue) and 80 ill (orange) people, and the decision threshold. Bottom: true positives, false negatives, false positives, true negatives. Bottom plot: accuracy, precision and recall against the threshold.</div>
  <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>precision</mtext><mo>=</mo><mfrac><mrow><mi>T</mi><mi>P</mi></mrow><mrow><mi>T</mi><mi>P</mi><mo>+</mo><mi>F</mi><mi>P</mi></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mtext>recall</mtext><mo>=</mo><mfrac><mrow><mi>T</mi><mi>P</mi></mrow><mrow><mi>T</mi><mi>P</mi><mo>+</mo><mi>F</mi><mi>N</mi></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mtext>accuracy</mtext><mo>=</mo><mfrac><mrow><mi>T</mi><mi>P</mi><mo>+</mo><mi>T</mi><mi>N</mi></mrow><mi>N</mi></mfrac></mrow><annotation encoding="application/x-tex">\text{precision}=\frac{TP}{TP+FP},\qquad \text{recall}=\frac{TP}{TP+FN},\qquad \text{accuracy}=\frac{TP+TN}{N}</annotation></semantics></math></span></div>
  <div class="worked"><h4>Worked example</h4>With 8% positives, answering "healthy" to everyone is 92% accurate and finds no one: recall 0.</div>
</section>
<section data-case="imbalance" data-example="never"><h3>Always negative</h3><p>Accuracy 92%, recall 0%: useless, and accuracy hides it.</p></section>
<section data-case="imbalance" data-example="low"><h3>Low threshold</h3><p>Nearly every ill person found (high recall), at the cost of many false alarms (low precision).</p></section>
</template>
