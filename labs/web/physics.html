<template id="explain-coil-induction"><!-- Explain drawer for coil-induction. <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mo>…</mo></mrow><annotation encoding="application/x-tex">…</annotation></semantics></math></span> and <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>…</mo></mrow><annotation encoding="application/x-tex">…</annotation></semantics></math></span> are rendered to MathML at build time. -->
<h2>How it works</h2>
      <p>Click a section to highlight what it describes in the scene.</p>

      <section data-highlight="coil">
        <h3>1 · One loop of current</h3>
        <p>Every short piece of wire adds a little field, perpendicular to both the wire and the line to the
          point (Biot–Savart). Summed around a ring, the field threads through the middle along the axis and
          curls back around the wire outside.</p>
        <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mstyle style="color:var(--c-B)"><msub><mi>B</mi><mi>z</mi></msub></mstyle><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><msub><mi>μ</mi><mn>0</mn></msub><mstyle style="color:var(--c-I)"><mi>I</mi></mstyle><msup><mi>R</mi><mn>2</mn></msup></mrow><mrow><mn>2</mn><mtext> </mtext><mo stretchy="false">(</mo><msup><mi>R</mi><mn>2</mn></msup><mo>+</mo><msup><mi>z</mi><mn>2</mn></msup><msup><mo stretchy="false">)</mo><mrow><mn>3</mn><mi mathvariant="normal">/</mi><mn>2</mn></mrow></msup></mrow></mfrac></mrow><annotation encoding="application/x-tex">\cB{B_z}(z) = \frac{\mu_0 \cI{I} R^2}{2\,(R^2+z^2)^{3/2}}</annotation></semantics></math></span></div>
        <p>Far away the ring looks like a magnetic dipole and its field fades as <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><msup><mi>r</mi><mn>3</mn></msup></mrow><annotation encoding="application/x-tex">1/r^3</annotation></semantics></math></span>.</p>
      </section>

      <section data-highlight="lines">
        <h3>2 · Many loops: the solenoid</h3>
        <p>Side by side, the rings' fields add up inside and nearly cancel outside. In a long coil the field
          inside is uniform and depends only on the turns per metre <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi><mo>=</mo><mi>N</mi><mi mathvariant="normal">/</mi><mi>L</mi></mrow><annotation encoding="application/x-tex">n = N/L</annotation></semantics></math></span>, not on the radius.</p>
        <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mstyle style="color:var(--c-B)"><mi>B</mi></mstyle><mo>≈</mo><msub><mi>μ</mi><mn>0</mn></msub><mtext> </mtext><mi>n</mi><mtext> </mtext><mstyle style="color:var(--c-I)"><mi>I</mi></mstyle></mrow><annotation encoding="application/x-tex">\cB{B} \approx \mu_0\, n\, \cI{I}</annotation></semantics></math></span></div>
        <p>Near the ends the lines spread out (fringing): at an end of a long coil the field is half the
          central value.</p>
      </section>

      <section data-highlight="pickup">
        <h3>3 · Flux through a loop</h3>
        <p>Flux counts how much field passes through a surface bounded by a loop. It is linear in the source
          current, with the mutual inductance <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>M</mi></mrow><annotation encoding="application/x-tex">M</annotation></semantics></math></span> as the constant: a geometric number set by the shapes and
          the positions.</p>
        <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="normal">Φ</mi><mo>=</mo><msub><mo>∫</mo><mi>S</mi></msub><mstyle style="color:var(--c-B)"><mi mathvariant="bold">B</mi></mstyle><mo>⋅</mo><mi>d</mi><mi mathvariant="bold">A</mi><mo>=</mo><mo>∮</mo><mi mathvariant="bold">A</mi><mo>⋅</mo><mi>d</mi><mi mathvariant="bold">ℓ</mi><mo>=</mo><mi>M</mi><mtext> </mtext><mstyle style="color:var(--c-I)"><mi>I</mi></mstyle></mrow><annotation encoding="application/x-tex">\Phi = \int_S \cB{\mathbf B}\cdot d\mathbf A = \oint \mathbf A\cdot d\boldsymbol\ell = M\,\cI{I}</annotation></semantics></math></span></div>
      </section>

      <section data-highlight="emf">
        <h3>4 · Faraday: change makes an EMF</h3>
        <p>A voltage appears around the loop only while the flux changes, because the current changes or the
          loop moves. A strong but steady field gives nothing.</p>
        <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="script">E</mi><mo>=</mo><mo>−</mo><mfrac><mrow><mi>d</mi><mi mathvariant="normal">Φ</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>−</mo><mi>M</mi><mfrac><mrow><mi>d</mi><mstyle style="color:var(--c-I)"><mi>I</mi></mstyle></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>−</mo><mstyle style="color:var(--c-I)"><mi>I</mi></mstyle><mtext> </mtext><mi mathvariant="normal">∇</mi><mi>M</mi><mo>⋅</mo><mstyle style="color:var(--c-v)"><mi mathvariant="bold">v</mi></mstyle></mrow><annotation encoding="application/x-tex">\mathcal E = -\frac{d\Phi}{dt} = -M\frac{d\cI{I}}{dt} - \cI{I}\,\nabla M\cdot\cv{\mathbf v}</annotation></semantics></math></span></div>
        <p>Pushing the same magnet in faster gives a bigger EMF for a shorter time. The area under
          <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="script">E</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\mathcal E(t)</annotation></semantics></math></span> is the total change in flux, whatever the speed.</p>
      </section>

      <section data-highlight="lenz">
        <h3>5 · Lenz: the induced current pushes back</h3>
        <p>The EMF drives a current <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mstyle style="color:var(--c-I)"><msub><mi>I</mi><mtext>ind</mtext></msub></mstyle><mo>=</mo><mi mathvariant="script">E</mi><mi mathvariant="normal">/</mi><mi>R</mi></mrow><annotation encoding="application/x-tex">\cI{I_\text{ind}} = \mathcal E/R</annotation></semantics></math></span> through the circuit. The minus sign
          means its own field opposes the change in flux, so the force on the moving magnet opposes its
          velocity. The kinetic energy lost becomes heat in the resistance.</p>
        <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mstyle style="color:var(--c-F)"><mi mathvariant="bold">F</mi></mstyle><mo>=</mo><mstyle style="color:var(--c-I)"><msub><mi>I</mi><mi>s</mi></msub></mstyle><mtext> </mtext><mstyle style="color:var(--c-I)"><msub><mi>I</mi><mtext>ind</mtext></msub></mstyle><mtext> </mtext><mi mathvariant="normal">∇</mi><mi>M</mi><mo separator="true">,</mo><mspace width="2em"/><mstyle style="color:var(--c-F)"><mi mathvariant="bold">F</mi></mstyle><mo>⋅</mo><mstyle style="color:var(--c-v)"><mi mathvariant="bold">v</mi></mstyle><mo>=</mo><mo>−</mo><msup><mstyle style="color:var(--c-I)"><msub><mi>I</mi><mtext>ind</mtext></msub></mstyle><mn>2</mn></msup><mi>R</mi><mo>≤</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\cF{\mathbf F} = \cI{I_s}\,\cI{I_\text{ind}}\,\nabla M, \qquad \cF{\mathbf F}\cdot\cv{\mathbf v} = -\cI{I_\text{ind}}^2 R \le 0</annotation></semantics></math></span></div>
      </section>

      <section data-highlight="efield">
        <h3>6 · The induced electric field</h3>
        <p>A changing magnetic field is surrounded by a circulating electric field, even in empty space with
          no wire there. The wire only gives its charges a path to follow.</p>
        <div class="eq"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mo>∮</mo><mstyle style="color:var(--c-E)"><mi mathvariant="bold">E</mi></mstyle><mo>⋅</mo><mi>d</mi><mi mathvariant="bold">ℓ</mi><mo>=</mo><mo>−</mo><mfrac><mrow><mi>d</mi><mi mathvariant="normal">Φ</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"/><mstyle style="color:var(--c-E)"><mi mathvariant="bold">E</mi></mstyle><mo>=</mo><mo>−</mo><mfrac><mrow><mi mathvariant="normal">∂</mi><mi mathvariant="bold">A</mi></mrow><mrow><mi mathvariant="normal">∂</mi><mi>t</mi></mrow></mfrac></mrow><annotation encoding="application/x-tex">\oint \cE{\mathbf E}\cdot d\boldsymbol\ell = -\frac{d\Phi}{dt}, \qquad \cE{\mathbf E} = -\frac{\partial \mathbf A}{\partial t}</annotation></semantics></math></span></div>
        <p>Switch the slice or the arrows to <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><mi mathvariant="bold">E</mi><mi mathvariant="normal">∣</mi></mrow><annotation encoding="application/x-tex">|\mathbf E|</annotation></semantics></math></span> with an AC coil, or while the magnet moves.</p>
      </section>

      <details>
        <summary>About the model</summary>
        <p><b>Sources.</b> The coil is <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>N</mi></mrow><annotation encoding="application/x-tex">N</annotation></semantics></math></span> coaxial rings of radius <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>R</mi></mrow><annotation encoding="application/x-tex">R</annotation></semantics></math></span> over length <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>L</mi></mrow><annotation encoding="application/x-tex">L</annotation></semantics></math></span>. A helix is
          drawn, but its small axial current component is neglected. The bar magnet is an Amperian
          cylinder: 12 rings carrying <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><msub><mi>B</mi><mi>r</mi></msub><mi mathvariant="normal">/</mi><msub><mi>μ</mi><mn>0</mn></msub><mo stretchy="false">)</mo><mtext> </mtext><msub><mi>l</mi><mi>m</mi></msub><mi mathvariant="normal">/</mi><mn>12</mn></mrow><annotation encoding="application/x-tex">(B_r/\mu_0)\,l_m/12</annotation></semantics></math></span> each. The probe is one ring. Every ring stays
          parallel to the coil.</p>
        <p><b>Field.</b> Each ring's field and vector potential <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>A</mi><mi>φ</mi></msub></mrow><annotation encoding="application/x-tex">A_\varphi</annotation></semantics></math></span> are the exact closed-form
          Biot–Savart result, using complete elliptic integrals computed by the arithmetic–geometric mean.
          Fields are tabulated on an <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>ρ</mi><mo separator="true">,</mo><mi>z</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(\rho, z)</annotation></semantics></math></span> grid: 160 asinh-spaced radial nodes, with axial nodes a
          divisor of the turn pitch, at most 3 mm. A strided prefix sum adds the turns, and bilinear
          interpolation fills in between nodes.</p>
        <p><b>Induction.</b> The model is quasi-static and resistive: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>I</mi><mtext>ind</mtext></msub><mo>=</mo><mi mathvariant="script">E</mi><mi mathvariant="normal">/</mi><mi>R</mi></mrow><annotation encoding="application/x-tex">I_\text{ind} = \mathcal E/R</annotation></semantics></math></span>, and
          self-inductance is neglected (valid while <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ω</mi><mi>L</mi><mo>≪</mo><mi>R</mi></mrow><annotation encoding="application/x-tex">\omega L \ll R</annotation></semantics></math></span>). The driven coil is an ideal current
          source. The flux uses reciprocity, <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Φ</mi><mo>=</mo><mi>M</mi><mi>I</mi></mrow><annotation encoding="application/x-tex">\Phi = M I</annotation></semantics></math></span>, with <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>M</mi><mo>=</mo><mo>∮</mo><mi mathvariant="bold">A</mi><mo>⋅</mo><mi>d</mi><mi mathvariant="bold">ℓ</mi></mrow><annotation encoding="application/x-tex">M = \oint \mathbf A\cdot d\boldsymbol\ell</annotation></semantics></math></span>:
          exact <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2</mn><mi>π</mi><mi>r</mi><msub><mi>A</mi><mi>φ</mi></msub></mrow><annotation encoding="application/x-tex">2\pi r A_\varphi</annotation></semantics></math></span> when coaxial, 48-point trapezoid otherwise. <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∇</mi><mi>M</mi></mrow><annotation encoding="application/x-tex">\nabla M</annotation></semantics></math></span> is a central
          difference (<span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>h</mi><mo>=</mo><mn>0.2</mn></mrow><annotation encoding="application/x-tex">h = 0.2</annotation></semantics></math></span> mm).</p>
        <p><b>Field lines.</b> RK4 on <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">B</mi><mi mathvariant="normal">/</mi><mi mathvariant="normal">∣</mi><mi mathvariant="bold">B</mi><mi mathvariant="normal">∣</mi></mrow><annotation encoding="application/x-tex">\mathbf B/|\mathbf B|</annotation></semantics></math></span> with step-doubling error control
          (tolerance 0.2 mm). Seeds sit on rings of equal flux in the source's mid-plane, so line density
          follows <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><mi mathvariant="bold">B</mi><mi mathvariant="normal">∣</mi></mrow><annotation encoding="application/x-tex">|\mathbf B|</annotation></semantics></math></span>. Colours span the 2nd–97th percentile of <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><mi mathvariant="bold">B</mi><mi mathvariant="normal">∣</mi></mrow><annotation encoding="application/x-tex">|\mathbf B|</annotation></semantics></math></span> along the lines. Particles move along the lines with speed <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>∝</mo><mi mathvariant="normal">∣</mi><mi mathvariant="bold">B</mi><mi mathvariant="normal">∣</mi></mrow><annotation encoding="application/x-tex">\propto |\mathbf B|</annotation></semantics></math></span>, capped
          at 3× the reference value near the wires. Charge carriers drift along the wire with speed
          <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>∝</mo><mi>I</mi></mrow><annotation encoding="application/x-tex">\propto I</annotation></semantics></math></span>.</p>
        <p><b>What is drawn.</b> Field lines and particles show the applied field: the driven coil, or the
          magnet. The induced current's own field is much weaker. It is shown by the induced-B arrow and the
          moving charge carriers, and it is included in the slice, the arrow grid and every number.</p>
        <p><b>Magnet drop.</b> <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>m</mi><mover accent="true"><mi>z</mi><mo>¨</mo></mover><mo>=</mo><mo>−</mo><mi>m</mi><mi>g</mi><mo>+</mo><msub><mi>F</mi><mi>z</mi></msub></mrow><annotation encoding="application/x-tex">m\ddot z = -mg + F_z</annotation></semantics></math></span>, integrated by RK4 at <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Δ</mi><mi>t</mi><mo>=</mo><mn>0.5</mn></mrow><annotation encoding="application/x-tex">\Delta t = 0.5</annotation></semantics></math></span> ms.</p>
        <table>
          <tr><th>Check (labs/tools/test.mjs)</th><th>Result</th></tr>
          <tr><td>Ring on-axis field vs <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub><mi>I</mi><msup><mi>R</mi><mn>2</mn></msup><mi mathvariant="normal">/</mi><mn>2</mn><mo stretchy="false">(</mo><msup><mi>R</mi><mn>2</mn></msup><mo>+</mo><msup><mi>z</mi><mn>2</mn></msup><msup><mo stretchy="false">)</mo><mrow><mn>3</mn><mi mathvariant="normal">/</mi><mn>2</mn></mrow></msup></mrow><annotation encoding="application/x-tex">\mu_0 I R^2/2(R^2+z^2)^{3/2}</annotation></semantics></math></span></td><td>&lt; 0.04 % (budget 0.1 %)</td></tr>
          <tr><td>Closed form vs Biot–Savart on 4000 segments</td><td>4 × 10⁻⁶</td></tr>
          <tr><td>Long solenoid centre vs <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub><mi>n</mi><mi>I</mi></mrow><annotation encoding="application/x-tex">\mu_0 n I</annotation></semantics></math></span></td><td>0.03 % (budget 1 %)</td></tr>
          <tr><td>Finite solenoid on axis vs continuous formula</td><td>&lt; 0.1 % (budget 1 %)</td></tr>
          <tr><td>Table vs exact sum over turns (≥ 5 mm from wire)</td><td>&lt; 0.15 % (budget 1 %)</td></tr>
          <tr><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∇</mi><mo>⋅</mo><mi mathvariant="bold">B</mi></mrow><annotation encoding="application/x-tex">\nabla\cdot\mathbf B</annotation></semantics></math></span> relative residual</td><td>&lt; 0.7 %</td></tr>
          <tr><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="script">E</mi></mrow><annotation encoding="application/x-tex">\mathcal E</annotation></semantics></math></span> vs <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mi>d</mi><mi mathvariant="normal">Φ</mi><mi mathvariant="normal">/</mi><mi>d</mi><mi>t</mi></mrow><annotation encoding="application/x-tex">-d\Phi/dt</annotation></semantics></math></span> finite difference</td><td>&lt; 10⁻⁸</td></tr>
          <tr><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">F</mi><mo>⋅</mo><mi mathvariant="bold">v</mi><mo>=</mo><mo>−</mo><msup><mi>I</mi><mn>2</mn></msup><mi>R</mi></mrow><annotation encoding="application/x-tex">\mathbf F\cdot\mathbf v = -I^2R</annotation></semantics></math></span></td><td>10⁻¹⁶</td></tr>
          <tr><td>Drop energy: <span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>m</mi><mi>g</mi><mi mathvariant="normal">Δ</mi><mi>h</mi><mo>=</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup><mo>+</mo><mo>∫</mo><msup><mi>I</mi><mn>2</mn></msup><mi>R</mi><mtext> </mtext><mi>d</mi><mi>t</mi></mrow><annotation encoding="application/x-tex">mg\Delta h = \tfrac12 mv^2 + \int I^2R\,dt</annotation></semantics></math></span></td><td>3 × 10⁻⁶</td></tr>
          <tr><td>Lenz sign, still-magnet EMF = 0, Amperian far field = dipole</td><td>pass</td></tr>
        </table>
      </details>
